<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ML Тренажёр{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/static/vendor/hljs/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="/static/vendor/hljs/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/static/style.css?v={{ ASSET_V }}">
  <script defer src="/static/vendor/katex/katex.min.js"></script>
  <script defer src="/static/vendor/hljs/highlight.min.js"></script>
  <script defer src="/static/app.js?v={{ ASSET_V }}"></script>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">ML Тренажёр</a>
    <a href="/" class="{{ 'on' if request.url.path == '/' }}">Главная</a>
    <a href="/questions" class="{{ 'on' if request.url.path.startswith('/questions') }}">Вопросы</a>
    <a href="/import" class="{{ 'on' if request.url.path.startswith('/import') }}">Импорт</a>
    <a href="/flagged" class="{{ 'on' if request.url.path.startswith('/flagged') }}">Флаги</a>
    <a href="/settings" class="{{ 'on' if request.url.path.startswith('/settings') }}">Настройки</a>
  </nav>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
