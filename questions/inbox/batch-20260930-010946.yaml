- id: stprob-rv-001
  topic: stats/probability
  type: card
  question: Что такое случайная величина и чем $X$ отличается от $x$?
  difficulty: 1
  tags:
  - random_variable
  - realization
  - notation
  answer: |-
    **Случайная величина** — число, которое получается в результате случайного эксперимента
    над **одним** объектом. До эксперимента оно неизвестно. Примеры: сумма одного чека,
    дефолт одного клиента (1 или 0).

    $X$ (заглавная) — сама величина как понятие до эксперимента: «сумма чека вообще».
    У неё есть распределение, матожидание, дисперсия.

    $x$ (строчная) — **реализация**: конкретное число, которое выпало. Петя купил на 2340 рублей,
    значит $x = 2340$.
  explanation: |-
    Частая путаница — считать случайной величиной средний чек по выборке. Это **другая**
    случайная величина, $\bar X$, построенная из $n$ отдельных чеков. У $X$ разброс $\sigma$,
    у $\bar X$ — $\sigma/\sqrt n$.
- id: stprob-disc-002
  topic: stats/probability
  type: mcq
  question: Какую из величин естественно моделировать как **непрерывную**?
  difficulty: 1
  tags:
  - discrete
  - continuous
  options:
  - text: Время, которое пользователь провёл на странице оплаты
    correct: true
    why: 'Между любыми двумя значениями есть ещё значения, и вероятность любого точного значения равна
      нулю. Вероятность имеет смысл только для интервала: «от 40 до 50 секунд».'
  - text: Число заказов клиента за месяц
    correct: false
    why: Значения можно перечислить (0, 1, 2, …), у каждого своя ненулевая вероятность. Это дискретная
      величина.
  - text: Факт дефолта по кредиту
    correct: false
    why: Два значения, 0 и 1, — распределение Бернулли, дискретное.
  - text: Число просроченных платежей за год
    correct: false
    why: Счётная величина с отдельными значениями, дискретная.
  explanation: |-
    Критерий различия — не «целые или дробные значения», а то, имеет ли отдельное
    значение свою ненулевую вероятность. Сумма чека формально дискретна (шаг в копейку),
    но значений так много и они так плотны, что её моделируют как непрерывную.
- id: stprob-pdf-003
  topic: stats/probability
  type: mcq
  question: |-
    У нормального распределения с $\sigma = 0{,}1$ плотность в центре примерно равна 4.
    Как это возможно, если вероятность не бывает больше 1?
  difficulty: 1
  tags:
  - pdf
  - density
  options:
  - text: Плотность — не вероятность. Вероятность — это площадь под плотностью на интервале, а общая площадь
      всё равно равна 1
    correct: true
    why: Узкий колокол вынужден быть высоким, чтобы площадь осталась единичной. Высота 4 на ширине порядка
      0,25 даёт площадь около 1.
  - text: 'Это ошибка: плотность нормального распределения всегда не больше 1'
    correct: false
    why: 'Нет такого ограничения. Чем меньше $\sigma$, тем выше пик: он равен $1/(\sigma\sqrt{2\pi})$.'
  - text: Плотность нормирована на 100%, поэтому 4 означает 4%
    correct: false
    why: Плотность не измеряется в процентах, у неё единица «вероятность на единицу измерения величины».
  - text: Для непрерывных величин вероятность точки может быть больше 1
    correct: false
    why: Для непрерывной величины вероятность любой точки равна нулю.
  explanation: |-
    Как узнать форму записи по графику: столбики — PMF (высота = вероятность),
    гладкий горб — PDF (вероятность = площадь), кривая от 0 до 1 — CDF (высота = $P(X \le x)$).
- id: stprob-cdf-004
  topic: stats/probability
  type: multi
  question: Что верно про функцию распределения (CDF) $F(x) = P(X \le x)$? Выбери все верные.
  difficulty: 1
  tags:
  - cdf
  - quantile
  options:
  - text: Она не убывает и меняется от 0 до 1
    correct: true
    why: Чем правее $x$, тем больше значений левее него, вероятность может только расти.
  - text: Она есть у любой случайной величины — и дискретной, и непрерывной
    correct: true
    why: PMF бывает только у дискретных, PDF — только у непрерывных, а CDF — у всех.
  - text: $P(a < X \le b) = F(b) - F(a)$
    correct: true
    why: Доля левее $b$ минус доля левее $a$ — это доля между ними.
  - text: Квантиль уровня $q$ — это значение $F$ в точке $q$
    correct: false
    why: 'Наоборот: квантиль — это такая точка $x$, что $F(x) = q$. Квантиль получают обратной функцией
      к CDF.'
  - text: По-русски «функция распределения» — это плотность
    correct: false
    why: Русское «функция распределения» — это именно CDF. Плотность — PDF.
  explanation: |-
    Через CDF удобно считать всё, что связано с хвостами: p-value двустороннего z-теста —
    это $2(1 - \Phi(|z|))$, где $\Phi$ — CDF стандартного нормального.
- id: stprob-bayes-005
  topic: stats/probability
  type: mcq
  question: |-
    В сегменте 2% клиентов — мошенники. Антифрод-правило ловит 90% мошенников
    и ложно срабатывает на 10% честных клиентов. Правило сработало на клиенте.
    Какова вероятность, что он мошенник?
  difficulty: 2
  tags:
  - bayes
  - conditional_probability
  - interview
  - credit_risk
  options:
  - text: Около 15,5%
    correct: true
    why: 'Срабатываний на мошенниках: $0{,}02 \cdot 0{,}9 = 0{,}018$. На честных: $0{,}98 \cdot 0{,}1
      = 0{,}098$. Доля мошенников среди всех срабатываний: $0{,}018 / 0{,}116 \approx 0{,}155$.'
  - text: 90%
    correct: false
    why: Это $P(\text{срабатывание} \mid \text{мошенник})$, а спрашивают обратную вероятность $P(\text{мошенник}
      \mid \text{срабатывание})$. Путать их — классическая ошибка.
  - text: 2%
    correct: false
    why: Это априорная доля до срабатывания. Срабатывание — информация, и оно повышает вероятность.
  - text: 81%
    correct: false
    why: Так получится, если вычесть долю ложных срабатываний из точности. Формула Байеса устроена иначе.
  explanation: |-
    Формула Байеса:
    $$P(A \mid B) = \frac{P(B \mid A)\,P(A)}{P(B)}$$
    Когда событие редкое, даже хороший классификатор даёт низкую точность (precision):
    честных клиентов так много, что их 10% ложных срабатываний перевешивают 90% пойманных мошенников.
    В терминах ML: recall 90%, FPR 10%, precision 15,5%. Отсюда важность precision
    и PR-кривой на несбалансированных данных.
- id: stprob-bern-006
  topic: stats/probability
  type: mcq
  question: Дефолт — величина Бернулли с вероятностью $p$. При каком $p$ её дисперсия максимальна?
  difficulty: 1
  tags:
  - bernoulli
  - variance
  options:
  - text: $p = 0{,}5$, дисперсия равна 0,25
    correct: true
    why: $\text{Var} = p(1-p)$ — парабола с максимумом в середине. При $p = 0{,}5$ исход предсказуем меньше
      всего.
  - text: $p = 1$
    correct: false
    why: 'При $p = 1$ всегда выпадает 1, разброса нет: $1 \cdot 0 = 0$.'
  - text: Дисперсия не зависит от $p$, у Бернулли отдельный параметр разброса
    correct: false
    why: У Бернулли один параметр, $p$. Он задаёт и среднее, и разброс.
  - text: $p = 0{,}1$, потому что редкие события более шумные
    correct: false
    why: Абсолютная дисперсия при $p = 0{,}1$ равна 0,09 — меньше 0,25. Велика относительная, а не абсолютная
      изменчивость.
  explanation: |-
    Вывод: $E[X] = p$, $E[X^2] = p$, значит $\text{Var} = p - p^2 = p(1-p)$.
    Поэтому в формулах SE и размера выборки для конверсии и доли дефолтов
    вместо $\sigma^2$ подставляют $p(1-p)$.
- id: stprob-std-007
  topic: stats/probability
  type: open
  question: Чем дисперсия отличается от стандартного отклонения и зачем нужны обе величины?
  difficulty: 1
  tags:
  - variance
  - std
  - interview
  answer: |-
    Дисперсия $\sigma^2 = E[(X - \mu)^2]$ — средний квадрат отклонения от среднего.
    Стандартное отклонение $\sigma = \sqrt{\sigma^2}$ — корень из неё.

    Мера разброса одна и та же, различаются единицы. Дисперсия измеряется в квадрате
    исходных единиц (рубли в квадрате), интерпретировать её трудно. Стандартное отклонение
    — в исходных единицах, читается как «типичное отклонение от среднего».

    Дисперсия нужна для вычислений: у независимых величин дисперсии **складываются**,
    а стандартные отклонения — нет. Из этого свойства выводятся $SE = \sigma/\sqrt n$
    и формула размера выборки. Стандартное отклонение нужно для интерпретации и отчётов.
  rubric:
  - 'Дал определения: средний квадрат отклонения и корень из него'
  - 'Сказал про единицы: дисперсия в квадрате единиц, std в исходных'
  - Назвал аддитивность дисперсий независимых величин как причину считать через дисперсию
  explanation: |-
    Хороший дополнительный ход на собесе — упомянуть, что в записи $N(\mu, \sigma^2)$
    второй параметр — именно дисперсия, а в коде `np.std` и `scale` в scipy — стандартное отклонение.
- id: stprob-varsum-008
  topic: stats/probability
  type: mcq
  question: $X$ и $Y$ независимы, $\sigma_X = 3$, $\sigma_Y = 4$. Чему равно стандартное отклонение $X
    - Y$?
  difficulty: 2
  tags:
  - variance
  - independence
  - interview
  options:
  - text: '5'
    correct: true
    why: $\text{Var}(X - Y) = \text{Var}(X) + \text{Var}(Y) = 9 + 16 = 25$, корень — 5.
  - text: '1'
    correct: false
    why: Вычитать стандартные отклонения нельзя. При вычитании случайных величин разброс не уменьшается,
      а растёт.
  - text: '7'
    correct: false
    why: Стандартные отклонения не складываются, складываются дисперсии.
  - text: $\sqrt{7}$
    correct: false
    why: 'Так получится, если вычесть дисперсии. Но у разности дисперсии складываются: минус при возведении
      в квадрат исчезает.'
  explanation: |-
    Ровно этот расчёт стоит за SE разности двух групп в A/B:
    $SE_{\text{diff}} = \sqrt{SE_A^2 + SE_B^2}$. Если $X$ и $Y$ зависимы, добавляется
    $-2\,\text{Cov}(X, Y)$ — на этом основан парный дизайн и CUPED.
- id: stprob-lin-009
  topic: stats/probability
  type: mcq
  question: $E[X] = 10$, $\text{Var}(X) = 4$. Чему равны $E[2X + 3]$ и $\text{Var}(2X + 3)$?
  difficulty: 1
  tags:
  - expectation
  - variance
  - linear_transform
  options:
  - text: 23 и 16
    correct: true
    why: 'Матожидание линейно: $2 \cdot 10 + 3 = 23$. Сдвиг не меняет разброс, множитель выходит в квадрате:
      $4 \cdot 4 = 16$.'
  - text: 23 и 11
    correct: false
    why: К дисперсии не прибавляют константу и множитель не выносят без квадрата.
  - text: 23 и 8
    correct: false
    why: 'Множитель выходит из дисперсии в квадрате: $\text{Var}(cX) = c^2\,\text{Var}(X)$.'
  - text: 20 и 16
    correct: false
    why: Сдвиг на 3 меняет среднее.
  explanation: |-
    Из $\text{Var}(cX) = c^2\,\text{Var}(X)$ при $c = 1/n$ получается множитель $1/n^2$
    в выводе дисперсии выборочного среднего. Стандартное отклонение от сдвига тоже
    не меняется, а множитель выходит по модулю: $\sigma_{2X+3} = 2\sigma_X$.
- id: stprob-corr-010
  topic: stats/probability
  type: multi
  question: Что верно про корреляцию и независимость? Выбери все верные.
  difficulty: 2
  tags:
  - correlation
  - independence
  - interview
  options:
  - text: Если величины независимы, их корреляция равна нулю
    correct: true
    why: Независимость означает нулевую ковариацию, значит, и нулевую корреляцию.
  - text: Нулевая корреляция не означает независимость
    correct: true
    why: 'Пример: $X$ симметрична вокруг нуля, $Y = X^2$. $Y$ полностью определяется $X$, но корреляция
      Пирсона равна нулю.'
  - text: Корреляция Пирсона ловит только линейную связь
    correct: true
    why: Нелинейная монотонная связь недооценивается, немонотонная может дать ноль.
  - text: Корреляция 0,9 означает, что $X$ влияет на $Y$
    correct: false
    why: 'Корреляция не говорит о причинности: связь может объясняться общим фактором (конфаундером).'
  - text: Корреляция Спирмена устойчива к выбросам, потому что считается по рангам
    correct: true
    why: Ранги ограничивают влияние экстремальных значений, а монотонная нелинейная связь даёт высокий
      Спирмен.
  explanation: |-
    Для зависимостей произвольной формы используют взаимную информацию,
    а в фиче-селекшене моделей — permutation importance или SHAP.
- id: stprob-pois-011
  topic: stats/probability
  type: mcq
  question: |-
    Число обращений клиента в поддержку за месяц: среднее 2, дисперсия 7.
    Подходит ли распределение Пуассона?
  difficulty: 2
  tags:
  - poisson
  - overdispersion
  - interview
  options:
  - text: 'Нет: у Пуассона среднее равно дисперсии, здесь сильная сверхдисперсия. Лучше отрицательное
      биномиальное'
    correct: true
    why: 'Дисперсия в 3,5 раза больше среднего. Обычно это значит, что клиенты неоднородны: одни почти
      не пишут, другие пишут постоянно.'
  - text: Да, Пуассон подходит для любых счётных данных
    correct: false
    why: 'У Пуассона жёсткое ограничение: $E = \text{Var} = \lambda$.'
  - text: Нет, потому что Пуассон только для непрерывных величин
    correct: false
    why: Пуассон дискретный, для счётчиков.
  - text: Да, если округлить дисперсию до среднего
    correct: false
    why: Подгонять данные под модель нельзя. Сверхдисперсия — это свойство данных, и Пуассон занизит неопределённость.
  explanation: |-
    Пуассон описывает число редких независимых событий за период при постоянной интенсивности.
    Если использовать его при сверхдисперсии, SE и интервалы получатся слишком узкими.
    Отрицательное биномиальное можно понимать как смесь Пуассонов с разной интенсивностью у разных клиентов.
- id: stprob-geom-012
  topic: stats/probability
  type: mcq
  question: |-
    Вероятность покупки за один визит — 5%, визиты независимы.
    Сколько визитов в среднем нужно до первой покупки (включая её)?
  difficulty: 2
  tags:
  - geometric
  - expectation
  - interview
  options:
  - text: '20'
    correct: true
    why: Число попыток до первого успеха имеет геометрическое распределение с матожиданием $1/p = 1/0{,}05
      = 20$.
  - text: '5'
    correct: false
    why: Спутаны вероятность и число попыток.
  - text: '19'
    correct: false
    why: 'Это среднее число **неудач** до первого успеха: $(1-p)/p$. Вопрос включает сам успешный визит.'
  - text: Зависит от числа посетителей сайта
    correct: false
    why: Для одного посетителя с независимыми визитами ответ определяется только $p$.
  explanation: |-
    Интуиция: если успех случается в 5% попыток, то на 100 попыток приходится 5 успехов,
    то есть в среднем один на каждые 20. Та же логика отвечает на вопрос «сколько раз
    в среднем бросать кубик до шестёрки» — 6.
- id: stprob-memless-013
  topic: stats/probability
  type: card
  question: Что такое свойство отсутствия памяти и у каких распределений оно есть?
  difficulty: 2
  tags:
  - exponential
  - memoryless
  answer: |-
    Прошлое ожидание не меняет будущего:
    $$P(T > s + t \mid T > s) = P(T > t)$$
    Если время до события уже больше $s$, оставшееся время распределено так же,
    как с самого начала.

    Среди непрерывных распределений это свойство есть только у **экспоненциального**,
    среди дискретных — только у **геометрического**.
  explanation: |-
    Пример: если время до следующей заявки экспоненциально и заявки нет уже 10 минут,
    ждать осталось в среднем столько же, сколько с нуля.

    В кредитном риске отсутствие памяти обычно **не** выполняется. Вероятность дефолта
    зависит от срока жизни кредита (MOB): пик приходится на первые месяцы, потом она снижается.
    Поэтому в survival-моделях дефолта используют распределения с меняющейся интенсивностью (hazard).
- id: stprob-skew-014
  topic: stats/probability
  type: mcq
  question: |-
    Суммы чеков распределены с длинным правым хвостом (примерно логнормально).
    Что больше — среднее или медиана?
  difficulty: 1
  tags:
  - lognormal
  - skewness
  - mean_median
  options:
  - text: Среднее больше медианы
    correct: true
    why: Редкие очень большие чеки тянут среднее вправо, а медиана на них почти не реагирует.
  - text: Медиана больше среднего
    correct: false
    why: Так бывает при длинном левом хвосте.
  - text: Они равны, как у любого распределения
    correct: false
    why: Равны они только у симметричных распределений.
  - text: Сравнить нельзя без знания дисперсии
    correct: false
    why: Направление перекоса однозначно определяет, в какую сторону сдвинуто среднее.
  explanation: |-
    Среднее — всё равно правильная метрика, если бизнес интересует выручка:
    выручка = число заказов × средний чек. Медиана устойчивее к выбросам,
    но на ней нельзя строить формулы выручки. В A/B-тестах среднего чека длинный хвост
    раздувает дисперсию, поэтому применяют винзоризацию или CUPED.
- id: stprob-binom-015
  topic: stats/probability
  type: open
  question: |-
    Банк выдал 1000 кредитов, PD каждого 5%. Сколько дефолтов ожидать и в каком
    диапазоне окажется их число примерно в 95% случаев? На каком допущении держится расчёт
    и что будет, если оно нарушено?
  difficulty: 3
  tags:
  - binomial
  - normal_approximation
  - credit_risk
  - interview
  answer: |-
    Число дефолтов — биномиальная величина, $n = 1000$, $p = 0{,}05$.

    Среднее: $np = 50$.

    Стандартное отклонение: $\sqrt{np(1-p)} = \sqrt{1000 \cdot 0{,}05 \cdot 0{,}95} \approx 6{,}9$.

    При $np = 50 \ge 10$ биномиальное хорошо приближается нормальным, поэтому 95% диапазон —
    $50 \pm 1{,}96 \cdot 6{,}9$, то есть примерно от 36 до 64 дефолтов.

    Ключевое допущение — **независимость** дефолтов. Если они коррелированы (кризис,
    один работодатель, один регион), дефолты приходят пачками. Среднее остаётся 50,
    но дисперсия суммы растёт на ковариации, и хвосты становятся гораздо тяжелее.
    Именно корреляцию дефолтов учитывают модели кредитного портфеля и капитальные требования.
  rubric:
  - Определил биномиальное распределение и посчитал среднее 50
  - Посчитал std через $\sqrt{np(1-p)} \approx 6{,}9$
  - Применил нормальное приближение и получил диапазон примерно 36–64
  - Назвал допущение независимости дефолтов
  - Объяснил, что корреляция дефолтов расширяет разброс и утяжеляет хвосты, не меняя среднее
  explanation: |-
    Это типичный переход на собесе от учебной задачи к риску: «а если экономика упадёт?».
    Сильный ответ связывает рост разброса с ковариациями в дисперсии суммы —
    той же формулой, из-за которой ломается SE при зависимых наблюдениях в A/B.
