- id: dlo-sgd-001
  topic: dl/optimizers
  type: card
  question: Чем отличаются batch, stochastic и mini-batch gradient descent?
  difficulty: 1
  tags:
  - sgd
  - batch_size
  - gradient_descent
  answer: |-
    Различие в том, на скольких объектах считается градиент перед одним шагом.

    **Batch (полный) GD** — градиент по всей обучающей выборке. Направление точное,
    траектория гладкая, но один шаг требует прохода по всем данным, и на больших
    датасетах это непрактично.

    **Stochastic GD** — градиент по одному объекту. Шаги очень дешёвые и частые,
    но направление сильно зашумлено, траектория рыскает.

    **Mini-batch GD** — градиент по пачке из 32–512 объектов. Компромисс: шум
    существенно меньше, чем у SGD, а вычисления эффективно параллелятся на GPU.

    На практике под словом SGD почти всегда подразумевают mini-batch версию.
  explanation: |-
    Шум в mini-batch — не только издержка, но и польза: он помогает выбираться
    из плохих локальных минимумов и седловых точек и работает как слабая
    регуляризация. Полный градиент застрял бы в первой же точке с нулевым градиентом.
- id: dlo-lr-002
  topic: dl/optimizers
  type: mcq
  question: Learning rate выставлен слишком большим. Что вы увидите на кривой обучения?
  difficulty: 1
  tags:
  - learning_rate
  - divergence
  options:
  - text: Лосс скачет вверх-вниз, растёт или уходит в NaN
    correct: true
    why: Шаг перелетает минимум и попадает в точку с большим значением функции, следующий шаг перелетает
      ещё сильнее — процесс расходится.
  - text: Лосс монотонно убывает, но очень медленно
    correct: false
    why: Это признак слишком маленького learning rate, а не слишком большого.
  - text: Лосс на train падает, а на validation растёт
    correct: false
    why: Это переобучение — проблема ёмкости модели и регуляризации, а не шага оптимизации.
  - text: Обучение идёт нормально, но требует больше эпох
    correct: false
    why: Большой шаг не замедляет обучение, а ломает его сходимость.
  explanation: |-
    Стандартный приём диагностики — LR range test: запустить несколько сотен шагов,
    экспоненциально увеличивая learning rate, и построить график лосса от LR.
    Берут значение примерно на порядок меньше того, при котором лосс начал расти.
- id: dlo-mom-003
  topic: dl/optimizers
  type: card
  question: Что такое momentum и какую проблему обычного SGD он решает?
  difficulty: 2
  tags:
  - momentum
  - ravine
  - convergence
  answer: |-
    Momentum накапливает скользящее среднее градиентов и шагает по нему:
    $$v_t = \beta v_{t-1} + \nabla L(w_t), \qquad w_{t+1} = w_t - \eta v_t$$
    где $\beta$ обычно равна 0,9.

    Проблема, которую он решает, — **овраги**: области, где поверхность лосса круто
    изгибается по одним направлениям и полого по другим. Обычный SGD в такой области
    зигзагообразно скачет между стенками оврага и почти не продвигается вдоль него.

    Momentum гасит колебания: по направлению поперёк оврага градиенты на соседних шагах
    имеют противоположные знаки и в сумме взаимно уничтожаются, а вдоль оврага знак
    постоянный, и вклады складываются, разгоняя движение.
  explanation: |-
    Физическая аналогия — шарик с массой, катящийся по поверхности, вместо частицы,
    которая мгновенно останавливается. Инерция помогает проскочить мелкие локальные
    ямки и плато, где градиент почти нулевой.

    Число обусловленности матрицы Гессе — формальная мера того, насколько вытянут овраг:
    чем оно больше, тем сильнее выигрыш от momentum.
- id: dlo-nest-004
  topic: dl/optimizers
  type: mcq
  question: В чём отличие Nesterov momentum от классического momentum?
  difficulty: 3
  tags:
  - nesterov
  - momentum
  options:
  - text: Градиент вычисляется не в текущей точке, а в точке, куда привела бы инерция
    correct: true
    why: 'Это взгляд на шаг вперёд: сначала мысленно сдвигаемся на $-\eta\beta v_{t-1}$, там считаем градиент
      и им корректируем шаг. Получается упреждающая поправка.'
  - text: Коэффициент $\beta$ адаптивно подбирается на каждом шаге
    correct: false
    why: В Nesterov $\beta$ такой же фиксированный гиперпараметр, как в обычном momentum.
  - text: Накапливаются квадраты градиентов вместо самих градиентов
    correct: false
    why: Это механизм RMSProp и второго момента Adam, к Nesterov отношения не имеет.
  - text: Momentum применяется только к смещениям, а не к весам
    correct: false
    why: Оптимизатор одинаково обрабатывает все обучаемые параметры.
  explanation: |-
    Интуиция: классический momentum сначала смотрит, куда идти из текущей точки,
    и только потом добавляет инерцию. Nesterov наоборот — сначала учитывает инерцию,
    а градиент считает уже в предсказанной точке. Если инерция несёт мимо минимума,
    градиент в предсказанной точке заранее начнёт тормозить.

    На практике выигрыш по сравнению с обычным momentum обычно небольшой, поэтому
    в PyTorch это просто флаг `nesterov=True` у `optim.SGD`.
- id: dlo-adam-005
  topic: dl/optimizers
  type: card
  question: Как устроен Adam? Что он накапливает и зачем нужна поправка на смещение?
  difficulty: 2
  tags:
  - adam
  - adaptive
  - moments
  answer: |-
    Adam хранит два скользящих средних для каждого параметра:

    Первый момент — среднее градиентов, это momentum:
    $$m_t = \beta_1 m_{t-1} + (1-\beta_1)\nabla L$$

    Второй момент — среднее квадратов градиентов, это масштаб шага:
    $$v_t = \beta_2 v_{t-1} + (1-\beta_2)(\nabla L)^2$$

    Поправка на смещение, потому что оба среднего инициализируются нулями и в начале
    обучения занижены:
    $$\hat m_t = \frac{m_t}{1-\beta_1^t}, \qquad \hat v_t = \frac{v_t}{1-\beta_2^t}$$

    Обновление:
    $$w \leftarrow w - \eta\,\frac{\hat m_t}{\sqrt{\hat v_t}+\varepsilon}$$

    Деление на $\sqrt{\hat v_t}$ делает шаг **адаптивным по параметрам**: у весов
    с крупными градиентами шаг уменьшается, у весов с мелкими увеличивается.
  explanation: |-
    Значения по умолчанию: $\beta_1 = 0{,}9$, $\beta_2 = 0{,}999$, $\varepsilon = 10^{-8}$.
    Разные $\beta$ не случайны: второй момент усредняется по гораздо более длинному окну
    (около 1000 шагов против 10), потому что оценка дисперсии требует больше наблюдений,
    чем оценка среднего.

    Без поправки на смещение первые шаги были бы чрезмерно большими: $\hat v_t$ занижено,
    а на него делят.
- id: dlo-adamw-006
  topic: dl/optimizers
  type: mcq
  question: Почему AdamW отделяет weight decay от градиента, хотя для SGD $L_2$-штраф и weight decay эквивалентны?
  difficulty: 2
  tags:
  - adamw
  - weight_decay
  - l2
  options:
  - text: В Adam градиент $L_2$-штрафа тоже делится на $\sqrt{\hat v}$, поэтому веса с большими градиентами
      получают более слабую регуляризацию
    correct: true
    why: Штраф перестаёт быть равномерным и начинает зависеть от истории градиентов параметра — это не
      то, что задумывалось при выборе $\lambda$.
  - text: $L_2$-штраф несовместим с momentum
    correct: false
    why: С momentum эквивалентность сохраняется. Проблему создаёт именно адаптивное деление на второй
      момент.
  - text: AdamW применяет weight decay только на последней эпохе
    correct: false
    why: Decay применяется на каждом шаге, изменился только способ его применения.
  - text: AdamW полностью отказывается от регуляризации ради скорости
    correct: false
    why: Наоборот, AdamW делает регуляризацию корректной; именно поэтому он стал стандартом для трансформеров.
  explanation: |-
    В AdamW decay вычитается напрямую из весов, минуя адаптивный знаменатель:
    $$w \leftarrow w - \eta\,\frac{\hat m_t}{\sqrt{\hat v_t}+\varepsilon} - \eta\lambda w$$

    Практическое следствие: у `torch.optim.Adam` параметр `weight_decay` работает
    как $L_2$ в лоссе и ведёт себя хуже, поэтому для трансформеров берут `AdamW`.
    Типичное значение $\lambda$ — от 0,01 до 0,1, и обычно его не применяют к смещениям
    и параметрам нормализации.
- id: dlo-warm-007
  topic: dl/optimizers
  type: open
  question: Зачем нужен warmup в начале обучения и почему он особенно важен для трансформеров?
  difficulty: 2
  tags:
  - warmup
  - transformers
  - interview
  answer: |-
    Warmup — это плавный рост learning rate от почти нуля до рабочего значения
    в течение первых нескольких сотен или тысяч шагов, после чего включается основное
    расписание.

    Основная причина в адаптивных оптимизаторах. Второй момент $\hat v$ в начале
    обучения оценён по считаным шагам и потому крайне шумный. Деление на корень
    из ненадёжной оценки даёт хаотичные по величине шаги, которые могут увести веса
    в область, откуда обучение не восстанавливается.

    Вторая причина — сами веса в начале случайны, и градиенты по ним не несут
    осмысленного направления. Большие шаги по случайному направлению только вредят.

    Для трансформеров это критично из-за архитектуры. Softmax в attention насыщается:
    если скалярные произведения запросов и ключей становятся большими, распределение
    внимания вырождается в почти one-hot, градиенты через него почти исчезают,
    и слой перестаёт обучаться. Ранние большие шаги легко загоняют модель в это
    состояние. Кроме того, глубокие стеки residual-блоков в начале обучения
    чувствительны к масштабу активаций.
  rubric:
  - Объяснил, что warmup — это плавный рост LR в начале обучения
  - Связал необходимость с ненадёжной оценкой второго момента в адаптивных методах
  - Упомянул, что в начале веса случайны и направление градиента малоинформативно
  - '{''Назвал специфику трансформеров'': ''насыщение softmax в attention или чувствительность глубоких
    residual-стеков''}'
  - Знает, что после warmup обычно идёт cosine или linear decay
  explanation: |-
    Типовой рецепт для трансформеров: linear warmup на 6–10% всех шагов обучения,
    затем cosine decay до значения, близкого к нулю.

    Существуют и архитектурные обходные пути — Pre-LN вместо Post-LN делает обучение
    устойчивее и снижает потребность в длинном warmup. Именно поэтому современные
    LLM почти все используют Pre-LN.
- id: dlo-clip-008
  topic: dl/optimizers
  type: mcq
  question: Что делает `torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0)`?
  difficulty: 2
  tags:
  - gradient_clipping
  - exploding_gradients
  - rnn
  options:
  - text: Если суммарная норма всех градиентов превышает 1,0, все градиенты умножаются на общий коэффициент
      так, чтобы норма стала равна 1,0
    correct: true
    why: Ключевое слово — общий коэффициент. Направление вектора градиента полностью сохраняется, меняется
      только его длина.
  - text: Каждый элемент градиента, больший 1,0 по модулю, заменяется на 1,0
    correct: false
    why: Это clip_grad_value_, поэлементное усечение. Оно искажает направление градиента, потому что разные
      компоненты обрезаются по-разному.
  - text: Ограничивает сами веса модели по норме 1,0
    correct: false
    why: Функция работает с полем .grad, а не с весами. Ограничение весов — это другой приём, max-norm
      constraint.
  - text: Обнуляет градиенты, если их норма превышает 1,0
    correct: false
    why: 'Шаг не пропускается: градиент масштабируется и обновление всё равно происходит.'
  explanation: |-
    Порядок вызова обязателен: `loss.backward()` → `clip_grad_norm_` → `optimizer.step()`.
    Если вызвать клиппинг после шага, он не повлияет ни на что.

    Зачем нужно: в RNN и глубоких трансформерах изредка случаются шаги с огромным
    градиентом (взрыв градиентов), и один такой шаг разрушает все накопленные веса.
    Клиппинг ограничивает ущерб. Типичное значение `max_norm` — от 0,5 до 1,0.

    От затухания градиентов клиппинг не спасает — это противоположная проблема,
    и её решают residual-связями и нормализацией.
- id: dlo-sched-009
  topic: dl/optimizers
  type: multi
  question: Какие утверждения о расписаниях learning rate верны?
  difficulty: 2
  tags:
  - lr_schedule
  - cosine
  - plateau
  options:
  - text: Уменьшение LR к концу обучения позволяет точнее сойтись в минимум, который большой шаг всё время
      перелетал бы
    correct: true
    why: Крупный шаг в начале нужен для быстрого движения, мелкий в конце — для точной настройки.
  - text: Cosine annealing плавно снижает LR по косинусоиде от начального значения почти до нуля
    correct: true
    why: Это де-факто стандарт для обучения трансформеров, обычно в связке с warmup.
  - text: ReduceLROnPlateau снижает LR, когда отслеживаемая метрика перестаёт улучшаться заданное число
      эпох
    correct: true
    why: Расписание реагирует на ход обучения, а не на номер шага, поэтому требует передачи метрики в
      scheduler.step(metric).
  - text: Расписание LR полностью заменяет подбор начального значения LR
    correct: false
    why: 'Начальное значение остаётся важнейшим гиперпараметром: расписание задаёт форму кривой, но её
      масштаб определяется стартовым LR.'
  - text: Step decay, который делит LR на 10 каждые N эпох, устарел и не работает
    correct: false
    why: Он проще, чем cosine, но вполне рабочий; классические результаты на ResNet получены именно с
      ним.
  - text: При использовании Adam расписание не нужно, потому что он уже адаптивен
    correct: false
    why: Adam адаптирует шаг по параметрам относительно друг друга, но общий масштаб $\eta$ он не снижает.
      Расписание по-прежнему нужно.
  explanation: |-
    Стандартная связка для трансформеров: linear warmup на первые несколько процентов
    шагов, затем cosine decay до нуля. В PyTorch это `get_cosine_schedule_with_warmup`
    из transformers или комбинация `LambdaLR` и `CosineAnnealingLR`.

    Частая ошибка в коде — вызывать `scheduler.step()` не там, где нужно: для
    пошаговых расписаний внутри цикла по батчам, для поэпошных в конце эпохи.
- id: dlo-batch-010
  topic: dl/optimizers
  type: mcq
  question: Вы увеличили размер батча с 32 до 256. Что разумно сделать с learning rate?
  difficulty: 2
  tags:
  - batch_size
  - learning_rate
  - scaling
  options:
  - text: Увеличить его, ориентировочно в 8 раз (linear scaling rule), обычно вместе с warmup
    correct: true
    why: Больший батч даёт менее зашумлённую оценку градиента, поэтому можно доверять ей сильнее и шагать
      дальше. За эпоху при этом делается в 8 раз меньше шагов, и без роста LR обучение замедлится.
  - text: Уменьшить в 8 раз, потому что градиент теперь суммируется по большему числу объектов
    correct: false
    why: В стандартной реализации лосс усредняется по батчу, а не суммируется, поэтому масштаб градиента
      не растёт с размером батча.
  - text: Оставить прежним — размер батча и LR независимы
    correct: false
    why: Они связаны через уровень шума в оценке градиента, и это одна из самых практически значимых связок
      гиперпараметров.
  - text: Заменить оптимизатор на SGD без momentum
    correct: false
    why: Размер батча не диктует выбор оптимизатора.
  explanation: |-
    Есть и правило квадратного корня ($\eta \propto \sqrt{B}$), которое часто лучше
    работает для адаптивных оптимизаторов. Линейное правило проверено прежде всего
    для SGD с momentum на свёрточных сетях.

    Важный практический нюанс: при очень больших батчах (тысячи объектов) линейное
    масштабирование ломается без warmup, а качество обобщения может просесть —
    шум мелких батчей сам по себе работает как регуляризация.
- id: dlo-bias-011
  topic: dl/optimizers
  type: mcq
  question: Что произойдёт, если убрать из Adam поправку на смещение (bias correction)?
  difficulty: 3
  tags:
  - adam
  - bias_correction
  options:
  - text: Первые шаги будут неоправданно большими, потому что оба момента занижены, а малое $\hat v$ стоит
      в знаменателе
    correct: true
    why: Оба момента стартуют с нуля и в первые шаги сильно смещены к нулю. Малый знаменатель $\sqrt{v}$
      раздувает шаг, и начало обучения становится нестабильным.
  - text: Обучение не изменится, поправка нужна только для красивой математики
    correct: false
    why: 'Эффект вполне практический: без неё чаще требуется более долгий warmup или меньший стартовый
      LR.'
  - text: Adam перестанет быть адаптивным и выродится в обычный SGD
    correct: false
    why: Адаптивность обеспечивается делением на $\sqrt{v}$, оно никуда не денется.
  - text: Оптимизатор перестанет сходиться в принципе
    correct: false
    why: 'Смещение затухает экспоненциально: множитель $1-\beta_2^t$ быстро приближается к единице, и
      через несколько тысяч шагов разница исчезает.'
  explanation: |-
    Разберём на числах. Пусть градиент стабильно равен $g$. Тогда после первого шага
    $v_1 = (1-\beta_2)g^2 = 0{,}001 g^2$, то есть в тысячу раз меньше истинного $g^2$.
    Знаменатель $\sqrt{v_1} \approx 0{,}032|g|$, и шаг получается примерно в 30 раз больше нужного.

    Поправка ровно это и исправляет: $\hat v_1 = v_1 / (1-\beta_2^1) = g^2$.
- id: dlo-saddle-012
  topic: dl/optimizers
  type: card
  question: Почему в глубоком обучении седловые точки считаются большей проблемой, чем локальные минимумы?
  difficulty: 2
  tags:
  - saddle_point
  - local_minimum
  - high_dimension
  answer: |-
    Дело в размерности. В критической точке знак определяется собственными значениями
    матрицы Гессе: локальный минимум требует, чтобы **все** они были положительны.

    Если у модели миллионы параметров, вероятность того, что все миллионы собственных
    значений случайно окажутся одного знака, ничтожно мала. Почти всегда найдётся хотя бы
    одно отрицательное направление, то есть точка оказывается седловой, а не минимумом.

    Плохие локальные минимумы в таких пространствах редки, и эмпирически найденные
    минимумы по значению лосса близки друг к другу.

    Чем седло мешает: рядом с ним градиент мал по большинству направлений, и обучение
    надолго застревает на плато, хотя выход существует.

    Помогают три вещи: **шум мини-батчей**, который случайно сталкивает с седла;
    **momentum**, чья инерция проносит через плоский участок; **адаптивные методы**,
    увеличивающие шаг там, где градиенты стабильно малы.
  explanation: |-
    Связь с конспектом по матанализу: для функции нескольких переменных нулевой градиент
    ещё не означает минимум, и классифицировать точку нужно по матрице Гессе —
    через критерий Сильвестра или знаки собственных значений.
- id: dlo-choice-013
  topic: dl/optimizers
  type: open
  question: Как выбрать оптимизатор для задачи? Правда ли, что Adam всегда лучше SGD?
  difficulty: 2
  tags:
  - adam
  - sgd
  - generalization
  - interview
  answer: |-
    Нет, не всегда, и это как раз содержательная часть ответа.

    **Adam и AdamW** сходятся быстрее, гораздо менее чувствительны к выбору learning rate
    и хорошо работают на разреженных градиентах и неоднородных масштабах признаков.
    Это стандарт для трансформеров и NLP, где обучение слишком дорого, чтобы долго
    подбирать гиперпараметры, и где embedding-слои дают разреженные обновления.

    **SGD с momentum** сходится медленнее и требует аккуратного подбора LR и расписания,
    но на компьютерном зрении при достаточном бюджете обучения часто даёт лучшее качество
    на тесте. Объяснение обычно связывают с тем, что шум SGD склоняет решение к более
    широким минимумам, которые устойчивее к сдвигу распределения.

    Практическое правило: AdamW как разумный старт почти для любой задачи, SGD с momentum
    как кандидат, если задача из области CV, есть бюджет на подбор гиперпараметров
    и важен последний процент качества.

    И главное: выигрыш от правильного learning rate и расписания обычно больше,
    чем выигрыш от смены оптимизатора.
  rubric:
  - Сказал, что универсально лучшего оптимизатора нет
  - '{''Назвал сильные стороны Adam/AdamW'': ''скорость сходимости и устойчивость к выбору LR''}'
  - Знает, что SGD с momentum нередко лучше обобщает, особенно в CV
  - Упомянул AdamW как стандарт для трансформеров
  - Отметил, что LR и расписание важнее выбора оптимизатора
  explanation: |-
    Полезно помнить и про память: Adam хранит два состояния на каждый параметр,
    то есть примерно втрое больше памяти под оптимизатор, чем SGD без momentum.
    При обучении крупных моделей это ощутимое ограничение, из-за чего появились
    экономные варианты вроде 8-bit Adam и Adafactor.
- id: dlo-diag-014
  topic: dl/optimizers
  type: open
  question: Вы обучаете модель, и через несколько сотен шагов лосс превращается в NaN. Как будете разбираться?
  difficulty: 3
  tags:
  - debugging
  - nan
  - interview
  - case
  answer: |-
    Сначала локализовал бы момент и место. Добавил бы проверку на каждом шаге: стал ли
    NaN лосс, или он появился раньше в градиентах, или уже в самих весах. Норма градиента,
    логируемая каждый шаг, обычно показывает всплеск незадолго до срыва.

    Дальше — типичные причины, примерно в порядке частоты.

    Слишком большой learning rate: шаг перелетает, значения растут, и на нескольких шагах
    происходит переполнение. Проверяется быстро — уменьшить LR на порядок и посмотреть,
    доживает ли обучение до того же шага.

    Взрыв градиентов: лечится `clip_grad_norm_`, особенно в рекуррентных сетях
    и глубоких стеках.

    Численно неустойчивый лосс: логарифм нуля или деление на нулевую дисперсию.
    Классический случай — самому писать `log(softmax(x))` вместо `log_softmax`
    или `CrossEntropyLoss` от логитов. Здесь же — отсутствие $\varepsilon$ в знаменателях.

    Плохие данные: NaN или бесконечность во входных признаках либо в целевой переменной,
    попавшие в один конкретный батч. Проверяется через `torch.isnan(x).any()` на входе.

    Отсутствие warmup при адаптивном оптимизаторе, из-за чего первые шаги слишком велики.

    Смешанная точность: в float16 переполнение наступает уже около 65504, поэтому нужен
    GradScaler; без него срыв в NaN — типичный симптом.

    Практический приём для воспроизведения: зафиксировать seed, сохранить батч, на котором
    случился срыв, и прогнать только его — это отделяет проблему данных от проблемы
    оптимизации.
  rubric:
  - Предложил локализовать, где именно появляется NaN — в данных, лоссе, градиентах или весах
  - Назвал слишком большой learning rate как первую гипотезу
  - Упомянул gradient clipping против взрыва градиентов
  - Назвал численную неустойчивость лосса, например логарифм нуля или ручной log(softmax)
  - Проверил бы входные данные на NaN и бесконечности
  - Упомянул смешанную точность и GradScaler или warmup
  explanation: |-
    Полезная привычка — держать в цикле обучения дешёвую проверку
    `if not torch.isfinite(loss): ...` с сохранением батча и состояния.
    Отладка постфактум без сохранённого состояния обычно превращается в угадывание.
- id: dlo-prop-015
  topic: dl/optimizers
  type: multi
  question: Какие утверждения об адаптивных методах (AdaGrad, RMSProp, Adam) верны?
  difficulty: 2
  tags:
  - adaptive
  - rmsprop
  - adagrad
  options:
  - text: AdaGrad накапливает сумму квадратов градиентов за всю историю, поэтому его эффективный шаг монотонно
      убывает и может преждевременно затухнуть
    correct: true
    why: Именно ради этого RMSProp заменил накопленную сумму на экспоненциальное скользящее среднее —
      старые градиенты забываются.
  - text: Адаптивность означает, что у каждого параметра свой эффективный размер шага
    correct: true
    why: Знаменатель $\sqrt{\hat v}$ вычисляется поэлементно, поэтому общий $\eta$ масштабируется для
      каждого веса по-своему.
  - text: Adam можно описать как RMSProp плюс momentum плюс поправка на смещение
    correct: true
    why: Второй момент — это RMSProp, первый момент — это momentum, а поправка убирает смещение к нулю
      в начале обучения.
  - text: Адаптивные методы делают подбор learning rate ненужным
    correct: false
    why: 'Они снижают чувствительность к LR, но не устраняют её: разница между $10^{-3}$ и $10^{-1}$ для
      Adam всё ещё катастрофическая.'
  - text: Адаптивные методы гарантированно дают лучшее качество на тесте, чем SGD
    correct: false
    why: Они быстрее сходятся, но на ряде задач, особенно в компьютерном зрении, SGD с momentum обобщает
      лучше.
  - text: Параметр $\varepsilon$ в знаменателе нужен для регуляризации весов
    correct: false
    why: Он нужен исключительно для численной устойчивости — чтобы не делить на ноль, когда второй момент
      близок к нулю.
  explanation: |-
    Историческая линия: AdaGrad (2011) ввёл идею поэлементного масштабирования,
    но затухал на длинных обучениях. RMSProp (2012) заменил сумму на скользящее среднее.
    Adam (2014) добавил к этому momentum и поправку на смещение.
    AdamW (2017) починил взаимодействие с weight decay.
