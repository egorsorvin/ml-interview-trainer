- id: stab-cycle-001
  topic: stats/ab_design
  type: card
  question: Из каких шагов состоит полный цикл A/B-теста?
  difficulty: 1
  tags:
  - ab_cycle
  - interview
  answer: |-
    1. **Гипотеза с механизмом.** Что меняем, на какую метрику и почему должно подействовать.
    2. **Метрики.** Одна primary (по ней решение), secondary (для понимания), guardrail (что не должно ухудшиться).
    3. **MDE и размер выборки.** Какой минимальный эффект важен бизнесу, сколько пользователей и дней нужно при α и мощности.
    4. **Рандомизация.** Единица (пользователь, клиент, город), способ (хеш от id с солью), доли групп.
    5. **Проверки перед запуском.** A/A-тест или исторический A/A на этой схеме сплита.
    6. **Запуск.** Полные недели, без подглядывания с остановкой.
    7. **Проверка качества.** SRM, корректность логирования, эффект новизны.
    8. **Анализ.** Эффект и доверительный интервал, p-value, поправки на множественные сравнения при нескольких primary.
    9. **Решение.** Сравнение интервала с MDE, учёт guardrail-метрик, стоимость внедрения.
  explanation: |-
    На собесе в формате «live discussion» часто просят пройти цикл на конкретном примере.
    Главное — порядок: гипотеза и метрики до данных, решение по заранее зафиксированным правилам.
- id: stab-hypothesis-002
  topic: stats/ab_design
  type: mcq
  question: Какая формулировка гипотезы для A/B-теста лучше всего?
  difficulty: 1
  tags:
  - hypothesis
  - ab_cycle
  options:
  - text: «Напоминание за 3 дня до платежа снизит долю выхода в просрочку 1–30 на 1 п.п., потому что часть
      просрочек — забывчивость, а не нехватка денег»
    correct: true
    why: Есть воздействие, конкретная метрика, ожидаемый размер эффекта и механизм. Механизм подсказывает,
      где эффект искать (среди «забывчивых») и какие метрики проверить.
  - text: «Напоминания улучшат платёжную дисциплину»
    correct: false
    why: Нет конкретной метрики и размера. Непонятно, как проверить и сколько нужно данных.
  - text: «Посмотрим, что изменится после напоминаний»
    correct: false
    why: Это не гипотеза. При таком подходе проверяют десятки метрик и находят случайные «эффекты».
  - text: «Доля просрочек в тестовой группе будет не такой, как в контрольной»
    correct: false
    why: Формально проверяемо, но без размера и механизма нельзя рассчитать выборку и понять результат.
  explanation: |-
    Ожидаемый размер эффекта нужен для расчёта выборки (через MDE),
    механизм — чтобы выбрать метрики и понять, что значит результат.
- id: stab-metrics-003
  topic: stats/ab_design
  type: mcq
  question: |-
    Банк тестирует автоматическое повышение кредитного лимита по картам. Primary-метрика — оборот по картам.
    Что логично сделать guardrail-метрикой?
  difficulty: 2
  tags:
  - primary_metric
  - guardrail
  - credit_risk
  options:
  - text: Долю выхода в просрочку 30+ (или 90+ на горизонте) и ожидаемые потери
    correct: true
    why: Guardrail — то, что не должно ухудшиться. Рост лимита может увеличить оборот за счёт роста долговой
      нагрузки и дефолтов. Если просрочка выросла, прирост оборота может не окупиться.
  - text: Число транзакций по картам
    correct: false
    why: 'Это скорее secondary-метрика: она помогает понять, откуда вырос оборот, но не защищает от вреда.'
  - text: Оборот по картам в первую неделю
    correct: false
    why: Это вариант primary, а не защитная метрика.
  - text: Guardrail не нужен, если primary выросла
    correct: false
    why: 'Именно при росте primary guardrail важнее всего: он показывает, какой ценой получен рост.'
  explanation: |-
    Особенность риска: просрочка «созревает» месяцами. Для guardrail по дефолту нужен performance window,
    поэтому на коротком горизонте смотрят ранние индикаторы (просрочка 1+, 30+ по первым платежам, утилизация лимита).
- id: stab-whyrandom-004
  topic: stats/ab_design
  type: mcq
  question: Зачем назначать группы случайно, а не, например, давать новую фичу самым активным пользователям?
  difficulty: 1
  tags:
  - randomization
  - causality
  - confounding
  options:
  - text: Случайность делает группы одинаковыми по всему, кроме воздействия, поэтому разница между группами
      — это эффект фичи плюс случайный шум, который измеряет SE
    correct: true
    why: Без рандомизации группы различаются ещё до воздействия (активные и так покупают больше). Разница
      смешивает эффект с этим различием — смещение отбора, которое тест не видит.
  - text: Чтобы группы были одинакового размера
    correct: false
    why: Одинаковый размер можно получить и без случайности. Суть — в одинаковости состава.
  - text: Чтобы тест быстрее набрал выборку
    correct: false
    why: Скорость набора от способа назначения не зависит.
  - text: Так требует t-тест
    correct: false
    why: t-тест посчитается на любых группах. Но без рандомизации его результат не будет причинным эффектом.
  explanation: |-
    Разница групп = эффект + смещение отбора + шум. Рандомизация обнуляет смещение отбора в среднем,
    а шум учитывается через SE и p-value. Большая выборка без рандомизации уменьшает шум,
    но не смещение.
- id: stab-salt-005
  topic: stats/ab_design
  type: mcq
  question: Группу назначают как `hash(соль + user_id) mod 100`. Зачем нужна соль, уникальная для эксперимента?
  difficulty: 2
  tags:
  - hashing
  - salt
  - randomization
  options:
  - text: 'Чтобы разбиения разных экспериментов были независимы: без соли один и тот же пользователь попадал
      бы в тест во всех экспериментах'
    correct: true
    why: Хеш детерминирован. Без соли у пользователя один и тот же бакет всегда. С солью бакеты для каждого
      эксперимента перетасовываются заново.
  - text: Чтобы пользователь при повторном заходе попал в ту же группу
    correct: false
    why: Это обеспечивает детерминированность хеша, соль для этого не нужна.
  - text: Для защиты user_id от утечки
    correct: false
    why: Соль в криптографии служит для этого, но в сплитовании её роль — независимость экспериментов.
  - text: Чтобы пропорции групп были ровно 50/50
    correct: false
    why: Пропорции задают через число бакетов в группе. Соль на них не влияет.
  explanation: |-
    Без соли прошлый эксперимент мог изменить поведение бакетов 50–99, и следующий тест с тем же разбиением
    унаследует это различие — группы будут неодинаковы ещё до старта.
- id: stab-saltorder-006
  topic: stats/ab_design
  type: mcq
  question: Почему `(hash(user_id) + соль) mod 100` — плохая схема, а `hash(соль + user_id) mod 100` —
    хорошая?
  difficulty: 2
  tags:
  - hashing
  - salt
  options:
  - text: В первой схеме соль только сдвигает все бакеты на одно и то же число по кругу, и разбиения разных
      экспериментов остаются жёстко связаны
    correct: true
    why: Кто был рядом, остаётся рядом. При сдвиге 0 группы совпадут полностью, при сдвиге 50 — полностью
      перевернутся. Только если соль внутри хеша, лавинный эффект перемешивает пользователей заново.
  - text: Первая схема медленнее
    correct: false
    why: Скорость здесь ни при чём.
  - text: Разницы нет, обе дают независимые разбиения
    correct: false
    why: 'Проверка на 100 000 пользователей: при сдвиге 17 вместо 25% в каждой из четырёх комбинаций групп
      получается 33% / 33% / 17% / 17%.'
  - text: Первая схема ломает постоянство группы у пользователя
    correct: false
    why: Постоянство обе схемы сохраняют. Проблема в связи между экспериментами.
  explanation: 'Правило: соль склеивается со входом, и только потом всё вместе хешируется.'
- id: stab-unit-007
  topic: stats/ab_design
  type: mcq
  question: |-
    Рандомизировали по пользователям, а конверсию считают по сессиям и сравнивают t-тестом,
    где каждое наблюдение — сессия. К чему это приводит?
  difficulty: 2
  tags:
  - randomization_unit
  - dependence
  - interview
  options:
  - text: Сессии одного пользователя зависимы, SE занижается, и ложных тревог становится намного больше
      α
    correct: true
    why: Формула SE предполагает независимые наблюдения. Реальной информации — на уровне пользователей,
      а тест считает, что её столько, сколько сессий. В симуляции с внутрипользовательской корреляцией
      доля ложных тревог может доходить до десятков процентов вместо 5%.
  - text: 'Мощность вырастет: сессий больше, чем пользователей'
    correct: false
    why: 'Это иллюзия мощности: SE занижена, и «значимость» во многом ложная.'
  - text: 'Ничего страшного: сессии и пользователи дадут одинаковый ответ'
    correct: false
    why: Только если у пользователей нет своего «уровня» конверсии, а в реальности он почти всегда есть.
  - text: Возникнет SRM
    correct: false
    why: SRM — перекос размеров групп. Здесь проблема в зависимости наблюдений, а не в размерах.
  explanation: |-
    Правило: **единица анализа = единица рандомизации**. Если нужна метрика по сессиям,
    её считают как отношение (сессии с покупкой / все сессии) на уровне пользователей и применяют
    дельта-метод или бутстрап по пользователям.
- id: stab-cluster-008
  topic: stats/ab_design
  type: mcq
  question: |-
    Сервис доставки тестирует новый алгоритм назначения курьеров. Почему рандомизация по заказам
    или пользователям здесь плохая идея?
  difficulty: 2
  tags:
  - randomization_unit
  - interference
  - cluster_randomization
  options:
  - text: 'Группы делят общий пул курьеров: если тестовые заказы забирают курьеров быстрее, контроль ждёт
      дольше. Группы влияют друг на друга, и разница завышена'
    correct: true
    why: 'Это нарушение независимости групп — интерференция, или сетевой эффект. Решения: рандомизация
      по городам или зонам (кластерная), switchback — переключение всей зоны между вариантами по времени.'
  - text: Заказов слишком много для рандомизации
    correct: false
    why: Количество не проблема. Проблема в общих ресурсах.
  - text: Нужно рандомизировать по курьерам — это всегда решает проблему
    correct: false
    why: Курьеры тоже делят общих клиентов и заказы. Решение зависит от того, где проходит связь.
  - text: Проблемы нет, достаточно большой выборки
    correct: false
    why: Большая выборка уменьшает шум, но не смещение из-за взаимного влияния групп.
  explanation: |-
    Кластерная рандомизация честнее, но единиц становится гораздо меньше (десятки городов),
    и мощность падает. Это обмен смещения на дисперсию.
- id: stab-deff-009
  topic: stats/ab_design
  type: mcq
  question: |-
    У пользователя в среднем 10 сессий, внутриклассовая корреляция (ICC) конверсии сессий — 0,3.
    Во сколько раз «эффективная» выборка меньше числа сессий?
  difficulty: 2
  tags:
  - design_effect
  - icc
  - clusters
  options:
  - text: 'В 3,7 раза: design effect $= 1 + (m - 1) \cdot ICC = 1 + 9 \cdot 0{,}3$'
    correct: true
    why: Design effect показывает, во сколько раз дисперсия оценки больше, чем при независимых наблюдениях.
      100 000 сессий по информативности равны примерно 27 000 независимых.
  - text: В 10 раз
    correct: false
    why: Так было бы при ICC = 1, когда все сессии пользователя одинаковы.
  - text: В 1,3 раза
    correct: false
    why: Это $1 + ICC$. В формуле ICC умножается на $(m - 1)$.
  - text: 'Не меньше: сессии — это просто больше данных'
    correct: false
    why: Зависимые данные несут меньше информации, чем такое же число независимых.
  explanation: |-
    ICC — доля разброса метрики, которая объясняется различиями **между** пользователями.
    Чем больше сессий у пользователя и чем выше ICC, тем сильнее анализ по сессиям обманывает.
- id: stab-aa-010
  topic: stats/ab_design
  type: mcq
  question: Зачем проводят A/A-тест?
  difficulty: 1
  tags:
  - aa_test
  - validation
  options:
  - text: 'Чтобы проверить систему экспериментов: при одинаковых вариантах значимые различия должны появляться
      примерно в α доле случаев'
    correct: true
    why: 'Если в A/A «значимо» получается чаще, чем в 5% случаев, что-то сломано: сплит, логирование,
      формула SE (например, не учтена зависимость наблюдений).'
  - text: Чтобы измерить эффект фичи точнее
    correct: false
    why: В A/A обе группы получают одно и то же, эффекта нет по построению.
  - text: Чтобы увеличить выборку основного теста
    correct: false
    why: A/A — проверка инструмента, а не способ набрать данные.
  - text: Чтобы выбрать, какую группу сделать контрольной
    correct: false
    why: Группы симметричны, выбирать не из чего.
  explanation: |-
    Часто делают «исторический A/A»: много раз случайно делят прошлых пользователей и смотрят
    распределение p-value. Оно должно быть равномерным от 0 до 1.
- id: stab-srmcauses-011
  topic: stats/ab_design
  type: multi
  question: |-
    Сплит 50/50, а в группах 50 600 и 49 400 пользователей (SRM). Что могло это вызвать?
    Выбери все правдоподобные причины.
  difficulty: 2
  tags:
  - srm
  - data_quality
  options:
  - text: Тестовый вариант иногда падает, и часть пользователей не логируется
    correct: true
    why: Потеря пользователей только в одной группе — классическая причина SRM.
  - text: Антибот-фильтр работает по-разному в группах
    correct: true
    why: Если фильтр срабатывает на поведение, которое меняет фича, из одной группы убирается больше «пользователей».
  - text: Редирект на новую версию страницы добавляет задержку, и часть пользователей уходит до логирования
    correct: true
    why: Ещё один механизм неравной потери пользователей.
  - text: Ошибка в хеш-функции или в назначении бакетов
    correct: true
    why: Например, бакеты распределены не 50 на 50 или разные сервисы считают группы по-разному.
  - text: Фича увеличила конверсию в покупку
    correct: false
    why: Конверсия меняет число покупок, а не число пользователей, попавших в группу. На размеры групп
      эффект фичи влиять не должен.
  explanation: |-
    При SRM результаты теста использовать нельзя: группы, скорее всего, различаются не только воздействием.
    Сначала находят и чинят причину, потом перезапускают.
- id: stab-weeks-012
  topic: stats/ab_design
  type: mcq
  question: Размер выборки набирается за 9 дней. Какую длительность теста выбрать?
  difficulty: 1
  tags:
  - duration
  - seasonality
  options:
  - text: 14 дней — округлить до полных недель
    correct: true
    why: Поведение по дням недели разное (выходные против будней). Неполная неделя перевешивает одни дни.
      Две полные недели дают сбалансированное покрытие.
  - text: 9 дней — ровно сколько нужно для выборки
    correct: false
    why: Выборка набрана, но в ней неравномерно представлены дни недели. Эффект может отличаться по дням.
  - text: 3 дня — если результат будет значим, можно остановиться
    correct: false
    why: Ранняя остановка по значимости — подглядывание, доля ложных тревог растёт.
  - text: 90 дней — чем дольше, тем лучше
    correct: false
    why: Слишком длинный тест — дорого, растёт риск загрязнения (очистка cookies, смена устройств), бизнес
      ждёт.
  explanation: |-
    Ещё соображения при выборе длительности: эффект новизны (нужно дать ему затухнуть),
    бизнес-циклы (дни зарплаты для банка), праздники, которые лучше не захватывать.
- id: stab-novelty-013
  topic: stats/ab_design
  type: mcq
  question: |-
    Новый дизайн ленты дал +8% кликов в первые три дня, а к концу второй недели — +1%.
    Как это интерпретировать и что проверить?
  difficulty: 2
  tags:
  - novelty_effect
  - duration
  options:
  - text: 'Похоже на эффект новизны: пользователи кликают на новое из любопытства. Нужно смотреть эффект
      по дням с момента первого показа и отдельно у новых пользователей'
    correct: true
    why: Если эффект у старых пользователей затухает, а у новых стабилен на уровне около +1%, долгосрочный
      эффект — около +1%, а не +8%.
  - text: Взять среднее за весь тест — это и есть эффект
    correct: false
    why: Среднее смешает временный всплеск и устойчивый эффект, и прогноз на будущее окажется завышен.
  - text: 'Результат первых дней самый надёжный: пользователи ещё не привыкли'
    correct: false
    why: 'Именно поэтому он ненадёжен для прогноза: привыкание неизбежно.'
  - text: Тест сломан, нужно перезапускать
    correct: false
    why: Затухание эффекта — не поломка, а свойство реакции пользователей.
  explanation: |-
    Обратный случай — **эффект первичности · primacy effect**: пользователи сначала сопротивляются изменениям,
    и эффект со временем растёт.
- id: stab-creditlimit-014
  topic: stats/ab_design
  type: open
  question: |-
    Спроектируйте A/B-тест автоматического повышения кредитного лимита. Чем он отличается
    от продуктового теста в e-comm?
  difficulty: 3
  tags:
  - credit_risk
  - performance_window
  - design
  - interview
  answer: |-
    **Гипотеза.** Повышение лимита на X% клиентам с хорошей платёжной историей увеличит оборот
    и процентный доход, не повысив потери сверх допустимого.

    **Единица рандомизации — клиент**, не карта и не заявка: у клиента может быть несколько карт,
    и ему нельзя одновременно дать разные условия.

    **Метрики.**
    - Primary: процентный доход или прибыль на клиента за горизонт (не просто оборот).
    - Guardrail: просрочка 30+ и 90+, ожидаемые потери (PD × LGD × EAD), жалобы.
    - Secondary: утилизация лимита, оборот, отток.

    **Главное отличие от e-comm — длинный горизонт.** Дефолт «созревает» месяцами. Нужен
    **performance window** — например, 6–12 месяцев наблюдения после изменения лимита.
    Решение по оборотам можно получить быстро, но вывод о рисках — только когда когорта созреет.
    На коротком горизонте смотрят ранние индикаторы: 1+ и 30+ по первым платежам после повышения.

    **Другие особенности.**
    - Эффект необратим: выданный лимит нельзя «откатить» без последствий для клиента.
      Поэтому тестовую группу делают небольшой и ограничивают сегмент.
    - Регуляторные ограничения на условия для клиентов.
    - Выборка: дефолты редкие, для guardrail по дефолтам нужна большая выборка или длинный горизонт.
    - Решение принимается по ожидаемой прибыли с учётом потерь, а не только по значимости.
  rubric:
  - Выбрал клиента как единицу рандомизации с обоснованием
  - Назвал primary и guardrail-метрики, включая просрочку или ожидаемые потери
  - Объяснил необходимость performance window и созревания когорты
  - Назвал ранние индикаторы риска
  - Упомянул необратимость решения или регуляторные ограничения
  explanation: |-
    Ключевые отличия риск-тестов от продуктовых: длинное созревание целевого события,
    асимметричная цена ошибок, необратимость и регуляторика. На собесе в риск-команду этот
    вопрос проверяет, понимаешь ли ты эти отличия.
- id: stab-checkout-015
  topic: stats/ab_design
  type: open
  question: Спроектируйте A/B-тест новой страницы оплаты в интернет-магазине.
  difficulty: 2
  tags:
  - design
  - ecomm
  - interview
  answer: |-
    **Гипотеза.** Упрощённая страница оплаты (меньше полей, автозаполнение) повысит конверсию
    из корзины в оплату на 1 п.п., потому что часть пользователей бросает оплату из-за длинной формы.

    **Метрики.**
    - Primary: конверсия из начала оплаты в успешную оплату на пользователя.
    - Secondary: время на странице, доля ошибок в форме, средний чек.
    - Guardrail: доля отказов платёжной системы, возвраты и chargeback, выручка на пользователя.

    **Единица рандомизации — пользователь** (залогиненный id), хеш от id с солью эксперимента.
    Анализ на том же уровне.

    **Размер выборки.** Базовая конверсия, скажем, 60%, MDE 1 п.п.:
    $n \approx 16 \cdot \frac{0{,}6 \cdot 0{,}4}{0{,}01^2} \approx 38\,000$ на группу.
    Делим на трафик страницы оплаты — получаем длительность, округляем до полных недель.

    **Перед запуском.** A/A или исторический A/A на этой схеме сплита.

    **Во время теста.** Не останавливать по промежуточной значимости. Мониторить только guardrail
    на случай поломки (рост отказов платежей).

    **Анализ.** Проверка SRM, эффект и 95% интервал, сравнение интервала с MDE,
    проверка guardrail. Разбивка по устройствам — как secondary, с осторожностью к множественным сравнениям.
  rubric:
  - Сформулировал гипотезу с механизмом и ожидаемым эффектом
  - Разделил метрики на primary, secondary и guardrail
  - Выбрал единицу рандомизации и способ сплита
  - Оценил размер выборки через базовую конверсию и MDE
  - Упомянул SRM, полные недели и запрет на подглядывание
  explanation: |-
    Формула $n \approx 16\sigma^2 / \Delta^2$ соответствует α = 0,05 и мощности 80%;
    для доли $\sigma^2 = p(1-p)$.
