- id: la-det-001
  topic: math/linalg
  type: mcq
  question: У квадратной матрицы $A$ определитель равен нулю. Что из этого следует?
  difficulty: 1
  tags:
  - determinant
  - singular
  options:
  - text: Столбцы $A$ линейно зависимы, обратной матрицы не существует
    correct: true
    why: 'Нулевой определитель означает вырожденность: преобразование схлопывает пространство в меньшую
      размерность, и обратить его нельзя.'
  - text: Все элементы $A$ равны нулю
    correct: false
    why: Нулевая матрица — лишь частный случай. Например, у матрицы из двух одинаковых строк определитель
      равен нулю, но элементы ненулевые.
  - text: Матрица ортогональна
    correct: false
    why: У ортогональной матрицы определитель равен $\pm 1$, а не нулю.
  - text: Система $Ax = b$ имеет единственное решение
    correct: false
    why: 'Наоборот: при нулевом определителе решений либо бесконечно много, либо нет вовсе.'
  explanation: |-
    Геометрически определитель — коэффициент изменения объёма при преобразовании.
    Ноль означает, что объём схлопнулся, информация потеряна, обратить преобразование невозможно.
- id: la-eig-002
  topic: math/linalg
  type: card
  question: Дай определение собственного вектора и собственного значения матрицы.
  difficulty: 1
  tags:
  - eigen
  answer: |-
    Ненулевой вектор $v$ называется собственным вектором матрицы $A$, если
    $$A v = \lambda v$$
    где число $\lambda$ — соответствующее собственное значение.

    Смысл: это направление, которое матрица не поворачивает, а только растягивает или сжимает в $\lambda$ раз.
  explanation: 'Собственные векторы определены с точностью до масштаба: если $v$ собственный, то и $cv$
    тоже.'
- id: la-sym-003
  topic: math/linalg
  type: mcq
  question: Матрица $A$ вещественная и симметричная. Что гарантированно верно про её собственные значения
    и векторы?
  difficulty: 2
  tags:
  - symmetric
  - spectral
  options:
  - text: Все собственные значения вещественны, а собственные векторы можно выбрать ортогональными
    correct: true
    why: Это спектральная теорема — именно она даёт разложение $A = Q\Lambda Q^T$ с ортогональной $Q$.
  - text: Все собственные значения положительны
    correct: false
    why: Это верно только для положительно определённой матрицы. Симметричная может иметь и отрицательные
      собственные значения — например, $\mathrm{diag}(1, -1)$.
  - text: Собственные значения могут быть комплексными
    correct: false
    why: У вещественной симметричной матрицы комплексных собственных значений не бывает.
  - text: Все собственные векторы совпадают с осями координат
    correct: false
    why: Они ортогональны друг другу, но в общем случае повёрнуты относительно осей.
  explanation: |-
    Именно ортогональность собственных векторов позволяет заменить дорогое обращение $P^{-1}$
    на дешёвое транспонирование $Q^T$ в спектральном разложении.
- id: la-xtx-004
  topic: math/linalg
  type: multi
  question: |-
    Матрица данных $X$ имеет размер $n \times k$ ($n$ объектов, $k$ признаков).
    Какие утверждения про $X^T X$ верны? Выбери все верные.
  difficulty: 2
  tags:
  - regression
  - gram
  options:
  - text: Размер матрицы равен $k \times k$
    correct: true
  - text: Матрица симметрична
    correct: true
  - text: Матрица положительно полуопределена
    correct: true
  - text: Матрица всегда обратима
    correct: false
    why: При линейно зависимых признаках (мультиколлинеарность) определитель равен нулю и обратной не
      существует. Именно это чинит Ridge через $X^TX + \lambda I$.
  - text: Размер матрицы равен $n \times n$
    correct: false
    why: Это размер $XX^T$, другой матрицы. У $X^TX$ размер определяется числом признаков, а не объектов.
  explanation: |-
    Симметричность следует из $(X^TX)^T = X^T X$, а положительная полуопределённость —
    из того, что $v^T X^T X v = \|Xv\|^2 \geq 0$ для любого $v$.
- id: la-mcoll-005
  topic: math/linalg
  type: open
  question: |-
    В линейной регрессии два признака почти полностью коррелированы.
    Что произойдёт с решением $w = (X^TX)^{-1}X^Ty$ и как это чинить?
  difficulty: 2
  tags:
  - multicollinearity
  - ridge
  - case
  answer: |-
    Матрица $X^TX$ становится почти вырожденной: её определитель близок к нулю,
    а минимальное собственное значение близко к нулю. Обращение такой матрицы численно неустойчиво —
    веса получаются огромными по модулю и взаимно компенсирующими друг друга.
    Малое изменение данных резко меняет решение.

    Геометрически функция потерь перестаёт быть круглой чашей и превращается в желоб:
    вдоль одного направления дно плоское, поэтому оптимум не единственный.

    Лечится L2-регуляризацией: в $X^TX + \lambda I$ все собственные значения сдвигаются вверх на $\lambda$,
    матрица становится гарантированно обратимой, а решение устойчивым.
    Альтернативы: убрать один из признаков, применить PCA, решать через SVD или QR вместо прямого обращения.
  rubric:
  - Сказал, что $X^TX$ становится почти вырожденной (определитель и минимальное собственное значение близки
    к нулю)
  - 'Упомянул неустойчивость решения: большие веса, сильная чувствительность к данным'
  - Назвал Ridge и объяснил, что $\lambda I$ делает матрицу обратимой
  - 'Предложил альтернативы: удаление признака, PCA, решение через SVD или QR'
  explanation: |-
    Полезно назвать и число обусловленности — отношение максимального собственного значения к минимальному.
    При мультиколлинеарности оно взрывается, и это формальная мера проблемы.
- id: la-svd-006
  topic: math/linalg
  type: card
  question: Запиши сингулярное разложение матрицы и назови свойства сингулярных чисел.
  difficulty: 2
  tags:
  - svd
  answer: |-
    Для любой матрицы $X$ размера $n \times k$:
    $$X = U \Sigma V^T$$
    где $U$ и $V$ ортогональны, а $\Sigma$ диагональна с сингулярными числами $\sigma_i$ на диагонали.

    Сингулярные числа всегда **неотрицательны** и упорядочены по убыванию: $\sigma_1 \geq \sigma_2 \geq \dots \geq 0$.
  explanation: |-
    В отличие от собственных значений, сингулярные числа существуют у любой матрицы,
    включая прямоугольную, и не бывают отрицательными.
- id: la-svd-007
  topic: math/linalg
  type: mcq
  question: Как сингулярные числа матрицы $X$ связаны с собственными значениями матрицы $X^T X$?
  difficulty: 3
  tags:
  - svd
  - eigen
  options:
  - text: Сингулярные числа — квадратные корни из собственных значений $X^TX$
    correct: true
    why: Подстановка $X = U\Sigma V^T$ даёт $X^TX = V \Sigma^2 V^T$ — спектральное разложение с $\Sigma^2$
      в середине.
  - text: Сингулярные числа равны собственным значениям $X^TX$
    correct: false
    why: 'Они равны корням из них. Отсюда, кстати, следует неотрицательность: $X^TX$ положительно полуопределена.'
  - text: Сингулярные числа — квадраты собственных значений $X^TX$
    correct: false
    why: 'Соотношение обратное: возводится в квадрат сингулярное число, а не собственное значение.'
  - text: Связи нет, это независимые характеристики
    correct: false
    why: Связь прямая, и именно на ней строится вычисление PCA через SVD.
  explanation: |-
    $X^TX = (U\Sigma V^T)^T(U\Sigma V^T) = V\Sigma^T U^T U \Sigma V^T = V \Sigma^2 V^T$,
    поскольку $U^TU = I$. Значит собственные значения $X^TX$ равны $\sigma_i^2$.
- id: la-pca-008
  topic: math/linalg
  type: mcq
  question: Что такое главные компоненты в методе PCA?
  difficulty: 2
  tags:
  - pca
  options:
  - text: Собственные векторы ковариационной матрицы центрированных данных
    correct: true
    why: Они задают направления максимального разброса и взаимно ортогональны, потому что ковариационная
      матрица симметрична.
  - text: Собственные значения ковариационной матрицы
    correct: false
    why: Собственные значения показывают дисперсию вдоль компонент, но сами компонентами не являются.
  - text: Исходные признаки, отсортированные по дисперсии
    correct: false
    why: PCA не отбирает исходные признаки, а строит новые — их линейные комбинации.
  - text: Строки матрицы данных с наибольшей нормой
    correct: false
    why: Компоненты относятся к пространству признаков, а не к отдельным объектам выборки.
  explanation: |-
    Главные компоненты — новые оси, повёрнутые так, чтобы лечь вдоль направлений
    наибольшего разброса данных. Дисперсию вдоль каждой оси даёт соответствующее собственное значение.
- id: la-pca-009
  topic: math/linalg
  type: open
  question: |-
    Опиши алгоритм PCA по шагам и объясни, почему на практике его считают через SVD,
    а не через ковариационную матрицу.
  difficulty: 2
  tags:
  - pca
  - case
  answer: |-
    Шаги: центрировать данные (вычесть среднее по каждому признаку, обычно ещё и стандартизировать),
    посчитать ковариационную матрицу, найти её собственные векторы и собственные значения,
    отсортировать по убыванию собственных значений, взять первые $k$ компонент,
    спроецировать данные на них.

    На практике вместо этого делают SVD центрированной матрицы данных.
    Правые сингулярные векторы совпадают с главными компонентами,
    а дисперсии выражаются как $\sigma_i^2 / n$.

    Причина — численная устойчивость: образование $X^TX$ возводит сингулярные числа в квадрат
    и резко ухудшает обусловленность. SVD работает с $X$ напрямую.
    Дополнительно не нужно хранить ковариационную матрицу, которая при большом числе признаков огромна.
  rubric:
  - Назвал центрирование как обязательный первый шаг
  - Сказал, что компоненты — собственные векторы ковариации, а собственные значения — дисперсии вдоль
    них
  - Упомянул сортировку по убыванию и отбор первых $k$ компонент
  - Объяснил, что SVD устойчивее, так как не требует образования $X^TX$
  explanation: |-
    Число компонент обычно выбирают по доле объяснённой дисперсии
    (например, покрыть 95%) либо по излому на графике собственных значений.
- id: la-spec-010
  topic: math/linalg
  type: card
  question: Запиши спектральное разложение симметричной матрицы и объясни смысл каждого множителя.
  difficulty: 2
  tags:
  - spectral
  - symmetric
  answer: |-
    $$A = Q \Lambda Q^T$$
    где $\Lambda$ — диагональная матрица собственных значений, $Q$ — ортогональная матрица,
    столбцы которой суть нормированные собственные векторы $A$.

    Читая справа налево: $Q^T$ поворачивает пространство в систему координат собственных векторов,
    $\Lambda$ растягивает вдоль этих осей, $Q$ поворачивает обратно.
  explanation: |-
    Ключевой момент: $Q^{-1} = Q^T$, потому что $Q$ ортогональна.
    Для несимметричной матрицы собственные векторы не ортогональны, и обращение приходится считать честно.
- id: la-inv-011
  topic: math/linalg
  type: multi
  question: Какие утверждения про обратную матрицу верны? Выбери все верные.
  difficulty: 1
  tags:
  - inverse
  options:
  - text: Обратная матрица существует только для квадратных матриц
    correct: true
  - text: Обратная матрица описывает преобразование, обратное исходному
    correct: true
  - text: Для существования обратной необходим ненулевой определитель
    correct: true
  - text: Произведение матрицы на обратную даёт нулевую матрицу
    correct: false
    why: 'Даёт единичную матрицу: $A A^{-1} = A^{-1} A = I$.'
  - text: Обратная матрица существует для матрицы любого размера
    correct: false
    why: У прямоугольной матрицы обратной нет. Для неё определяют псевдообратную, которая строится через
      SVD.
  explanation: |-
    Для прямоугольных и вырожденных матриц роль обратной играет псевдообратная Мура-Пенроуза
    $X^+ = V\Sigma^+U^T$ — именно она стоит за решением методом наименьших квадратов в `numpy.linalg.lstsq`.
- id: la-pca-012
  topic: math/linalg
  type: open
  question: Почему перед PCA признаки нужно стандартизировать? Что будет, если этого не сделать?
  difficulty: 2
  tags:
  - pca
  - scaling
  answer: |-
    PCA ищет направления максимальной дисперсии, а дисперсия зависит от единиц измерения.
    Если один признак — зарплата в рублях с разбросом в десятки тысяч, а другой — возраст с разбросом в десятки,
    то первый получит несоизмеримо большую дисперсию просто из-за масштаба.

    Без стандартизации первая главная компонента будет почти полностью повторять признак
    с самыми большими числами, а реально информативные признаки в мелких единицах окажутся отброшены.

    Стандартизация (вычесть среднее, поделить на стандартное отклонение) уравнивает вклад признаков.
    Формально это переход от ковариационной матрицы к корреляционной.
  rubric:
  - Сказал, что дисперсия зависит от единиц измерения признака
  - Объяснил, что признак с большим масштабом перетянет на себя первую компоненту
  - 'Назвал стандартизацию: вычесть среднее, поделить на стандартное отклонение'
  - Упомянул, что центрирование обязательно в любом случае, даже без масштабирования
  explanation: |-
    Исключение — когда все признаки уже в одинаковых единицах и разброс содержателен
    (например, интенсивности пикселей). Тогда стандартизация может стереть полезную информацию.
- id: la-quad-013
  topic: math/linalg
  type: mcq
  question: |-
    В критической точке функции многих переменных гессиан имеет собственные значения
    разных знаков. Что это за точка?
  difficulty: 3
  tags:
  - quadratic_form
  - hessian
  - optimization
  options:
  - text: Седловая точка
    correct: true
    why: По одним направлениям функция возрастает, по другим убывает — это и есть седло.
  - text: Локальный минимум
    correct: false
    why: Для минимума нужно, чтобы все собственные значения были положительны (гессиан положительно определён).
  - text: Локальный максимум
    correct: false
    why: Для максимума все собственные значения должны быть отрицательны.
  - text: Точка разрыва функции
    correct: false
    why: Гессиан вычисляется там, где функция дважды дифференцируема, так что разрыва в этой точке нет.
  explanation: |-
    Около критической точки функция приближается квадратичной формой $\tfrac{1}{2}\Delta w^T H \Delta w$
    (линейный член исчезает, так как градиент равен нулю). Знак этой формы по разным направлениям
    и определяет тип точки. В глубоком обучении сёдла встречаются чаще локальных минимумов:
    чтобы точка была минимумом, все $n$ собственных значений должны оказаться положительными.
- id: la-cond-014
  topic: math/linalg
  type: card
  question: Что такое число обусловленности матрицы и о чём оно говорит в контексте обучения моделей?
  difficulty: 2
  tags:
  - conditioning
  - svd
  answer: |-
    $$\kappa(X) = \frac{\sigma_{\max}}{\sigma_{\min}}$$
    отношение наибольшего сингулярного числа к наименьшему.

    Большое значение означает плохую обусловленность: решение системы численно неустойчиво,
    а линии уровня функции потерь сильно вытянуты в овраг, из-за чего градиентный спуск
    идёт зигзагом и сходится медленно.
  explanation: |-
    Отсюда практические следствия: стандартизация признаков делает ландшафт более круглым,
    а momentum и Adam гасят зигзаги. Ridge-регуляризация напрямую улучшает обусловленность.
- id: la-orth-015
  topic: math/linalg
  type: mcq
  question: Матрица $Q$ ортогональна. Что из этого следует?
  difficulty: 1
  tags:
  - orthogonal
  options:
  - text: $Q^{-1} = Q^T$, и преобразование сохраняет длины векторов и углы между ними
    correct: true
    why: Из $Q^TQ = I$ сразу следует равенство обратной и транспонированной, а сохранение скалярного произведения
      даёт сохранение длин и углов.
  - text: Все элементы $Q$ неотрицательны
    correct: false
    why: Знаки элементов произвольны. Например, матрица поворота содержит отрицательные элементы.
  - text: Определитель $Q$ равен нулю
    correct: false
    why: 'Наоборот, он равен $\pm 1$: ортогональное преобразование сохраняет объём.'
  - text: $Q$ обязательно диагональна
    correct: false
    why: Диагональная ортогональная матрица — лишь частный случай с $\pm 1$ на диагонали. Любой поворот
      тоже ортогонален.
  explanation: |-
    Именно сохранение длин и углов делает ортогональные преобразования численно безопасными:
    они не усиливают ошибки округления. Поэтому на них строятся QR-разложение и SVD.
