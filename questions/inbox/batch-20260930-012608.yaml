- id: sttest-anatomy-001
  topic: stats/tests
  type: card
  question: Из каких двух частей состоит любой статистический критерий и чем критерии отличаются друг
    от друга?
  difficulty: 1
  tags:
  - test_statistic
  - null_distribution
  answer: |-
    1. **Статистика** — как сжать данные в одно число. Чаще всего это
       $\dfrac{\text{наблюдённая разница}}{SE}$.
    2. **Распределение этой статистики при H₀** — с чем её сравнивать, чтобы получить p-value.

    Критерии различаются в основном тем, **как получают распределение при H₀**:
    - через ЦПТ — нормальное или t: z-тест, t-тест Уэлча;
    - через сумму квадратов нормальных — хи-квадрат: χ²-тест для таблиц;
    - точной комбинаторикой — тест Фишера;
    - через ранги — Манн-Уитни;
    - симуляцией — бутстрап, перестановочный тест.
  explanation: |-
    Выбор критерия определяется двумя вопросами: **что** сравниваем (среднее, долю,
    распределение целиком, квантиль) и **какие допущения** выполнены (независимость,
    размер выборки, парность наблюдений).
- id: sttest-conv-002
  topic: stats/tests
  type: mcq
  question: |-
    Нужно сравнить конверсию в покупку в двух группах A/B-теста, по 20 000 пользователей в каждой.
    Какой критерий подходит?
  difficulty: 1
  tags:
  - proportions
  - z_test
  - chi_squared
  options:
  - text: z-тест для двух долей или χ²-тест для таблицы 2×2 — они дают одинаковое p-value
    correct: true
    why: Конверсия — доля. При больших $n$ выборочная доля по ЦПТ почти нормальна. χ² для таблицы 2×2
      равен $z^2$, поэтому p-value совпадают.
  - text: Манна-Уитни
    correct: false
    why: 'Для бинарных данных ранговый тест неудобен и теряет смысл: почти все значения — одинаковые нули
      и единицы.'
  - text: Точный тест Фишера — он всегда точнее
    correct: false
    why: Фишер нужен при маленьких числах в ячейках. На 20 000 наблюдений он даёт практически то же, что
      z-тест, но считается дольше.
  - text: Парный t-тест
    correct: false
    why: Группы независимы, пар нет.
  explanation: |-
    На практике для конверсии в A/B чаще всего используют z-тест для долей или t-тест на нулях
    и единицах — на больших выборках все они совпадают.
- id: sttest-welch-003
  topic: stats/tests
  type: mcq
  question: |-
    Сравниваем средний доход на пользователя в двух группах по 15 000 человек.
    Разброс дохода в тестовой группе заметно больше. Какой критерий взять?
  difficulty: 1
  tags:
  - t_test
  - welch
  - means
  options:
  - text: t-тест Уэлча — он не требует равенства дисперсий
    correct: true
    why: Уэлч считает SE разницы как $\sqrt{s_A^2/n_A + s_B^2/n_B}$ — у каждой группы своя дисперсия.
  - text: t-тест Стьюдента — классический вариант
    correct: false
    why: Классический t-тест предполагает равные дисперсии и объединяет их. При неравных дисперсиях и
      разных размерах групп он может давать неверную долю ложных тревог.
  - text: χ²-тест
    correct: false
    why: χ² работает с частотами в таблице, а не со средними непрерывной величины.
  - text: 'Нельзя сравнить: доход не нормален'
    correct: false
    why: На 15 000 наблюдений по ЦПТ средние почти нормальны. Ненормальность данных не мешает.
  explanation: |-
    В scipy: `ttest_ind(a, b, equal_var=False)`. Поскольку Уэлч почти ничего не теряет при равных дисперсиях
    и защищает при неравных, его используют по умолчанию.
- id: sttest-welchwhy-004
  topic: stats/tests
  type: mcq
  question: Почему t-тест Уэлча считается разумным выбором по умолчанию вместо классического t-теста Стьюдента?
  difficulty: 2
  tags:
  - welch
  - student
  - assumptions
  - interview
  options:
  - text: При равных дисперсиях он почти не теряет мощность, а при неравных сохраняет правильную долю
      ложных тревог
    correct: true
    why: Стьюдент выигрывает только когда дисперсии действительно равны, и выигрыш маленький. Когда они
      не равны, особенно при разных размерах групп, Стьюдент ошибается заметно.
  - text: Уэлч не требует нормальности, а Стьюдент требует
    correct: false
    why: Оба опираются на одни и те же предположения о нормальности средних. Различие только в дисперсиях.
  - text: Уэлч — непараметрический тест
    correct: false
    why: Нет, это параметрический t-тест с другой формулой SE и степеней свободы.
  - text: Уэлч всегда даёт меньшее p-value
    correct: false
    why: Не всегда, и выбирать тест по тому, какое p-value меньше, — p-хакинг.
  explanation: |-
    Отдельная предварительная проверка «равны ли дисперсии» с последующим выбором теста
    не рекомендуется: она сама добавляет ошибок. Проще сразу использовать Уэлча.
- id: sttest-chiz-005
  topic: stats/tests
  type: mcq
  question: z-тест для двух долей дал $z = 2{,}22$, p = 0,027. Что покажет χ²-тест на той же таблице 2×2?
  difficulty: 2
  tags:
  - chi_squared
  - z_test
  - equivalence
  options:
  - text: $\chi^2 \approx 4{,}93$ и то же p = 0,027
    correct: true
    why: Для таблицы 2×2 без поправки χ² = $z^2$ = $2{,}22^2 \approx 4{,}93$. У χ² с одной степенью свободы
      только правый хвост, но в нём уже «сложены» оба хвоста z, поэтому p-value то же.
  - text: $\chi^2 = 2{,}22$, p = 0,027
    correct: false
    why: χ² — это квадрат z, а не сам z.
  - text: $\chi^2 \approx 4{,}93$, p = 0,013
    correct: false
    why: Это p-value одного хвоста z. χ² положителен, и его правый хвост соответствует обоим хвостам z.
  - text: Результаты несравнимы, это разные тесты
    correct: false
    why: Для 2×2 это одна и та же проверка в двух записях.
  explanation: |-
    Иногда используют поправку Йейтса на непрерывность — тогда χ² чуть меньше $z^2$. На больших выборках
    разница пренебрежима.
- id: sttest-fisher-006
  topic: stats/tests
  type: mcq
  question: |-
    В пилоте нового продукта: 3 мошенника из 40 клиентов в одном канале и 0 из 38 в другом.
    Какой тест уместен для сравнения долей?
  difficulty: 2
  tags:
  - fisher_exact
  - small_samples
  options:
  - text: Точный тест Фишера — числа в ячейках слишком малы для нормального приближения
    correct: true
    why: Ожидаемые числа мошенников в ячейках около 1,5 — правило «хотя бы 5 в каждой ячейке» нарушено.
      Фишер считает p-value точно, перебором таблиц. Здесь он даёт p ≈ 0,24.
  - text: z-тест для долей
    correct: false
    why: z-тест опирается на нормальное приближение, которое при единицах событий не работает.
  - text: t-тест Уэлча
    correct: false
    why: Та же проблема с приближением, плюс данные бинарные и крошечные.
  - text: 'Сравнивать нечего: в одном канале 0, значит, разница очевидна'
    correct: false
    why: 3 против 0 на таких выборках вполне могут быть случайностью. Фишер даёт p ≈ 0,24 — разница не
      значима.
  explanation: |-
    Правило: если в таблице 2×2 ожидаемые частоты меньше 5, используют точный тест Фишера.
    В A/B с тысячами наблюдений он не нужен.
- id: sttest-mwu-007
  topic: stats/tests
  type: mcq
  question: Что на самом деле проверяет тест Манна-Уитни?
  difficulty: 2
  tags:
  - mann_whitney
  - ranks
  - auc
  - interview
  options:
  - text: Равна ли ½ вероятность того, что случайное значение из B больше случайного значения из A
    correct: true
    why: Тест работает с рангами и сравнивает, насколько одна выборка «систематически выше» другой. Это
      не тест на равенство средних и не тест медиан в общем случае.
  - text: Равны ли средние двух групп
    correct: false
    why: Нет. Средние могут различаться в одну сторону, а «кто обычно выше» — в другую, например, если
      в одной группе редкие огромные значения.
  - text: Равны ли медианы двух групп
    correct: false
    why: Только при дополнительном допущении, что распределения одинаковой формы и отличаются лишь сдвигом.
      В общем случае — нет.
  - text: Нормальны ли данные
    correct: false
    why: Для проверки нормальности есть отдельные тесты. Манна-Уитни сравнивает две группы.
  explanation: |-
    Связь с ML: статистика $U$, делённая на $n_A \cdot n_B$, — это ровно ROC AUC, если считать
    одну группу «положительным классом». AUC — вероятность, что случайный положительный объект
    получит скор выше случайного отрицательного.

    В A/B по выручке Манна-Уитни опасен: бизнесу важно среднее (выручка = число × средний чек),
    а тест отвечает на другой вопрос.
- id: sttest-paired-008
  topic: stats/tests
  type: mcq
  question: |-
    Чтобы оценить эффект нового скрипта продаж, отделения разбили на 24 пары похожих
    (регион, размер, продажи в прошлом году); в каждой паре одно отделение получило скрипт.
    Как анализировать?
  difficulty: 2
  tags:
  - paired_test
  - variance_reduction
  options:
  - text: Парным t-тестом по разностям внутри пар
    correct: true
    why: Разность внутри пары убирает разброс **между** парами — большие и маленькие отделения сравниваются
      с похожими. SE становится меньше, тест чувствительнее.
  - text: t-тестом Уэлча для двух независимых групп по 24 отделения
    correct: false
    why: 'Корректно, но выбрасывает информацию о парах: огромные различия между отделениями разных регионов
      останутся шумом, и мощность будет ниже.'
  - text: χ²-тестом
    correct: false
    why: χ² работает с частотами категорий, а не с продажами.
  - text: Сравнить продажи отделений со скриптом до и после внедрения
    correct: false
    why: Без контрольной группы изменение «до — после» смешивает эффект скрипта с сезонностью и общими
      трендами.
  explanation: |-
    Парный тест — обычный одновыборочный t-тест на разностях: $t = \bar d / (s_d / \sqrt{n})$, df = $n - 1 = 23$.
    Тот же принцип «убрать предсказуемый разброс» лежит в основе CUPED.
- id: sttest-srm-009
  topic: stats/tests
  type: mcq
  question: |-
    Сплит задуман 50/50, в группах получилось 50 500 и 49 500 пользователей.
    Есть ли SRM (перекос размеров групп)?
  difficulty: 2
  tags:
  - srm
  - chi_squared
  - ab_testing
  options:
  - text: 'Да: $\chi^2 = 10$, p ≈ 0,0016 — такой перекос случайно почти не бывает'
    correct: true
    why: Ожидаемо по 50 000. $\chi^2 = \frac{500^2}{50\,000} + \frac{500^2}{50\,000} = 5 + 5 = 10$, одна
      степень свободы, p ≈ 0,0016. Сплит сломан.
  - text: 'Нет: разница всего 1%'
    correct: false
    why: На 100 000 пользователей случайный разброс размеров около ±160 человек. Отклонение в 500 — это
      больше трёх стандартных отклонений.
  - text: Проверять нужно t-тестом средних метрик
    correct: false
    why: SRM — про число пользователей в группах, это проверка частот. Подходит χ² на соответствие ожидаемым
      долям.
  - text: Это нормально, результаты теста можно использовать
    correct: false
    why: При SRM группы, скорее всего, различаются не только воздействием (боты, баг логирования, фильтр
      только в одной группе). Результаты теста нельзя считать надёжными.
  explanation: |-
    Формула χ²: $\sum \frac{(\text{наблюдено} - \text{ожидаемо})^2}{\text{ожидаемо}}$.
    Для SRM обычно берут строгий порог (например, p < 0,001), потому что проверка делается во всех тестах подряд.
- id: sttest-gini-010
  topic: stats/tests
  type: mcq
  question: |-
    Новая скоринговая модель на отложенной выборке дала Gini 0,52, старая — 0,50.
    Обе модели считали на **одних и тех же** клиентах. Как проверить, значима ли разница?
  difficulty: 2
  tags:
  - bootstrap
  - paired
  - model_comparison
  - credit_risk
  options:
  - text: 'Парным бутстрапом: пересемплировать клиентов и на каждой псевдовыборке считать разницу Gini
      двух моделей'
    correct: true
    why: Скоры двух моделей на одних клиентах сильно коррелированы. Парный бутстрап сохраняет эту связь,
      и интервал для разницы получается узким и честным. Альтернатива — тест ДеЛонга для разницы AUC.
  - text: Построить бутстрап-интервал Gini для каждой модели отдельно и проверить, перекрываются ли они
    correct: false
    why: 'Игнорирует парность и страдает от проблемы перекрытия интервалов: разница может быть значимой,
      даже если интервалы перекрываются.'
  - text: t-тестом по скорам двух моделей
    correct: false
    why: Сравнение средних скоров ничего не говорит о качестве ранжирования.
  - text: Разница 0,02 очевидно значима
    correct: false
    why: Зависит от размера выборки и числа дефолтов. На маленькой выборке 0,02 Gini — обычный шум.
  explanation: |-
    Gini = $2 \cdot AUC - 1$. У него нет простой формулы SE, поэтому стандартный путь — бутстрап.
    Ключ — **парный**: из-за корреляции скоров разница двух Gini гораздо стабильнее каждого из них.
- id: sttest-normality-011
  topic: stats/tests
  type: multi
  question: Какие утверждения о нормальности данных верны? Выбери все верные.
  difficulty: 2
  tags:
  - normality
  - assumptions
  - t_test
  options:
  - text: t-тест на больших выборках не требует нормальности самих данных
    correct: true
    why: По ЦПТ нормально выборочное среднее. Этого достаточно.
  - text: На малых выборках с сильной скошенностью t-тест может врать
    correct: true
    why: 'ЦПТ ещё не сработала: среднее скошено, реальная доля ложных тревог отличается от α.'
  - text: Манна-Уитни и бутстрап не требуют нормальности
    correct: true
    why: Первый работает с рангами, второй строит распределение симуляцией.
  - text: Перед каждым t-тестом нужно проверить нормальность тестом Шапиро-Уилка
    correct: false
    why: На больших выборках Шапиро отвергнет нормальность почти всегда (реальные данные не идеально нормальны),
      но t-тесту это не мешает. Проверка ничего не добавляет.
  - text: Если данные не нормальны, их обязательно нужно логарифмировать перед t-тестом
    correct: false
    why: 'Логарифм меняет вопрос: сравниваются геометрические средние («во сколько раз»), а не обычные.
      Иногда это полезно, но не обязательно.'
  explanation: |-
    Практическое правило для A/B: при тысячах наблюдений нормальность данных не проверяют.
    Смотрят на тяжёлые хвосты (выбросы раздувают дисперсию) и на независимость наблюдений.
- id: sttest-median-012
  topic: stats/tests
  type: mcq
  question: Бизнес хочет знать, изменилась ли **медиана** времени доставки в тесте. Какой подход корректен?
  difficulty: 2
  tags:
  - median
  - bootstrap
  - quantiles
  options:
  - text: Бутстрап-интервал для разницы медиан
    correct: true
    why: Для медианы нет простой формулы SE. Бутстрап даёт выборочное распределение разницы медиан напрямую.
      Если нужна поправка на ковариаты — квантильная регрессия.
  - text: Тест Манна-Уитни — это тест медиан
    correct: false
    why: Только при допущении, что распределения одной формы и отличаются сдвигом. В общем случае он проверяет
      «кто обычно больше», а не медианы.
  - text: t-тест на медианах групп
    correct: false
    why: Медиана в каждой группе — одно число. t-тест сравнивает средние выборок, здесь он неприменим.
  - text: χ²-тест на доле доставок дольше общей медианы
    correct: false
    why: Это медианный тест Муда — он существует, но теряет много информации. Бутстрап обычно предпочтительнее.
  explanation: |-
    Бутстрап при зависимых наблюдениях (много заказов одного пользователя) нужно делать по пользователям:
    пересемплировать целых пользователей со всеми их заказами.
- id: sttest-phack-013
  topic: stats/tests
  type: mcq
  question: |-
    t-тест Уэлча по выручке дал p = 0,08. Аналитик попробовал Манна-Уитни — получил p = 0,04
    и написал в отчёте «эффект значим». Что не так?
  difficulty: 3
  tags:
  - p_hacking
  - test_choice
  - interview
  options:
  - text: Выбор теста после просмотра результатов — p-хакинг. К тому же тесты отвечают на разные вопросы
    correct: true
    why: 'Каждый дополнительный тест — ещё одна попытка случайно пересечь порог, реальная доля ложных
      тревог выше 5%. И по сути: Уэлч спрашивает про среднюю выручку, Манна-Уитни — про «кто обычно больше».
      Для выручки бизнесу важно среднее.'
  - text: 'Всё корректно: Манна-Уитни устойчивее к выбросам'
    correct: false
    why: Устойчивость — не повод менять тест после того, как увидел p-value. Выбор должен быть сделан
      до анализа.
  - text: Нужно было взять меньшее из двух p-value и поделить на 2
    correct: false
    why: Так не делается ни в одной корректной процедуре.
  - text: Нужно было сделать ещё и бутстрап и выбрать тот, что даст наименьшее p-value
    correct: false
    why: Это усугубляет p-хакинг.
  explanation: |-
    Правильный порядок: до запуска теста зафиксировать метрику, критерий и порог.
    Если выручка с тяжёлыми хвостами — заранее решить про винзоризацию или CUPED и оставаться
    на вопросе о среднем.
- id: sttest-choose-014
  topic: stats/tests
  type: open
  question: Как выбрать статистический критерий для анализа A/B-теста?
  difficulty: 2
  tags:
  - test_choice
  - ab_testing
  - interview
  answer: |-
    Иду по вопросам.

    **1. Какой тип метрики?**
    - Доля (конверсия, доля дефолтов) → z-тест для долей или χ²; при очень малых числах — Фишер.
    - Среднее на пользователя (выручка, число заказов) → t-тест Уэлча.
    - Отношение двух сумм, где знаменатель случаен (средний чек = выручка / заказы при рандомизации по пользователям) → дельта-метод или бутстрап по пользователям.
    - Квантиль или медиана → бутстрап.

    **2. Совпадает ли единица анализа с единицей рандомизации?**
    Если рандомизировали пользователей, а метрика по заказам или сессиям — наблюдения зависимы,
    обычная формула SE занижена. Нужно агрегировать до пользователя, дельта-метод или бутстрап по пользователям.

    **3. Есть ли парность?** Одни и те же объекты или заранее подобранные пары → парный тест.

    **4. Хватает ли размера выборки для ЦПТ?** При тысячах наблюдений — да.
    При малых выборках со скошенностью — бутстрап или непараметрика.

    **5. Тяжёлые хвосты?** Не меняю тест, а заранее решаю про винзоризацию или CUPED.

    Всё это фиксируется **до** запуска теста.
  rubric:
  - 'Связал выбор критерия с типом метрики: доля, среднее, отношение, квантиль'
  - Назвал проверку соответствия единицы анализа единице рандомизации
  - Упомянул парный дизайн
  - Упомянул размер выборки и ЦПТ
  - Сказал, что критерий выбирается до анализа
  explanation: |-
    На собесе этот вопрос проверяет систематичность. Хороший ответ — дерево решений,
    а не список всех известных тестов.
- id: sttest-ratio-015
  topic: stats/tests
  type: open
  question: |-
    Рандомизация по пользователям, метрика — средний чек (выручка / число заказов).
    Аналитик запускает t-тест, где каждое наблюдение — отдельный заказ. Что не так и как сделать правильно?
  difficulty: 3
  tags:
  - ratio_metric
  - delta_method
  - dependence
  - interview
  answer: |-
    **Проблема — зависимость наблюдений.** Заказы одного пользователя связаны: у «богатого»
    пользователя все чеки крупные. t-тест по заказам считает их независимыми. Реальная информация
    соответствует числу пользователей, а не заказов, поэтому SE получается **заниженной**,
    а ложных тревог — больше α.

    **Вторая особенность — это отношение.** Средний чек = сумма выручки / сумма заказов,
    и знаменатель тоже случаен: в тесте пользователи могут делать больше или меньше заказов.

    **Как правильно.**
    1. **Дельта-метод.** По пользователям считают выручку $R_i$ и число заказов $N_i$.
       Метрика $\bar R / \bar N$. Её дисперсию выражают через дисперсии $R$, $N$ и их ковариацию
       с помощью линеаризации. Получается корректная SE, дальше обычный z-тест.
    2. **Бутстрап по пользователям.** Пересемплируют пользователей целиком, со всеми их заказами,
       и на каждой псевдовыборке считают отношение.
    3. **Линеаризация** — превращают метрику в поюзерную величину, к которой применим обычный t-тест.
  rubric:
  - Назвал зависимость заказов одного пользователя
  - Сказал, что SE занижается и ложных тревог больше α
  - Отметил, что знаменатель отношения тоже случаен
  - Предложил дельта-метод или бутстрап по пользователям
  explanation: |-
    Общее правило: анализ должен идти на уровне единицы рандомизации. Если рандомизировали пользователей,
    независимы пользователи, а не их заказы или сессии.
