- id: mlint-types-001
  topic: ml/interpretability
  type: card
  question: По каким осям различают методы интерпретации моделей?
  difficulty: 1
  tags:
  - global
  - local
  - model_agnostic
  answer: |-
    **Глобальная против локальной.** Глобальная объясняет поведение модели в целом:
    какие признаки важны вообще (permutation importance, PDP). Локальная объясняет
    одно конкретное предсказание: почему отказали именно этому клиенту
    (SHAP для объекта, LIME).

    **Model-specific против model-agnostic.** Первые опираются на устройство модели:
    коэффициенты линейной регрессии, gain в деревьях, веса внимания. Вторые работают
    с любой моделью как с чёрным ящиком: permutation importance, LIME, PDP,
    Kernel SHAP — им нужна только возможность вызывать `predict`.

    **Интерпретируемая по построению против апостериорного объяснения.** Линейная
    модель или неглубокое дерево прозрачны сами по себе. Бустинг и нейросеть
    требуют отдельного метода объяснения поверх уже обученной модели,
    и такое объяснение — всегда приближение.
  explanation: |-
    Третья ось важна практически: апостериорное объяснение может быть неверным.
    Оно описывает не то, «как модель на самом деле думает», а то, как её поведение
    выглядит в рамках выбранной аппроксимации. Поэтому в регулируемых областях
    нередко требуют именно прозрачную по построению модель.
- id: mlint-gain-002
  topic: ml/interpretability
  type: mcq
  question: Чем плоха встроенная feature importance в бустинге (по gain или числу сплитов)?
  difficulty: 2
  tags:
  - feature_importance
  - gain
  - boosting
  - bias
  options:
  - text: Она смещена в пользу признаков с большим числом уникальных значений и считается на обучающей
      выборке, поэтому переобученный признак получает высокую важность
    correct: true
    why: У непрерывного признака или категории с высокой кардинальностью гораздо больше кандидатов на
      разбиение, и хотя бы одно из них случайно окажется удачным на train. Признак получает вклад, не
      имея предсказательной силы на новых данных.
  - text: Она вообще не отражает вклад признаков в предсказание
    correct: false
    why: Отражает, просто смещённо. Как быстрая первичная оценка она вполне полезна.
  - text: Она работает только для бинарной классификации
    correct: false
    why: Никакого ограничения по типу задачи нет.
  - text: Её значения всегда в сумме дают единицу, что мешает сравнению
    correct: false
    why: Нормировка — вопрос представления, а не источник смещения.
  explanation: |-
    Второе ограничение: при коррелированных признаках вклад делится между ними
    произвольно. Дерево выбрало один из двух почти одинаковых признаков — второй
    получил около нуля важности, хотя несёт ту же информацию. Вывод «второй признак
    бесполезен» будет неверным.

    Что делать: смотреть permutation importance на **валидационной** выборке
    или SHAP. В XGBoost стоит обращать внимание на тип важности — `weight`
    (число сплитов) смещён сильнее всего, `gain` разумнее, `total_gain` ещё лучше.
- id: mlint-perm-003
  topic: ml/interpretability
  type: card
  question: Как работает permutation importance? В чём её сильные и слабые стороны?
  difficulty: 2
  tags:
  - permutation_importance
  - model_agnostic
  answer: |-
    Алгоритм прост. Замеряем метрику качества на отложенной выборке. Затем берём один
    признак и случайно перемешиваем его значения между объектами, разрушая связь
    с целевой переменной, но сохраняя распределение. Снова замеряем метрику.
    Насколько она просела — такова важность признака. Повторяем для каждого признака,
    обычно с несколькими перестановками для усреднения.

    **Плюсы.** Работает с любой моделью, включая чёрный ящик. Измеряет важность
    в терминах именно той метрики, которая вам нужна. Считается на валидации,
    поэтому не поощряет переобученные признаки. Не требует переобучения модели.

    **Минусы.** При коррелированных признаках перемешивание порождает нереалистичные
    объекты (доход 20 тысяч при квартире за 30 миллионов), и модель оценивается
    в области, где она никогда не обучалась. Коррелированные признаки «страхуют»
    друг друга, и важность обоих занижается. Результат стохастичен и требует
    повторов. При большом числе признаков дорого: нужно $O(p \times n_{\text{repeats}})$
    проходов inference.
  explanation: |-
    Принципиальный момент: считать нужно на **валидации или тесте**, а не на train.
    Важность на обучающей выборке отвечает на вопрос «на что модель опирается»,
    важность на отложенной — «что действительно помогает обобщать». Признак-утечка,
    выученный наизусть, на train покажет огромную важность, на тесте — нулевую.
- id: mlint-shap-004
  topic: ml/interpretability
  type: card
  question: Что такое SHAP и на какой идее он построен?
  difficulty: 2
  tags:
  - shap
  - shapley
  - additive
  answer: |-
    SHAP переносит на машинное обучение **значения Шепли** из кооперативной теории игр.
    Там решалась задача справедливого дележа выигрыша между игроками; здесь «игроки» —
    это признаки, а «выигрыш» — отклонение предсказания от среднего.

    Вклад признака определяется как его средний предельный вклад по всем возможным
    порядкам добавления признаков в модель. Усреднение по порядкам нужно потому,
    что при взаимодействиях вклад зависит от того, какие признаки уже учтены.

    Главное свойство — **аддитивность**:
    $$f(x) = \phi_0 + \sum_{j=1}^{p}\phi_j$$
    где $\phi_0$ — среднее предсказание модели по выборке (base value), а $\phi_j$ —
    вклад признака $j$ для данного объекта. Сумма вкладов точно равна предсказанию,
    без остатка.

    Значения Шепли — единственный способ распределения вклада, удовлетворяющий
    набору естественных аксиом (эффективность, симметрия, отсутствие вклада
    у неиспользуемого признака, линейность).
  explanation: |-
    Честный расчёт требует перебора $2^p$ подмножеств признаков и непрактичен.
    Поэтому используют приближения: **TreeSHAP** для деревьев и бустинга считает
    значения точно и за полиномиальное время, используя структуру дерева;
    **KernelSHAP** работает с любой моделью, но медленно и приближённо;
    **DeepSHAP** адаптирован под нейросети.

    SHAP локален по своей природе, но глобальную картину получают агрегированием:
    средний модуль вклада по выборке даёт глобальную важность, а beeswarm-график
    показывает ещё и направление влияния.
- id: mlint-shapprop-005
  topic: ml/interpretability
  type: multi
  question: Какие утверждения о SHAP верны?
  difficulty: 2
  tags:
  - shap
  - properties
  options:
  - text: Сумма SHAP-значений всех признаков плюс base value в точности равна предсказанию модели для
      объекта
    correct: true
    why: Свойство эффективности. Именно оно делает SHAP пригодным для объяснений вида «скор снизился на
      40 баллов, из них 25 из-за просрочек».
  - text: SHAP-значение может быть отрицательным, что означает вклад в сторону уменьшения предсказания
    correct: true
    why: Знак показывает направление влияния конкретного значения признака у данного объекта.
  - text: TreeSHAP считает значения для деревьев точно, а не приближённо
    correct: true
    why: Структура дерева позволяет свернуть перебор подмножеств в обход дерева за полиномиальное время.
  - text: SHAP-значения показывают причинно-следственный эффект признака на целевую переменную
    correct: false
    why: Они объясняют **модель**, а не реальный мир. Если модель выучила корреляцию, SHAP честно покажет
      эту корреляцию как вклад.
  - text: Высокое SHAP-значение означает, что признак важен для всей выборки
    correct: false
    why: 'SHAP локален: значение относится к конкретному объекту. Глобальная важность получается усреднением
      модулей по выборке.'
  - text: SHAP-значение признака не зависит от значений остальных признаков объекта
    correct: false
    why: 'Зависит, и в этом смысл усреднения по порядкам добавления: при взаимодействиях вклад признака
      меняется в зависимости от контекста.'
  explanation: |-
    Полезная деталь для классификации: SHAP по умолчанию объясняет выход модели
    в пространстве **логитов** (raw margin), а не вероятностей, потому что аддитивность
    выполняется именно там. При переводе в вероятности сумма вкладов перестаёт
    быть точной — сигмоида нелинейна. Об этом часто забывают, объясняя результаты бизнесу.
- id: mlint-corr-006
  topic: ml/interpretability
  type: mcq
  question: В данных два сильно коррелированных признака. Permutation importance показала низкую важность
    обоих. Как это трактовать?
  difficulty: 3
  tags:
  - correlation
  - permutation_importance
  - pitfall
  options:
  - text: 'Они страхуют друг друга: при перемешивании одного модель берёт информацию из второго, поэтому
      просадка метрики мала — но вместе они могут быть очень важны'
    correct: true
    why: Метод оценивает предельный вклад признака при наличии всех остальных. Если информация дублируется,
      предельный вклад каждого близок к нулю, хотя совместный вклад велик.
  - text: Оба признака бесполезны и их можно смело удалить
    correct: false
    why: Удаление обоих может обрушить качество. Проверять нужно совместной перестановкой или удалением
      с переобучением.
  - text: Модель переобучилась на этих признаках
    correct: false
    why: Переобучение проявилось бы как высокая важность на train и низкая на тесте, а не как низкая важность
      на обоих.
  - text: Это признак утечки данных
    correct: false
    why: Утечка выглядит ровно наоборот — аномально высокая важность одного признака.
  explanation: |-
    Как проверить: перемешать оба признака **одновременно**. Если метрика при этом
    просядет сильно, значит вместе они важны, а по отдельности маскируют друг друга.

    Существуют и групповые варианты метода: признаки кластеризуют по корреляции
    (иерархическая кластеризация на матрице ранговых корреляций) и перемешивают
    кластерами. В sklearn этот подход описан в документации как рекомендуемый
    для коррелированных данных.

    Та же проблема есть у SHAP, но проявляется мягче: там вклад делится между
    коррелированными признаками примерно поровну, а не обнуляется.
- id: mlint-pdp-007
  topic: ml/interpretability
  type: mcq
  question: Чем ICE-кривые отличаются от partial dependence plot и когда это различие критично?
  difficulty: 2
  tags:
  - pdp
  - ice
  - partial_dependence
  options:
  - text: PDP показывает усреднённую по выборке зависимость, ICE — отдельную кривую для каждого объекта;
      при разнонаправленных эффектах усреднение PDP может дать плоскую линию и скрыть влияние
    correct: true
    why: Если у одной половины объектов признак повышает предсказание, а у другой понижает, среднее будет
      около нуля. ICE покажет расходящийся пучок кривых и вскроет взаимодействие.
  - text: ICE строится только для категориальных признаков
    correct: false
    why: Метод одинаково применим к признакам любого типа.
  - text: PDP локален, а ICE глобален
    correct: false
    why: 'Ровно наоборот: ICE даёт кривую на объект, PDP усредняет по всем.'
  - text: ICE требует переобучения модели для каждого объекта
    correct: false
    why: Обе техники используют уже обученную модель, меняя значение признака и вызывая predict.
  explanation: |-
    Механика построения одинакова: берём объект, подставляем вместо интересующего
    признака всю сетку его значений, для каждого получаем предсказание. Одна кривая —
    это ICE. Среднее всех кривых — это PDP.

    Общее ограничение обоих методов: при подстановке значений игнорируется связь
    признаков между собой, и модель снова оценивается на нереалистичных комбинациях.
    Метод ALE (accumulated local effects) решает эту проблему, работая с локальными
    приращениями внутри узких интервалов условного распределения.
- id: mlint-black-008
  topic: ml/interpretability
  type: open
  question: 'Есть модель-чёрный ящик: доступ только к предсказаниям, весов и устройства не видно. Как
    оценить, какие признаки важны и каков вклад каждого?'
  difficulty: 2
  tags:
  - black_box
  - interview
  - model_agnostic
  answer: |-
    Доступ к `predict` на своих данных — этого достаточно для целого класса
    model-agnostic методов.

    **Permutation importance** как основной инструмент. Перемешиваю значения одного
    признака на отложенной выборке, смотрю просадку метрики, повторяю для каждого
    признака. Даёт глобальный рейтинг важности в терминах интересующей метрики.
    Если признаки коррелированы, перемешиваю их группами, иначе важность окажется
    занижена у всех членов группы.

    **PDP и ICE** для формы зависимости. Важность отвечает на вопрос «насколько сильно»,
    а частичная зависимость — «в какую сторону и как именно»: монотонно, с насыщением,
    с переломом. ICE дополнительно показывает, одинаков ли эффект для разных объектов.

    **KernelSHAP** для локальных объяснений, если нужен разбор конкретных предсказаний.
    Он тоже требует только вызовов predict, но дорог по числу вызовов, поэтому его
    обычно применяют к выборке из нескольких сотен объектов, а не ко всем.

    **Surrogate model** как способ понять логику целиком: обучаю прозрачную модель
    (неглубокое дерево или линейную регрессию) предсказывать **выходы чёрного ящика**,
    а не истинные метки. Если суррогат воспроизводит их с высоким $R^2$, его структуру
    можно читать как приближённое описание логики исходной модели. Низкий $R^2$ означает,
    что упрощение неадекватно, и доверять ему нельзя.

    **Абляция с переобучением** — самый честный, но самый дорогой вариант: убрать
    признак, переобучить, сравнить качество. Отвечает на другой вопрос — не «на что
    опирается эта модель», а «нужен ли признак в принципе». При наличии дублирующих
    признаков ответы этих двух подходов расходятся.

    И обязательная оговорка: всё перечисленное объясняет модель, а не природу явления.
    Причинных выводов из этого делать нельзя.
  rubric:
  - Назвал permutation importance как основной метод и объяснил его механику
  - Указал, что считать нужно на отложенной выборке
  - Упомянул PDP/ICE для формы зависимости, а не только силы
  - Назвал SHAP (Kernel/model-agnostic) для локальных объяснений
  - Упомянул суррогатную модель или абляцию с переобучением
  - Оговорил проблему коррелированных признаков или отсутствие причинности
  explanation: |-
    Именно этот вопрос часто задают в формате «а если у вас нет доступа к модели».
    Проверяется понимание того, что интерпретация бывает model-agnostic и опирается
    только на вход и выход.

    Отдельный нюанс, который стоит упомянуть, если спросят про ограничения:
    все перечисленные методы требуют **репрезентативных данных**. Без выборки,
    похожей на ту, где модель работает, никакой оценки важности не получится.
- id: mlint-caus-009
  topic: ml/interpretability
  type: mcq
  question: В модели оттока признак «число обращений в поддержку» имеет высокую важность. Продакт предлагает
    сократить поддержку, чтобы снизить отток. Что ответить?
  difficulty: 2
  tags:
  - causality
  - correlation
  - pitfall
  options:
  - text: 'Модель выявила корреляцию, а не причину: обращения — скорее симптом уже возникшего недовольства,
      и их устранение не устранит причину оттока'
    correct: true
    why: Причинность из наблюдательных данных не следует. Здесь вероятна общая причина — проблема с продуктом,
      порождающая и обращения, и отток.
  - text: 'Согласиться: высокая важность признака означает сильное влияние на целевую переменную'
    correct: false
    why: Важность означает полезность для предсказания, а не наличие причинного влияния.
  - text: Предложить удалить признак из модели, раз он вводит в заблуждение
    correct: false
    why: Для прогноза признак полезен. Проблема не в модели, а в попытке сделать из неё причинный вывод.
  - text: Согласиться, если признак имеет высокое SHAP-значение — SHAP в отличие от других методов измеряет
      причинный эффект
    correct: false
    why: SHAP объясняет модель и наследует все её корреляционные зависимости. Причинности он не измеряет.
  explanation: |-
    Общее правило: модель отвечает на вопрос «что будет, если я **увижу** такое значение
    признака», а не «что будет, если я **изменю** его». Для второго нужен эксперимент
    (A/B-тест) или методы причинного вывода на наблюдательных данных.

    Особенно коварны признаки-последствия: они отлично предсказывают, поскольку
    порождены тем же процессом, что и целевая переменная, но вмешательство в них
    ничего не меняет. Их же стоит проверять на утечку — не сформированы ли они
    после момента, в который модель должна делать предсказание.
- id: mlint-lime-010
  topic: ml/interpretability
  type: mcq
  question: На чём основан метод LIME?
  difficulty: 3
  tags:
  - lime
  - local_surrogate
  options:
  - text: Вокруг объясняемого объекта генерируются возмущённые копии, для них берутся предсказания модели,
      и на этой выборке с весами по близости обучается простая интерпретируемая модель
    correct: true
    why: 'Идея локальной линейной аппроксимации: сложная граница решения в малой окрестности точки приближается
      линейной, а её коэффициенты и служат объяснением.'
  - text: Считаются средние предельные вклады признаков по всем порядкам их добавления
    correct: false
    why: Это определение значений Шепли, то есть SHAP.
  - text: Признаки поочерёдно перемешиваются, и измеряется просадка метрики
    correct: false
    why: Это permutation importance, и она глобальна, тогда как LIME объясняет одно предсказание.
  - text: Анализируются градиенты выхода модели по входным признакам
    correct: false
    why: Это класс градиентных методов (saliency maps, integrated gradients), требующих дифференцируемости
      модели. LIME работает с чёрным ящиком.
  explanation: |-
    Главный недостаток LIME — неустойчивость. Результат зависит от способа генерации
    возмущений, ширины ядра близости и случайности, поэтому два запуска на одном объекте
    могут дать заметно разные объяснения. У SHAP таких проблем меньше за счёт аксиоматики
    и детерминированности TreeSHAP.

    Взамен LIME дешевле и естественно работает с текстом и изображениями, где
    возмущения — это выключение слов или суперпикселей.
- id: mlint-leak-011
  topic: ml/interpretability
  type: open
  question: Модель показывает ROC-AUC 0,98, и один признак даёт 90% суммарной важности. Что вы подумаете
    и что проверите?
  difficulty: 2
  tags:
  - leakage
  - case
  - interview
  answer: |-
    Первая гипотеза — утечка данных. Комбинация «подозрительно высокое качество плюс
    один доминирующий признак» почти всегда означает, что в признак попала информация,
    недоступная в момент реального предсказания.

    Что бы я проверил.

    **Момент формирования признака.** Главный вопрос: существует ли это значение
    в тот момент, когда модель должна работать в продакшене? Классический пример —
    поле вроде `closing_reason`, `collection_flag` или дата последнего платежа:
    оно заполняется уже после наступления события, которое мы предсказываем.

    **Связь с целевой переменной напрямую.** Посмотрел бы сводную таблицу: среднее
    значение целевой переменной по бинам признака. Если там почти идеальное разделение
    или в признаке видна детерминированная функция от таргета, вопрос закрыт.

    **Как признак считается.** Если это агрегат, важно, по какому окну он собран.
    Агрегат, посчитанный по всему периоду, включая будущее относительно даты
    предсказания, — самая частая форма утечки в транзакционных данных.

    **Валидация по времени.** Обучил бы на раннем периоде, проверил на позднем.
    Утечка из будущего обычно даёт резкое падение качества при честном временном
    разбиении.

    **Проверка без признака.** Убрал бы его и переобучил. Если AUC падает
    с 0,98 до 0,72, это подтверждает, что вся модель держится на одном признаке,
    и надо разобраться, что он на самом деле означает.

    Отдельно уточнил бы у владельца данных, как поле заполняется в источнике.
    Часто ответ находится там, а не в коде.

    Возможен и невинный вариант: признак действительно сильный и легитимный,
    например, официальная кредитная история для скоринга. Но проверить нужно
    в любом случае — цена ошибки здесь высокая, потому что в продакшене модель
    просто не будет работать.
  rubric:
  - Первой гипотезой назвал утечку данных
  - Проверил бы, доступен ли признак в момент реального предсказания
  - Упомянул проверку временного окна агрегатов или валидацию по времени
  - Предложил убрать признак и переобучить для оценки вклада
  - Допустил легитимный вариант и предложил уточнить смысл признака у источника данных
  explanation: |-
    Именно из-за таких ситуаций интерпретация — не только средство объяснения, но и
    инструмент **отладки**. Взгляд на важность признаков нередко ловит ошибки в данных
    раньше, чем это сделает продакшен.
- id: mlint-mono-012
  topic: ml/interpretability
  type: card
  question: Что такое монотонные ограничения в бустинге и зачем они нужны?
  difficulty: 2
  tags:
  - monotonic_constraints
  - boosting
  - scoring
  answer: |-
    Это ограничение на структуру дерева, требующее, чтобы предсказание изменялось
    по признаку только в заданном направлении: например, при росте числа просрочек
    вероятность дефолта могла только расти. В XGBoost, LightGBM и CatBoost это
    параметр `monotone_constraints` с вектором из $-1$, $0$ и $+1$ по признакам.

    Зачем нужно.

    **Объяснимость.** Немонотонный кусок объяснить невозможно: «при доходе от 80 до 90
    тысяч риск почему-то выше, чем при 70» — это неприемлемо ни для клиента, ни для
    валидатора модели.

    **Устойчивость.** Немонотонность обычно возникает из шума в разреженных участках
    распределения. Запрет на неё работает как регуляризация и нередко улучшает
    качество на тесте.

    **Защита от манипуляций.** Если зависимость немонотонна, заявитель может
    целенаправленно попасть в выгодный интервал.

    Цена — небольшая потеря качества на train и необходимость задать направления
    вручную, опираясь на предметные знания.
  explanation: |-
    Направления определяют не по данным, а из здравого смысла предметной области.
    Если ограничение противоречит тому, что видно в данных, это повод разобраться:
    либо в предметном понимании, либо в качестве данных.

    Тот же эффект в логистической регрессии достигается через биннинг с монотонным
    WOE — бины объединяют так, чтобы риск менялся монотонно.
- id: mlint-local-013
  topic: ml/interpretability
  type: mcq
  question: Клиенту отказали в кредите, и нужно назвать причины отказа. Какой инструмент подходит?
  difficulty: 2
  tags:
  - local_explanation
  - reason_codes
  - production
  options:
  - text: 'SHAP-значения для конкретного объекта: отсортировать признаки по вкладу в сторону отказа и
      назвать несколько самых весомых'
    correct: true
    why: Нужна локальная интерпретация — объяснение одного предсказания. Аддитивность SHAP позволяет корректно
      сказать, сколько баллов скора отняла каждая причина.
  - text: Глобальная feature importance модели
    correct: false
    why: Она описывает модель в среднем и ничего не говорит о конкретном клиенте. У этого заявителя решающими
      могли оказаться совсем другие признаки.
  - text: Permutation importance на тестовой выборке
    correct: false
    why: 'Тоже глобальный метод: он показывает просадку метрики по всей выборке, а не вклад в одно предсказание.'
  - text: Матрица корреляций признаков с целевой переменной
    correct: false
    why: Описывает данные, а не решение модели по данному заявителю.
  explanation: |-
    В скоринге такие объяснения называют reason codes, и их формирование
    обычно регулируется. Практические требования: причин называют немного (три-четыре),
    формулируют на языке клиента («высокая долговая нагрузка», а не «feature_37»),
    и они не должны раскрывать модель настолько, чтобы её можно было обойти.

    Важная техническая деталь: SHAP аддитивен в пространстве логитов, поэтому
    для перевода вкладов в баллы скора используют линейное преобразование логита,
    а не вероятности.
- id: mlint-att-014
  topic: ml/interpretability
  type: multi
  question: Какие утверждения об интерпретации нейросетевых моделей верны?
  difficulty: 3
  tags:
  - attention
  - deep_learning
  - embeddings
  options:
  - text: Веса внимания показывают, между какими позициями шёл обмен информацией, но их прямая трактовка
      как объяснения предсказания оспаривается
    correct: true
    why: 'Известна серия работ «Attention is not Explanation» и ответов на них: можно построить разные
      распределения внимания, дающие один и тот же выход, поэтому веса не определяют объяснение однозначно.'
  - text: 'Для дифференцируемых моделей применимы градиентные методы: saliency maps, integrated gradients'
    correct: true
    why: Они оценивают чувствительность выхода к входу и дёшевы, поскольку требуют одного обратного прохода,
      но чувствительны к шуму и страдают от насыщения активаций.
  - text: 'Обученные эмбеддинги можно исследовать косвенно: смотреть ближайших соседей, кластеризовать,
      визуализировать через UMAP, обучать probing-классификаторы'
    correct: true
    why: 'Стандартный набор для foundation-моделей: если в кластерах эмбеддингов транзакционного поведения
      выделяются осмысленные типы клиентов, представление выучило что-то содержательное.'
  - text: SHAP неприменим к нейросетям
    correct: false
    why: Есть DeepSHAP и GradientSHAP, адаптированные под дифференцируемые модели, а KernelSHAP работает
      с любой моделью как с чёрным ящиком.
  - text: Нейросеть интерпретируема по построению, потому что все её веса доступны
    correct: false
    why: 'Доступность весов не даёт интерпретируемости: смысл распределён по миллионам параметров и не
      локализован в отдельных числах.'
  - text: Если для признака посчитан высокий градиент по выходу, значит признак важен для предсказания
      в целом
    correct: false
    why: Градиент — локальная характеристика в конкретной точке. При насыщении активации он может быть
      близок к нулю у признака, который на самом деле полностью определяет ответ.
  explanation: |-
    Применительно к задаче вроде претрена на последовательностях транзакций
    вопрос интерпретации обычно ставится в двух местах.

    На уровне представления: что выучил энкодер. Здесь работают probing-задачи
    (можно ли по эмбеддингу линейно предсказать известный атрибут клиента),
    анализ соседей и кластеризация.

    На уровне финальной модели: почему принято решение по клиенту. Здесь, если
    эмбеддинги идут признаками в бустинг, SHAP считают уже над ним — но вклад
    компонент эмбеддинга сам по себе неинтерпретируем, поэтому в скоринг обычно
    добавляют и явные интерпретируемые признаки.
- id: mlint-case-015
  topic: ml/interpretability
  type: open
  question: Модель показывает отличные метрики, но бизнес отказывается её внедрять, не доверяя результатам.
    Как будете действовать?
  difficulty: 3
  tags:
  - case
  - interview
  - validation
  - trust
  answer: |-
    Считаю недоверие содержательным сигналом, а не препятствием: у экспертов есть
    предметное знание, которого нет в метриках, и нередко они улавливают реальную
    проблему до того, как её видно в цифрах.

    Сначала выяснил бы, что именно смущает. Вопрос «какой результат модели выглядит
    для вас неправдоподобно» продуктивнее любых презентаций: он даёт конкретные случаи,
    которые можно разобрать.

    Дальше — сверка логики модели с предметными ожиданиями. Показал бы глобальную
    важность признаков и PDP по ключевым из них: согласуется ли направление
    зависимостей с тем, что эксперты знают? Расхождение — это либо ошибка в данных,
    либо новое знание, и разбирать его нужно вместе. Если модель говорит, что риск
    падает с ростом долговой нагрузки, проблема почти наверняка в данных.

    Разобрал бы конкретные предсказания через SHAP, в первую очередь те, которые
    эксперты считают неверными. Часто выясняется, что модель права, а интуиция
    опиралась на редкий частный случай, — но бывает и наоборот, и тогда находится
    утечка или дефект признака.

    Проверил бы саму валидацию. Отличные метрики иногда следствие неправильной
    схемы: случайное разбиение вместо временного, утечка через агрегаты, объекты
    одного клиента в train и test. Честное разбиение по времени и по клиентам —
    первое, что стоит перепроверить.

    Предложил бы измерять модель в бизнес-величинах, а не в AUC: сколько потерь
    предотвращено, сколько хороших клиентов отсечено. AUC не убеждает никого,
    кроме аналитиков.

    И главное — внедрение через эксперимент. Сначала shadow-режим: модель считает
    решения параллельно с текущим процессом, ни на что не влияя, и накапливается
    статистика расхождений. Затем A/B-тест на небольшой доле трафика с чётко
    заданной бизнес-метрикой. Так решение о внедрении принимается по данным,
    а не по степени убедительности презентации.
  rubric:
  - Отнёсся к недоверию как к содержательному сигналу, а не помехе
  - Предложил выяснить конкретные случаи, вызывающие сомнения
  - Использовал бы интерпретацию (важность, PDP, SHAP) для сверки с предметными ожиданиями
  - Перепроверил бы схему валидации на утечки и корректность разбиения
  - Предложил перевести качество в бизнес-метрики
  - Предложил shadow-режим и A/B-тест перед полным внедрением
  explanation: |-
    Этот вопрос проверяет не технику, а понимание того, что модель внедряется
    в организацию. Сильный ответ содержит и техническую часть (проверка валидации
    и интерпретация), и процессную (эксперимент, постепенный выкат).

    Слабый ответ — «показать им метрики и убедить, что модель хорошая».
