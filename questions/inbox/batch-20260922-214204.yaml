- id: mllin-ols-001
  topic: ml/linear_models
  type: card
  question: Как устроена линейная регрессия и откуда берётся нормальное уравнение?
  difficulty: 1
  tags:
  - linear_regression
  - ols
  - normal_equation
  answer: |-
    Модель предполагает линейную зависимость целевой переменной от признаков:
    $$\hat y = Xw + b$$

    Обучение — минимизация суммы квадратов ошибок (метод наименьших квадратов):
    $$L(w) = \|y - Xw\|^2$$

    Это квадратичная функция от $w$, поэтому минимум находится аналитически.
    Приравниваем градиент к нулю:
    $$\nabla_w L = -2X^T(y - Xw) = 0 \;\Longrightarrow\; X^TXw = X^Ty$$

    Отсюда нормальное уравнение:
    $$w = (X^TX)^{-1}X^Ty$$

    Геометрический смысл: $\hat y$ — это проекция вектора $y$ на подпространство,
    натянутое на столбцы $X$. Вектор остатков $y - \hat y$ ортогонален всем признакам,
    что и записано условием $X^T(y - Xw) = 0$.
  explanation: |-
    Именно из-за квадрата в лоссе решение получается в замкнутом виде: производная
    квадратичной формы линейна, и уравнение на минимум оказывается линейным.
    Для MAE такого решения нет, там нужна итеративная оптимизация.
- id: mllin-assum-002
  topic: ml/linear_models
  type: multi
  question: Какие предположения нужны классической линейной регрессии и зачем?
  difficulty: 2
  tags:
  - assumptions
  - ols
  - inference
  options:
  - text: Линейность связи между признаками и целевой переменной
    correct: true
    why: 'Без неё модель систематически смещена: никакой подбор весов не исправит неверную форму зависимости.'
  - text: Гомоскедастичность — постоянная дисперсия остатков
    correct: true
    why: При нарушении сами оценки весов остаются несмещёнными, но их стандартные ошибки считаются неверно,
      а значит, ломаются p-значения и доверительные интервалы.
  - text: Независимость наблюдений
    correct: true
    why: Для временных рядов и панельных данных это регулярно нарушается, что приводит к переоценке значимости
      коэффициентов.
  - text: Отсутствие строгой мультиколлинеарности между признаками
    correct: true
    why: При полной линейной зависимости столбцов матрица $X^TX$ вырождена и не обращается, а при почти
      полной оценки становятся неустойчивыми.
  - text: Признаки должны быть распределены нормально
    correct: false
    why: Требование нормальности относится к **остаткам**, и то только для построения доверительных интервалов
      и тестов. Сами признаки могут иметь любое распределение.
  - text: Целевая переменная должна быть отмасштабирована в диапазон от нуля до единицы
    correct: false
    why: Масштаб целевой переменной влияет только на масштаб коэффициентов, но не на качество модели.
  explanation: |-
    Разграничение, о котором часто спрашивают: предположения нужны в разной степени
    для **предсказания** и для **статистического вывода**. Если вас интересует только
    качество прогноза, достаточно линейности; если вы хотите говорить о значимости
    коэффициентов и доверительных интервалах, нужны все остальные.

    В ML линейную регрессию обычно используют в первом режиме, в эконометрике и A/B —
    во втором.
- id: mllin-logit-003
  topic: ml/linear_models
  type: card
  question: Как устроена логистическая регрессия? Что такое odds и логит?
  difficulty: 2
  tags:
  - logistic_regression
  - sigmoid
  - odds
  - logit
  answer: |-
    Модель считает линейную комбинацию признаков и пропускает её через сигмоиду:
    $$z = w^Tx + b, \qquad p = \sigma(z) = \frac{1}{1 + e^{-z}}$$

    Сигмоида переводит любое число из $(-\infty, +\infty)$ в интервал $(0, 1)$,
    что и позволяет трактовать выход как вероятность.

    **Odds** (шансы) — отношение вероятности события к вероятности его отсутствия:
    $$\text{odds} = \frac{p}{1-p}$$
    При $p = 0{,}8$ шансы равны 4, то есть событие вчетверо вероятнее, чем его отсутствие.

    **Логит** — логарифм шансов, и он же обратная функция к сигмоиде:
    $$\text{logit}(p) = \ln\frac{p}{1-p} = z = w^Tx + b$$

    Ключевая мысль: логистическая регрессия линейна **по логиту**, а не по вероятности.
    Линейная комбинация $z$ — это и есть логарифм шансов.
  explanation: |-
    Отсюда прямо следует интерпретация коэффициентов: увеличение признака на единицу
    добавляет $w_j$ к логиту, то есть умножает шансы на $e^{w_j}$.

    В скоринге на этом построена вся практика: линейность по логиту позволяет
    превращать модель в аддитивную балльную шкалу, где вклад каждого признака
    выражается в баллах.
- id: mllin-mse-004
  topic: ml/linear_models
  type: mcq
  question: Почему логистическую регрессию обучают на cross-entropy, а не на MSE?
  difficulty: 2
  tags:
  - cross_entropy
  - mse
  - optimization
  options:
  - text: MSE от сигмоиды даёт невыпуклую функцию потерь и затухающие градиенты при сильно ошибочных предсказаниях,
      а cross-entropy выпукла и сохраняет сильный градиент
    correct: true
    why: Оба довода существенны. Невыпуклость создаёт локальные минимумы, а множитель $\sigma^{\prime}(z)$
      в градиенте MSE обнуляет обучение ровно там, где модель ошибается сильнее всего.
  - text: MSE нельзя применять к величинам в интервале от нуля до единицы
    correct: false
    why: Формально применять можно, вопрос в свойствах получившейся задачи оптимизации, а не в допустимости.
  - text: Cross-entropy быстрее вычисляется
    correct: false
    why: Вычислительная стоимость у них сопоставима, дело не в этом.
  - text: MSE не позволяет получить вероятности на выходе
    correct: false
    why: Вероятность даёт сигмоида, а не функция потерь. Функция потерь влияет на то, как хорошо эти вероятности
      откалиброваны.
  explanation: |-
    Сравните градиенты по $z$ для одного объекта.

    Cross-entropy: $\dfrac{\partial L}{\partial z} = p - y$. Если модель уверенно ошиблась
    ($y = 1$, $p = 0{,}01$), градиент равен $-0{,}99$ — сильный сигнал.

    MSE: $\dfrac{\partial L}{\partial z} = (p - y)\,\sigma^{\prime}(z)$, а $\sigma^{\prime}(z) = p(1-p)$.
    В той же ситуации $\sigma^{\prime} = 0{,}0099$, и градиент падает примерно до $-0{,}0098$,
    то есть в сто раз слабее. Модель почти не учится на своих худших ошибках.

    Cross-entropy выводится из принципа максимального правдоподобия для распределения
    Бернулли, поэтому это не эвристика, а естественный выбор.
- id: mllin-coef-005
  topic: ml/linear_models
  type: open
  question: Коэффициент при признаке в логистической регрессии равен 0,7. Как вы объясните это бизнес-заказчику?
  difficulty: 2
  tags:
  - interpretation
  - odds_ratio
  - interview
  answer: |-
    Прямая интерпретация: увеличение признака на одну единицу умножает **шансы**
    наступления события на $e^{0{,}7} \approx 2$, то есть примерно удваивает их,
    при неизменных остальных признаках.

    Важно не сказать «вероятность удваивается» — это распространённая ошибка.
    Удваиваются именно шансы. Если исходная вероятность была 0,1 (шансы 0,11),
    новые шансы равны 0,22, а вероятность примерно 0,18, а не 0,2. При исходной
    вероятности 0,5 (шансы 1) новые шансы равны 2, а вероятность 0,67.
    Эффект на вероятность зависит от точки, в которой мы находимся.

    Оговорки, которые обязательно стоит проговорить.

    Единица признака — это единица **в том виде, в котором признак подан модели**.
    Если данные стандартизованы, речь об изменении на одно стандартное отклонение,
    и «одна единица» в терминах бизнеса будет другой.

    Сравнивать коэффициенты между собой по величине можно только при сопоставимых
    масштабах признаков, то есть после стандартизации.

    Это условная связь, а не причинность. При коррелированных признаках коэффициент
    может даже поменять знак относительно простой парной зависимости.

    Если применена регуляризация, коэффициенты смещены к нулю, и их абсолютные значения
    не стоит трактовать как точные оценки эффекта.
  rubric:
  - Сказал, что шансы умножаются на $e^{0{,}7} \approx 2$
  - Провёл различие между шансами и вероятностью, не сказал «вероятность удваивается»
  - Упомянул оговорку «при прочих равных»
  - Отметил зависимость интерпретации от масштаба признака и стандартизации
  - Предупредил, что это корреляция, а не причинность
  explanation: |-
    В кредитном скоринге именно из этого свойства выросла техника scorecard:
    признаки биннингуют, считают WOE, обучают логрег и переводят коэффициенты
    в баллы через линейное преобразование логита. Получается таблица, где
    каждому значению признака соответствует число баллов, а их сумма даёт скор.

    Эта интерпретируемость — основная причина, по которой логистическая регрессия
    до сих пор широко используется в банках несмотря на существование бустинга.
- id: mllin-scale-006
  topic: ml/linear_models
  type: mcq
  question: В каком случае масштабирование признаков для линейной модели обязательно?
  difficulty: 2
  tags:
  - scaling
  - standardization
  - regularization
  options:
  - text: При использовании регуляризации или градиентного спуска
    correct: true
    why: 'Регуляризация штрафует веса одинаково, а вес признака обратно пропорционален его масштабу: признак
      в рублях и он же в тысячах рублей получат штрафы, различающиеся в тысячу раз. Градиентный спуск
      на разномасштабных признаках порождает вытянутый овраг и сходится медленно.'
  - text: Всегда, иначе линейная регрессия не обучится
    correct: false
    why: 'Обычный МНК без регуляризации инвариантен к масштабированию признаков: коэффициенты просто пересчитаются,
      предсказания не изменятся.'
  - text: Только если признаков больше, чем объектов
    correct: false
    why: Это отдельная проблема — вырожденность $X^TX$, и решается она регуляризацией, а не масштабированием.
  - text: Только для категориальных признаков после one-hot кодирования
    correct: false
    why: Как раз бинарные столбцы после one-hot чаще всего оставляют как есть.
  explanation: |-
    Практическое следствие: `LogisticRegression` в sklearn по умолчанию применяет
    $L_2$-регуляризацию (`penalty=l2`, `C=1.0`), поэтому масштабировать нужно почти всегда.
    Без явного `StandardScaler` результат будет зависеть от единиц измерения признаков.

    И обязательное правило: `fit` только на train, `transform` на train и test.
    Иначе статистики теста утекут в обучение.
- id: mllin-mc-007
  topic: ml/linear_models
  type: mcq
  question: Два признака коррелируют на уровне 0,97. Что произойдёт с линейной регрессией?
  difficulty: 2
  tags:
  - multicollinearity
  - vif
  - ridge
  options:
  - text: Коэффициенты станут неустойчивыми и плохо интерпретируемыми, но качество предсказания может
      почти не пострадать
    correct: true
    why: Матрица $X^TX$ близка к вырожденной, её обращение усиливает шум, и веса могут принимать огромные
      значения противоположных знаков, гасящие друг друга. При этом сумма их вкладов остаётся адекватной,
      поэтому прогноз держится.
  - text: Модель откажется обучаться с ошибкой сингулярной матрицы
    correct: false
    why: Ошибка возникает только при **строгой** линейной зависимости. При корреляции 0,97 матрица обратима,
      просто плохо обусловлена.
  - text: Качество на тесте обязательно резко упадёт
    correct: false
    why: Прогноз обычно страдает мало. Страдает именно интерпретация и устойчивость весов к изменению
      выборки.
  - text: Оба коэффициента автоматически станут нулевыми
    correct: false
    why: Зануление весов — эффект $L_1$-регуляризации, а не мультиколлинеарности самой по себе.
  explanation: |-
    Диагностика: корреляционная матрица ловит только парные связи, а VIF
    (variance inflation factor) ловит и связи вида «признак выражается через несколько
    других». $\text{VIF}_j = 1/(1 - R_j^2)$, где $R_j^2$ — качество регрессии признака $j$
    на все остальные. Значения выше 5–10 считаются тревожными.

    Лечение: убрать один из признаков, объединить их, применить PCA или добавить
    $L_2$-регуляризацию. Ridge работает здесь напрямую: $(X^TX + \lambda I)^{-1}$
    сдвигает все собственные значения на $\lambda$, убирая близкие к нулю
    и восстанавливая устойчивость обращения.
- id: mllin-sep-008
  topic: ml/linear_models
  type: mcq
  question: Классы в данных линейно разделимы идеально. Что будет с логистической регрессией без регуляризации?
  difficulty: 3
  tags:
  - separability
  - divergence
  - regularization
  options:
  - text: Веса будут неограниченно расти, а решение не сойдётся
    correct: true
    why: 'Разделяющая гиперплоскость найдена, и дальше выгодно только увеличивать её масштаб: умножение
      всех весов на константу делает предсказания увереннее и снижает лосс, никогда не достигая нуля.'
  - text: Модель найдёт единственное оптимальное решение с максимальным зазором
    correct: false
    why: Максимизация зазора — это свойство SVM с hinge loss. У логистической регрессии единственного
      оптимума в разделимом случае просто нет.
  - text: Обучение завершится на первой же эпохе
    correct: false
    why: Функция потерь продолжает убывать на каждом шаге, критерий остановки не срабатывает.
  - text: Модель выдаст вероятности ровно 0,5 для всех объектов
    correct: false
    why: Наоборот, предсказанные вероятности будут стремиться к нулю и единице.
  explanation: |-
    Разберём механику. Пусть веса $w$ разделяют классы. Возьмём $10w$: все логиты
    вырастают в 10 раз, сигмоида прижимается к 0 и 1, и cross-entropy падает.
    Возьмём $100w$ — падает ещё. Предела нет, супремум лосса равен нулю,
    но не достигается ни при каких конечных весах.

    Что происходит на практике: оптимизатор останавливается по лимиту итераций,
    выдаёт `ConvergenceWarning`, веса огромны, а вероятности вырождены в 0 и 1
    и совершенно не откалиброваны.

    Регуляризация решает проблему полностью: штраф на норму весов делает функцию
    строго выпуклой с единственным конечным минимумом. Поэтому в sklearn
    регуляризация включена по умолчанию.
- id: mllin-inv-009
  topic: ml/linear_models
  type: mcq
  question: Почему на практике линейную регрессию редко решают через $w = (X^TX)^{-1}X^Ty$?
  difficulty: 3
  tags:
  - normal_equation
  - conditioning
  - computation
  options:
  - text: 'Обращение $X^TX$ дорого и численно неустойчиво: число обусловленности возводится в квадрат,
      поэтому используют QR или SVD'
    correct: true
    why: Сложность $O(p^3)$ по числу признаков, а квадрат числа обусловленности означает потерю примерно
      вдвое большего числа верных разрядов. QR-разложение решает ту же задачу без явного построения $X^TX$.
  - text: Нормальное уравнение даёт лишь приближённое решение
    correct: false
    why: Оно даёт точное решение задачи наименьших квадратов, вопрос только в способе его вычисления.
  - text: Формула работает только при нормально распределённых остатках
    correct: false
    why: Вывод формулы опирается на минимизацию квадратов ошибок и никаких распределенческих допущений
      не требует.
  - text: Нормальное уравнение неприменимо, если признаков больше двадцати
    correct: false
    why: Никакого такого порога нет; проблемы начинаются на тысячах признаков и при плохой обусловленности.
  explanation: |-
    Связь с конспектом по линейной алгебре: если $X = QR$, то
    $$X^TXw = X^Ty \;\Longrightarrow\; R^TQ^TQRw = R^TQ^Ty \;\Longrightarrow\; Rw = Q^Ty$$
    поскольку $Q^TQ = I$. Остаётся треугольная система, решаемая обратной подстановкой,
    и матрица $X^TX$ вообще не строится.

    Именно так работает `numpy.linalg.lstsq` (через SVD) и `sklearn.LinearRegression`
    (через LAPACK gelsd). При очень больших $n$ переходят к градиентным методам,
    то есть к `SGDRegressor`.
- id: mllin-nonlin-010
  topic: ml/linear_models
  type: card
  question: Как линейная модель может уловить нелинейную зависимость?
  difficulty: 2
  tags:
  - feature_engineering
  - nonlinearity
  - woe
  answer: |-
    Через признаки. Модель линейна по **весам**, а не по исходным переменным,
    поэтому нелинейность вносится на этапе подготовки данных.

    **Полиномиальные признаки**: добавить $x^2$, $x^3$ и произведения $x_i x_j$.
    Произведения важны отдельно — они дают взаимодействия, которых линейная модель
    иначе не видит совсем.

    **Преобразования**: логарифм для скошенных распределений (доход, сумма транзакций),
    корень, обратная величина. Логарифм заодно превращает мультипликативные связи
    в аддитивные.

    **Биннинг**: разбить непрерывный признак на интервалы и подать one-hot. Модель
    получает свободу задать произвольную ступенчатую форму зависимости.

    **WOE-кодирование**: для каждого бина считается $\ln\frac{\text{доля хороших}}{\text{доля плохих}}$.
    Признак после этого линеен по логиту по построению — стандарт в кредитном скоринге.

    **Ядровой трюк**: неявное отображение в пространство высокой размерности, это SVM.
  explanation: |-
    Плата за это — рост числа признаков и риск переобучения, поэтому нелинейные
    расширения почти всегда идут в связке с регуляризацией.

    Именно здесь проходит граница с бустингом: деревья находят разбиения
    и взаимодействия сами, а линейной модели их нужно подать руками. Взамен
    линейная модель остаётся интерпретируемой и устойчивой.
- id: mllin-imb-011
  topic: ml/linear_models
  type: open
  question: Вы строите логистическую регрессию для кредитного скоринга. Дефолтов в данных 2%. Как будете
    действовать?
  difficulty: 2
  tags:
  - imbalance
  - scoring
  - calibration
  - interview
  - case
  answer: |-
    Сначала зафиксировал бы метрику. Accuracy бесполезна: константный прогноз «не дефолт»
    даёт 98%. Для ранжирования заёмщиков смотрел бы ROC-AUC и Gini, для качества
    на редком классе — PR-AUC, поскольку precision чувствителен к доле положительных.

    Дальше — валидация. Стратифицированные фолды, чтобы доля дефолтов сохранялась,
    и обязательно разбиение по времени: модель уйдёт в продакшен на будущих заявках,
    поэтому оценивать её нужно на более позднем периоде, а не на случайной подвыборке.

    Про сам дисбаланс: 2% — это не катастрофа, и агрессивно ребалансировать обычно
    не нужно. Я бы начал с `class_weight='balanced'`, который просто взвешивает вклад
    классов в лосс. Важно понимать, что взвешивание и передискретизация сдвигают
    предсказанные вероятности вверх и ломают калибровку.

    А калибровка здесь — суть задачи. Скоринг нужен не для метки «дефолт или нет»,
    а для оценки вероятности, из которой считается ожидаемый убыток и ставка.
    Поэтому я бы проверял калибровочную кривую и при необходимости применял
    isotonic regression или Platt scaling на отложенной выборке.

    Порог отсечения выбирал бы не по F1, а по экономике: стоимость выданного плохого
    кредита и упущенная прибыль от отказа хорошему клиенту сильно различаются,
    и оптимальный порог следует из их соотношения.

    По признакам для логрег в скоринге стандарт — биннинг и WOE: получается монотонная
    интерпретируемая модель, которую можно объяснить регулятору и превратить в scorecard.
  rubric:
  - Отверг accuracy и назвал адекватные метрики (ROC-AUC/Gini, PR-AUC)
  - Предложил стратификацию и разбиение по времени при валидации
  - Упомянул class_weight или взвешивание вместо агрессивного oversampling
  - Сказал, что взвешивание и передискретизация портят калибровку вероятностей
  - Объяснил, что порог выбирается из экономики ошибок, а не из F1
  - Упомянул интерпретируемость и WOE/scorecard как требование предметной области
  explanation: |-
    Про SMOTE стоит иметь мнение: он синтезирует объекты интерполяцией между соседями
    редкого класса. На табличных данных со смешанными типами признаков это часто
    порождает нереалистичные объекты, и выигрыш нестабилен. Применять его нужно
    строго внутри фолда обучения, иначе синтетические объекты протекут в валидацию.
- id: mllin-multi-012
  topic: ml/linear_models
  type: mcq
  question: Чем multinomial логистическая регрессия отличается от стратегии one-vs-rest?
  difficulty: 2
  tags:
  - multiclass
  - softmax
  - ovr
  options:
  - text: Multinomial обучает одну модель с softmax по всем классам сразу, OvR обучает K независимых бинарных
      моделей
    correct: true
    why: В multinomial вероятности нормированы softmax и в сумме дают единицу по построению. В OvR каждый
      классификатор ничего не знает об остальных, и выходы приходится нормировать постфактум.
  - text: Multinomial применим только при трёх классах
    correct: false
    why: Softmax работает для любого числа классов.
  - text: OvR даёт калиброванные вероятности, а multinomial только метки
    correct: false
    why: 'Скорее наоборот: у OvR сумма выходов не равна единице и нормировка искусственна.'
  - text: Это одно и то же, разные названия одного алгоритма
    correct: false
    why: Это разные функции потерь и разный результат обучения.
  explanation: |-
    Softmax обобщает сигмоиду:
    $$p_k = \frac{e^{z_k}}{\sum_j e^{z_j}}$$
    При двух классах это сводится ровно к сигмоиде от разности логитов.

    Градиент softmax с cross-entropy по логитам равен $p - y$ — тот же результат,
    что и для бинарного случая, и то же, что используется в выходном слое нейросети.

    В sklearn поведение задаётся параметром `multi_class`; для сбалансированных
    многоклассовых задач multinomial обычно предпочтительнее.
- id: mllin-reg-013
  topic: ml/linear_models
  type: multi
  question: Какие утверждения о регуляризации линейных моделей верны?
  difficulty: 2
  tags:
  - ridge
  - lasso
  - elastic_net
  options:
  - text: Ridge ($L_2$) добавляет $\lambda I$ к $X^TX$ и делает решение устойчивым при мультиколлинеарности
    correct: true
    why: 'Формула становится $(X^TX + \lambda I)^{-1}X^Ty$: все собственные значения сдвигаются на $\lambda$,
      близкие к нулю уходят от нуля, обусловленность улучшается.'
  - text: Lasso ($L_1$) зануляет часть коэффициентов и потому работает как отбор признаков
    correct: true
    why: Постоянная по модулю производная штрафа додавливает малые веса точно до нуля.
  - text: Elastic Net комбинирует оба штрафа и лучше Lasso справляется с группами коррелированных признаков
    correct: true
    why: Чистый Lasso из группы почти одинаковых признаков произвольно выбирает один, а остальные обнуляет;
      $L_2$-составляющая распределяет вес между ними.
  - text: Штраф в sklearn задаётся параметром C, и большее C означает более сильную регуляризацию
    correct: false
    why: 'Наоборот: $C = 1/\lambda$, поэтому большее C — более **слабая** регуляризация. Это классическая
      ловушка.'
  - text: Смещение (intercept) регуляризуют наравне с остальными весами
    correct: false
    why: 'Свободный член обычно исключают из штрафа: его штрафовать бессмысленно, поскольку он отвечает
      за общий уровень целевой переменной, а не за зависимость от признаков.'
  - text: Регуляризация снижает bias модели
    correct: false
    why: Она увеличивает bias и снижает variance. В этом и состоит обмен.
  explanation: |-
    Ridge имеет ещё и байесовскую интерпретацию: $L_2$-штраф эквивалентен нормальному
    априорному распределению на веса с нулевым средним, а $L_1$ — распределению Лапласа,
    у которого острый пик в нуле. Отсюда и разреженность Lasso.
- id: mllin-why-014
  topic: ml/linear_models
  type: open
  question: Градиентный бустинг почти всегда обыгрывает логистическую регрессию на табличных данных. Почему
    её всё ещё используют в скоринге?
  difficulty: 2
  tags:
  - interview
  - interpretability
  - production
  answer: |-
    Причин несколько, и качество прогноза в них не главное.

    **Интерпретируемость и регуляторные требования.** Отказ в кредите нужно объяснить —
    и клиенту, и регулятору. Логистическая регрессия в связке с WOE-биннингом
    превращается в scorecard: таблицу, где каждому значению признака соответствует
    число баллов. Такую модель может проверить валидатор, не разбирающийся в ML.
    SHAP для бустинга даёт объяснение, но это апостериорная аппроксимация, а не сама модель.

    **Монотонность и осмысленность.** Биннинг проектируют так, чтобы риск монотонно
    менялся с признаком. Бустинг может выучить немонотонный кусок из-за шума в данных,
    и объяснить такое бизнесу невозможно.

    **Устойчивость и мониторинг.** Линейная модель гораздо менее чувствительна
    к сдвигу распределения и деградирует плавно. Её проще мониторить: дрейф каждого
    признака отслеживается отдельно, вклад в скор известен.

    **Стоимость эксплуатации.** Скор считается как сумма нескольких чисел, работает
    где угодно, воспроизводится в SQL, не требует выкатки библиотеки версии такой-то.

    **Разрыв в качестве часто невелик.** После грамотного биннинга и отбора признаков
    разница по Gini нередко составляет несколько пунктов, и это не всегда перевешивает
    перечисленное.

    На практике часто применяют гибрид: бустинг для внутренних задач и ранжирования,
    логрег для итогового решения о выдаче. Или используют предсказание бустинга
    как один из признаков.
  rubric:
  - Назвал интерпретируемость и требование объяснимости решений как главную причину
  - Упомянул регуляторные и валидационные требования в финансовой сфере
  - Сказал про устойчивость к дрейфу и простоту мониторинга
  - Отметил простоту внедрения и эксплуатации
  - Признал, что разрыв в качестве часто невелик после хорошей подготовки признаков
  explanation: |-
    Это очень частый вопрос на собеседованиях в финтехе, и он проверяет не знание
    алгоритмов, а понимание того, что модель существует внутри продукта и процесса.
    Ответ «бустинг лучше, поэтому берём бустинг» здесь считается слабым.
- id: mllin-grad-015
  topic: ml/linear_models
  type: card
  question: Выведите градиент функции потерь логистической регрессии по весам.
  difficulty: 3
  tags:
  - gradient
  - cross_entropy
  - derivation
  answer: |-
    Функция потерь для одного объекта:
    $$L = -\big[y\ln p + (1-y)\ln(1-p)\big], \qquad p = \sigma(z), \quad z = w^Tx$$

    Шаг 1. Производная лосса по $p$:
    $$\frac{\partial L}{\partial p} = -\frac{y}{p} + \frac{1-y}{1-p} = \frac{p - y}{p(1-p)}$$

    Шаг 2. Производная сигмоиды — красивое тождество:
    $$\frac{\partial p}{\partial z} = \sigma(z)\big(1 - \sigma(z)\big) = p(1-p)$$

    Шаг 3. По цепному правилу знаменатели сокращаются:
    $$\frac{\partial L}{\partial z} = \frac{p - y}{p(1-p)}\cdot p(1-p) = p - y$$

    Шаг 4. Поскольку $z = w^Tx$, получаем $\partial z/\partial w = x$:
    $$\nabla_w L = (p - y)\,x$$

    В матричной форме для всей выборки:
    $$\nabla_w L = \frac{1}{n}X^T(p - y)$$
  explanation: |-
    Результат стоит запомнить: **градиент равен ошибке, умноженной на вход**.
    Тот же вид имеет градиент линейной регрессии с MSE и градиент softmax
    с cross-entropy в выходном слое нейросети. Это не совпадение: cross-entropy
    и сигмоида (softmax) — сопряжённая пара, и сокращение $p(1-p)$ происходит по построению.

    Отсюда же понятно, почему MSE с сигмоидой работает хуже: там множитель $p(1-p)$
    не сокращается и душит градиент при уверенных ошибках.
