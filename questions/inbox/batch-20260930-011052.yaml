- id: stpz-dice8-001
  topic: stats/problems
  type: mcq
  question: Бросают два кубика. Какова вероятность, что сумма равна 8?
  difficulty: 1
  tags:
  - counting
  - dice
  - pattern_outcomes
  options:
  - text: $5/36$
    correct: true
    why: Всего пар $6 \times 6 = 36$. Сумму 8 дают пары (2,6), (3,5), (4,4), (5,3), (6,2) — пять штук.
      $5/36 \approx 0{,}14$.
  - text: $1/11$
    correct: false
    why: 'Сумм от 2 до 12 одиннадцать, но они не равновозможны: разные суммы получаются разным числом
      пар. Нужно считать пары, а не суммы.'
  - text: $3/36$
    correct: false
    why: 'Посчитаны только пары без учёта порядка: (2,6), (3,5), (4,4). Но (2,6) и (6,2) — разные исходы:
      на первом кубике 2 и на первом кубике 6.'
  - text: $1/6$
    correct: false
    why: Столько у суммы 7 — у неё 6 пар. У суммы 8 на одну меньше.
  explanation: |-
    Шаблон паттерна «посчитай исходы»:
    1. Один исход — пара (первый кубик, второй кубик).
    2. Всего: у первого 6 вариантов, для каждого у второго ещё 6 → 36.
    3. Подходящие: перебираем первый кубик от 2 до 6, второй определяется как 8 минус первый.
    4. Делим подходящие на все.
- id: stpz-coins-002
  topic: stats/problems
  type: mcq
  question: Бросают три монеты. Какова вероятность, что орлов выпало не меньше двух?
  difficulty: 1
  tags:
  - counting
  - coins
  - pattern_outcomes
  options:
  - text: $1/2$
    correct: true
    why: 'Всего исходов $2 \times 2 \times 2 = 8$. Ровно два орла: ООР, ОРО, РОО — 3 исхода. Три орла:
      ООО — 1 исход. Итого $4/8 = 1/2$.'
  - text: $3/8$
    correct: false
    why: Это только «ровно два орла». Условие «не меньше двух» включает ещё и три орла.
  - text: $2/3$
    correct: false
    why: 'Так получится, если считать исходами «0, 1, 2 или 3 орла» как равновозможные. Они не равновозможны:
      1 и 2 орла получаются тремя способами, а 0 и 3 — одним.'
  - text: $1/4$
    correct: false
    why: 'Всего исходов не 4, а 8: каждая из трёх монет удваивает число исходов.'
  explanation: |-
    Почему $2^3$: одна монета — 2 исхода. Вторая продолжает каждый из них двумя способами — 4.
    Третья продолжает каждый из 4 — 8. Каждая новая монета удваивает число исходов.

    Проверка симметрией: «не меньше двух орлов» и «не меньше двух решек» при трёх монетах —
    противоположные события одинакового размера, значит, каждое по ½.
- id: stpz-choose-003
  topic: stats/problems
  type: mcq
  question: |-
    Из 5 заявок 2 мошеннические. Наугад берут 2 заявки на проверку.
    Какова вероятность, что обе окажутся честными?
  difficulty: 2
  tags:
  - combinations
  - pattern_outcomes
  - credit_risk
  options:
  - text: $3/10$
    correct: true
    why: 'Пар из 5 заявок: $\frac{5 \times 4}{2} = 10$. Пар из 3 честных: $\frac{3 \times 2}{2} = 3$ —
      это {Ч1,Ч2}, {Ч1,Ч3}, {Ч2,Ч3}. $3/10$.'
  - text: $9/25$
    correct: false
    why: Это $(3/5)^2$ — как будто заявку возвращают обратно и могут вытащить ещё раз. Здесь выбор без
      возвращения.
  - text: $3/5$
    correct: false
    why: Это вероятность, что честной окажется одна конкретная заявка. Нужны обе.
  - text: $3/20$
    correct: false
    why: 'Смешаны два способа счёта: в числителе 3 неупорядоченные пары, а в знаменателе 20 упорядоченных
      ($5 \times 4$). Порядок нужно учитывать одинаково: либо $3/10$, либо $6/20$ — это одно и то же.'
  explanation: |-
    Второй способ — через «И» с зависимыми событиями:
    - первая честная: 3 из 5;
    - при условии, что первая честная, вторая честная: осталось 4 заявки, из них 2 честные → 2/4;
    - $\frac35 \times \frac24 = \frac{6}{20} = \frac{3}{10}$.

    Оба способа дают одно и то же — хорошая проверка на собесе.
- id: stpz-tworules-004
  topic: stats/problems
  type: mcq
  question: |-
    Два независимых антифрод-правила ложно срабатывают на честном клиенте с вероятностями 5% и 3%.
    Какова вероятность, что на честном клиенте сработает хотя бы одно?
  difficulty: 1
  tags:
  - at_least_one
  - independence
  - fraud
  options:
  - text: Около 7,85%
    correct: true
    why: 'Через «ни одного»: первое не сработало — 0,95, второе не сработало — 0,97, оба не сработали
      (независимы) — $0{,}95 \times 0{,}97 = 0{,}9215$. Хотя бы одно: $1 - 0{,}9215 = 0{,}0785$.'
  - text: 8%
    correct: false
    why: 'Простое сложение $5\% + 3\%$ дважды считает случаи, когда сработали оба. Нужно вычесть пересечение:
      $0{,}05 + 0{,}03 - 0{,}05 \times 0{,}03 = 0{,}0785$.'
  - text: 0,15%
    correct: false
    why: 'Это вероятность, что сработали **оба**: $0{,}05 \times 0{,}03$. Спрашивают про хотя бы одно.'
  - text: 5%
    correct: false
    why: Это вероятность только первого правила. Второе добавляет свои срабатывания.
  explanation: |-
    Два способа, которые должны совпасть:
    - «ИЛИ» с вычитанием пересечения: $0{,}05 + 0{,}03 - 0{,}0015 = 0{,}0785$;
    - «хотя бы одно» через дополнение: $1 - 0{,}95 \times 0{,}97 = 0{,}0785$.

    Практический смысл: каждое новое правило добавляет ложных блокировок честных клиентов.
    Пять правил по 5% дают уже около 23% честных клиентов с хотя бы одной блокировкой.
- id: stpz-nodraw-005
  topic: stats/problems
  type: mcq
  question: |-
    Из 10 заявок 3 мошеннические. Наугад по очереди берут две заявки, не возвращая.
    Какова вероятность, что обе мошеннические?
  difficulty: 2
  tags:
  - dependent_events
  - conditional_probability
  options:
  - text: $1/15$
    correct: true
    why: 'Первая мошенническая: $3/10$. Если первая оказалась мошеннической, осталось 9 заявок и 2 мошеннические:
      $2/9$. Перемножаем: $\frac{3}{10} \times \frac{2}{9} = \frac{6}{90} = \frac{1}{15}$.'
  - text: $9/100$
    correct: false
    why: Это $(3/10)^2$ — будто после первой заявки ничего не изменилось. Но заявку не вернули, и вторая
      вероятность уже другая.
  - text: $1/10$
    correct: false
    why: 'Так получится, если во втором множителе оставить 3 мошеннические из 9: $\frac{3}{10} \times
      \frac{3}{9}$. Но одна мошенническая уже вынута.'
  - text: $1/5$
    correct: false
    why: 'Неверный подсчёт; правильные числа: 3 пары из мошеннических среди 45 всех пар.'
  explanation: |-
    Проверка через сочетания: пар из 10 заявок $\frac{10 \times 9}{2} = 45$,
    пар из 3 мошеннических $\frac{3 \times 2}{2} = 3$. $3/45 = 1/15$. Совпало.

    Общее правило «И»: $P(A \text{ и } B) = P(A) \times P(B \mid A)$. Для независимых
    событий $P(B \mid A) = P(B)$, и остаётся простое произведение.
- id: stpz-union-006
  topic: stats/problems
  type: mcq
  question: |-
    30% пользователей покупали в приложении, 20% — на сайте, 10% — и там, и там.
    Какая доля покупала хотя бы где-то?
  difficulty: 1
  tags:
  - inclusion_exclusion
  - ecomm
  options:
  - text: 40%
    correct: true
    why: 'Складываем $30\% + 20\% = 50\%$. Но 10% «и там, и там» посчитаны дважды: один раз среди 30%,
      второй — среди 20%. Вычитаем их один раз: $50\% - 10\% = 40\%$.'
  - text: 50%
    correct: false
    why: Забыто вычесть тех, кто покупал в обоих местах. Они посчитаны дважды.
  - text: 60%
    correct: false
    why: Пересечение не прибавляют, а вычитают.
  - text: 44%
    correct: false
    why: 'Это $1 - 0{,}7 \times 0{,}8$ — формула для независимых событий. Здесь пересечение дано напрямую
      (10%), а при независимости было бы $0{,}3 \times 0{,}2 = 6\%$. Значит, события зависимы: покупатели
      в приложении чаще покупают и на сайте.'
  explanation: |-
    Формула включений-исключений: $P(A \text{ или } B) = P(A) + P(B) - P(A \text{ и } B)$.

    Бонус-вопрос с собеса: «какая доля покупала **только** в приложении?» — $30\% - 10\% = 20\%$.
- id: stpz-fwer5-007
  topic: stats/problems
  type: mcq
  question: |-
    В A/B-тесте 5 независимых метрик, каждая проверяется при α = 0,05. Эффекта нет ни на одной.
    Какова вероятность хотя бы одного ложного «значимого» результата?
  difficulty: 1
  tags:
  - at_least_one
  - multiple_testing
  - ab_testing
  options:
  - text: Около 23%
    correct: true
    why: 'Одна метрика не даёт ложной тревоги с вероятностью 0,95. Все пять — $0{,}95^5 \approx 0{,}774$.
      Хотя бы одна тревога: $1 - 0{,}774 \approx 0{,}226$.'
  - text: 25%
    correct: false
    why: Это сложение $5 \times 0{,}05$. Оно дважды считает случаи, когда тревог несколько, поэтому слегка
      завышает. На малых α разница невелика, но точный ответ — 22,6%.
  - text: 5%
    correct: false
    why: 5% — это вероятность ложной тревоги для одной метрики. С ростом числа проверок она накапливается.
  - text: 0,00003%
    correct: false
    why: Это $0{,}05^5$ — вероятность, что ложная тревога случится на **всех** пяти. Спрашивают про хотя
      бы одну.
  explanation: |-
    Шаблон «хотя бы один»: $1 - (1 - p)^n$.
    Это FWER — вероятность хотя бы одной ложной тревоги в семье проверок. Отсюда нужда в поправках:
    Бонферрони проверяет каждую метрику на уровне $\alpha / m = 0{,}01$, и тогда FWER не больше 5%.
- id: stpz-12months-008
  topic: stats/problems
  type: open
  question: |-
    Вероятность, что клиент просрочит платёж в конкретном месяце, — 2%.
    Какова вероятность хотя бы одной просрочки за год (12 платежей), если месяцы независимы?
    Насколько реалистично допущение независимости?
  difficulty: 2
  tags:
  - at_least_one
  - independence
  - credit_risk
  answer: |-
    **Шаг 1.** «Хотя бы одна просрочка» — переходим к противоположному: «ни одной просрочки за год».

    **Шаг 2.** В одном месяце не просрочил: $1 - 0{,}02 = 0{,}98$.

    **Шаг 3.** Не просрочил во всех 12 месяцах: месяцы независимы, поэтому перемножаем:
    $0{,}98^{12} \approx 0{,}785$.

    **Шаг 4.** Хотя бы одна просрочка: $1 - 0{,}785 = 0{,}215$, то есть около **21,5%**.

    **Про независимость.** Она нереалистична: просрочки одного клиента сильно связаны.
    Кто просрочил в марте, с гораздо большей вероятностью просрочит и в апреле
    (потерял работу, долговая нагрузка). Из-за положительной связи просрочки «слипаются»
    в одних и тех же клиентах. Реальная доля клиентов хотя бы с одной просрочкой
    будет **ниже** 21,5%, а у тех, кто просрочил, просрочек будет больше одной.
  rubric:
  - Перешёл к противоположному событию «ни одной просрочки»
  - Посчитал $0{,}98^{12} \approx 0{,}785$ и ответ около 21,5%
  - 'Сказал, что независимость нереалистична: просрочки одного клиента связаны'
  - 'Объяснил направление: связь концентрирует просрочки у части клиентов, доля с хотя бы одной ниже расчётной'
  explanation: |-
    Именно поэтому в риске смотрят на roll rates — вероятность перехода из одного bucket
    просрочки в следующий. Это условные вероятности, которые явно учитывают зависимость месяцев.
- id: stpz-rule3-009
  topic: stats/problems
  type: mcq
  question: |-
    В новом сегменте выдали 500 кредитов, и ни один не ушёл в дефолт.
    Какую верхнюю 95% оценку PD можно дать?
  difficulty: 2
  tags:
  - rule_of_three
  - zero_events
  - credit_risk
  options:
  - text: Около 0,6% — по «правилу трёх», $3/n$
    correct: true
    why: 'Если бы PD был $p$, вероятность 0 дефолтов из 500 была бы $(1-p)^{500}$. Ищем, при каком $p$
      она падает до 5%: $(1-p)^{500} = 0{,}05$ даёт $p \approx 3/500 = 0{,}006$. Более высокий PD плохо
      согласуется с нулём дефолтов.'
  - text: 0% — дефолтов же не было
    correct: false
    why: 'Ноль в выборке не означает ноль в генеральной совокупности. При PD 0,3% увидеть 0 дефолтов из
      500 вполне вероятно: $0{,}997^{500} \approx 22\%$.'
  - text: $1/500 = 0{,}2\%$
    correct: false
    why: Это «как будто был один дефолт». Верхняя граница при нуле событий — примерно $3/n$, а не $1/n$.
  - text: Оценить нельзя, нужен хотя бы один дефолт
    correct: false
    why: 'Оценить можно: ноль событий тоже информация. Нулевой результат ограничивает PD сверху.'
  explanation: |-
    Откуда тройка: $(1-p)^n \approx e^{-np}$, и $e^{-3} \approx 0{,}05$. Поэтому $np \approx 3$.

    На практике для таких низкодефолтных сегментов используют консервативные оценки
    или байесовское сглаживание с prior из похожих сегментов.
- id: stpz-disease-010
  topic: stats/problems
  type: open
  question: |-
    Болезнь есть у 1% людей. Тест находит 95% больных и даёт ложноположительный результат
    у 5% здоровых. У человека тест положительный. Какова вероятность, что он болен?
    Реши через натуральные частоты и через формулу Байеса.
  difficulty: 2
  tags:
  - bayes
  - base_rate
  - interview
  answer: |-
    **Натуральные частоты на 10 000 человек.**
    - Больных: 1% → 100. Тест найдёт 95% из них → **95** положительных.
    - Здоровых: 9 900. Ложноположительных 5% → **495**.
    - Всего положительных: $95 + 495 = 590$.
    - Из них больны: $95 / 590 \approx$ **16%**.

    **Формула Байеса.**

    $$P(\text{болен} \mid +) = \frac{P(+ \mid \text{болен}) \, P(\text{болен})}{P(+ \mid \text{болен}) \, P(\text{болен}) + P(+ \mid \text{здоров}) \, P(\text{здоров})}$$

    - числитель: $0{,}95 \times 0{,}01 = 0{,}0095$;
    - знаменатель: $0{,}0095 + 0{,}05 \times 0{,}99 = 0{,}0095 + 0{,}0495 = 0{,}059$;
    - ответ: $0{,}0095 / 0{,}059 \approx 0{,}16$.

    **Почему так мало.** Здоровых в 99 раз больше, и 5% ложных срабатываний от огромной
    группы (495) в пять раз превышают 95% правильных от маленькой (95).
  rubric:
  - 'Посчитал через натуральные частоты: 95 и 495 положительных'
  - Записал формулу Байеса с полной вероятностью в знаменателе
  - Получил ответ около 16%
  - 'Объяснил через базовую частоту: здоровых намного больше, их ложные срабатывания доминируют'
  explanation: |-
    Как поднять точность: повторный независимый тест (шансы умножаются на отношение
    правдоподобий ещё раз) или тестировать только группу риска (выше prior).
    Та же механика — у precision антифрод-модели на редком фроде.
- id: stpz-channel-011
  topic: stats/problems
  type: mcq
  question: |-
    10% заявок приходят из партнёрского канала, PD там 12%. В остальных каналах PD 4%.
    Кредит ушёл в дефолт. Какова вероятность, что он из партнёрского канала?
  difficulty: 2
  tags:
  - bayes
  - total_probability
  - credit_risk
  options:
  - text: 25%
    correct: true
    why: 'На 1 000 кредитов: из партнёрского канала 100, дефолтов $100 \times 0{,}12 = 12$. Из остальных
      900, дефолтов $900 \times 0{,}04 = 36$. Всего 48 дефолтов, из партнёрского канала 12. $12/48 = 25\%$.'
  - text: 12%
    correct: false
    why: 'Это $P(\text{дефолт} \mid \text{партнёр})$. Спрашивают обратное: $P(\text{партнёр} \mid \text{дефолт})$.'
  - text: 10%
    correct: false
    why: Это доля канала среди всех заявок (prior). Дефолт — информация, и она повышает вероятность партнёрского
      канала, потому что там PD выше.
  - text: 75%
    correct: false
    why: Это вероятность, что дефолт из остальных каналов.
  explanation: |-
    Формулой: $\frac{0{,}12 \times 0{,}1}{0{,}12 \times 0{,}1 + 0{,}04 \times 0{,}9} = \frac{0{,}012}{0{,}048} = 0{,}25$.

    Заметь: канал даёт 10% заявок, но 25% дефолтов. Такой разрез «доля в выдачах против доли в дефолтах»
    — стандартный способ найти проблемный сегмент.
- id: stpz-game-012
  topic: stats/problems
  type: mcq
  question: |-
    Игра: платишь 100 рублей, бросаешь кубик и получаешь 30 рублей за каждое очко
    (выпало 4 — получаешь 120). Выгодно ли играть в среднем?
  difficulty: 1
  tags:
  - expectation
  - decision
  options:
  - text: 'Да: средний выигрыш 105, в среднем +5 за игру'
    correct: true
    why: Среднее число очков на кубике — 3,5. Выплата в среднем $30 \times 3{,}5 = 105$. Минус взнос 100
      — в среднем плюс 5.
  - text: 'Нет: выигрыш больше 100 только при 4, 5 и 6, это половина случаев'
    correct: false
    why: Важна не только вероятность выиграть, но и сколько выигрываешь и проигрываешь. При 6 получаешь
      +80, а при 1 теряешь 70 — выигрыши в среднем крупнее.
  - text: Ровно в ноль
    correct: false
    why: Было бы, если бы платили $100 / 3{,}5 \approx 28{,}6$ за очко.
  - text: Нельзя сказать без знания, сколько раз играть
    correct: false
    why: Матожидание одной игры определено. Число игр влияет на разброс итога, но не на средний результат
      за игру.
  explanation: |-
    Матожидание кубика: $1 \times \tfrac16 + 2 \times \tfrac16 + \dots + 6 \times \tfrac16 = 3{,}5$.
    По линейности $E[30X - 100] = 30 E[X] - 100 = 5$.

    Та же логика в кредитовании: решение о выдаче принимают по ожидаемой прибыли
    (маржа × вероятность вернуть минус потери × PD), а не по тому, вернёт ли клиент «скорее всего».
- id: stpz-letters-013
  topic: stats/problems
  type: mcq
  question: |-
    100 писем случайно разложили по 100 подписанным конвертам.
    Сколько в среднем писем окажется в своём конверте?
  difficulty: 2
  tags:
  - indicators
  - linearity
  - expectation
  options:
  - text: '1'
    correct: true
    why: 'Индикатор на каждое письмо: «попало в свой конверт». Вероятность для каждого — $1/100$. Среднее
      числа попавших = сумма 100 вероятностей: $100 \times \tfrac{1}{100} = 1$.'
  - text: 0,01
    correct: false
    why: Это вероятность для одного письма. Писем 100, их вероятности складываются.
  - text: '50'
    correct: false
    why: 'Такого нет: у каждого письма шанс всего 1 из 100.'
  - text: 'Посчитать нельзя: события зависимы'
    correct: false
    why: 'Для **среднего** суммы зависимость не важна: среднее суммы всегда равно сумме средних. Зависимость
      влияет только на разброс.'
  explanation: |-
    Ответ не зависит от числа писем: при 3 письмах тоже 1 — можно проверить перебором всех 6 раскладок.

    Приём «индикаторы + линейность» — ответ на любой вопрос «сколько в среднем объектов
    с таким-то свойством»: ожидаемое число дефолтов в портфеле = сумма PD кредитов.
- id: stpz-apply-014
  topic: stats/problems
  type: mcq
  question: |-
    Каждую заявку клиента одобряют с вероятностью 40%, независимо от прошлых.
    Клиент подаёт заявки, пока не одобрят. Сколько заявок в среднем он подаст?
  difficulty: 1
  tags:
  - first_step
  - geometric
  - expectation
  options:
  - text: 2,5
    correct: true
    why: 'Первый шаг: $E = 1 + 0{,}6 E$ — одна заявка подана, с вероятностью 0,6 отказ, и всё начинается
      сначала. $0{,}4 E = 1$, $E = 2{,}5$. Это формула $1/p$.'
  - text: 1,5
    correct: false
    why: Это $1 + 0{,}6 \times 1$ — будто после отказа хватит ровно одной заявки. После отказа снова ждём
      в среднем $E$.
  - text: 0,4
    correct: false
    why: Это вероятность одобрения, а не число заявок.
  - text: 1,67
    correct: false
    why: Это $1/0{,}6$ — вместо вероятности успеха подставлена вероятность неудачи.
  explanation: |-
    Среднее ожидание до первого успеха — $1/p$: при 40% — 2,5, при 5% — 20, для кубика до шестёрки — 6.

    В реальности допущение независимости неверно: после отказа банки видят кредитную
    историю запросов, и повторные заявки одобряют реже.
