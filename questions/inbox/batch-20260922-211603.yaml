- id: mc-part-016
  topic: math/calculus
  type: card
  question: |-
    Что такое частная производная и как её вычислять?
    Найди обе частные производные функции $f(x, y) = x^2 y^3$.
  difficulty: 1
  tags:
  - partial_derivative
  answer: |-
    Частная производная — производная по одной переменной при условии,
    что все остальные считаются **константами**. Геометрически это наклон поверхности
    вдоль соответствующей оси.

    $$\frac{\partial f}{\partial x} = 2x y^3, \qquad \frac{\partial f}{\partial y} = 3x^2 y^2$$

    При дифференцировании по $x$ множитель $y^3$ выносится как константа,
    при дифференцировании по $y$ константой становится $x^2$.
  explanation: |-
    Наглядно: фиксируя одну переменную, мы разрезаем поверхность вертикальной плоскостью
    и получаем обычную кривую одной переменной, к которой применима вся техника
    одномерного дифференцирования.
- id: mc-grad-017
  topic: math/calculus
  type: mcq
  question: Что такое градиент функции нескольких переменных?
  difficulty: 1
  tags:
  - gradient
  options:
  - text: Вектор, составленный из всех частных производных функции
    correct: true
    why: Собранные вместе наклоны по каждой оси образуют вектор, который указывает направление в пространстве.
  - text: Число, равное сумме частных производных
    correct: false
    why: Суммирование уничтожило бы информацию о направлении, ради которой градиент и вводится.
  - text: Матрица вторых производных
    correct: false
    why: Это матрица Гессе. Градиент состоит из производных первого порядка.
  - text: Скорость изменения функции вдоль оси первой переменной
    correct: false
    why: Это лишь одна компонента градиента, а не он целиком.
  explanation: |-
    Ключевой переход: по отдельности частные производные — просто набор наклонов,
    а собранные в вектор они приобретают новое качество и **указывают направление**,
    причём направление наискорейшего роста функции.
- id: mc-grad-018
  topic: math/calculus
  type: card
  question: Назови три главных свойства градиента.
  difficulty: 2
  tags:
  - gradient
  - properties
  answer: |-
    Градиент указывает направление **наискорейшего возрастания** функции.
    Соответственно антиградиент $-\nabla f$ — направление наискорейшего убывания.

    Его длина $\|\nabla f\|$ равна **крутизне** склона в этом направлении:
    большой градиент означает быстрое изменение функции, близкий к нулю — плато или критическую точку.

    Градиент **перпендикулярен линиям уровня**. Вдоль линии уровня функция не меняется,
    значит быстрее всего она меняется поперёк неё.
  explanation: |-
    Все три свойства следуют из одной формулы производной по направлению:
    $$D_{\vec u} f = \nabla f \cdot \vec u = \|\nabla f\| \cos\theta$$
    Максимум при $\theta = 0$ даёт первое свойство, значение при этом даёт второе,
    а ноль при $\theta = 90^\circ$ — третье.
- id: mc-gd-019
  topic: math/calculus
  type: mcq
  question: Почему в формуле обновления весов $w \leftarrow w - \eta \nabla L$ стоит знак минус?
  difficulty: 1
  tags:
  - gradient_descent
  options:
  - text: Градиент указывает направление роста функции потерь, а мы её минимизируем, поэтому идём в противоположную
      сторону
    correct: true
    why: Антиградиент — направление наискорейшего убывания, именно оно нужно при минимизации.
  - text: Минус нужен, чтобы веса оставались положительными
    correct: false
    why: Никаких ограничений на знак весов формула не накладывает; они свободно принимают любые значения.
  - text: Так компенсируется положительность learning rate
    correct: false
    why: Learning rate задаёт только длину шага. Направление определяется знаком перед градиентом.
  - text: Минус появляется из-за того, что функция потерь всегда неотрицательна
    correct: false
    why: Неотрицательность лосса не связана с направлением шага. Минус нужен и для лоссов, принимающих
      отрицательные значения.
  explanation: |-
    Если бы стоял плюс, получился бы градиентный **подъём** — метод максимизации.
    Он тоже применяется, например при максимизации правдоподобия или награды в обучении с подкреплением.
- id: mc-grad-020
  topic: math/calculus
  type: open
  question: |-
    Что означает отдельная компонента градиента $\dfrac{\partial L}{\partial w_i}$ при обучении модели?
    Как её знак и величина влияют на обновление веса?
  difficulty: 2
  tags:
  - gradient
  - interpretation
  - interview
  answer: |-
    Эта компонента отвечает на вопрос: насколько изменится функция потерь,
    если чуть-чуть увеличить именно этот вес при неизменных остальных.

    Знак задаёт направление обновления. Положительная производная означает,
    что увеличение веса увеличивает ошибку, поэтому вес нужно **уменьшать** —
    и минус в формуле обновления делает это автоматически.

    Модуль отражает влиятельность веса. Большая по модулю производная означает,
    что лосс сильно реагирует на этот вес, и шаг по нему будет крупным.
    Близкая к нулю производная означает, что вес почти не влияет на ошибку,
    и он практически не обучается.

    На практике из этого следуют наблюдаемые эффекты: веса с систематически малыми градиентами
    застывают, что и происходит при затухании градиентов в ранних слоях глубокой сети.
    Адаптивные оптимизаторы вроде Adam как раз выравнивают масштаб шагов между параметрами
    с сильно различающимися градиентами.
  rubric:
  - Сказал, что компонента показывает чувствительность лосса к изменению конкретного веса
  - 'Объяснил роль знака: направление обновления через минус в формуле'
  - 'Объяснил роль модуля: сила влияния веса и размер шага'
  - 'Связал с практикой: малые градиенты означают, что вес не обучается'
  explanation: |-
    Полезное уточнение для конкретики: для линейной регрессии производная по весу $w_i$
    пропорциональна произведению ошибки на значение признака.
    Чем больше промах и чем больше значение признака, тем сильнее корректируется вес.
- id: mc-dir-021
  topic: math/calculus
  type: mcq
  question: Почему градиент перпендикулярен линиям уровня функции?
  difficulty: 2
  tags:
  - gradient
  - level_curves
  options:
  - text: Вдоль линии уровня функция не меняется, значит производная по этому направлению равна нулю,
      а нулевое скалярное произведение означает прямой угол
    correct: true
    why: Производная по направлению равна $\|\nabla f\|\cos\theta$. Ноль достигается при $\theta = 90^\circ$.
  - text: Это соглашение, принятое для удобства рисования графиков
    correct: false
    why: Это строгий математический факт, выводимый из определения производной по направлению.
  - text: Потому что линии уровня всегда представляют собой окружности
    correct: false
    why: Линии уровня бывают эллипсами, гиперболами, кривыми произвольной формы. Перпендикулярность выполняется
      независимо от их вида.
  - text: Перпендикулярность выполняется только для выпуклых функций
    correct: false
    why: Свойство верно для любой дифференцируемой функции, включая невыпуклые.
  explanation: |-
    Практическая польза: глядя на линии уровня, можно сразу понять направление движения
    градиентного спуска — перпендикулярно им, в сторону убывания.
    Именно это делает картинки с линиями уровня рабочим инструментом анализа оптимизации.
- id: mc-hess-022
  topic: math/calculus
  type: card
  question: Что такое матрица Гессе и почему она симметрична?
  difficulty: 2
  tags:
  - hessian
  answer: |-
    Матрица всех вторых частных производных функции многих переменных:
    $$H_{ij} = \frac{\partial^2 f}{\partial x_i \partial x_j}$$

    Симметрична по **теореме Шварца**: если смешанные производные непрерывны,
    порядок дифференцирования не важен, то есть $\dfrac{\partial^2 f}{\partial x \partial y} = \dfrac{\partial^2 f}{\partial y \partial x}$.

    Гессиан — многомерный аналог второй производной: он описывает кривизну функции.
  explanation: |-
    Симметричность важна практически: она гарантирует вещественность собственных значений
    и ортогональность собственных векторов по спектральной теореме,
    что и позволяет классифицировать критические точки по знакам собственных значений.
- id: mc-crit-023
  topic: math/calculus
  type: mcq
  question: В критической точке гессиан положительно определён. Что это за точка?
  difficulty: 2
  tags:
  - hessian
  - critical_points
  options:
  - text: Локальный минимум
    correct: true
    why: Положительная определённость означает, что все собственные значения положительны, и функция возрастает
      по всем направлениям от точки.
  - text: Локальный максимум
    correct: false
    why: Максимуму соответствует отрицательно определённый гессиан, то есть все собственные значения отрицательны.
  - text: Седловая точка
    correct: false
    why: Седло возникает при собственных значениях разных знаков, то есть при знаконеопределённом гессиане.
  - text: Точка перегиба
    correct: false
    why: Перегиб связан со сменой знака кривизны и в многомерном случае классифицируется иначе.
  explanation: |-
    Около критической точки функция приближается квадратичной формой
    $\tfrac{1}{2}\Delta w^T H \Delta w$, поскольку линейный член исчезает при нулевом градиенте.
    Знак этой формы по всем направлениям и определяет тип точки —
    ровно тот вопрос, ради которого в линейной алгебре разбирают знакоопределённость.
- id: mc-saddle-024
  topic: math/calculus
  type: multi
  question: Какие утверждения про седловые точки верны? Выбери все верные.
  difficulty: 2
