  - text: В седловой точке градиент равен нулю
    correct: true
  - text: Функция возрастает по одним направлениям и убывает по другим
    correct: true
  - text: Собственные значения гессиана имеют разные знаки
    correct: true
  - text: В пространствах высокой размерности сёдла встречаются чаще локальных минимумов
    correct: true
  - text: Седловые точки существуют и для функций одной переменной
