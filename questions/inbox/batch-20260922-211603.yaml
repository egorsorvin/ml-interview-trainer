  explanation: |-
    Хорошая новость для обучения: из седла градиентные методы выбираются,
    поскольку существуют направления убывания. Из локального минимума выйти нельзя.
    Помогают шум мини-батчей, momentum и адаптивные методы.
- id: mc-saddle-025
  topic: math/calculus
  type: open
  question: |-
    Почему в глубоком обучении седловые точки считают большей проблемой,
    чем локальные минимумы? И почему сети всё же успешно обучаются?
  difficulty: 3
  tags:
  - saddle_point
  - deep_learning
  - interview
  answer: |-
    Чтобы критическая точка была локальным минимумом, нужно, чтобы **все** собственные значения
    гессиана оказались положительными. Если грубо считать знаки независимыми,
    вероятность этого порядка $2^{-n}$, где $n$ — число параметров.
    При миллионах параметров это исчезающе мало, тогда как для седла достаточно,
    чтобы знаки просто различались. Значит почти любая критическая точка большой сети — седло.

    Сети обучаются успешно по двум причинам.

    Из седла можно выбраться: существуют направления убывания, и их находят
    шум мини-батчей, накопленная инерция momentum и адаптивные шаги Adam.
    Настоящая трудность не в самих сёдлах, а в окружающих их плато, где градиент мал
    и обучение замедляется.

    Эмпирически обнаружено, что в больших сетях большинство локальных минимумов
    дают примерно одинаковое качество, близкое к глобальному. Плохие мелкие минимумы редки.
    Поэтому даже застревание оказывается не катастрофой.

    Стоит честно отметить, что теоретических гарантий сходимости к глобальному оптимуму нет:
    практика здесь опережает теорию.
  rubric:
  - Объяснил, что минимум требует положительности всех собственных значений, что при большой размерности
    маловероятно
  - Сказал, что из седла можно выбраться, а из минимума нет
  - 'Назвал механизмы выхода: шум SGD, momentum, адаптивные методы'
  - Упомянул, что локальные минимумы больших сетей примерно равнокачественны
  - Отметил отсутствие теоретических гарантий при работающей практике
  explanation: |-
    Понимание изменилось после работ 2014–2015 годов, показавших доминирование седловых точек
    в высоких размерностях. До этого причиной трудностей обучения считали плохие локальные минимумы.
- id: mc-min-026
  topic: math/calculus
  type: card
  question: |-
    Сформулируй необходимое и достаточное условия локального минимума
    для функции многих переменных.
  difficulty: 2
  tags:
  - optimization
  - conditions
  answer: |-
    **Необходимое условие**: градиент обращается в ноль, $\nabla f(w^*) = 0$.
    Развёрнуто это система уравнений: все частные производные равны нулю.

    **Достаточное условие**: дополнительно матрица Гессе в этой точке
    **положительно определена**, то есть все её собственные значения положительны.

    Нулевой градиент даёт лишь кандидата: точка может оказаться максимумом или седлом.
  explanation: |-
    Это прямое обобщение одномерного случая, где условиями были $f'(x) = 0$ и $f''(x) > 0$.
    Проверять положительную определённость можно по собственным значениям
    или быстрее — по критерию Сильвестра через угловые миноры.
- id: mc-ravine-027
  topic: math/calculus
  type: mcq
  question: |-
    Линии уровня функции потерь — сильно вытянутые эллипсы.
    Как это скажется на градиентном спуске?
  difficulty: 2
  tags:
  - conditioning
