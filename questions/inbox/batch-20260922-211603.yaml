  - text: 'Минимум не будет найден никогда: у такой функции его не существует'
    correct: false
    why: Минимум существует и единственен, если функция выпукла. Проблема в скорости сходимости, а не
      в его отсутствии.
  - text: Поведение спуска не зависит от формы линий уровня
    correct: false
    why: 'Зависит напрямую: направление шага определяется градиентом, а он задаётся геометрией поверхности.'
  explanation: |-
    Формально вытянутость измеряется числом обусловленности — отношением максимального
    собственного значения гессиана к минимальному. Три лекарства: стандартизация признаков
    делает ландшафт круглее, momentum гасит поперечные колебания,
    адаптивные методы дают свой размер шага каждому параметру.
- id: mc-taylor-028
  topic: math/calculus
  type: open
  question: Как ряд Тейлора связан с градиентным спуском и методом Ньютона?
  difficulty: 2
  tags:
  - taylor
  - newton
  - interview
  answer: |-
    Разложение функции вокруг точки в многомерном случае выглядит так:
    $$f(w + \Delta w) \approx f(w) + \nabla f^T \Delta w + \tfrac{1}{2}\Delta w^T H \Delta w$$

    Градиентный спуск использует приближение **первого порядка**: оставляет только
    линейный член и считает, что функция локально ведёт себя как плоскость.
    Отсюда прямое следствие — ограничение на learning rate: приближение верно лишь
    в малой окрестности, и слишком большой шаг выводит за её пределы,
    из-за чего лосс может вырасти вместо убывания.

    Метод Ньютона берёт **два** члена, то есть учитывает кривизну через гессиан.
    Минимизируя квадратичное приближение аналитически, получаем шаг
    $$w \leftarrow w - H^{-1}\nabla f$$
    Он сходится за существенно меньшее число итераций, а для квадратичной функции —
    вообще за один шаг. Плата — необходимость вычислить и обратить гессиан,
    что при $n$ параметрах требует порядка $n^2$ памяти и $n^3$ операций.

    Для больших моделей это неподъёмно, поэтому используют компромиссы:
    L-BFGS приближает гессиан, не храня его целиком, а Adam применяет
    грубое диагональное приближение.

    Ещё одно следствие: в критической точке градиент равен нулю, линейный член исчезает,
    и остаётся квадратичная форма — именно поэтому знакоопределённость гессиана
    классифицирует тип критической точки.
  rubric:
  - Записал разложение с градиентом и гессианом или описал его словами
  - Связал градиентный спуск с приближением первого порядка и объяснил ограничение на learning rate
  - Связал метод Ньютона с приближением второго порядка и шагом через обратный гессиан
  - 'Назвал причину неприменимости Ньютона в глубоком обучении: размер гессиана'
  - Упомянул, что в критической точке остаётся квадратичная форма, задающая тип точки
  explanation: |-
    Полезная деталь: эквивалентности из теории пределов вроде $\sin x \sim x$ и $\ln(1+x) \sim x$ —
    это первые члены соответствующих рядов Тейлора.
- id: mc-hess-029
  topic: math/calculus
  type: multi
  question: Какие утверждения про гессиан в контексте глубокого обучения верны? Выбери все верные.
  difficulty: 2
  tags:
  - hessian
  - deep_learning
  options:
  - text: Для модели с $n$ параметрами он содержит порядка $n^2$ элементов
    correct: true
  - text: Его знакоопределённость классифицирует критические точки
    correct: true
  - text: Отношение крайних собственных значений задаёт число обусловленности задачи
    correct: true
  - text: В обучении больших нейросетей его обычно не вычисляют явно
    correct: true
  - text: Второй момент в оптимизаторе Adam — это диагональ гессиана
    correct: false
    why: Adam хранит скользящее среднее **квадратов градиентов**, то есть информацию о масштабе, а не
      о кривизне. Это метод первого порядка, несмотря на внешнее сходство идеи.
  explanation: |-
    Именно размер делает гессиан неприменимым напрямую: при миллиарде параметров
    он содержал бы $10^{18}$ чисел. Поэтому в глубоком обучении он служит скорее
    языком анализа, чем рабочим инструментом.
- id: mc-part-030
  topic: math/calculus
  type: mcq
  question: |-
    У функции двух переменных в некоторой точке существуют обе частные производные.
    Следует ли отсюда, что функция в этой точке непрерывна?
  difficulty: 3
  tags:
  - partial_derivative
  - differentiability
  - pitfall
  options:
  - text: 'Нет: частные производные описывают поведение только вдоль осей, а функция может быть разрывной
      по другим направлениям'
    correct: true
    why: 'Классический контрпример — $\frac{xy}{x^2+y^2}$ с доопределением нулём в начале координат: вдоль
      обеих осей функция тождественно равна нулю, значит обе частные производные существуют, но предела
      в нуле не существует.'
  - text: 'Да: существование производных всегда влечёт непрерывность'
    correct: false
    why: Это верно для функций одной переменной, но в многомерном случае перестаёт работать.
  - text: Да, но только если обе производные равны нулю
    correct: false
    why: В упомянутом контрпримере обе производные как раз равны нулю, а функция всё равно разрывна.
  - text: 'Вопрос некорректен: у разрывной функции производных быть не может'
    correct: false
    why: Частная производная требует лишь существования предела вдоль одной оси, что вполне совместимо
      с разрывом по другим направлениям.
  explanation: |-
    Достаточным условием служит **непрерывность** частных производных в окрестности точки —
    тогда функция дифференцируема, а значит и непрерывна.
    Для функций, встречающихся в ML, это условие обычно выполняется,
    поэтому на практике проблема не возникает, но различие между
    существованием частных производных и дифференцируемостью стоит понимать.
