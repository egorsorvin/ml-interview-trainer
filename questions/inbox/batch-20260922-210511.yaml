    затем итеративно уточняют, используя сдвиги для ускорения сходимости.
    Именно поэтому `numpy.linalg.eig` возвращает числа вроде $-3{,}02069926$,
    а не точные выражения.
- id: la-eigh-029
  topic: math/linalg
  type: open
  question: |-
    В чём разница между `numpy.linalg.eig` и `numpy.linalg.eigh`, и когда что использовать?
    Что будет, если применить `eigh` к несимметричной матрице?
  difficulty: 3
  tags:
  - numpy
  - eigen
  - practice
  answer: |-
    Буква h в названии означает hermitian, то есть эрмитова матрица;
    для вещественного случая это симметричная матрица.

    Функция `eig` работает с любой квадратной матрицей. Собственные значения могут получиться
    комплексными, а собственные векторы в общем случае не ортогональны.

    Функция `eigh` предназначена только для симметричных матриц и использует их свойства
    по спектральной теореме: гарантирует вещественные собственные значения
    и ортонормированные собственные векторы, работает быстрее и точнее,
    а результат возвращает отсортированным по возрастанию.

    Опасность в том, что при передаче несимметричной матрицы `eigh` **не выдаст ошибку**:
    она читает только одну половину матрицы (по умолчанию нижний треугольник)
    и молча достраивает вторую симметрично. Результат будет корректным,
    но для **другой** матрицы, а не для той, что передали.

    Практическое следствие: перед вызовом стоит проверять симметричность,
    например через `np.allclose(A, A.T)`.
  rubric:
  - Сказал, что `eigh` предназначена для симметричных матриц, а `eig` для любых
  - 'Назвал гарантии `eigh`: вещественные собственные значения и ортогональные векторы'
  - Упомянул, что `eigh` быстрее и точнее на симметричных матрицах
  - Предупредил, что на несимметричной матрице `eigh` не падает, а молча даёт неверный результат
  explanation: |-
    В ML `eigh` применима почти всегда, поскольку встречающиеся матрицы симметричны:
    ковариационная матрица, $X^TX$, гессиан (симметричен по теореме Шварца).
    Для SVD прямоугольных матриц используют отдельную функцию `numpy.linalg.svd`.
- id: la-sylv-030
  topic: math/linalg
  type: card
  question: Сформулируй критерий Сильвестра и скажи, зачем он нужен, если есть собственные значения.
  difficulty: 2
  tags:
  - sylvester
  - positive_definite
  answer: |-
    Симметричная матрица положительно определена тогда и только тогда,
    когда **все её угловые (ведущие главные) миноры положительны**:
    $$\Delta_1 > 0, \quad \Delta_2 > 0, \quad \dots, \quad \Delta_n > 0$$
    где $\Delta_k$ — определитель левого верхнего блока размера $k \times k$.

    Нужен потому, что позволяет проверить знакоопределённость **без вычисления собственных значений**,
    то есть без решения характеристического уравнения — только через определители.
  explanation: |-
    Для отрицательной определённости знаки угловых миноров чередуются, начиная с минуса.
    Практичный частный случай для матрицы $2 \times 2$ с элементами $A, B, C$:
    при $D = AC - B^2 > 0$ и $A > 0$ матрица положительно определена, значит критическая точка — минимум;
    при $D < 0$ собственные значения разных знаков, значит это седло.
