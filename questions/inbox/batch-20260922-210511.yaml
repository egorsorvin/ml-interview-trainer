- id: la-norm-016
  topic: math/linalg
  type: card
  question: Запиши нормы $L_1$ и $L_2$ вектора и скажи, в каком виде каждая используется в регуляризации.
  difficulty: 1
  tags:
  - norms
  - l1
  - l2
  answer: |-
    $$\|w\|_1 = \sum_j |w_j|, \qquad \|w\|_2 = \sqrt{\sum_j w_j^2}$$

    В регуляризации к функции потерь добавляют штраф:
    для Lasso это $\lambda \|w\|_1$, для Ridge — $\lambda \|w\|_2^2$,
    то есть **квадрат** второй нормы, а не сама норма. Квадрат берут ради гладкости:
    производная получается $2\lambda w_j$ без корня в знаменателе.
  explanation: |-
    $L_2$ — привычное евклидово расстояние. $L_1$ называют манхэттенской нормой:
    это путь по улицам квартальной сетки, где двигаться можно только вдоль осей.
- id: la-norm-017
  topic: math/linalg
  type: mcq
  question: Почему $L_1$-регуляризация обнуляет часть весов, а $L_2$ только уменьшает их?
  difficulty: 2
  tags:
  - l1
  - l2
  - sparsity
  options:
  - text: У $L_1$ сила притяжения к нулю постоянна и равна $\lambda$, а у $L_2$ пропорциональна весу и
      слабеет при его уменьшении
    correct: true
    why: 'Производная штрафа: у $L_1$ это $\lambda \cdot \mathrm{sign}(w)$, у $L_2$ это $2\lambda w$.
      Постоянная сила додавливает вес до точного нуля, убывающая — только приближает.'
  - text: $L_1$ штрафует сильнее, поскольку модуль растёт быстрее квадрата
    correct: false
    why: При больших весах как раз квадрат растёт быстрее. Дело не в величине штрафа, а в поведении его
      производной около нуля.
  - text: $L_1$ отбрасывает признаки с наименьшей корреляцией с таргетом
    correct: false
    why: 'Никакого явного отбора по корреляции не происходит: зануление — побочный эффект вида штрафа
      при оптимизации.'
  - text: $L_2$ применяется только к линейным моделям, а $L_1$ к любым
    correct: false
    why: Обе применимы к любым моделям с весами, включая нейросети.
  explanation: |-
    Геометрическая формулировка того же: область допустимых весов для $L_1$ — ромб с углами на осях,
    для $L_2$ — круг. Растущие линии уровня функции потерь с большой вероятностью
    коснутся именно угла ромба, а угол лежит на оси, где одна из координат равна нулю.
    У круга углов нет, поэтому точка касания почти всегда имеет обе ненулевые координаты.
- id: la-orth-018
  topic: math/linalg
  type: mcq
  question: Как проверить, что два вектора ортогональны?
  difficulty: 1
  tags:
  - orthogonality
  - dot_product
  options:
  - text: Их скалярное произведение равно нулю
    correct: true
    why: Из формулы $\langle a, b\rangle = \|a\|\|b\|\cos\theta$ следует, что нулевое произведение при
      ненулевых векторах означает угол $90^\circ$.
  - text: Их длины равны между собой
    correct: false
    why: Равенство длин никак не связано с углом между векторами.
  - text: Их сумма равна нулевому вектору
    correct: false
    why: Это условие противоположной направленности, то есть угла $180^\circ$, а не прямого.
  - text: Их покоординатное произведение даёт нулевой вектор
    correct: false
    why: Требуется равенство нулю суммы произведений координат, а не каждого произведения по отдельности.
  explanation: |-
    В ML ортогональность важна прежде всего потому, что ортогональные признаки некоррелированы
    (для центрированных данных), а ортогональные преобразования сохраняют длины и углы,
    то есть не искажают геометрию и не усиливают ошибки округления.
- id: la-rank-019
  topic: math/linalg
  type: card
  question: Что такое ранг матрицы и как он связан с линейной зависимостью признаков?
  difficulty: 2
  tags:
  - rank
  - linear_dependence
  answer: |-
    Ранг — число линейно независимых строк (оно же число линейно независимых столбцов).

    Если матрица признаков $X$ размера $n \times k$ имеет ранг меньше $k$,
    значит какой-то признак выражается через другие линейной комбинацией.
    Тогда $X^TX$ вырождена, обратной не существует, и решение регрессии не единственно.
  explanation: |-
    Через SVD ранг равен числу ненулевых сингулярных чисел.
    На практике из-за погрешностей вычислений считают число сингулярных чисел выше малого порога —
    именно так работает `numpy.linalg.matrix_rank`.
- id: la-lindep-020
  topic: math/linalg
  type: multi
  question: |-
    В матрице признаков обнаружена линейная зависимость столбцов. Какие утверждения верны?
    Выбери все верные.
  difficulty: 2
  tags:
  - linear_dependence
  - multicollinearity
  options:
  - text: Определитель $X^TX$ равен нулю, обратной матрицы не существует
    correct: true
  - text: Веса линейной регрессии не определены однозначно
    correct: true
  - text: Ранг матрицы меньше числа столбцов
    correct: true
  - text: Проблему можно смягчить $L_2$-регуляризацией
    correct: true
  - text: Качество предсказаний модели обязательно ухудшится
    correct: false
    why: 'Предсказания могут остаться приемлемыми: страдает интерпретируемость и устойчивость весов, а
      не обязательно точность. Именно поэтому мультиколлинеарность часто остаётся незамеченной.'
  explanation: |-
    Ridge добавляет $\lambda I$ к $X^TX$, сдвигая все собственные значения вверх на $\lambda$.
    Матрица становится гарантированно обратимой, а решение устойчивым к малым изменениям данных.
- id: la-qr-021
  topic: math/linalg
  type: card
  question: Запиши QR-разложение и назови свойства каждого множителя.
  difficulty: 2
  tags:
  - qr
  answer: |-
    $$A = QR$$
    где $Q$ — **ортогональная** матрица (её столбцы ортонормированы, поэтому $Q^{-1} = Q^T$),
    а $R$ — **верхнетреугольная** матрица.

    Содержательно $Q$ содержит ортонормированный базис, построенный из столбцов $A$,
    а $R$ хранит коэффициенты, по которым из этого базиса собираются исходные столбцы.
  explanation: |-
    Наглядный способ построения — процесс Грама-Шмидта: каждый следующий вектор берут
    и вычитают из него проекции на все предыдущие, затем нормируют.
    На практике применяют численно более устойчивые отражения Хаусхолдера.
- id: la-qr-022
  topic: math/linalg
  type: open
  question: Зачем в линейной регрессии используют QR-разложение вместо прямого вычисления $(X^TX)^{-1}X^Ty$?
  difficulty: 2
  tags:
  - qr
  - regression
  - stability
  answer: |-
    Прямое вычисление требует образовать $X^TX$ и обратить её. Образование этого произведения
    возводит сингулярные числа в квадрат, а значит **возводит в квадрат число обусловленности**.
    Если матрица признаков была умеренно плохо обусловлена, то $X^TX$ становится существенно хуже,
    и результат теряет точность.

    QR позволяет обойтись без этого. Подставив $X = QR$ в нормальное уравнение и воспользовавшись
    тем, что $Q^TQ = I$, получаем
    $$R w = Q^T y$$
    — систему с треугольной матрицей, которая решается обратной подстановкой без обращения чего-либо.

    Именно так работают `numpy.linalg.lstsq` и решатели в sklearn.
    Альтернатива с ещё большей устойчивостью — SVD, которая дополнительно
    корректно обрабатывает вырожденный случай через псевдообратную матрицу.
  rubric:
  - Сказал, что образование $X^TX$ ухудшает обусловленность, возводя её в квадрат
  - Показал переход к треугольной системе $Rw = Q^Ty$ с использованием $Q^TQ = I$
  - Упомянул, что треугольная система решается обратной подстановкой без обращения матриц
  - Назвал SVD как ещё более устойчивую альтернативу
  explanation: |-
    Общий принцип численной линейной алгебры: избегать явного обращения матриц.
    Вместо $A^{-1}b$ решают систему $Ax = b$ подходящим разложением.
- id: la-qralg-023
  topic: math/linalg
  type: mcq
  question: Что находит QR-алгоритм и чем он отличается от QR-разложения?
  difficulty: 2
  tags:
  - qr_algorithm
  - eigen
  options:
  - text: QR-алгоритм итеративно находит собственные значения, многократно применяя QR-разложение
    correct: true
    why: 'Повторяется шаг: разложить $A_k = Q_k R_k$, затем составить $A_{k+1} = R_k Q_k$. Матрица сходится
      к треугольной, и на диагонали проступают собственные значения.'
  - text: Это разные названия одной и той же операции
    correct: false
    why: Разложение — однократная операция, алгоритм — итеративный цикл, многократно её использующий.
  - text: QR-алгоритм находит обратную матрицу за одну итерацию
    correct: false
    why: Обращение выполняется другими методами; QR-алгоритм предназначен для спектральной задачи.
  - text: QR-алгоритм решает систему линейных уравнений методом исключения
    correct: false
    why: Это описание метода Гаусса. Систему действительно можно решить через QR-разложение, но алгоритм
      ищет собственные значения.
  explanation: |-
    Работает потому, что $R_k Q_k = Q_k^T A_k Q_k$ — преобразование подобия,
    которое сохраняет собственные значения. Каждая итерация приближает матрицу
    к базису её собственных векторов.
    Именно этот алгоритм крутится внутри `numpy.linalg.eig` и `eigh`.
- id: la-diag-024
  topic: math/linalg
  type: card
  question: Что происходит при умножении диагональной матрицы на вектор и почему такие матрицы ценят в
    вычислениях?
  difficulty: 1
  tags:
  - diagonal
  answer: |-
    Умножение на диагональную матрицу — это **поэлементное масштабирование**:
    $$\mathrm{diag}(d_1, \dots, d_n) \cdot x = (d_1 x_1, \dots, d_n x_n)$$

    Ценят за дешевизну: хранение требует $n$ чисел вместо $n^2$,
    умножение выполняется за $n$ операций вместо $n^2$,
    обращение сводится к замене каждого элемента обратным (если все они ненулевые),
    а собственные значения стоят прямо на диагонали.
  explanation: |-
    Отсюда популярность диагональных приближений в оптимизации.
    Adam и RMSprop хранят по одному числу на параметр вместо полной матрицы вторых моментов,
    что делает их применимыми к моделям с миллиардами весов.
- id: la-trace-025
  topic: math/linalg
  type: mcq
  question: |-
    Матрица $2 \times 2$ имеет след, равный 6, и определитель, равный 5.
    Чему равны её собственные значения?
  difficulty: 2
  tags:
  - trace
  - determinant
  - eigen
  options:
  - text: 1 и 5
    correct: true
    why: След равен сумме собственных значений, определитель — их произведению. Нужны числа с суммой 6
      и произведением 5.
  - text: 2 и 3
    correct: false
    why: Сумма равна 5, а не 6, произведение равно 6, а не 5. Числа перепутаны местами со значениями следа
      и определителя.
  - text: 6 и 5
    correct: false
    why: Это сами след и определитель. Их сумма равна 11, произведение 30 — условия не выполняются.
  - text: 0 и 6
    correct: false
    why: Сумма верна, но произведение равно нулю, а определитель по условию равен 5.
  explanation: |-
    Соотношения $\mathrm{tr}(A) = \sum_i \lambda_i$ и $\det(A) = \prod_i \lambda_i$ верны
    для любой квадратной матрицы и служат быстрой проверкой вычислений:
    найдя собственные значения, полезно сверить их сумму со следом.
- id: la-transform-026
  topic: math/linalg
  type: open
  question: |-
    Объясни, что означает умножение матрицы на вектор с геометрической точки зрения.
    Как по матрице понять характер преобразования?
  difficulty: 2
  tags:
  - geometry
  - transformation
  - interview
  answer: |-
    Матрица задаёт линейное преобразование пространства, а умножение на вектор —
    применение этого преобразования к точке. Столбцы матрицы показывают,
    куда переходят базисные векторы: первый столбец — образ первого базисного вектора, и так далее.

    По характеристикам матрицы можно судить о преобразовании.

    Определитель показывает, во сколько раз меняется объём. Отрицательный означает
    смену ориентации (отражение), нулевой — схлопывание пространства в меньшую размерность,
    при котором информация теряется безвозвратно.

    Собственные векторы — направления, которые преобразование не поворачивает,
    а только растягивает или сжимает в соответствующее собственное значение раз.

    Ортогональная матрица соответствует повороту или отражению: длины и углы сохраняются,
    определитель равен $\pm 1$. Диагональная матрица — чистое растяжение вдоль осей координат.

    Общий случай для симметричной матрицы раскладывается через спектральное разложение
    $A = Q\Lambda Q^T$: поворот, масштабирование вдоль новых осей, поворот обратно.
  rubric:
  - Сказал, что столбцы матрицы суть образы базисных векторов
  - Связал определитель с изменением объёма и вырожденностью
  - Объяснил собственные векторы как неповорачиваемые направления
  - 'Назвал частные случаи: ортогональная как поворот, диагональная как растяжение'
  - Упомянул спектральное разложение как разбиение на поворот, масштабирование и обратный поворот
  explanation: |-
    Полезное следствие для SVD: любое линейное преобразование, даже меняющее размерность,
    представимо как поворот, масштабирование вдоль осей и ещё один поворот.
- id: la-det-027
  topic: math/linalg
  type: multi
  question: Какие утверждения про определитель верны? Выбери все верные.
  difficulty: 2
  tags:
  - determinant
  options:
  - text: Определитель равен произведению собственных значений
    correct: true
  - text: Определитель ортогональной матрицы равен $\pm 1$
    correct: true
  - text: Геометрически определитель показывает коэффициент изменения объёма
    correct: true
  - text: Для квадратных матриц выполняется $\det(AB) = \det(A)\det(B)$
    correct: true
  - text: Определитель определён для любой матрицы, включая прямоугольную
    correct: false
