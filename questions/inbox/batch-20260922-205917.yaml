- id: np-shape-001
  topic: python/numpy_pandas
  type: mcq
  question: |-
    ```python
    A = np.random.randn(4, 3)
    B = np.random.randn(3, 5)
    C = A @ B
    ```
    Какая форма у `C`, и что произойдёт при `B @ A`?
  difficulty: 1
  tags:
  - shapes
  - matmul
  options:
  - text: '`C` имеет форму `(4, 5)`; выражение `B @ A` вызовет ошибку'
    correct: true
    why: Внутренние размерности 3 и 3 совпали и схлопнулись. В обратном порядке получается 5 против 4
      — несовместимо.
  - text: '`C` имеет форму `(3, 3)`; `B @ A` даст `(5, 4)`'
    correct: false
    why: Остаются внешние размерности, а не внутренние. Внутренние как раз исчезают при умножении.
  - text: '`C` имеет форму `(4, 5)`; `B @ A` даст `(3, 3)`'
    correct: false
    why: 'Форма `C` верна, но `B @ A` не вычисляется: у `B` пять столбцов, у `A` четыре строки.'
  - text: Оба выражения вызовут ошибку, размерности несовместимы
    correct: false
    why: 'Первое выражение корректно: число столбцов `A` равно числу строк `B`.'
  explanation: |-
    Правило: $(a \times b) \cdot (b \times c) = (a \times c)$.
    Внутренние размерности должны совпасть и схлопываются, внешние остаются.
    Несовпадение порядка — одна из самых частых ошибок в коде.
- id: np-shape-002
  topic: python/numpy_pandas
  type: card
  question: Матрица данных $X$ имеет форму $(n, k)$. Какие формы у $X^T X$, $X X^T$ и $Xw$, где $w$ —
    вектор весов?
  difficulty: 1
  tags:
  - shapes
  - matmul
  answer: |-
    $X^T X$ имеет форму $(k, k)$ — квадратная по числу **признаков**.

    $X X^T$ имеет форму $(n, n)$ — квадратная по числу **объектов**.

    $Xw$ при $w$ формы $(k,)$ или $(k, 1)$ даёт $(n,)$ или $(n, 1)$ — по одному предсказанию на объект.
  explanation: |-
    В формуле линейной регрессии $w = (X^TX)^{-1}X^Ty$ используется именно $X^TX$:
    её размер не зависит от количества объектов, поэтому обращение остаётся выполнимым
    и при миллионах строк.
- id: np-axis-003
  topic: python/numpy_pandas
  type: mcq
  question: |-
    ```python
    X = np.random.randn(1000, 128)   # объекты x признаки
    a = X.mean(axis=0)
    b = X.mean(axis=1)
    ```
    Какие формы у `a` и `b` и что означает каждое?
  difficulty: 1
  tags:
  - axis
  - aggregation
  options:
  - text: '`a` имеет форму `(128,)` — среднее каждого признака; `b` имеет форму `(1000,)` — среднее признаков
      каждого объекта'
    correct: true
    why: Параметр `axis` указывает ось, по которой происходит агрегирование, и именно она исчезает из
      результата.
  - text: '`a` имеет форму `(1000,)`, `b` имеет форму `(128,)`'
    correct: false
    why: Формы перепутаны. При `axis=0` схлопывается ось объектов, значит остаётся размерность признаков.
  - text: Обе имеют форму `(1000, 128)`, метод `mean` не меняет форму
    correct: false
    why: Форму не меняют поэлементные операции. Агрегирующие функции убирают указанную ось.
  - text: '`a` имеет форму `(128,)`, `b` вызовет ошибку'
    correct: false
    why: 'Оба вызова корректны: у двумерного массива есть обе оси.'
  explanation: |-
    Мнемоника: `axis` — это ось, которая **исчезает**.
    На практике `X.mean(axis=0)` — то, что вычисляет `StandardScaler` при `fit`.
    А `X.mean(axis=1)` обычно бессмысленно: усредняются признаки разной природы.
- id: np-bcast-004
  topic: python/numpy_pandas
  type: mcq
  question: |-
    ```python
    v = np.random.randn(5)
    M = np.random.randn(3, 5)
    N = np.random.randn(5, 3)
    M + v   # a
    N + v   # b
    ```
    Что произойдёт в каждой строке?
  difficulty: 2
  tags:
  - broadcasting
  options:
  - text: Строка a даёт `(3, 5)`; строка b вызовет ошибку
    correct: true
    why: Размерности сравниваются справа налево. У `M` последняя равна 5 и совпадает с длиной `v`. У `N`
      последняя равна 3, что с 5 несовместимо.
  - text: 'Обе строки отработают: numpy найдёт подходящую ось автоматически'
    correct: false
    why: Broadcasting сопоставляет размерности строго с конца и не ищет подходящую ось где-то в середине
      формы.
  - text: Строка a вызовет ошибку, строка b даст `(5, 3)`
    correct: false
    why: 'Всё наоборот: совместима именно `M`, у которой последняя размерность равна длине вектора.'
  - text: Обе строки вызовут ошибку, для сложения нужны одинаковые формы
    correct: false
    why: 'Совпадение форм не обязательно: broadcasting растягивает размерности, равные единице или отсутствующие.'
  explanation: |-
    Ловушка в том, что число 5 присутствует в форме `N`, но стоит не на той позиции.
    Починить можно через `N + v[:, None]`: тогда `v` получит форму `(5, 1)`
    и растянется по столбцам.
- id: np-bcast-005
  topic: python/numpy_pandas
  type: card
  question: Сформулируй правило broadcasting и приведи пример, где оно используется в ML.
  difficulty: 2
  tags:
  - broadcasting
  answer: |-
    Формы сравниваются **справа налево**. Пара размерностей совместима, если они равны
    или одна из них равна единице. Недостающие слева размерности считаются единицами.
    Размерность, равная единице, растягивается до нужной.

    Пример из ML — центрирование данных:
    ```python
    X_centered = X - X.mean(axis=0)   # (1000, 20) - (20,)
    ```
    Вектор из 20 средних вычитается из каждой из 1000 строк без единого цикла.
  explanation: |-
    Второй частый случай — прибавление смещения в линейном слое: `X @ W + b`,
    где `b` имеет форму `(out,)` и добавляется к каждому объекту батча.
- id: np-mask-006
  topic: python/numpy_pandas
  type: code
  question: |-
    Есть батч последовательностей `T` формы `(batch, seq_len, dim)` и булева маска `mask`
    формы `(batch, seq_len)`, где `True` означает реальный шаг, а `False` — padding.

    Реализуй `masked_mean(T, mask)`: усреднение по длине последовательности **только по реальным шагам**.
    Результат должен иметь форму `(batch, dim)`. Считай, что `numpy` доступен как `np`.
  difficulty: 2
  tags:
  - masking
  - pooling
  - sequences
  explanation: |-
    Ключевой момент — `mask[:, :, None]`: без добавления третьей оси умножение
    `(B, S, D) * (B, S)` упадёт, поскольку справа налево D и S не совпадают.
    С добавленной осью маска растягивается по всем каналам.

    Обычный `T.mean(axis=1)` здесь неверен вдвойне: в сумму попадут значения
    на padding-позициях, а делитель будет равен полной длине вместо реальной.
    Обёртка `np.maximum(..., 1)` защищает от деления на ноль для пустых последовательностей.
  language: python
  starter: |-
    import numpy as np

    def masked_mean(T, mask):
        ...
  solution: |-
    import numpy as np

    def masked_mean(T, mask):
        m = mask[:, :, None]
        counts = np.maximum(mask.sum(axis=1), 1)[:, None]
        return (T * m).sum(axis=1) / counts
  tests: |-
    T = np.ones((2, 4, 3))
    mask = np.array([[1, 1, 0, 0], [1, 1, 1, 1]], dtype=bool)
    assert masked_mean(T, mask).shape == (2, 3)
    assert np.allclose(masked_mean(T, mask), np.ones((2, 3)))

    T2 = np.zeros((1, 3, 2)); T2[0, 0] = [4.0, 8.0]
    m2 = np.array([[1, 0, 0]], dtype=bool)
    assert np.allclose(masked_mean(T2, m2), [[4.0, 8.0]])
- id: np-mul-007
  topic: python/numpy_pandas
  type: mcq
  question: |-
    ```python
    A = np.array([[1, 2], [3, 4]])
    A @ A     # 1
    A * A     # 2
    ```
    Чем отличаются результаты?
  difficulty: 1
  tags:
  - matmul
  - elementwise
  options:
  - text: Первое — матричное умножение, даёт `[[7, 10], [15, 22]]`; второе — поэлементное, даёт `[[1,
      4], [9, 16]]`
    correct: true
    why: Оператор `@` перемножает строку на столбец, `*` умножает элементы с одинаковыми индексами.
  - text: Оба выражения дают одинаковый результат, `*` просто более короткая запись
    correct: false
    why: В numpy `*` всегда поэлементный, даже для двумерных массивов. Это отличие от MATLAB, где `*`
      матричный.
  - text: Первое даёт поэлементное произведение, второе — матричное
    correct: false
    why: 'Соотношение обратное: матричное умножение обозначается `@` или `np.matmul`.'
  - text: 'Второе выражение вызовет ошибку: нельзя перемножать матрицы поэлементно'
    correct: false
    why: Поэлементное умножение матриц одинаковой формы вполне допустимо и широко используется, например
      для применения масок.
  explanation: |-
    Проверка первого элемента: при матричном умножении это $1 \cdot 1 + 2 \cdot 3 = 7$,
    при поэлементном $1 \cdot 1 = 1$.
    Поэлементное умножение постоянно применяется для масок и dropout,
    матричное — для линейных слоёв.
- id: np-vec-008
  topic: python/numpy_pandas
  type: open
  question: |-
    Даны две реализации одной операции: тройной цикл `for` по элементам и вызов `X @ W`.
    Результат одинаковый, но вторая работает в сотни раз быстрее. Почему,
    и как убедиться, что функции действительно эквивалентны?
  difficulty: 2
  tags:
  - vectorization
  - performance
  - interview
  answer: |-
    Асимптотическая сложность у обеих одинакова — порядка $O(n \cdot k \cdot m)$ операций.
    Разница не в алгоритме, а в реализации.

    Цикл на Python интерпретируется: на каждую итерацию приходятся накладные расходы
    интерпретатора, и таких итераций миллионы. Оператор `@` вызывает скомпилированный код
    библиотеки BLAS, написанный на C или Fortran, который дополнительно использует
    векторные инструкции процессора и оптимизирует работу с кэшем.

    Проверять эквивалентность нужно через `np.allclose`, а не через `==`.
    Причина в том, что сложение чисел с плавающей точкой не ассоциативно:
    цикл суммирует слева направо, BLAS разбивает сумму на блоки и складывает в другом порядке.
    Расхождение в последних разрядах неизбежно и составляет порядка $10^{-13}$.

    Для надёжности стоит прогнать на нескольких случайных матрицах разных размеров,
    включая неквадратные.
  rubric:
  - Сказал, что асимптотическая сложность одинакова, разница в константе
  - Объяснил накладные расходы интерпретатора против скомпилированного BLAS
  - Предложил `np.allclose` для сравнения
  - 'Объяснил, почему `==` не подходит: неассоциативность сложения float'
  explanation: |-
    Есть и менее очевидное отличие: при несовпадении размерностей `@` сразу падает
    с понятной ошибкой, а ручной цикл может молча использовать только часть данных
    и вернуть неверный результат без всякого предупреждения.
- id: np-bcast-009
  topic: python/numpy_pandas
  type: multi
  question: Какие пары форм совместимы по правилам broadcasting? Выбери все верные.
  difficulty: 2
