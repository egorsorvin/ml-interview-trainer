    вроде ReLU или сигмоиды никогда не меняют размерность, а линейные слои меняют.
- id: np-debug-014
  topic: python/numpy_pandas
  type: open
  question: |-
    Код падает с ошибкой несовпадения размерностей внутри длинного пайплайна.
    Как ты будешь искать причину?
  difficulty: 2
  tags:
  - debugging
  - shapes
  - interview
  answer: |-
    Первым делом читаю саму ошибку: numpy и PyTorch указывают конкретные формы,
    которые не сошлись, и это сразу сужает поиск.

    Дальше печатаю формы на каждом шаге пайплайна: `print(x.shape)` после каждого
    преобразования либо ставлю `assert x.shape == (...)` в ключевых местах.
    Так находится шаг, где форма стала не той, что ожидалась.

    Типичные причины по опыту: перепутанные оси при транспонировании;
    забытый `reshape` или `flatten` перед полносвязным слоем; агрегирование
    по неверной оси, из-за чего пропала лишняя размерность; вектор формы `(n,)`
    там, где ожидался `(n, 1)`; broadcasting, который молча сработал
    и дал результат неожиданной формы вместо ошибки.

    Полезный приём — проверять пайплайн на маленьком батче с **различающимися**
    размерностями, например `(2, 3, 4)`, а не `(4, 4, 4)`. При одинаковых числах
    перепутанные оси не проявляются.
  rubric:
  - Сказал, что нужно прочитать формы из текста ошибки
  - Предложил печатать или проверять ассертами формы по шагам пайплайна
  - 'Назвал типичные причины: транспонирование, забытый reshape, неверная ось агрегирования'
  - Упомянул тест на маленьком батче с различающимися размерностями
  explanation: |-
    Отдельно коварен случай, когда broadcasting срабатывает вместо ошибки:
    сложение `(n, 1)` и `(1, n)` даёт матрицу `(n, n)` вместо ожидаемого вектора,
    и программа продолжает работать с неверными данными.
- id: np-onehot-015
  topic: python/numpy_pandas
  type: code
  question: |-
    Реализуй `one_hot(labels, num_classes)` без циклов: по массиву целочисленных меток
    формы `(n,)` построй матрицу формы `(n, num_classes)`, где в каждой строке единица
    стоит в позиции соответствующей метки, остальные значения нулевые.
    Считай, что `numpy` доступен как `np`.
  difficulty: 2
  tags:
  - indexing
  - one_hot
  explanation: |-
    Приём называется fancy indexing: два массива индексов одинаковой длины
    задают набор пар «строка, столбец», и присваивание выполняется сразу по всем позициям.
    Запись `out[np.arange(n), labels] = 1` читается как «в строке $i$ поставь единицу
    в столбце `labels[i]`».

    Тот же приём применяют для выбора вероятности правильного класса из матрицы предсказаний:
    `probs[np.arange(n), y]` — именно это происходит внутри вычисления cross-entropy.
  language: python
  starter: |-
    import numpy as np

    def one_hot(labels, num_classes):
        ...
  solution: |-
    import numpy as np

    def one_hot(labels, num_classes):
        out = np.zeros((len(labels), num_classes))
        out[np.arange(len(labels)), labels] = 1.0
        return out
  tests: |-
    y = np.array([0, 2, 1, 2])
    oh = one_hot(y, 3)
    assert oh.shape == (4, 3)
    assert np.allclose(oh.sum(axis=1), 1.0)
    assert np.allclose(oh.argmax(axis=1), y)
    assert np.allclose(one_hot(np.array([1]), 2), [[0.0, 1.0]])
