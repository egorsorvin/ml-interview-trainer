- id: np-float-010
  topic: python/numpy_pandas
  type: card
  question: Как правильно сравнивать массивы чисел с плавающей точкой и почему нельзя использовать `==`?
  difficulty: 2
  tags:
  - float
  - testing
  answer: |-
    ```python
    np.allclose(a, b)                    # True/False с допуском
    np.testing.assert_allclose(a, b)     # в тестах, с подробным отчётом
    ```

    Оператор `==` требует побитового совпадения, а арифметика с плавающей точкой
    накапливает погрешность округления. Классический пример: `0.1 + 0.2 == 0.3` даёт `False`.
    Разный порядок суммирования в разных реализациях приводит к расхождению
    в последних разрядах при математически верном результате.
  explanation: |-
    Точное сравнение через `np.array_equal` уместно только для целых чисел,
    индексов и булевых масок. Чтобы увидеть величину расхождения,
    используют `np.max(np.abs(a - b))`.
- id: np-std-011
  topic: python/numpy_pandas
  type: code
  question: |-
    Реализуй `standardize(X)`: стандартизацию матрицы признаков `X` формы `(n_objects, n_features)`
    по каждому **признаку** — вычесть среднее и поделить на стандартное отклонение.
    Форма результата совпадает с формой входа. Считай, что `numpy` доступен как `np`.
  difficulty: 1
  tags:
  - standardization
  - axis
  explanation: |-
    Ключевое — `axis=0`: агрегируем по объектам, получая по одному числу на признак.
    С `axis=1` статистики считались бы по признакам внутри объекта, что бессмысленно.
    Вычитание и деление работают через broadcasting: вектор длины `n_features`
    применяется к каждой строке.

    В реальном пайплайне такую операцию не пишут руками, а берут `StandardScaler`,
    причём `fit` выполняют только на обучающей выборке, иначе возникает утечка данных.
  language: python
  starter: |-
    import numpy as np

    def standardize(X):
        ...
  solution: |-
    import numpy as np

    def standardize(X):
        return (X - X.mean(axis=0)) / X.std(axis=0)
  tests: |-
    X = np.array([[1.0, 10.0], [3.0, 20.0], [5.0, 30.0]])
    Z = standardize(X)
    assert Z.shape == X.shape
    assert np.allclose(Z.mean(axis=0), 0.0, atol=1e-10)
    assert np.allclose(Z.std(axis=0), 1.0)
- id: np-reshape-012
  topic: python/numpy_pandas
  type: mcq
  question: |-
    ```python
    x = np.random.randn(32, 28, 28)
    y = x.reshape(32, -1)
    ```
    Какая форма у `y` и что означает `-1`?
  difficulty: 2
  tags:
  - reshape
  - shapes
  options:
  - text: '`(32, 784)`; значение `-1` означает «вычисли эту размерность автоматически»'
    correct: true
    why: 'Общее число элементов сохраняется: $28 \cdot 28 = 784$. Значение `-1` допустимо только для одной
      оси.'
  - text: '`(32, 28)`; значение `-1` отбрасывает последнюю ось'
    correct: false
    why: Метод `reshape` никогда не отбрасывает данные — общее число элементов всегда сохраняется.
  - text: '`(32, 1)`; значение `-1` схлопывает оставшиеся оси в одну усреднением'
    correct: false
    why: Усреднение выполняет `mean`. Метод `reshape` только меняет форму, не трогая значения.
  - text: 'Вызов приведёт к ошибке: `-1` недопустимо как размерность'
    correct: false
    why: Это стандартный приём numpy и PyTorch, позволяющий не считать размерность вручную.
  explanation: |-
    Именно так изображения «выпрямляют» перед подачей в полносвязный слой:
    двумерная сетка пикселей превращается в вектор длины 784.
    Если передать `-1` сразу для двух осей, numpy не сможет определить форму однозначно и выдаст ошибку.
- id: np-shape-013
