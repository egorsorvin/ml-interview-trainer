- id: mlr-base-001
  topic: ml/metrics
  type: card
  question: Запиши формулы MAE, MSE и RMSE и скажи, в каких единицах измеряется каждая.
  difficulty: 1
  tags:
  - mae
  - mse
  - rmse
  answer: |-
    $$\text{MAE} = \frac{1}{n}\sum_i |y_i - \hat y_i|$$
    $$\text{MSE} = \frac{1}{n}\sum_i (y_i - \hat y_i)^2$$
    $$\text{RMSE} = \sqrt{\text{MSE}}$$

    MAE и RMSE измеряются **в тех же единицах**, что целевая переменная, поэтому интерпретируемы:
    «в среднем промахиваемся на столько-то рублей». MSE измеряется в **квадратах** этих единиц
    и для объяснения бизнесу не годится.
  explanation: |-
    Именно поэтому RMSE популярнее MSE как метрика: она возвращает результат в исходный масштаб,
    сохраняя при этом усиленный вес крупных ошибок.
- id: mlr-out-002
  topic: ml/metrics
  type: mcq
  question: Почему MSE считается чувствительной к выбросам, а MAE устойчивой?
  difficulty: 1
  tags:
  - mse
  - outliers
  options:
  - text: Квадрат растёт быстрее модуля, поэтому крупная ошибка даёт непропорционально большой вклад
    correct: true
    why: При ошибке 10 модуль даёт 10, а квадрат — 100. Один выброс может перевесить десятки обычных объектов.
  - text: MSE не определена для отрицательных остатков
    correct: false
    why: Квадрат как раз убирает знак, обе метрики корректно работают с остатками любого знака.
  - text: MAE делит на число объектов, а MSE нет
    correct: false
    why: Обе метрики усредняют по выборке, различие только в способе обработки величины ошибки.
  - text: MSE применима только к нормально распределённым данным
    correct: false
    why: Формального ограничения нет. Связь с нормальностью возникает лишь в интерпретации MSE через максимальное
      правдоподобие.
  explanation: |-
    Практическое следствие: модель, обученная на MSE, «жертвует» точностью на большинстве объектов
    ради уменьшения одного огромного промаха. Если выбросы в данных — шум, это вредит.
- id: mlr-choose-003
  topic: ml/metrics
  type: open
  question: Как выбрать метрику для задачи регрессии? На что смотреть?
  difficulty: 2
  tags:
  - interview
  - case
  answer: |-
    Отталкиваюсь от четырёх вопросов.

    Насколько критичны крупные ошибки? Если один большой промах опаснее многих мелких
    (прогноз нагрузки на сервер, оценка риска) — RMSE. Если все ошибки равноценны — MAE.

    Есть ли выбросы и являются ли они шумом? Если да — MAE или Huber,
    чтобы аномалии не перетягивали обучение. Если выбросы содержательны и их важно ловить — RMSE.

    Нужна ли относительная ошибка? Когда значения различаются на порядки
    (один магазин продаёт десятки штук, другой десятки тысяч), абсолютные метрики
    неинформативны — нужны MAPE, WAPE или логарифмирование таргета.

    Кому объяснять результат? Бизнесу понятнее MAE в единицах и MAPE в процентах,
    для сравнения моделей между собой удобен R².

    На практике смотрю несколько метрик сразу: RMSE как основную, MAE для интерпретации,
    и обязательно распределение остатков, а не только среднее.
  rubric:
  - Назвал критерий чувствительности к крупным ошибкам как основной для выбора между MAE и RMSE
  - Упомянул выбросы и устойчивость MAE или Huber
  - Сказал про относительные метрики, когда масштаб значений сильно различается
  - Учёл интерпретируемость для заказчика
  - Предложил смотреть несколько метрик и распределение ошибок
  explanation: |-
    Сильный ответ включает встречный вопрос: «что дороже в вашей задаче — стабильно ошибаться
    на немного или изредка сильно промахиваться». Это сразу определяет выбор.
- id: mlr-gap-004
  topic: ml/metrics
  type: card
  question: Как соотносятся RMSE и MAE, и о чём говорит большой разрыв между ними?
  difficulty: 2
  tags:
  - rmse
  - mae
  - diagnostics
  answer: |-
    Всегда выполняется $\text{RMSE} \geq \text{MAE}$.

    Если значения близки — ошибки примерно одинаковы по величине.
    Если RMSE заметно больше MAE — в данных есть **выбросы**: небольшое число объектов
    предсказывается гораздо хуже остальных.
  explanation: |-
    Это бесплатная диагностика: увидев большой разрыв, стоит отобрать объекты
    с максимальными ошибками и посмотреть на них. Часто обнаруживается либо аномалия в данных,
    либо целый сегмент, который модель не умеет обрабатывать.
- id: mlr-r2-005
  topic: ml/metrics
  type: card
  question: Запиши формулу $R^2$ и объясни, с чем она сравнивает модель.
  difficulty: 1
  tags:
  - r2
  answer: |-
    $$R^2 = 1 - \frac{SS_{res}}{SS_{tot}} = 1 - \frac{\sum_i (y_i - \hat y_i)^2}{\sum_i (y_i - \bar y)^2}$$

    Сравнивает модель с тривиальным бейзлайном — предсказанием средним значением.
    Показывает, какую долю разброса данных модель сумела объяснить.
  explanation: |-
    В отличие от MAE и RMSE, метрика безразмерная, поэтому удобна для сравнения
    качества на разных задачах и разных масштабах целевой переменной.
- id: mlr-r2-006
  topic: ml/metrics
  type: mcq
  question: На тестовой выборке получено $R^2 = -0{,}3$. Что это означает?
  difficulty: 2
  tags:
  - r2
  - pitfall
  options:
  - text: Модель хуже, чем предсказание средним значением
    correct: true
    why: Ноль соответствует уровню бейзлайна, отрицательное значение означает, что модель проигрывает
      даже ему. Типично при переобучении или смене распределения данных.
  - text: 'В вычислениях ошибка: $R^2$ не может быть отрицательным'
    correct: false
    why: На обучающей выборке для линейной регрессии действительно не может, но на тестовой — вполне.
  - text: Модель объясняет $30\%$ дисперсии, знак означает обратную зависимость
    correct: false
    why: Знак $R^2$ не кодирует направление зависимости. Доля объяснённой дисперсии здесь просто отрицательна,
      то есть модель вредит.
  - text: Целевая переменная имеет нулевую дисперсию
    correct: false
    why: В этом случае знаменатель обратился бы в ноль и метрика была бы не определена, а не отрицательна.
  explanation: |-
    Отрицательный $R^2$ — сигнал серьёзной проблемы: сильное переобучение,
    сдвиг распределения между обучением и тестом либо ошибка в пайплайне.
- id: mlr-mape-007
  topic: ml/metrics
  type: multi
  question: Какие утверждения про MAPE верны? Выбери все верные.
  difficulty: 2
  tags:
  - mape
  options:
  - text: Метрика выражается в процентах и удобна для объяснения бизнесу
    correct: true
  - text: Метрика не определена, если целевая переменная принимает нулевые значения
    correct: true
  - text: 'Метрика асимметрична: занижение прогноза штрафуется мягче, чем завышение'
    correct: true
  - text: Метрика устойчива к выбросам в целевой переменной
    correct: false
    why: 'Наоборот, при малых значениях таргета она взрывается: ошибка в 2 единицы при истинном значении
      1 даёт $200\%$.'
  - text: Метрика измеряется в тех же единицах, что целевая переменная
    correct: false
    why: MAPE безразмерна и измеряется в процентах — в этом и смысл относительной метрики.
  explanation: |-
    Асимметрия объясняется просто: при недооценке процентная ошибка ограничена $100\%$,
    а при переоценке может быть сколь угодно большой. Поэтому оптимизация MAPE
    систематически подталкивает модель занижать прогноз.
    Частичные решения — SMAPE и WAPE.
- id: mlr-loss-008
  topic: ml/metrics
  type: open
  question: Почему модель часто обучают на MSE, а качество показывают в MAE или MAPE?
  difficulty: 2
  tags:
  - loss
  - interview
  answer: |-
    Потому что метрика и функция потерь решают разные задачи.

    MSE удобна как функция потерь: она гладкая и дифференцируемая всюду,
    для линейных моделей выпуклая и имеет аналитическое решение,
    а её производная $-2(y-\hat y)$ проста и даёт устойчивую оптимизацию.
    MAE недифференцируема в нуле из-за излома, что усложняет градиентные методы.

    Но MSE измеряется в квадратах единиц и для объяснения результата не годится.
    MAE даёт понятное «в среднем ошибаемся на столько-то», MAPE — «на столько-то процентов».

    Важная оговорка: оптимизация MSE приближает **условное среднее**,
    а оптимизация MAE — **условную медиану**. Поэтому при сильно скошенном распределении
    таргета обучение на MSE даст систематически смещённые предсказания относительно медианы,
    и расхождение метрик будет не только вопросом интерпретации.
  rubric:
  - Сказал, что MSE гладкая и дифференцируемая, а MAE имеет излом в нуле
  - Упомянул, что MSE измеряется в квадратах единиц и неинтерпретируема
  - 'Разделил роли: лосс оптимизируем, метрику показываем'
  - Отметил, что MSE приближает среднее, а MAE медиану
  explanation: |-
    Если выбросы мешают, но нужна гладкость, берут Huber loss —
    он квадратичен около нуля и линеен на хвостах.
- id: mlr-huber-009
  topic: ml/metrics
  type: mcq
  question: Как устроена функция потерь Хьюбера и какую задачу она решает?
  difficulty: 2
  tags:
  - huber
  - loss
  options:
  - text: 'Квадратична при малых ошибках и линейна при больших: сочетает гладкость MSE с устойчивостью
      MAE'
    correct: true
    why: Около нуля ведёт себя как MSE (гладкая производная), на хвостах как MAE (выбросы не перетягивают
      обучение). Порог переключения задаёт параметр $\delta$.
  - text: Линейна при малых ошибках и квадратична при больших
    correct: false
    why: Соотношение обратное. Такая функция усиливала бы влияние выбросов, а не гасила его.
  - text: Это MSE с добавленным L2-штрафом на веса
    correct: false
    why: Это описание Ridge-регрессии. Huber меняет способ штрафа за ошибку предсказания, а не за величину
      весов.
  - text: Это среднее арифметическое MAE и MSE
    correct: false
    why: Huber не усредняет метрики, а переключается между двумя режимами в зависимости от величины ошибки.
  explanation: |-
    В компьютерном зрении та же функция известна как smooth L1 loss
    и применяется для регрессии координат ограничивающих рамок в детекции объектов.
- id: mlr-rmse-010
  topic: ml/metrics
  type: multi
  question: Какие утверждения про RMSE верны? Выбери все верные.
  difficulty: 2
  tags:
  - rmse
  options:
  - text: Измеряется в тех же единицах, что целевая переменная
    correct: true
  - text: Сильнее MAE реагирует на крупные ошибки
    correct: true
  - text: Всегда не меньше MAE на одной и той же выборке
    correct: true
  - text: Устойчива к выбросам
    correct: false
    why: 'Наследует чувствительность MSE: извлечение корня меняет масштаб, но не устраняет непропорциональный
      вклад крупных ошибок.'
  - text: Значение всегда лежит в диапазоне от 0 до 1
    correct: false
    why: Метрика не нормирована и ограничена только снизу нулём. В диапазоне от 0 до 1 обычно лежит $R^2$.
  explanation: |-
    Полезный ориентир для оценки качества: сравнить RMSE со стандартным отклонением целевой переменной.
    Если они сопоставимы, модель работает примерно на уровне предсказания средним.
- id: mlr-scale-011
  topic: ml/metrics
  type: open
  question: |-
    Прогнозируем дневные продажи по сети магазинов. Один магазин продаёт около 10 единиц в день,
    другой около 10 000. Какую метрику выбрать и почему?
  difficulty: 3
  tags:
  - case
  - mape
  - interview
  answer: |-
    Абсолютные метрики здесь непригодны: RMSE и MAE будут почти полностью определяться
    крупными магазинами. Ошибка в 50 единиц для магазина с оборотом 10 000 незначительна,
    а для магазина с оборотом 10 катастрофична, но в общей сумме первая перевесит.

    Варианты решения.

    Относительные метрики: MAPE или, предпочтительнее, WAPE
    $$\text{WAPE} = \frac{\sum_i |y_i - \hat y_i|}{\sum_i |y_i|}$$
    WAPE устойчивее к нулевым и малым продажам, которые у маленьких магазинов неизбежны.

    Логарифмирование таргета: обучаться на $\ln(1+y)$, тогда абсолютная ошибка в лог-пространстве
    соответствует относительной в исходном. Метрика RMSLE работает по этому принципу.

    Отдельно стоит считать метрики **в разрезе сегментов** магазинов, а не только общую цифру.
    Средняя метрика по всей сети скроет, что для малых точек модель бесполезна.

    Также имеет смысл обсудить с бизнесом, что важнее: точность в штуках
    (тогда абсолютные метрики оправданы, ведь деньги делают крупные магазины)
    или одинаково хорошее качество для каждой точки.
  rubric:
  - Объяснил, что абсолютные метрики будут доминироваться крупными магазинами
  - 'Предложил относительную метрику: MAPE, WAPE или логарифмирование таргета'
  - Отметил проблему MAPE при нулевых или малых продажах и предпочёл WAPE или RMSLE
  - Предложил считать метрики в разрезе сегментов, а не только общую
  - 'Уточнил у бизнеса, что важнее: абсолютная точность или равномерное качество'
  explanation: |-
    Это типичный вопрос для задач прогнозирования спроса.
    Ответ «возьму RMSE» без обсуждения масштаба показывает отсутствие практического опыта.
- id: mlr-adjr2-012
  topic: ml/metrics
  type: card
  question: Зачем нужен скорректированный $R^2$ и чем он отличается от обычного?
  difficulty: 2
  tags:
  - r2
  - feature_selection
  answer: |-
    $$R^2_{adj} = 1 - (1 - R^2)\frac{n-1}{n-k-1}$$
    где $n$ — число объектов, $k$ — число признаков.

    Обычный $R^2$ **не уменьшается** при добавлении любого признака, даже случайного шума:
    модель всегда может немного подстроиться под лишние данные.
    Скорректированный вводит штраф за количество признаков и **падает**,
    если новый признак не даёт реального улучшения.
  explanation: |-
    Полезен при отборе признаков в линейных моделях.
    Для сравнения моделей разной сложности применяют также информационные критерии AIC и BIC,
    работающие по схожему принципу штрафа за число параметров.
- id: mlr-gap-013
  topic: ml/metrics
  type: mcq
  question: |-
    Две модели на выборке из 10 объектов. Модель A ошибается на 10 единиц в каждом из 10 объектов.
    Модель B точна на девяти объектах и ошибается на 100 единиц в одном.
    Что покажут метрики?
  difficulty: 3
  tags:
  - mae
  - rmse
  - pitfall
  options:
  - text: 'MAE одинакова и равна 10, а RMSE различается: 10 против примерно 31,6'
    correct: true
    why: 'MAE усредняет модули: в обоих случаях суммарная ошибка равна 100. RMSE усредняет квадраты, и
      единственный крупный промах даёт $\sqrt{10000/10} \approx 31{,}6$.'
  - text: Обе метрики одинаковы, поскольку суммарная ошибка совпадает
    correct: false
    why: 'Совпадает только MAE. RMSE различает характер ошибок: много мелких или одна большая.'
  - text: MAE выше у модели B, потому что её максимальная ошибка больше
    correct: false
    why: MAE учитывает только сумму модулей и не смотрит на максимум. Суммы равны, значит равны и MAE.
  - text: RMSE одинакова, а MAE различается
    correct: false
    why: 'Всё наоборот: устойчивость к характеру распределения ошибок — свойство MAE, а не RMSE.'
  explanation: |-
    Отсюда прямое следствие для выбора метрики: если один крупный промах опаснее
    десяти мелких (прогноз нагрузки, оценка риска), нужна RMSE.
    Если важна суммарная ошибка (сколько всего товара недовезли), достаточно MAE.
- id: mlr-resid-014
  topic: ml/metrics
  type: open
  question: |-
    Почему при оценке регрессии недостаточно смотреть только на среднюю метрику?
    Что ещё стоит проверить?
  difficulty: 2
  tags:
  - residuals
  - diagnostics
  - interview
  answer: |-
    Средняя метрика скрывает структуру ошибок. Модель с RMSE 100 может стабильно ошибаться
    на сотню везде, а может быть точной на большинстве объектов и катастрофически промахиваться
    на одном сегменте — цифра будет одинаковой, а выводы разными.

    Что смотрю дополнительно.

    Распределение остатков: гистограмма покажет, симметричны ли ошибки
    или модель систематически завышает либо занижает прогноз.

    Зависимость ошибки от предсказанного значения: если ошибка растёт
    с величиной прогноза, это сигнал о необходимости логарифмирования таргета
    или относительной метрики.

    Метрики в разрезе сегментов: по регионам, категориям, диапазонам таргета.
    Часто выясняется, что модель хороша на массовых случаях и бесполезна на важном меньшинстве.

    Объекты с максимальными ошибками: там обнаруживаются либо аномалии в данных,
    либо целые классы ситуаций, которые модель не улавливает.

    Сравнение с бейзлайном: предсказание средним или значением с прошлого периода.
    Без этого непонятно, есть ли от модели польза вообще.
  rubric:
  - Сказал, что среднее скрывает структуру ошибок и разные модели могут дать одинаковую метрику
  - Предложил посмотреть распределение остатков на систематическое смещение
  - Упомянул анализ по сегментам или зависимость ошибки от величины прогноза
  - Предложил разобрать объекты с наибольшими ошибками
  - Назвал сравнение с тривиальным бейзлайном
  explanation: |-
    Разрыв между RMSE и MAE — самый быстрый индикатор того,
    что распределение ошибок неоднородно и требует отдельного разбора.
- id: mlr-opt-015
  topic: ml/metrics
  type: mcq
  question: |-
    Какую статистику целевой переменной приближает модель, обученная на MSE,
    и какую — обученная на MAE?
  difficulty: 3
  tags:
  - mse
  - mae
  - theory
  options:
  - text: MSE приближает условное среднее, MAE — условную медиану
    correct: true
    why: Минимум суммы квадратов отклонений достигается на среднем, минимум суммы модулей — на медиане.
  - text: Обе приближают условное среднее, различие только в скорости сходимости
    correct: false
    why: 'Различие принципиальное: при скошенном распределении среднее и медиана заметно расходятся, и
      предсказания моделей будут разными.'
  - text: MSE приближает медиану, MAE — среднее
    correct: false
    why: 'Соотношение обратное. Проверяется на простом примере: для набора чисел сумма квадратов отклонений
      минимальна относительно среднего.'
  - text: MSE приближает моду, MAE — среднее
    correct: false
    why: Моду приближают другие подходы, например оценки на основе плотности. Ни MSE, ни MAE к моде не
      ведут.
  explanation: |-
    Практическое следствие: при сильно скошенном распределении таргета
    (доходы, длительность сессии, суммы покупок) выбор между MSE и MAE меняет не только
    устойчивость к выбросам, но и саму величину, которую предсказывает модель.
    Обобщение этой идеи — квантильная функция потерь, позволяющая предсказывать
    произвольный квантиль, например 90-й процентиль для оценки худшего случая.
