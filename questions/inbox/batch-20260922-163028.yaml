- id: mlv-over-001
  topic: ml/validation
  type: card
  question: Что такое переобучение и по какому признаку его обнаруживают?
  difficulty: 1
  tags:
  - overfitting
  answer: |-
    Переобучение — ситуация, когда модель подстраивается под **шум** обучающих данных
    вместо реальных закономерностей, и теряет способность обобщать на новые данные.

    Главный признак — **разрыв** между выборками: низкая ошибка на train при заметно более
    высокой ошибке на validation. Важно именно расхождение, а не абсолютное значение ошибки.
  explanation: |-
    Ошибка на train падает монотонно с ростом сложности модели, а ошибка на validation
    сначала падает, потом разворачивается вверх. Точка разворота — оптимальная сложность.
- id: mlv-diag-002
  topic: ml/validation
  type: mcq
  question: |-
    Ошибка модели высокая и на обучающей, и на валидационной выборке, значения близки друг к другу.
    Что это означает и что делать?
  difficulty: 1
  tags:
  - underfitting
  - learning_curves
  options:
  - text: 'Недообучение: модель слишком проста, нужно усложнить её или добавить признаки'
    correct: true
    why: Высокая ошибка на train означает, что модель не способна выразить зависимость даже на данных,
      которые видела.
  - text: 'Переобучение: нужно добавить регуляризацию'
    correct: false
    why: При переобучении ошибка на train низкая, а расхождение с validation велико. Здесь обе ошибки
      высоки и близки.
  - text: 'Утечка данных: признаки содержат ответ'
    correct: false
    why: Утечка проявляется подозрительно хорошими метриками, а не плохими.
  - text: Модель обучена корректно, это предел качества
    correct: false
    why: Такой вывод можно сделать только если ошибка близка к уровню шума в данных, что требует отдельной
      проверки.
  explanation: |-
    Диагностика по двум числам: обе ошибки высокие и близкие — высокий bias (недообучение);
    train низкая, validation высокая — высокий variance (переобучение).
- id: mlv-bv-003
  topic: ml/validation
  type: open
  question: Объясни bias-variance trade-off.
  difficulty: 2
  tags:
  - bias_variance
  - interview
  answer: |-
    Ожидаемая ошибка на новых данных раскладывается на три части:
    $$\mathbb{E}\big[(y - \hat f(x))^2\big] = \text{Bias}^2 + \text{Variance} + \sigma^2$$

    **Bias** — систематическая ошибка от того, что модель слишком проста и физически не способна
    выразить истинную зависимость. Прямая не опишет синусоиду, сколько данных ей ни дай.

    **Variance** — чувствительность к конкретной обучающей выборке. Если обучить модель
    на слегка разных выборках и получить сильно разные модели, variance высокий:
    модель ловит случайные особенности данных.

    **Шум** — неустранимая случайность в самих данных, нижняя граница ошибки.

    Компромисс в том, что усложнение модели снижает bias, но повышает variance.
    Поэтому суммарная ошибка имеет минимум при промежуточной сложности,
    и просто «взять модель помощнее» не работает.
  rubric:
  - 'Назвал все три компоненты: bias, variance и неустранимый шум'
  - Объяснил bias как систематическую ошибку от недостаточной выразительности модели
  - Объяснил variance как чувствительность к конкретной выборке
  - Сказал, что усложнение снижает bias и повышает variance, поэтому есть оптимум
  - 'Связал с практикой: простая модель — недообучение, сложная — переобучение'
  explanation: |-
    Наглядная аналогия — стрельба по мишени, где каждая точка это предсказание модели,
    обученной на своей выборке. Высокий bias — кучно, но мимо центра.
    Высокий variance — разбросанно вокруг центра.
    Стоит отметить, что разложение строго выводится только для квадратичной ошибки.
- id: mlv-bv-004
  topic: ml/validation
  type: card
  question: Что снижает bias, а что variance? Приведи по несколько приёмов.
  difficulty: 2
  tags:
  - bias_variance
  answer: |-
    **Снижают variance** (борются с переобучением): регуляризация, больше данных,
    упрощение модели, ансамблирование через бэггинг, dropout, ранняя остановка, аугментация.

    **Снижают bias** (борются с недообучением): более сложная модель, новые признаки,
    ослабление регуляризации, более долгое обучение, бустинг.
  explanation: |-
    Отсюда ключевое различие ансамблей: бэггинг усредняет независимо обученные модели
    и снижает преимущественно variance, а бустинг последовательно исправляет ошибки
    предыдущих моделей и снижает преимущественно bias.
- id: mlv-split-005
  topic: ml/validation
  type: mcq
  question: Зачем нужна отдельная тестовая выборка, если валидационная уже показывает качество на невиданных
    данных?
  difficulty: 2
  tags:
  - train_val_test
  options:
  - text: Подбирая гиперпараметры по валидации, мы неявно подгоняемся под неё, и оценка становится завышенной
    correct: true
    why: Перебрав сотню конфигураций и выбрав лучшую по валидации, мы выбираем в том числе ту, что случайно
      хорошо легла на эти данные.
  - text: Тест нужен, чтобы обучить модель на большем объёме данных
    correct: false
    why: Наоборот, тест изымается из обучения и уменьшает доступный объём.
  - text: Валидация используется только для ранней остановки, а метрики по ней не считают
    correct: false
    why: Метрики по валидации считают постоянно, именно на их основе принимают решения.
  - text: Это требование библиотек вроде sklearn
    correct: false
    why: Техническое требование отсутствует, это методологическая необходимость.
  explanation: |-
    Правило: как только на основе выборки принято хотя бы одно решение, она перестаёт быть
    независимой оценкой. Тест трогают один раз в самом конце.
- id: mlv-var-006
  topic: ml/validation
  type: multi
  question: Какие приёмы помогают бороться с переобучением? Выбери все верные.
  difficulty: 2
  tags:
  - overfitting
  - regularization
  options:
  - text: Добавить L2-регуляризацию
    correct: true
  - text: Собрать больше обучающих данных
    correct: true
  - text: Применить раннюю остановку по валидационной метрике
    correct: true
  - text: Уменьшить число параметров модели
    correct: true
  - text: Увеличить число эпох обучения
    correct: false
    why: 'Это усиливает переобучение: модель получает больше возможностей подстроиться под шум обучающей
      выборки.'
  explanation: |-
    Все перечисленные приёмы работают через снижение variance: либо ограничивают
    эффективную сложность модели, либо увеличивают объём информации, на которой она учится.
- id: mlv-leak-007
  topic: ml/validation
  type: open
  question: Что такое утечка данных? Приведи несколько типичных примеров и скажи, как её обнаружить.
  difficulty: 2
  tags:
  - data_leakage
  - interview
  answer: |-
    Утечка — попадание в обучение информации, недоступной в момент реального предсказания.
    Модель показывает отличные метрики на валидации и проваливается в проде.

    Типичные примеры:

    Масштабирование или отбор признаков выполнены **до** разделения выборки —
    статистики теста просочились в обучение.

    Признак, производный от целевой переменной: дата отмены подписки при предсказании оттока,
    заполненная только у тех, кто уже ушёл.

    Признаки из будущего во временных задачах: агрегат за период, внутри которого уже произошло событие.

    Дубликаты одного объекта в train и test — модель просто его запоминает.

    Подбор порога или гиперпараметров по тесту.

    Обнаруживают по подозрительно высоким метрикам, по одному признаку с аномально большой важностью,
    и главное — проверкой каждого признака вопросом: будет ли он доступен в момент предсказания в проде.
  rubric:
  - 'Дал определение: информация, недоступная в момент реального предсказания'
  - Назвал утечку через предобработку до разделения выборки
  - Назвал признак, производный от таргета, или признак из будущего
  - Упомянул подозрительно высокие метрики как сигнал
  - Предложил проверку доступности признака в момент предсказания
  explanation: |-
    Практическое правило: ROC-AUC порядка $0{,}99$ на реальной бизнес-задаче почти всегда
    означает утечку, а не выдающуюся модель.
- id: mlv-scale-008
  topic: ml/validation
  type: mcq
  question: |-
    ```python
    scaler = StandardScaler()
    X_scaled = scaler.fit_transform(X)
    X_train, X_test, y_train, y_test = train_test_split(X_scaled, y)
    ```
    Что здесь не так?
  difficulty: 2
  tags:
  - data_leakage
  - preprocessing
  options:
  - text: 'Масштабирование применено до разделения: параметры посчитаны с учётом тестовых данных'
    correct: true
    why: Среднее и стандартное отклонение вычислены по всей выборке, включая тест, — это утечка, и оценка
      качества будет завышена.
  - text: Нужно было применить `transform` вместо `fit_transform` ко всей выборке
    correct: false
    why: Без предварительного `fit` метод `transform` вызвать нельзя. Проблема в порядке операций, а не
      в выборе метода.
  - text: StandardScaler нельзя применять перед train_test_split только для деревьев
    correct: false
    why: Порядок операций нарушен независимо от типа модели. Деревьям масштабирование просто не нужно,
      но утечка здесь не про это.
  - text: Ошибки нет, так масштабируют стандартно
    correct: false
    why: Это одна из самых частых ошибок в ML-коде и типичный вопрос на собеседовании.
  explanation: |-
    Правильный порядок: сначала `train_test_split`, затем `fit_transform` на train
    и `transform` на test теми же параметрами. Надёжнее всего обернуть всё в `Pipeline`,
    который делает это автоматически внутри кросс-валидации.
- id: mlv-cv-009
  topic: ml/validation
  type: card
  question: Опиши алгоритм K-fold кросс-валидации и объясни, что она даёт по сравнению с одиночным разделением.
  difficulty: 2
  tags:
  - cross_validation
  answer: |-
    Данные делятся на $K$ равных частей. Модель обучается на $K-1$ частях и проверяется на оставшейся,
    процедура повторяется $K$ раз со сменой валидационного фолда, затем оценки усредняются.

    Даёт более устойчивую оценку: каждый объект побывал и в обучении, и в проверке,
    а усреднение снижает влияние случайности разбиения.
    Дополнительно разброс оценок между фолдами сам по себе информативен — большой разброс
    означает нестабильность модели.
  explanation: |-
    Цена — обучение проводится $K$ раз. Для больших нейросетей это обычно неприемлемо,
    поэтому там ограничиваются одиночным разделением.
- id: mlv-time-010
  topic: ml/validation
  type: mcq
  question: Данные — продажи по дням за два года. Как правильно разделить выборку для валидации?
  difficulty: 2
  tags:
  - time_series
  - split
  options:
  - text: 'По времени: обучение на раннем периоде, проверка на позднем'
    correct: true
    why: 'Так воспроизводится реальный сценарий: в проде модель предсказывает будущее, зная только прошлое.'
  - text: Случайно с перемешиванием, как обычно
    correct: false
    why: В обучение попадут дни, идущие позже тестовых, — это утечка из будущего и завышенная оценка.
  - text: Случайно, но со стратификацией по месяцам
    correct: false
    why: 'Стратификация не устраняет главную проблему: обучающие объекты всё равно окажутся позже тестовых
      по времени.'
  - text: Случайно, если данных достаточно много
    correct: false
    why: Объём данных не влияет на природу утечки из будущего.
  explanation: |-
    Для кросс-валидации на временных данных применяют `TimeSeriesSplit`:
    обучающая выборка растёт, а валидационный фолд всегда идёт следом за ней по времени.
- id: mlv-leak-011
  topic: ml/validation
  type: open
  question: |-
    Коллега показывает модель предсказания оттока клиентов с ROC-AUC $0{,}99$ на отложенной выборке
    и предлагает выкатывать её в прод. Твои действия?
  difficulty: 3
  tags:
  - data_leakage
  - case
  - interview
  answer: |-
    Такое значение на реальной бизнес-задаче — почти наверняка признак утечки, а не качества модели.
    Отток зависит от множества трудно предсказуемых факторов, и настолько чистое разделение классов неправдоподобно.

    Что проверяю в первую очередь: список признаков на предмет тех, что производны от таргета
    или становятся известны только после факта оттока — дата расторжения договора,
    финальный статус, агрегаты за период, включающий момент ухода.

    Дальше смотрю важность признаков: если один даёт почти всё качество, это главный подозреваемый.

    Проверяю методологию: не выполнялась ли предобработка до разделения выборки,
    нет ли дубликатов между train и test, не перемешаны ли временные данные случайно.

    Главный критерий по каждому признаку: будет ли он доступен в момент,
    когда модель реально делает предсказание. Если нет — признак убираем и переобучаем.

    Финальная проверка — воспроизвести прод-сценарий на исторических данных:
    обучиться на периоде до какой-то даты и предсказать следующий период.
  rubric:
  - Сказал, что $0{,}99$ на такой задаче подозрительно и указывает на утечку
  - Предложил проверить признаки на производность от таргета или недоступность в момент предсказания
  - Упомянул анализ важности признаков для поиска подозреваемого
  - 'Проверил методологию: предобработка до split, дубликаты, перемешивание временных данных'
  - Предложил воспроизвести прод-сценарий с разделением по времени
  explanation: |-
    Ответ «отлично, выкатываем» — провальный. Ответ «подозрительно, проверю признаки
    на утечку» — то, что хотят услышать. Хороший кандидат сразу называет конкретный механизм проверки.
- id: mlv-cv-012
  topic: ml/validation
  type: multi
  question: В каких ситуациях обычный K-fold со случайным разбиением применять нельзя? Выбери все верные.
  difficulty: 2
  tags:
  - cross_validation
  - stratification
  options:
  - text: Данные упорядочены по времени
    correct: true
  - text: 'В выборке есть группы связанных объектов: несколько снимков одного пациента'
    correct: true
  - text: Сильный дисбаланс классов, редкий класс может целиком уйти в один фолд
    correct: true
  - text: Признаков больше, чем объектов
    correct: false
    why: Это затрудняет обучение модели и требует регуляризации, но схему разбиения менять не нужно.
  - text: Модель обучается долго
    correct: false
    why: 'Это вопрос вычислительных затрат: кросс-валидация останется корректной, просто дорогой. Обычно
      уменьшают $K$ или переходят к одиночному разделению.'
  explanation: |-
    Для каждой ситуации есть свой вариант: `TimeSeriesSplit` для временных данных,
    `GroupKFold` для связанных объектов, `StratifiedKFold` для дисбаланса.
- id: mlv-early-013
  topic: ml/validation
  type: card
  question: Как работает ранняя остановка и почему её считают формой регуляризации?
  difficulty: 2
  tags:
  - early_stopping
  answer: |-
    После каждой эпохи считается метрика на валидации. Лучшее значение и соответствующие веса
    запоминаются. Если улучшений нет в течение заданного числа эпох (patience), обучение прекращается,
    и возвращаются **лучшие** веса, а не последние.

    Регуляризацией её считают потому, что она ограничивает, насколько далеко модель успеет уйти
    в подгонку под шум, то есть ограничивает её эффективную сложность — как и L2-штраф, но другим способом.
  explanation: |-
    Ранняя остановка и сохранение лучших весов — разные механизмы.
    Чекпоинтинг решает вопрос «какую модель взять», остановка — «сколько ресурсов тратить».
    Patience нужен потому, что валидационная метрика шумит и может случайно просесть на одной эпохе.
- id: mlv-nested-014
  topic: ml/validation
  type: mcq
  question: |-
    ```python
    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2)
    grid = GridSearchCV(LogisticRegression(), {'C': [0.01, 0.1, 1, 10]}, cv=5)
    grid.fit(X_test, y_test)
    print(grid.best_score_)
    ```
    В чём здесь главная ошибка?
  difficulty: 3
  tags:
  - hyperparameters
  - nested_cv
  options:
  - text: Подбор гиперпараметров выполняется на тестовой выборке, а обучающая не используется вовсе
    correct: true
    why: Тест перестаёт быть независимой оценкой, а 80% данных лежат без дела. Нужно `fit` на `X_train`,
      а тест трогать один раз в конце.
  - text: Значение `cv=5` слишком мало для надёжной оценки
    correct: false
    why: Пять фолдов — стандартный выбор. Проблема не в числе фолдов, а в том, на каких данных они строятся.
  - text: Сетка значений `C` подобрана неверно
    correct: false
    why: Логарифмическая сетка от $0{,}01$ до $10$ вполне разумна для силы регуляризации.
  - text: Нужно было использовать `RandomizedSearchCV` вместо полного перебора
    correct: false
    why: При четырёх значениях одного гиперпараметра полный перебор дешевле и точнее случайного поиска.
  explanation: |-
    Даже при корректном `fit` на train значение `best_score_` остаётся слегка оптимистичным:
    оно получено на тех же фолдах, где выбирались гиперпараметры.
    Методологически честная оценка требует вложенной кросс-валидации,
    где внешний цикл оценивает качество, а внутренний подбирает параметры.
- id: mlv-diag-015
  topic: ml/validation
  type: open
  question: Как по кривым обучения отличить недообучение от переобучения и что делать в каждом случае?
  difficulty: 2
  tags:
  - learning_curves
  - interview
  answer: |-
    Смотрю на две вещи: абсолютный уровень ошибок и разрыв между train и validation.

    **Недообучение (высокий bias):** обе ошибки высокие и близки друг к другу.
    Модель не справляется даже с данными, которые видела. Лечение: усложнить модель,
    добавить признаки, ослабить регуляризацию, обучать дольше.

    **Переобучение (высокий variance):** ошибка на train низкая, на validation заметно выше,
    и после некоторой эпохи validation начинает расти. Лечение: регуляризация, больше данных,
    аугментация, упрощение модели, ранняя остановка.

    **Хороший баланс:** обе ошибки низкие и близки.

    Отдельный случай — обе ошибки низкие, но validation не улучшается при добавлении данных:
    вероятно, достигнут предел информативности признаков, и нужны новые признаки, а не новые объекты.
  rubric:
  - 'Назвал критерий: уровень ошибок плюс разрыв между train и validation'
  - Описал недообучение как высокие и близкие ошибки, предложил усложнение модели
  - Описал переобучение как разрыв между train и validation, предложил регуляризацию или больше данных
  - Упомянул, что смотреть надо на разрыв, а не только на абсолютные значения
  explanation: |-
    Полезное дополнение: кривая зависимости качества от объёма данных.
    Если validation продолжает улучшаться с ростом выборки, имеет смысл собирать данные;
    если вышла на плато — узкое место в самой модели или признаках.
