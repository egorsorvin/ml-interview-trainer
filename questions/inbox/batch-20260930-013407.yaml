- id: stcs-muxbar-016
  topic: stats/descriptive
  type: mcq
  question: Чем $\mu$ отличается от $\bar x$?
  difficulty: 1
  tags:
  - parameter
  - statistic
  - mean
  options:
  - text: $\mu$ — истинное среднее генеральной совокупности, фиксированное и неизвестное; $\bar x$ — среднее
      нашей выборки, известное, но случайное
    correct: true
    why: Другая выборка даст другое $\bar x$, а $\mu$ от выборки не зависит. $\bar x$ — оценка $\mu$.
  - text: Это одно и то же в разных обозначениях
    correct: false
    why: 'Они совпадают только случайно. На уровне обозначений: греческие буквы — параметры генеральной
      совокупности, латинские — статистики выборки.'
  - text: $\mu$ — медиана, $\bar x$ — среднее
    correct: false
    why: 'Обе — средние, но разных уровней: совокупности и выборки.'
  - text: $\bar x$ — фиксированное число, $\mu$ меняется от выборки к выборке
    correct: false
    why: 'Наоборот: истина фиксирована, оценка случайна.'
  explanation: |-
    То же для разброса: $\sigma$ — истинное стандартное отклонение, $s$ — выборочное.
    И для доли: $p$ — истинная, $\hat p$ — выборочная. Шляпка над буквой означает «оценка».
- id: stcs-shrinks-017
  topic: stats/descriptive
  type: mcq
  question: Выборку чеков увеличили с 900 до 3600. Что произойдёт с $\sigma$, $s$ и $SE$?
  difficulty: 2
  tags:
  - std
  - standard_error
  - sample_size
  options:
  - text: $\sigma$ не изменится, $s$ останется примерно тем же, $SE$ уменьшится вдвое
    correct: true
    why: '$\sigma$ — свойство клиентов, от размера выборки не зависит. $s$ — оценка $\sigma$, она колеблется
      вокруг неё и с ростом $n$ просто становится точнее. $SE = \sigma / \sqrt n$: $n$ вырос в 4 раза,
      $\sqrt n$ — в 2 раза.'
  - text: Все три уменьшатся вдвое
    correct: false
    why: Разброс самих чеков не уменьшается от того, что мы собрали их больше. Уменьшается только разброс
      оценки среднего.
  - text: $\sigma$ и $s$ уменьшатся, $SE$ не изменится
    correct: false
    why: 'Наоборот: от $n$ зависит именно SE.'
  - text: $SE$ уменьшится в 4 раза
    correct: false
    why: SE обратно пропорциональна $\sqrt n$, а не $n$.
  explanation: |-
    Самый короткий способ запомнить: **σ — насколько разные клиенты, SE — насколько точна наша оценка**.
    Больше данных не делает клиентов похожими, но делает оценку точнее.
- id: stcs-levels-018
  topic: stats/descriptive
  type: multi
  question: Что верно про $\sigma$, $s$ и $SE$? Выбери все верные.
  difficulty: 2
  tags:
  - std
  - standard_error
  - sampling_distribution
  options:
  - text: $\sigma$ описывает разброс отдельных значений в генеральной совокупности
    correct: true
    why: Например, насколько чеки разных клиентов отличаются друг от друга.
  - text: $s$ — оценка $\sigma$ по выборке
    correct: true
    why: Считается по данным с делением на $n - 1$.
  - text: $SE$ — стандартное отклонение выборочного распределения оценки
    correct: true
    why: То есть насколько среднее (или доля) скачет от выборки к выборке.
  - text: На практике SE считают как $s / \sqrt n$
    correct: true
    why: $\sigma$ неизвестна, поэтому подставляют её оценку $s$.
  - text: $SE$ описывает разброс данных в выборке
    correct: false
    why: Разброс данных описывает $s$. SE — про разброс оценки, построенной по всей выборке.
  - text: При большой выборке $s$ стремится к нулю
    correct: false
    why: $s$ стремится к $\sigma$, а не к нулю. К нулю стремится SE.
  explanation: |-
    Иерархия: $\sigma$ (истина про данные) → $s$ (её оценка) → $SE = s / \sqrt n$ (разброс оценки среднего).
    Первые две — про клиентов, третья — про точность нашего вывода.
- id: stcs-contradiction-019
  topic: stats/descriptive
  type: mcq
  question: |-
    В отчёте сказано: «стандартное отклонение чека 1500 рублей, стандартная ошибка среднего 50 рублей».
    Коллега считает, что это противоречие: разброс не может быть и 1500, и 50. Кто прав?
  difficulty: 2
  tags:
  - std
  - standard_error
  - interview
  options:
  - text: 'Противоречия нет: 1500 — разброс отдельных чеков, 50 — разброс среднего по 900 чекам'
    correct: true
    why: $SE = 1500 / \sqrt{900} = 50$. Отдельные чеки отличаются друг от друга на тысячи, а средние по
      900 чекам из разных выборок отличаются друг от друга всего на десятки.
  - text: 'Коллега прав: одно из чисел ошибочно'
    correct: false
    why: Оба числа корректны, они описывают разброс разных величин.
  - text: Противоречия нет, потому что SE считают по выборке, а σ — по всей совокупности
    correct: false
    why: 'Это не суть различия: обе можно оценить по выборке ($s$ и $s/\sqrt n$). Разница в том, **чей**
      это разброс — отдельных значений или среднего.'
  - text: SE должна быть больше стандартного отклонения
    correct: false
    why: SE в $\sqrt n$ раз меньше. Больше она быть не может при $n > 1$.
  explanation: |-
    Если среднее по 900 чекам колеблется на ±50, а отдельные чеки — на ±1500, это ровно то, что
    предсказывает формула $\sigma / \sqrt n$: при усреднении случайные отклонения частично гасят друг друга.
- id: stcs-plusminus-020
  topic: stats/descriptive
  type: mcq
  question: |-
    На дашборде две записи: «средний чек 2060 ± 1500» и «средний чек 2060 ± 98» (по 900 чекам).
    Что означает каждая?
  difficulty: 2
  tags:
  - reporting
  - confidence_interval
  - std
  options:
  - text: ±1500 — стандартное отклонение, описывает разброс чеков; ±98 — полуширина 95% интервала для
      среднего, описывает точность оценки
    correct: true
    why: $98 = 1{,}96 \times SE = 1{,}96 \times 50$. Первая запись отвечает на вопрос «насколько разные
      клиенты», вторая — «насколько точно мы знаем средний чек».
  - text: Обе — доверительные интервалы разного уровня
    correct: false
    why: Интервал для среднего по 900 чекам не может быть ±1500 при таком разбросе — это на порядок шире
      любого разумного уровня доверия.
  - text: Обе — стандартные отклонения, посчитанные разными способами
    correct: false
    why: ±98 не является стандартным отклонением чеков.
  - text: 'Запись «± 1500» ошибочна: у среднего не бывает разброса'
    correct: false
    why: Это разброс данных вокруг среднего, такая запись распространена. Проблема в том, что без подписи
      её легко спутать с интервалом.
  explanation: |-
    Хорошая практика — всегда подписывать, что стоит после ±: SD, SE или 95% CI.
    Для решений в A/B нужен интервал (точность оценки эффекта), для описания клиентов — SD.
- id: stcs-sdse-021
  topic: stats/descriptive
  type: open
  question: Объясните разницу между стандартным отклонением и стандартной ошибкой. Когда какую использовать?
  difficulty: 2
  tags:
  - std
  - standard_error
  - interview
  answer: |-
    **Стандартное отклонение** ($\sigma$, по выборке — $s$) — разброс **отдельных значений**
    вокруг среднего. Отвечает на вопрос «насколько разные объекты». От размера выборки не зависит:
    клиенты не становятся похожими от того, что мы собрали их больше.

    **Стандартная ошибка** ($SE = \sigma / \sqrt n$) — разброс **оценки** (например, среднего)
    от выборки к выборке. Отвечает на вопрос «насколько точно мы знаем среднее».
    Уменьшается с ростом выборки как $1 / \sqrt n$.

    **Пример.** Чеки: $\sigma = 1500$. По 900 чекам $SE = 1500 / 30 = 50$.

    **Когда что.**
    - Описать данные, неоднородность клиентов, найти выбросы → стандартное отклонение.
    - Доверительный интервал, проверка гипотез, сравнение групп в A/B → стандартная ошибка.

    **Откуда $\sqrt n$.** Дисперсии независимых наблюдений складываются, поэтому дисперсия суммы $n$
    значений — $n\sigma^2$. Среднее — сумма, делённая на $n$, его дисперсия $n\sigma^2 / n^2 = \sigma^2 / n$,
    стандартное отклонение $\sigma / \sqrt n$.
  rubric:
  - Определил стандартное отклонение как разброс отдельных значений
  - Определил SE как разброс оценки от выборки к выборке
  - Сказал, что от n зависит SE, а не стандартное отклонение
  - Привёл формулу SE = σ/√n и пример на числах
  - Назвал, где используется каждая мера
  explanation: |-
    Один из самых частых базовых вопросов на собесе. Сильный ответ — с формулой, примером на числах
    и объяснением, откуда берётся $\sqrt n$.
