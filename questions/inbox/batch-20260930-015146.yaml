- id: stcup-idea-001
  topic: stats/variance_reduction
  type: card
  question: В чём идея CUPED и как он устроен?
  difficulty: 1
  tags:
  - cuped
  - variance_reduction
  answer: |-
    **Идея.** Часть разброса метрики в тесте объясняется тем, каким пользователь был **до** теста:
    кто много покупал в прошлом месяце, много купит и в этом. Эта часть не связана с воздействием,
    это просто шум для сравнения групп. Если её вычесть, сравнение станет точнее.

    **Формула.** Для каждого пользователя:

    $$Y_{\text{cuped}} = Y - \theta\,(X - \bar X), \qquad \theta = \frac{\text{Cov}(X, Y)}{\text{Var}(X)}$$

    - $Y$ — метрика в тесте;
    - $X$ — ковариата до теста, обычно та же метрика за предпериод;
    - $\bar X$ — среднее $X$ по всем пользователям обеих групп;
    - $\theta$ — коэффициент регрессии $Y$ на $X$.

    **Результат.** Среднее метрики не меняется, дисперсия умножается на $1 - \rho^2$,
    где $\rho$ — корреляция $X$ и $Y$. Дальше — обычный t-тест на $Y_{\text{cuped}}$.
  explanation: |-
    CUPED — Controlled-experiment Using Pre-Experiment Data. По сути это регрессионная поправка
    на ковариату, известную до рандомизации.
- id: stcup-mean-002
  topic: stats/variance_reduction
  type: mcq
  question: Почему CUPED не смещает оценку эффекта?
  difficulty: 1
  tags:
  - cuped
  - unbiased
  options:
  - text: Вычитается величина $\theta(X - \bar X)$ со средним ноль, а $X$ измерена до теста и одинаково
      распределена в группах благодаря рандомизации
    correct: true
    why: Среднее $X - \bar X$ по всей выборке ноль. Воздействие на $X$ не влияет — она из прошлого. Поэтому
      разница средних $Y_{\text{cuped}}$ между группами в среднем равна разнице средних $Y$.
  - text: Потому что CUPED применяют только к контрольной группе
    correct: false
    why: Применяют к обеим группам одинаково, с одним и тем же $\theta$ и $\bar X$.
  - text: Потому что дисперсия уменьшается
    correct: false
    why: Уменьшение дисперсии и несмещённость — разные свойства. Несмещённость следует из того, что вычитаемое
      имеет среднее ноль.
  - text: CUPED смещает оценку, но это компенсируется ростом мощности
    correct: false
    why: При правильной ковариате смещения нет.
  explanation: |-
    Ключевое условие — ковариата измерена **до** рандомизации. Если взять метрику, на которую
    воздействие могло повлиять, оценка сместится.
- id: stcup-rho-003
  topic: stats/variance_reduction
  type: mcq
  question: |-
    Корреляция выручки пользователя в тесте с его выручкой за месяц до теста — 0,7.
    Во сколько раз CUPED уменьшит дисперсию и нужную выборку?
  difficulty: 2
  tags:
  - cuped
  - correlation
  - calculation
  options:
  - text: Дисперсия и выборка умножатся на $1 - 0{,}7^2 = 0{,}51$ — почти вдвое меньше
    correct: true
    why: Доля дисперсии, объяснённая ковариатой, — $\rho^2 = 0{,}49$. Остаётся 51%. Размер выборки пропорционален
      дисперсии.
  - text: На 70%
    correct: false
    why: Объяснённая доля — квадрат корреляции, а не сама корреляция.
  - text: На 30%
    correct: false
    why: Это $1 - \rho$. Правильно — $1 - \rho^2$.
  - text: Не изменит выборку, только интервал
    correct: false
    why: 'Интервал и выборка связаны через SE: меньше дисперсия — та же точность на меньшей выборке.'
  explanation: |-
    При $\rho = 0{,}3$ экономия всего 9%, при $\rho = 0{,}9$ — 81%. CUPED особенно полезен
    для метрик с сильной «инерцией» поведения.
- id: stcup-covariate-004
  topic: stats/variance_reduction
  type: mcq
  question: Какую ковариату **нельзя** использовать в CUPED для теста новой рекомендательной ленты?
  difficulty: 2
  tags:
  - cuped
  - covariate
  - bias
  options:
  - text: Число сессий пользователя за время теста
    correct: true
    why: Лента может влиять на число сессий. Ковариата, зависящая от воздействия, «съедает» часть эффекта
      и смещает оценку.
  - text: Выручку пользователя за 4 недели до теста
    correct: false
    why: Измерена до теста, от воздействия не зависит — классическая ковариата.
  - text: Число заказов за прошлый квартал
    correct: false
    why: Тоже из предпериода, допустима.
  - text: Возраст аккаунта на момент начала теста
    correct: false
    why: Зафиксирован до рандомизации, воздействие на него не влияет.
  explanation: |-
    Правило: ковариата должна быть известна **до** рандомизации. Всё, что измерено во время теста,
    потенциально испорчено воздействием.
- id: stcup-newusers-005
  topic: stats/variance_reduction
  type: mcq
  question: У части пользователей теста нет истории до теста — они новые. Как быть с CUPED?
  difficulty: 2
  tags:
  - cuped
  - missing_data
  options:
  - text: Заполнить ковариату константой (например, 0 или средним) и добавить индикатор «новый пользователь»;
      для новых выигрыша от CUPED не будет, для старых — будет
    correct: true
    why: 'Корректность сохраняется: заполнение не зависит от воздействия. Дисперсия снижается только за
      счёт пользователей с историей.'
  - text: Исключить новых пользователей из теста
    correct: false
    why: 'Это меняет популяцию теста: результат будет только про старых пользователей, а фичу выкатят
      на всех.'
  - text: Использовать для новых их метрику за время теста как ковариату
    correct: false
    why: Метрика во время теста зависит от воздействия — оценка сместится.
  - text: CUPED неприменим, если хоть у кого-то нет истории
    correct: false
    why: Применим, просто эффективность ниже.
  explanation: |-
    Для новых пользователей можно искать другие предпериодные ковариаты: канал привлечения,
    устройство, первое действие до рандомизации.
- id: stcup-theta-006
  topic: stats/variance_reduction
  type: mcq
  question: Как правильно оценивать $\theta$ в CUPED?
  difficulty: 2
  tags:
  - cuped
  - theta
  options:
  - text: Один $\theta$ по объединённым данным обеих групп (или по предпериоду) и применять его одинаково
      к обеим группам
    correct: true
    why: Если считать $\theta$ отдельно в каждой группе, преобразование в группах будет разным, и разница
      может отражать разницу преобразований, а не эффект.
  - text: Отдельно в каждой группе — так точнее
    correct: false
    why: Точнее для каждой группы по отдельности, но сравнение групп становится некорректным.
  - text: Только по тестовой группе
    correct: false
    why: Контроль тогда преобразуется «чужим» коэффициентом, асимметрично.
  - text: $\theta$ всегда равен 1
    correct: false
    why: $\theta = 1$ — это просто разница «после минус до». Оптимальный $\theta$ — коэффициент регрессии,
      он минимизирует дисперсию.
  explanation: |-
    При $\theta = 1$ получается анализ приростов «после − до». Он тоже несмещённый, но уменьшает дисперсию
    хуже оптимального $\theta$, а при слабой корреляции может даже увеличить её.
- id: stcup-ols-007
  topic: stats/variance_reduction
  type: mcq
  question: С чем эквивалентен CUPED?
  difficulty: 2
  tags:
  - cuped
  - regression
  - ancova
  options:
  - text: 'С линейной регрессией $Y \sim \text{группа} + X$: коэффициент при индикаторе группы — оценка
      эффекта с поправкой на ковариату'
    correct: true
    why: Регрессия «вычитает» из $Y$ часть, объяснённую $X$, и оценивает разницу групп по остатку. Это
      ANCOVA; в пределе больших выборок результат совпадает с CUPED.
  - text: С парным t-тестом
    correct: false
    why: Парный тест — частный случай с $\theta = 1$ и парами, это другое.
  - text: С бутстрапом
    correct: false
    why: Бутстрап — способ оценить распределение статистики, а не снизить дисперсию метрики.
  - text: С поправкой Бонферрони
    correct: false
    why: Поправка — про множественные сравнения, к CUPED отношения не имеет.
  explanation: |-
    Регрессионная запись удобна тем, что в неё можно добавить несколько ковариат сразу —
    это обобщение CUPED (иногда называют CUPAC, если ковариата — прогноз ML-модели).
- id: stcup-ratiodef-008
  topic: stats/variance_reduction
  type: mcq
  question: |-
    Рандомизация по пользователям. Метрика — CTR = все клики / все показы в группе.
    Почему это метрика-отношение и чем она отличается от среднего по пользователям их CTR?
  difficulty: 1
  tags:
  - ratio_metric
  - ctr
  options:
  - text: И числитель, и знаменатель — суммы случайных величин по пользователям. Глобальный CTR взвешивает
      пользователей по числу показов, среднее поюзерных CTR — всех одинаково
    correct: true
    why: Пользователь с 1000 показами влияет на глобальный CTR в 1000 раз сильнее, чем пользователь с
      одним показом. В среднем поюзерных CTR у них одинаковый вес. Это разные метрики с разным смыслом.
  - text: Это одно и то же
    correct: false
    why: Совпадают только если у всех одинаковое число показов.
  - text: Метрика-отношение — это любая доля от 0 до 1
    correct: false
    why: Конверсия пользователей в покупку — доля, но знаменатель (число пользователей) не случаен. Метрика-отношение
      — когда случаен знаменатель.
  - text: Глобальный CTR нельзя сравнивать между группами
    correct: false
    why: Можно, но SE нужно считать дельта-методом или бутстрапом по пользователям.
  explanation: |-
    Примеры метрик-отношений: CTR (клики / показы), средний чек (выручка / заказы),
    доля просроченных платежей (просроченные платежи / все платежи) при рандомизации по клиентам.
- id: stcup-delta-009
  topic: stats/variance_reduction
  type: mcq
  question: Зачем нужен дельта-метод при анализе метрики-отношения?
  difficulty: 2
  tags:
  - delta_method
  - ratio_metric
  options:
  - text: Чтобы корректно посчитать дисперсию отношения двух средних, когда числитель и знаменатель случайны
      и коррелированы
    correct: true
    why: Для отношения нет простой формулы вида $\sigma/\sqrt n$. Дельта-метод линеаризует отношение (разложение
      Тейлора первого порядка) и выражает его дисперсию через дисперсии числителя, знаменателя и их ковариацию.
  - text: Чтобы убрать выбросы
    correct: false
    why: Это делает винзоризация.
  - text: Чтобы сделать метрику нормальной
    correct: false
    why: Нормальность оценки даёт ЦПТ. Дельта-метод даёт её дисперсию.
  - text: Чтобы уменьшить дисперсию, как CUPED
    correct: false
    why: Дельта-метод не уменьшает дисперсию, а правильно её оценивает. Наивная формула по отдельным показам
      её занижает.
  explanation: |-
    Если считать SE, как будто каждый показ независим, дисперсия будет занижена:
    показы одного пользователя связаны. Дельта-метод работает на уровне пользователей и учитывает это.
- id: stcup-deltaformula-010
  topic: stats/variance_reduction
  type: mcq
  question: |-
    По пользователям есть числитель $R_i$ (выручка) и знаменатель $N_i$ (заказы). Метрика $\bar R / \bar N$.
    Что входит в дисперсию по дельта-методу?
  difficulty: 2
  tags:
  - delta_method
  - formula
  options:
  - text: Дисперсия $R$, дисперсия $N$ и их ковариация
    correct: true
    why: $\text{Var}\left(\frac{\bar R}{\bar N}\right) \approx \frac{1}{n\,\mu_N^2}\left(\sigma_R^2 -
      2\frac{\mu_R}{\mu_N}\text{Cov}(R, N) + \frac{\mu_R^2}{\mu_N^2}\sigma_N^2\right)$. Ковариация обычно
      положительна (больше заказов — больше выручки) и уменьшает дисперсию.
  - text: Только дисперсия выручки по заказам
    correct: false
    why: Это наивный подход, который считает заказы независимыми.
  - text: Только дисперсия $R$
    correct: false
    why: Знаменатель тоже случаен, его разброс влияет на отношение.
  - text: Дисперсия $R$ плюс дисперсия $N$
    correct: false
    why: 'Без ковариации оценка будет неточной: $R$ и $N$ сильно связаны.'
  explanation: |-
    Формулу на собесе наизусть обычно не требуют. Важно понимать: отношение линеаризуют,
    и в дисперсию входят обе величины и связь между ними.
- id: stcup-linearize-011
  topic: stats/variance_reduction
  type: mcq
  question: В чём идея линеаризации метрики-отношения?
  difficulty: 2
  tags:
  - linearization
  - ratio_metric
  options:
  - text: Для каждого пользователя считают $L_i = R_i - \kappa N_i$, где $\kappa$ — отношение в контрольной
      группе, и сравнивают средние $L$ обычным t-тестом
    correct: true
    why: Метрика-отношение превращается в обычную поюзерную величину. Направление и значимость эффекта
      совпадают с дельта-методом, а к $L$ можно применить и CUPED.
  - text: Логарифмируют отношение, чтобы оно стало линейным
    correct: false
    why: Это другая операция, она меняет вопрос.
  - text: Считают CTR каждого пользователя и сравнивают их средние
    correct: false
    why: 'Это другая метрика: все пользователи получают одинаковый вес.'
  - text: Выбрасывают пользователей с большим знаменателем
    correct: false
    why: Это искажает выборку.
  explanation: |-
    Линеаризация популярна в продакшен-платформах экспериментов: после неё все метрики —
    поюзерные средние, и для них работает одинаковый конвейер (t-тест, CUPED, поправки).
- id: stcup-boot-012
  topic: stats/variance_reduction
  type: mcq
  question: Как корректно применить бутстрап к метрике «средний чек» при рандомизации по пользователям?
  difficulty: 2
  tags:
  - bootstrap
  - ratio_metric
  - clusters
  options:
  - text: Пересемплировать пользователей целиком, со всеми их заказами, и на каждой псевдовыборке считать
      сумму выручки / сумму заказов
    correct: true
    why: Единица независимости — пользователь. Пересемплирование пользователей сохраняет зависимость заказов
      внутри пользователя.
  - text: Пересемплировать отдельные заказы
    correct: false
    why: Разрывает связь заказов одного пользователя и занижает разброс — та же ошибка, что t-тест по
      заказам.
  - text: Пересемплировать дни
    correct: false
    why: Рандомизация была не по дням.
  - text: Бутстрап к отношениям неприменим
    correct: false
    why: Применим, это как раз одна из его сильных сторон.
  explanation: |-
    Бутстрап по пользователям — универсальная проверка для любой сложной метрики.
    Его минус — вычислительная стоимость на больших тестах, поэтому в продакшене чаще используют
    дельта-метод или линеаризацию.
- id: stcup-reduce-013
  topic: stats/variance_reduction
  type: multi
  question: Какие способы действительно снижают дисперсию оценки эффекта и повышают мощность? Выбери все
    верные.
  difficulty: 2
  tags:
  - variance_reduction
  - power
  options:
  - text: CUPED с ковариатой из предпериода
    correct: true
    why: Вычитает объяснимую часть разброса.
  - text: Винзоризация тяжёлых хвостов
    correct: true
    why: Ограничивает влияние экстремальных значений, ценой небольшого смещения.
  - text: 'Стратификация: рандомизация внутри страт или постстратификация'
    correct: true
    why: Убирает разброс между стратами (регион, сегмент) из сравнения.
  - text: Более чувствительная метрика, ближе к воздействию
    correct: true
    why: 'Например, клик по кнопке вместо выручки за месяц: меньше шума на единицу эффекта.'
  - text: Анализ по сессиям вместо пользователей
    correct: false
    why: Это не снижает дисперсию, а занижает её **оценку**. Мощность кажущаяся, ложных тревог больше.
  explanation: |-
    Всё сводится к $\Delta / SE$: снизить SE можно через $\sigma$ (методы выше) или через $n$ (время).
    Снижать $\sigma$ почти всегда дешевле.
- id: stcup-explain-014
  topic: stats/variance_reduction
  type: open
  question: |-
    Менеджер спрашивает: «Вы что-то вычитаете из метрики — это не подгонка результата?»
    Объясните, что делает CUPED и почему это честно.
  difficulty: 2
  tags:
  - cuped
  - communication
  - interview
  answer: |-
    **Что делает.** Пользователи сильно различаются сами по себе: кто-то тратит 500 рублей в месяц,
    кто-то 50 000. Этот разброс не связан с фичей, но делает сравнение групп шумным.
    CUPED смотрит, сколько пользователь тратил **до** теста, и вычитает из его метрики ту часть,
    которая предсказывается его прошлым поведением. Остаётся то, что изменилось.

    **Почему честно.**
    1. Прошлое поведение измерено **до** теста — фича на него не могла повлиять.
    2. Благодаря рандомизации прошлое поведение в группах в среднем одинаковое, поэтому вычитание
       не сдвигает разницу между группами, а только убирает шум.
    3. Одинаковое преобразование применяется к обеим группам с одним коэффициентом.
    4. Метод и ковариата выбираются **до** теста, а не после просмотра результатов.

    **Что даёт.** При корреляции 0,7 с прошлым поведением тест даёт тот же ответ на вдвое меньшей
    выборке — или вдвое быстрее.
  rubric:
  - Объяснил, что убирается разброс между пользователями, не связанный с фичей
  - Подчеркнул, что ковариата измерена до теста
  - Объяснил, почему это не смещает разницу групп (рандомизация, одинаковое преобразование)
  - Сказал, что метод фиксируется заранее
  - 'Назвал практическую выгоду: меньше выборка или быстрее тест'
  explanation: |-
    Объяснение без формул для нетехнического стейкхолдера — навык, который проверяют на финальных
    этапах. Хороший приём — аналогия: «сравниваем не сколько потратили, а насколько больше или меньше
    обычного для этого человека».
- id: stcup-risk-015
  topic: stats/variance_reduction
  type: open
  question: |-
    В банке тестируют новую стратегию коммуникации с клиентами в ранней просрочке. Метрика —
    доля погашения долга за 30 дней. Какие ковариаты для CUPED или стратификации вы бы взяли,
    и какие брать нельзя?
  difficulty: 3
  tags:
  - cuped
  - credit_risk
  - stratification
  - interview
  answer: |-
    **Можно** — всё, что известно на момент рандомизации (момент входа клиента в просрочку):
    - история платёжной дисциплины: число и глубина прошлых просрочек, roll rate клиента в прошлом;
    - текущий скор или PD клиента на дату входа в просрочку;
    - сумма долга и срок кредита, утилизация лимита;
    - канал связи и реакция на прошлые коммуникации;
    - продукт и регион.

    Особенно сильная ковариата — прошлое поведение в просрочке: кто раньше быстро «выходил», тот и сейчас,
    скорее всего, выйдет.

    **Нельзя** — всё, что происходит после старта теста и может зависеть от стратегии:
    - число контактов или дозвонов во время теста;
    - обещания заплатить, полученные во время теста;
    - частичные платежи внутри 30 дней.

    **Стратификация.** Можно рандомизировать внутри страт по сумме долга или скору: группы гарантированно
    сбалансированы по сильным факторам, дисперсия ниже.

    **Особенности.** Единица рандомизации — клиент (у клиента может быть несколько продуктов в просрочке).
    Эффект виден быстро (30 дней), но стоит проверить долгосрочные последствия: не выросла ли повторная
    просрочка и жалобы.
  rubric:
  - 'Назвал ковариаты, известные на момент рандомизации: прошлая просрочка, скор, сумма долга'
  - 'Назвал запрещённые ковариаты: всё, что измерено во время теста и зависит от стратегии'
  - Упомянул стратификацию
  - Выбрал клиента как единицу рандомизации
  - Упомянул долгосрочные guardrail-метрики
  explanation: |-
    Интервьюеру в риске важна именно граница «до / после рандомизации»: ошибка с ковариатой из периода
    теста встречается часто и незаметно искажает эффект стратегий взыскания.
