- id: stpz-ht-015
  topic: stats/problems
  type: open
  question: |-
    Сколько в среднем бросков монеты нужно, чтобы впервые выпала комбинация «орёл, затем решка» (ОР)?
    Почему ответ отличается от «два орла подряд» (6 бросков)?
  difficulty: 3
  tags:
  - first_step
  - states
  - interview
  answer: |-
    **Состояния.** Ждать осталось по-разному в зависимости от того, был ли последний бросок орлом.
    - $E_0$ — старт: последний бросок не орёл (или бросков не было);
    - $E_1$ — последний бросок был орлом.

    **Уравнение для $E_1$.** Бросаем (1 бросок):
    - решка (½) → получилось ОР, готово;
    - орёл (½) → последний снова орёл, остаёмся в $E_1$.

    $E_1 = 1 + \tfrac12 \times 0 + \tfrac12 E_1$, откуда $\tfrac12 E_1 = 1$, $E_1 = 2$.

    **Уравнение для $E_0$.** Бросаем:
    - орёл (½) → переходим в $E_1$;
    - решка (½) → остаёмся на старте.

    $E_0 = 1 + \tfrac12 E_1 + \tfrac12 E_0 = 1 + 1 + \tfrac12 E_0$, откуда $\tfrac12 E_0 = 2$, $E_0 = 4$.

    **Ответ: 4 броска.**

    **Почему меньше, чем для ОО.** При ожидании ОО неудача после орла (выпала решка)
    отбрасывает **в самое начало** — прогресс теряется. При ожидании ОР неудача после орла
    (выпал ещё один орёл) оставляет нас **там же**: последний бросок по-прежнему орёл,
    и до цели всё ещё один шаг. Прогресс не теряется, поэтому ждать меньше.
  rubric:
  - 'Ввёл два состояния: старт и «последний — орёл»'
  - Правильно записал, что из состояния «орёл» ещё один орёл оставляет в том же состоянии
  - Решил уравнения и получил $E_1 = 2$, $E_0 = 4$
  - 'Объяснил разницу с ОО: там неудача отбрасывает в начало, здесь — нет'
  explanation: |-
    Любимый вопрос на собесах как раз из-за контраста: у обеих комбинаций вероятность ¼
    на двух конкретных бросках, но среднее время ожидания разное. Вероятность комбинации
    и время её ожидания — разные вещи: важно, как комбинация «перекрывается» сама с собой.
