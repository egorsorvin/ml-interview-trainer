- id: mc-der-001
  topic: math/calculus
  type: card
  question: Запиши определение производной и объясни, почему это предел, а не просто дробь.
  difficulty: 1
  tags:
  - derivative
  - definition
  answer: |-
    $$f'(x_0) = \lim_{\Delta x \to 0} \frac{f(x_0 + \Delta x) - f(x_0)}{\Delta x}$$

    Если просто подставить $\Delta x = 0$, получится неопределённость $\tfrac{0}{0}$:
    числитель тоже стремится к нулю, поскольку точка $x_0 + \Delta x$ подходит всё ближе к $x_0$.
    Предельный переход разрешает эту неопределённость, и отношение стремится к конечному числу.
  explanation: |-
    Геометрически: дробь — наклон секущей через две точки графика.
    При стягивании второй точки к первой секущая превращается в касательную,
    а средняя скорость изменения — в мгновенную.
- id: mc-der-002
  topic: math/calculus
  type: mcq
  question: В точке $x_0$ производная функции равна $-3$. Что это означает?
  difficulty: 1
  tags:
  - derivative
  - geometry
  options:
  - text: Функция убывает, и касательная в этой точке имеет наклон $-3$
    correct: true
    why: Производная равна тангенсу угла наклона касательной. Отрицательное значение означает убывание.
  - text: Значение функции в этой точке равно $-3$
    correct: false
    why: Производная описывает скорость изменения, а не само значение функции.
  - text: Функция имеет минимум в этой точке
    correct: false
    why: В точке экстремума производная обращается в ноль, а не принимает ненулевое значение.
  - text: Функция не определена в этой точке
    correct: false
    why: Существование производной, наоборот, требует, чтобы функция была определена и непрерывна в точке.
  explanation: |-
    Практическое чтение: при малом сдвиге аргумента на $dx$ значение функции изменится
    примерно на $-3 \cdot dx$. Именно на этом стоит градиентный спуск:
    зная знак производной, мы понимаем, в какую сторону двигаться для уменьшения функции.
- id: mc-cont-003
  topic: math/calculus
  type: mcq
  question: 'Функция ReLU, то есть $\max(0, x)$, в точке $x = 0$:'
  difficulty: 2
  tags:
  - continuity
  - differentiability
  - relu
  options:
  - text: Непрерывна, но не дифференцируема
    correct: true
    why: 'Разрыва нет: слева и справа значение стремится к нулю. Но слева наклон равен 0, а справа 1,
      поэтому единой касательной не существует.'
  - text: Дифференцируема, но не непрерывна
    correct: false
    why: 'Такое невозможно в принципе: дифференцируемость строго влечёт непрерывность.'
  - text: И непрерывна, и дифференцируема
    correct: false
    why: В точке излома односторонние производные различаются, значит производной не существует.
  - text: Ни непрерывна, ни дифференцируема
    correct: false
    why: 'Непрерывность есть: функция не совершает скачка, её график рисуется не отрывая карандаша.'
  explanation: |-
    Дифференцируемость — более сильное требование, чем непрерывность.
    На практике производную ReLU в нуле доопределяют константой (обычно 0 или 1):
    вероятность попасть ровно в эту точку на вещественных данных исчезающе мала.
    Та же ситуация у модуля и у функции потерь MAE.
- id: mc-chain-004
  topic: math/calculus
  type: card
  question: Сформулируй цепное правило и примени его к $\left(e^{x^2}\right)'$.
  difficulty: 1
  tags:
  - chain_rule
  answer: |-
    $$\big(f(g(x))\big)' = f'(g(x)) \cdot g'(x)$$

    Производная внешней функции, вычисленная в точке внутренней, умноженная на производную внутренней.

    Для примера: внешняя функция — экспонента, внутренняя — $x^2$.
    $$\left(e^{x^2}\right)' = e^{x^2} \cdot 2x$$
  explanation: |-
    Интуиция через передачу: если $u$ меняется втрое быстрее $x$,
    а $y$ вдвое быстрее $u$, то $y$ меняется в шесть раз быстрее $x$.
    Скорости перемножаются по цепочке — именно это и происходит в backpropagation.
- id: mc-chain-005
  topic: math/calculus
  type: open
  question: |-
    Как цепное правило связано с обучением нейросетей?
    Что из него следует про глубокие сети?
  difficulty: 2
  tags:
  - chain_rule
  - backprop
  - interview
  answer: |-
    Нейросеть — композиция функций: выход каждого слоя подаётся на вход следующему.
    Чтобы вычислить градиент функции потерь по весам раннего слоя, нужно применить
    цепное правило через все последующие слои, то есть **перемножить** их производные.

    Backpropagation — это систематическое вычисление такого произведения,
    идущее от выхода к входу с переиспользованием уже посчитанных множителей.
    Считать каждый градиент независимо было бы вычислительно неподъёмно.

    Из перемножения прямо следуют две известные проблемы глубоких сетей.
    Если множители систематически меньше единицы, произведение экспоненциально убывает —
    это затухание градиентов, и ранние слои перестают обучаться.
    Если множители больше единицы — взрыв градиентов, лосс уходит в бесконечность или NaN.

    Отсюда практические решения: ReLU вместо сигмоиды (её производная равна единице
    на положительной полуоси), нормализация слоёв, residual-связи, дающие градиенту
    короткий путь в обход блоков, и клиппинг градиентов.
  rubric:
  - Сказал, что нейросеть — композиция слоёв, и градиент считается через произведение производных
  - Назвал backpropagation как эффективное вычисление этого произведения от выхода к входу
  - Вывел затухание и взрыв градиентов из перемножения множителей
  - 'Предложил решения: ReLU, нормализация, residual-связи, клиппинг'
  explanation: |-
    Конкретный расчёт делает проблему наглядной: максимум производной сигмоиды равен $0{,}25$,
    поэтому через десять слоёв градиент ослабевает как минимум в $0{,}25^{10} \approx 10^{-6}$ раз.
- id: mc-sigm-006
  topic: math/calculus
  type: mcq
  question: Чему равна производная сигмоиды $\sigma(x) = \dfrac{1}{1 + e^{-x}}$?
  difficulty: 2
  tags:
  - sigmoid
  - derivative
  options:
  - text: $\sigma(x)\big(1 - \sigma(x)\big)$
    correct: true
    why: Производная выражается через само значение функции, поэтому на обратном проходе её можно получить
      из сохранённого результата прямого прохода.
  - text: $\sigma(x)^2$
    correct: false
    why: Такая формула не обращалась бы в ноль на краях и не давала бы максимума в нуле.
  - text: $1 - \sigma(x)$
    correct: false
    why: Это выражение не стремится к нулю при больших положительных $x$, тогда как производная сигмоиды
      стремится.
  - text: $e^{-x}$
    correct: false
    why: 'Промежуточный результат при выводе, но не итоговая производная: не хватает деления на квадрат
      знаменателя.'
  explanation: |-
    Максимум достигается при $\sigma = 0{,}5$, то есть при $x = 0$, и равен $0{,}5 \cdot 0{,}5 = 0{,}25$.
    На краях производная стремится к нулю — сигмоида насыщается.
    Это и есть математическая причина затухания градиентов в глубоких сетях с сигмоидами.
- id: mc-act-007
  topic: math/calculus
  type: card
  question: Запиши производные ReLU, сигмоиды и tanh. Чему равен максимум каждой?
  difficulty: 2
  tags:
  - activations
  - derivatives
  answer: |-
    $$\text{ReLU}'(x) = \begin{cases} 1, & x > 0 \\ 0, & x < 0 \end{cases} \qquad \text{максимум } 1$$

    $$\sigma'(x) = \sigma(x)\big(1 - \sigma(x)\big) \qquad \text{максимум } 0{,}25$$

    $$\tanh'(x) = 1 - \tanh^2(x) \qquad \text{максимум } 1$$

    В точке $x = 0$ производная ReLU не определена, на практике её доопределяют константой.
  explanation: |-
    Именно значения максимумов объясняют историю функций активации.
    У сигмоиды множитель не превышает $0{,}25$, поэтому в глубокой сети градиент затухает.
    У ReLU он равен ровно единице на положительной полуоси, и перемножение единиц ничего не ослабляет.
    Плата за это — проблема умирающих нейронов: при отрицательных входах производная равна нулю.
- id: mc-diff-008
  topic: math/calculus
  type: multi
  question: Какие функции дифференцируемы всюду и потому пригодны как функция потерь? Выбери все верные.
  difficulty: 2
  tags:
  - differentiability
  - loss
  - metrics
  options:
  - text: MSE, то есть $(y - \hat y)^2$
    correct: true
  - text: Cross-entropy
    correct: true
  - text: Сигмоида
    correct: true
  - text: Accuracy
    correct: false
    why: Меняется скачками при переключении предсказанного класса, её градиент почти всюду равен нулю.
      Оптимизировать градиентными методами невозможно.
  - text: MAE, то есть $|y - \hat y|$
    correct: false
    why: Недифференцируема в нуле из-за излома. Как функция потерь применяется, но требует субградиентов;
      гладкая альтернатива — функция Хьюбера.
  explanation: |-
    Ключевое различие: MAE имеет **одну** проблемную точку и всё же используется как лосс.
    Accuracy и F1 недифференцируемы принципиально — они кусочно-постоянны,
    поэтому их можно только измерять, но не оптимизировать.
- id: mc-surr-009
  topic: math/calculus
  type: open
  question: |-
    Почему нельзя обучать модель, напрямую максимизируя accuracy?
    Что делают вместо этого и какие последствия у такой замены?
  difficulty: 2
  tags:
  - loss
  - optimization
  - interview
  answer: |-
    Accuracy кусочно-постоянна: при малом изменении весов предсказанный класс обычно не переключается,
    и метрика остаётся ровно той же. Значит её производная почти всюду равна нулю,
    а в точках переключения не существует. Градиентный спуск в таких условиях не даёт
    никакой информации о направлении движения.

    Вместо этого оптимизируют **суррогатную** функцию потерь — гладкую и дифференцируемую,
    коррелирующую с целевой метрикой. Для классификации это cross-entropy:
    она реагирует на любое изменение предсказанной вероятности, даже если класс не переключился.

    Последствие в том, что оптимизируется не то, что измеряется.
    Падение лосса не гарантирует роста метрики: особенно заметно при дисбалансе,
    когда модель уверенно улучшает cross-entropy на лёгком мажорном классе,
    а F1 по редкому классу стоит на месте.
    Поэтому следят за обоими: лосс как индикатор здоровья обучения, метрику как показатель пользы.
  rubric:
  - Объяснил, что accuracy кусочно-постоянна и её градиент почти всюду нулевой
  - Назвал cross-entropy суррогатной дифференцируемой целью
  - Сказал, что суррогат реагирует на изменение вероятности, а не только класса
  - 'Упомянул расхождение: падение лосса не гарантирует роста метрики'
  explanation: |-
    Дополнительный рычаг — подбор порога после обучения.
    Модель обучается на cross-entropy, а порог подбирается уже под нужную метрику,
    что частично компенсирует расхождение между целью оптимизации и целью бизнеса.
- id: mc-softmax-010
  topic: math/calculus
  type: mcq
  question: Чему равен градиент cross-entropy по логитам при использовании softmax на выходе?
  difficulty: 3
  tags:
  - softmax
  - cross_entropy
  - gradient
  options:
  - text: $p - y$, то есть предсказанная вероятность минус истинная метка
    correct: true
    why: Производные softmax и логарифма взаимно упрощаются, и от громоздких выражений остаётся простая
      разность.
  - text: $-\dfrac{y}{p}$
    correct: false
    why: Это производная cross-entropy по **вероятности**, а не по логиту. Вклад softmax ещё не учтён.
  - text: $p(1-p)$
    correct: false
    why: Это производная сигмоиды, отдельный множитель, который как раз сокращается при выводе.
  - text: $\ln p - \ln y$
    correct: false
    why: 'Логарифмы в итоговом градиенте не появляются: он исчезает при дифференцировании.'
  explanation: |-
    Эта простота — одна из причин, по которой связка softmax и cross-entropy стала стандартом:
    градиент вычисляется дёшево и численно устойчиво.
    Практическое следствие: лосс нужно считать от логитов через `CrossEntropyLoss`,
    а не применять softmax вручную — библиотечная реализация использует устойчивые формулы внутри.
- id: mc-second-011
  topic: math/calculus
  type: card
  question: Что показывает вторая производная и как по её знаку определить тип критической точки?
  difficulty: 2
  tags:
  - second_derivative
  - convexity
  answer: |-
    Вторая производная описывает **кривизну**: как быстро меняется сама скорость изменения функции.

    Знак задаёт форму графика: при $f'' > 0$ это чаша, при $f'' < 0$ купол.

    Если $f'(x_0) = 0$, то знак второй производной классифицирует точку:
    $f''(x_0) > 0$ даёт минимум, $f''(x_0) < 0$ даёт максимум,
    а при $f''(x_0) = 0$ требуется дополнительное исследование.
  explanation: |-
    Русские названия «выпуклая вверх» и «выпуклая вниз» путают, поэтому надёжнее
    держать в голове знак и картинку: плюс — чаша, минус — купол.
    В многомерном случае роль второй производной играет матрица Гессе,
    а условие $f'' > 0$ превращается в её положительную определённость.
- id: mc-convex-012
  topic: math/calculus
  type: multi
  question: Какие утверждения о выпуклой функции верны? Выбери все верные.
  difficulty: 2
  tags:
  - convexity
  - optimization
  options:
  - text: Любой её локальный минимум является глобальным
    correct: true
  - text: Её вторая производная неотрицательна на всей области
    correct: true
  - text: У неё не бывает седловых точек
    correct: true
  - text: Функция потерь линейной регрессии выпукла
    correct: true
  - text: Функция потерь нейросети выпукла, если использовать ReLU
    correct: false
    why: Композиция линейных слоёв и нелинейных активаций даёт невыпуклый ландшафт независимо от выбора
      активации. Отсюда зависимость результата от инициализации весов.
  explanation: |-
    Практическое следствие выпуклости — воспроизводимость: градиентный спуск
    приходит в один и тот же оптимум из любой начальной точки.
    Поэтому логистическая регрессия обучается детерминированно,
    а два запуска обучения нейросети дают разные модели.
- id: mc-vanish-013
  topic: math/calculus
  type: open
  question: |-
    Объясни через производные, почему глубокие сети с сигмоидами плохо обучались,
    и почему переход на ReLU это исправил.
  difficulty: 3
  tags:
  - vanishing_gradient
  - activations
  - interview
  answer: |-
    Градиент по весам раннего слоя вычисляется цепным правилом как произведение
    производных всех последующих слоёв. Значит поведение этого произведения
    определяется величиной отдельных множителей.

    Производная сигмоиды равна $\sigma(1-\sigma)$ и достигает максимума $0{,}25$ при нулевом входе,
    а на краях стремится к нулю из-за насыщения. Даже в самом благоприятном случае
    каждый слой умножает градиент на число, не превосходящее $0{,}25$.
    Через десять слоёв получается $0{,}25^{10} \approx 10^{-6}$, то есть до первых слоёв
    сигнал об ошибке доходит ослабленным на порядки — они фактически перестают обучаться.

    Производная ReLU равна ровно единице для положительных входов.
    Перемножение единиц ничего не ослабляет, поэтому градиент достигает ранних слоёв
    в полной силе. Дополнительный плюс — вычислительная дешевизна: сравнение с нулём
    вместо экспоненты.

    Своя проблема у ReLU тоже есть: при отрицательных входах производная равна нулю,
    и нейрон может навсегда перестать обучаться. Отсюда модификации:
    Leaky ReLU с малым наклоном слева, ELU, GELU.
  rubric:
  - Связал градиент раннего слоя с произведением производных через цепное правило
  - Назвал максимум производной сигмоиды $0{,}25$ и показал экспоненциальное затухание
  - 'Объяснил преимущество ReLU: производная равна единице, произведение не ослабевает'
  - Упомянул проблему умирающих нейронов у ReLU и её модификации
  explanation: |-
    ReLU решила проблему не полностью: в очень глубоких сетях всё равно понадобились
    residual-связи, дающие градиенту прямой путь в обход блоков, и нормализация слоёв.
- id: mc-extr-014
  topic: math/calculus
  type: card
  question: Назови необходимое и достаточное условия экстремума. Всегда ли точка с нулевой производной
    — экстремум?
  difficulty: 2
  tags:
  - extrema
  - optimization
  answer: |-
    **Необходимое условие** (теорема Ферма): в точке локального экстремума дифференцируемой функции
    производная равна нулю, $f'(x_0) = 0$.

    **Достаточные условия**: либо производная **меняет знак** при переходе через точку
    (с плюса на минус — максимум, с минуса на плюс — минимум),
    либо вторая производная в этой точке отлична от нуля и её знак задаёт тип.

    Нет, не всегда. Нулевая производная делает точку лишь **кандидатом**.
    Классический контрпример — $f(x) = x^3$ в нуле: производная обращается в ноль,
    но функция продолжает возрастать, и это точка перегиба.
  explanation: |-
    Точки, где производная равна нулю или не существует, называют критическими.
    В многомерном случае условие превращается в $\nabla f = 0$,
    а к минимуму и максимуму добавляется третий тип критической точки — седло.
- id: mc-lr-015
  topic: math/calculus
  type: mcq
  question: |-
    Градиентный спуск опирается на линейное приближение функции.
    Что произойдёт, если learning rate окажется слишком большим?
  difficulty: 2
  tags:
  - taylor
  - gradient_descent
  - learning_rate
  options:
  - text: Шаг выйдет за пределы области, где линейное приближение верно, и лосс может вырасти вместо убывания
    correct: true
    why: |
      Приближение $f(x + \Delta x) \approx f(x) + f'(x)\Delta x$ справедливо лишь локально.
      При большом шаге реальная функция ведёт себя иначе, чем предсказывает касательная.
  - text: Обучение просто пойдёт быстрее, поскольку шаги крупнее
    correct: false
    why: До определённого предела так и есть, но за ним начинаются колебания и расходимость.
  - text: Модель переобучится, поскольку слишком точно подстроится под данные
    correct: false
    why: Переобучение связано со сложностью модели и длительностью обучения, а не с размером шага. Большой
      шаг скорее помешает сойтись вообще.
  - text: Градиент станет равен нулю и обучение остановится
    correct: false
    why: Нулевой градиент характерен для плато и точек минимума, а не для большого шага.
  explanation: |-
    Это прямое следствие ряда Тейлора: градиентный спуск использует приближение первого порядка,
    и learning rate по сути определяет, насколько далеко мы доверяем касательной.
    Диагностика по кривой лосса: лосс скачет вверх-вниз — шаг слишком велик;
    лосс падает крайне медленно и монотонно — шаг можно увеличить.
