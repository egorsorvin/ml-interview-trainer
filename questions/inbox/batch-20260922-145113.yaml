- id: mlm-conf-001
  topic: ml/metrics
  type: card
  question: Запиши формулы precision и recall и объясни, какой вопрос задаёт каждая метрика.
  difficulty: 1
  tags:
  - confusion_matrix
  - precision
  - recall
  answer: |-
    $$\text{Precision} = \frac{TP}{TP + FP}, \qquad \text{Recall} = \frac{TP}{TP + FN}$$

    **Precision** — из тех, кого модель назвала положительными, какая доля действительно положительная.
    Отвечает на вопрос: «насколько можно доверять, когда модель говорит да».

    **Recall** — из всех реально положительных объектов какую долю модель нашла.
    Отвечает на вопрос: «скольких мы не упустили».
  explanation: |-
    Различаются знаменателем: у precision это всё, что предсказала модель,
    у recall — всё, что есть в реальности. Мнемоника про рыбалку: precision — какая доля улова
    оказалась рыбой, recall — какую долю всей рыбы в пруду выловили.
- id: mlm-acc-002
  topic: ml/metrics
  type: mcq
  question: |-
    В задаче детекции мошенничества положительный класс составляет $1\%$ выборки.
    Модель показала accuracy $99\%$. Что это означает?
  difficulty: 1
  tags:
  - accuracy
  - imbalance
  options:
  - text: 'Ничего: константный ответ «не мошенник» даёт такую же accuracy'
    correct: true
    why: При дисбалансе accuracy отражает долю мажоритарного класса, а не качество модели.
  - text: Модель отличная, нашла почти всех мошенников
    correct: false
    why: Из accuracy вообще не следует, сколько объектов редкого класса найдено. Возможно, ни одного.
  - text: Модель переобучилась на обучающей выборке
    correct: false
    why: Про переобучение говорит разрыв между train и validation, а не само значение accuracy.
  - text: Точность на редком классе составляет $99\%$
    correct: false
    why: Accuracy считается по всем объектам сразу и ничего не говорит про отдельный класс.
  explanation: |-
    Любую метрику полезно сравнивать с тривиальным бейзлайном.
    Здесь бейзлайн «всегда отвечать мажоритарным классом» даёт те же $99\%$,
    значит модель не принесла никакой пользы.
- id: mlm-pr-003
  topic: ml/metrics
  type: open
  question: Что важнее — precision или recall?
  difficulty: 2
  tags:
  - precision
  - recall
  - case
  - interview
  answer: |-
    Универсального ответа нет, всё определяется ценой ошибок в конкретной задаче.

    Recall важнее, когда дорого пропустить положительный объект: диагностика заболеваний,
    поиск мошенничества, детекция критических дефектов. Ложная тревога там переживается,
    а пропуск стоит дорого.

    Precision важнее, когда дорого ошибиться в положительном предсказании: спам-фильтр
    (потерять важное письмо хуже, чем пропустить один спам), автоматическая блокировка аккаунтов,
    рекомендации, где плохая рекомендация раздражает пользователя.

    Если известна стоимость FP и FN, правильнее не выбирать между метриками,
    а подобрать порог, минимизирующий суммарные потери. Когда нужна одна цифра для сравнения
    моделей, берут F1 или F-beta с весом в сторону нужной метрики.
  rubric:
  - Сказал, что ответ зависит от цены ошибок FP и FN, а не универсален
  - Привёл пример, где важнее recall, и объяснил почему
  - Привёл пример, где важнее precision, и объяснил почему
  - Упомянул, что выбор регулируется порогом, а не только выбором метрики
  - Назвал F1 или F-beta как способ свести обе метрики к одному числу
  explanation: |-
    Сильный ход на собеседовании — встречный вопрос: «а что дороже в вашей задаче,
    пропустить объект или дать ложную тревогу». Это показывает практическое мышление.
- id: mlm-f1-004
  topic: ml/metrics
  type: card
  question: Запиши формулу F1 и объясни, почему берут гармоническое среднее, а не обычное.
  difficulty: 1
  tags:
  - f1
  answer: |-
    $$F_1 = 2 \cdot \frac{\text{precision} \cdot \text{recall}}{\text{precision} + \text{recall}}$$

    Гармоническое среднее сильнее наказывает за перекос между метриками.
    При precision $1{,}0$ и recall $0{,}01$ обычное среднее даёт $0{,}505$ (выглядит прилично),
    а F1 даёт примерно $0{,}02$ и честно показывает, что модель бесполезна.
  explanation: |-
    Обобщение — F-beta: $F_\beta = (1+\beta^2)\frac{PR}{\beta^2 P + R}$.
    При $\beta > 1$ больший вес получает recall, при $\beta < 1$ — precision.
- id: mlm-rates-005
  topic: ml/metrics
  type: card
  question: Запиши формулы TPR и FPR и объясни, что означает знаменатель каждой.
  difficulty: 2
  tags:
  - roc
  - tpr
  - fpr
  answer: |-
    $$TPR = \frac{TP}{TP + FN}, \qquad FPR = \frac{FP}{FP + TN}$$

    У TPR знаменатель — все **реально положительные** объекты, метрика отвечает
    «какую долю положительных мы поймали» (это то же самое, что recall).

    У FPR знаменатель — все **реально отрицательные**, метрика отвечает
    «какую долю отрицательных мы зря пометили как положительные».
  explanation: |-
    Ключевое свойство пары: каждая метрика нормирована внутри своего класса,
    классы не смешиваются. Отсюда независимость ROC-кривой от баланса классов —
    и одновременно её слепота к дисбалансу.
- id: mlm-auc-006
  topic: ml/metrics
  type: mcq
  question: Какова вероятностная интерпретация ROC-AUC?
  difficulty: 2
  tags:
  - roc_auc
  - interpretation
  options:
  - text: Вероятность того, что случайный положительный объект получит более высокую оценку, чем случайный
      отрицательный
    correct: true
    why: AUC равен доле правильно упорядоченных пар «положительный–отрицательный».
  - text: Вероятность того, что модель даст правильный ответ на случайном объекте
    correct: false
    why: Это описание accuracy, причём при фиксированном пороге. AUC порога не фиксирует.
  - text: Доля объектов, для которых предсказанная вероятность отличается от истинной менее чем на $0{,}5$
    correct: false
    why: Это ближе к идее калибровки, а AUC калибровку вообще не измеряет.
  - text: Средняя предсказанная вероятность положительного класса по выборке
    correct: false
    why: Среднее предсказание не связано с качеством ранжирования и может быть любым.
  explanation: |-
    Отсюда следует важное: AUC измеряет **качество ранжирования**, а не качество самих вероятностей.
    Модель может выдавать абсурдные числа (например, 0,51 против 0,49) и всё равно иметь AUC, равный единице,
    если порядок объектов правильный.
- id: mlm-auc-007
  topic: ml/metrics
  type: multi
  question: Какие утверждения про ROC-AUC верны? Выбери все верные.
  difficulty: 2
  tags:
  - roc_auc
  options:
  - text: Значение $0{,}5$ соответствует случайному угадыванию
    correct: true
  - text: Метрика не зависит от выбранного порога классификации
    correct: true
  - text: Каждая точка ROC-кривой соответствует одному значению порога
    correct: true
  - text: Метрика надёжна при любом соотношении классов
    correct: false
    why: 'При сильном дисбалансе ROC-AUC завышает впечатление: FPR имеет в знаменателе огромное число
      негативов, и ложные срабатывания в нём растворяются. Нужна PR-AUC.'
  - text: Высокий AUC гарантирует, что предсказанные вероятности корректны
    correct: false
    why: AUC зависит только от порядка объектов. Модель может быть хорошо ранжирующей и при этом плохо
      откалиброванной.
  explanation: |-
    Число точек на ROC-кривой равно числу уникальных предсказанных вероятностей
    (плюс крайние точки), потому что между соседними значениями порог ничего не меняет.
- id: mlm-prauc-008
  topic: ml/metrics
  type: open
  question: Когда ROC-AUC вводит в заблуждение и чем его заменить?
  difficulty: 2
  tags:
  - pr_auc
  - imbalance
  - interview
  answer: |-
    При сильном дисбалансе классов. Причина в знаменателе FPR: там стоит общее число отрицательных объектов.
    Если их десятки тысяч, то даже сотни ложных срабатываний дают крошечный FPR,
    и кривая выглядит почти идеальной.

    Пример: 50 положительных на 4950 отрицательных, ROC-AUC около $0{,}95$.
    При этом чтобы поймать $60\%$ положительных, precision может упасть до $0{,}35$ —
    то есть две трети срабатываний окажутся ложными. ROC этого не показывает, PR-кривая показывает.

    Замена — PR-AUC (average precision). Precision смешивает TP и FP из разных классов,
    поэтому чувствителен к дисбалансу. Важно помнить, что базовый уровень PR-кривой равен
    доле положительного класса, и сравнивать надо с ним, а не с $0{,}5$.
  rubric:
  - Назвал сильный дисбаланс классов как условие проблемы
  - 'Объяснил механизм: большое число негативов в знаменателе FPR размывает ложные срабатывания'
  - Предложил PR-AUC или average precision как замену
  - Упомянул, что базовый уровень PR-кривой равен доле положительного класса
  explanation: |-
    ROC-AUC удобен для сравнения моделей на разных датасетах, поскольку не зависит от баланса классов.
    Ровно это свойство делает его слепым к дисбалансу внутри одной задачи.
- id: mlm-thr-009
  topic: ml/metrics
  type: mcq
  question: Как правильно подбирать порог классификации?
  difficulty: 2
  tags:
  - threshold
  options:
  - text: Перебором на валидационной выборке, максимизируя целевую метрику или минимизируя стоимость ошибок
    correct: true
    why: Порог — такой же гиперпараметр, как любой другой, и подбирается на валидации, а проверяется на
      тесте.
  - text: Всегда брать $0{,}5$, это статистически обоснованное значение
    correct: false
    why: Это просто умолчание библиотек. Оптимальный порог зависит от дисбаланса и цены ошибок и часто
      заметно отличается от $0{,}5$.
  - text: Подбирать на тестовой выборке, чтобы получить наилучший результат
    correct: false
    why: 'Тогда тест перестаёт быть честной оценкой: решение принято на его основе, и метрика окажется
      завышенной.'
  - text: Брать порог, равный доле положительного класса в выборке
    correct: false
    why: Эвристика без обоснования. Она может случайно сработать, но ничего не оптимизирует.
  explanation: |-
    Три рабочих способа: максимизировать F1 на валидации; зафиксировать требование бизнеса
    (например, recall не ниже $0{,}9$) и посмотреть получившийся precision;
    минимизировать суммарные потери, если известна цена FP и FN.
- id: mlm-calib-010
  topic: ml/metrics
  type: open
  question: |-
    Модель показывает ROC-AUC $0{,}92$, но бизнес жалуется, что расчёт ожидаемых потерь
    по её вероятностям не сходится с реальностью. В чём может быть дело?
  difficulty: 3
  tags:
  - calibration
  - interview
  answer: |-
    Скорее всего модель плохо откалибрована. AUC зависит только от порядка объектов
    и ничего не говорит о том, соответствуют ли предсказанные вероятности реальным частотам.
    Модель может уверенно ранжировать и при этом систематически завышать уверенность:
    говорить $0{,}9$ там, где положительных на самом деле $60\%$.

    Для ранжирования и отбора топа это неважно, но как только вероятность идёт в расчёт
    (ожидаемые потери, страховая премия, экономика решения), ошибка калибровки переносится в деньги.

    Проверяется калибровочной кривой: объекты разбивают на корзины по предсказанной вероятности
    и в каждой сравнивают её с реальной долей положительных. Идеальная калибровка даёт диагональ.

    Чинится дообучением поверх модели на отдельной выборке: Platt scaling (логистическая регрессия
    на выходах) или isotonic regression. Полезно знать, что градиентный бустинг и нейросети
    обычно переуверены, а логистическая регрессия откалибрована хорошо, поскольку её функция потерь
    прямо штрафует за неверные вероятности.
  rubric:
  - Сказал, что AUC измеряет ранжирование и не отражает калибровку
  - 'Объяснил, что значит плохая калибровка: предсказанная вероятность не равна реальной частоте'
  - Назвал калибровочную кривую как способ проверки
  - Предложил Platt scaling или isotonic regression и отдельную выборку для калибровки
  - Упомянул, что калибровка важна только когда вероятности используются в расчётах, а не для сортировки
  explanation: |-
    Второй правдоподобный вариант ответа — сдвиг распределения данных между обучением и продом.
    Хороший кандидат назовёт обе гипотезы и предложит сначала построить калибровочную кривую.
- id: mlm-avg-011
  topic: ml/metrics
  type: mcq
  question: |-
    Датасет из 1000 объектов: 900 первого класса, 90 второго, 10 третьего.
    F1 по классам получился $0{,}95$, $0{,}70$ и $0{,}20$ соответственно.
    Какая схема усреднения честнее покажет проблему с редким классом?
  difficulty: 3
  tags:
  - multiclass
  - macro
  - micro
  options:
  - text: 'Macro: обычное среднее по классам, даёт примерно $0{,}62$'
    correct: true
    why: Каждый класс входит с равным весом, поэтому провал на редком классе сильно тянет метрику вниз.
  - text: 'Weighted: среднее с весами по размеру класса, даёт примерно $0{,}92$'
    correct: false
    why: 'Как раз маскирует проблему: доминирует крупный класс, и провал на редком почти не виден.'
  - text: 'Micro: суммирование TP, FP и FN по всем классам'
    correct: false
    why: Каждый объект входит с равным весом, поэтому редкий класс снова теряется. Для однометочной многоклассовой
      задачи micro-F1 численно совпадает с accuracy.
  - text: Все три схемы дадут одинаковый результат
    correct: false
    why: Они совпадают только при сбалансированных классах и одинаковом качестве по ним.
  explanation: |-
    Правило выбора: если важны редкие классы — macro; если важна общая доля правильных ответов — micro.
    Weighted выглядит как компромисс, но на практике чаще скрывает проблемы.
- id: mlm-imb-012
  topic: ml/metrics
  type: multi
  question: Какие подходы имеет смысл применять при сильном дисбалансе классов? Выбери все верные.
  difficulty: 2
  tags:
  - imbalance
  options:
  - text: Использовать PR-AUC и F1 вместо accuracy
    correct: true
  - text: Задать веса классов в функции потерь
    correct: true
  - text: Подобрать порог классификации под требуемый recall
    correct: true
  - text: Применить oversampling редкого класса или SMOTE
    correct: true
  - text: Увеличить learning rate, чтобы модель быстрее выучила редкий класс
    correct: false
    why: Learning rate управляет скоростью оптимизации и никак не влияет на дисбаланс. Слишком большое
      значение просто сломает сходимость.
  explanation: |-
    Важная деталь по oversampling: его применяют **только к обучающей выборке**, уже после разделения.
    Если размножить объекты до split, копии одного объекта попадут и в train, и в validation —
    получится утечка и завышенная оценка.
- id: mlm-loss-013
  topic: ml/metrics
  type: open
  question: |-
    Почему модель обучают на cross-entropy, а качество оценивают по F1 или accuracy?
    Почему нельзя оптимизировать метрику напрямую?
  difficulty: 2
  tags:
  - loss
  - optimization
  - interview
  answer: |-
    Accuracy и F1 недифференцируемы. Они меняются скачками: объект либо классифицирован верно, либо нет,
    и при малом изменении весов предсказанный класс обычно не переключается.
    Значит градиент почти всюду равен нулю, а в точках переключения не определён — градиентный спуск работать не может.

    Cross-entropy гладкая и дифференцируемая, у неё есть осмысленный градиент в каждой точке,
    поэтому она служит суррогатной целью: минимизируя её, мы косвенно улучшаем и метрику.

    Отсюда практическое следствие: падение лосса не гарантирует роста метрики.
    Особенно заметно при дисбалансе, когда модель уверенно улучшает cross-entropy
    на лёгком мажорном классе, а F1 по редкому классу не растёт.
    Поэтому следят за обоими: лосс как индикатор здоровья обучения, метрика как показатель пользы.
  rubric:
  - Сказал, что accuracy и F1 недифференцируемы, меняются скачками
  - Объяснил, что градиент по ним почти всюду нулевой, поэтому обучать нельзя
  - Назвал cross-entropy суррогатной дифференцируемой целью
  - Упомянул, что падение лосса не гарантирует роста метрики
  explanation: |-
    Существуют приёмы приблизить метрику дифференцируемой функцией (soft-F1, surrogate losses),
    но на практике почти всегда обучают на cross-entropy и подбирают порог под нужную метрику.
- id: mlm-conf-014
  topic: ml/metrics
  type: card
  question: Что такое FP и FN, и как их называют в статистике?
  difficulty: 1
  tags:
  - confusion_matrix
  - errors
  answer: |-
    **FP (False Positive)** — модель предсказала положительный класс, а объект отрицательный.
    Это **ложная тревога**, ошибка I рода.

    **FN (False Negative)** — модель предсказала отрицательный класс, а объект положительный.
    Это **пропуск**, ошибка II рода.

    В названии второе слово говорит, что предсказала модель, первое — угадала она или нет.
  explanation: |-
    Соответствие с A/B-тестами прямое: ошибка I рода — увидели эффект, которого нет (вероятность $\alpha$),
    ошибка II рода — пропустили реальный эффект (вероятность $\beta$).
    Recall при этом соответствует мощности критерия $1-\beta$.
- id: mlm-auc-015
  topic: ml/metrics
  type: mcq
  question: |-
    Модель A выдаёт вероятности $0{,}99$ для всех положительных объектов и $0{,}98$ для всех отрицательных.
    Модель B выдаёт $0{,}9$ для положительных и $0{,}1$ для отрицательных, но в $5\%$ случаев путает порядок.
    У какой модели выше ROC-AUC?
  difficulty: 3
  tags:
  - roc_auc
  - ranking
  - pitfall
  options:
  - text: У модели A, её AUC равен единице
    correct: true
    why: 'AUC зависит только от порядка: у A все положительные стоят выше всех отрицательных, значит разделение
      идеально.'
  - text: У модели B, потому что её вероятности разнесены сильнее
    correct: false
    why: Величина разрыва между вероятностями на AUC не влияет — важен только порядок объектов.
  - text: У них одинаковый AUC, поскольку обе разделяют классы
    correct: false
    why: У B порядок нарушен в $5\%$ пар, поэтому её AUC строго меньше единицы.
  - text: Определить невозможно без указания порога
    correct: false
    why: ROC-AUC считается сразу по всем порогам, поэтому конкретный порог для ответа не нужен.
  explanation: |-
    Подвох в том, что модель A с идеальным AUC совершенно непригодна к использованию как источник вероятностей:
    она катастрофически плохо откалибрована, и порог $0{,}5$ отнесёт все объекты к положительному классу.
    Хорошее ранжирование и хорошие вероятности — разные свойства.
