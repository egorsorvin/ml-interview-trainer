- id: stcs-outlier-001
  topic: stats/descriptive
  type: mcq
  question: 'Доходы пяти клиентов (тыс. рублей): 50, 60, 70, 80, 1000. Чему равны среднее и медиана?'
  difficulty: 1
  tags:
  - mean
  - median
  - outliers
  options:
  - text: Среднее 252, медиана 70
    correct: true
    why: 'Среднее: $(50 + 60 + 70 + 80 + 1000) / 5 = 1260 / 5 = 252$. Медиана — середина упорядоченного
      ряда, третье значение из пяти: 70.'
  - text: Среднее 70, медиана 252
    correct: false
    why: Перепутаны местами. Медиана — середина ряда, среднее — сумма, делённая на число.
  - text: Среднее 65, медиана 70
    correct: false
    why: 65 — это среднее без выброса 1000. Но среднее считается по всем значениям, и один выброс тянет
      его вверх.
  - text: Среднее 252, медиана 60
    correct: false
    why: В ряду из пяти значений медиана — третье по порядку, это 70.
  explanation: |-
    Один выброс сдвинул среднее в 3,6 раза выше «типичного» клиента, а медиана его почти не заметила.
    Поэтому для скошенных величин (доходы, чеки, суммы кредитов) среднее и медиана могут сильно расходиться.
- id: stcs-which-002
  topic: stats/descriptive
  type: mcq
  question: |-
    Какую меру центра использовать, чтобы спрогнозировать выручку магазина на следующий месяц
    по числу ожидаемых заказов?
  difficulty: 1
  tags:
  - mean
  - median
  - business_metrics
  - interview
  options:
  - text: 'Среднее: выручка = число заказов × средний чек'
    correct: true
    why: 'Среднее связано с суммой: $\text{сумма} = n \cdot \bar x$. Медиана такой связи не имеет — выручка
      определяется в том числе крупными заказами, которые медиана игнорирует.'
  - text: 'Медиану: она устойчива к выбросам'
    correct: false
    why: Устойчивость хороша для описания «типичного» заказа. Но выручку крупные заказы формируют реально,
      их нельзя игнорировать.
  - text: 'Моду: самое частое значение'
    correct: false
    why: Мода описывает самый популярный чек, но не связана с суммой.
  - text: Любую, результат одинаковый
    correct: false
    why: Для скошенных чеков среднее может быть в полтора-два раза больше медианы.
  explanation: |-
    Правило: **среднее** — когда важна сумма (выручка, потери, EL портфеля).
    **Медиана** — когда важно «типичное» значение (типичный клиент, типичное время доставки)
    и нужно не зависеть от выбросов.
- id: stcs-defs-003
  topic: stats/descriptive
  type: card
  question: Что такое среднее, медиана и мода, и когда какую меру центра использовать?
  difficulty: 1
  tags:
  - mean
  - median
  - mode
  answer: |-
    **Среднее · mean** — сумма значений, делённая на их число. Учитывает каждое значение,
    поэтому чувствительно к выбросам. Связано с суммой: сумма = $n \times$ среднее.

    **Медиана · median** — значение посередине упорядоченного ряда: половина значений меньше,
    половина больше. Не реагирует на то, **насколько** велики крайние значения, поэтому устойчива к выбросам.

    **Мода · mode** — самое частое значение. Полезна для категорий (самый популярный тариф)
    и для дискретных величин.

    **Когда что:**
    - нужна сумма или прогноз итога → среднее;
    - нужен «типичный» объект, данные скошены или с выбросами → медиана;
    - категориальные данные → мода.
  explanation: |-
    Для симметричных распределений все три меры совпадают. Расхождение среднего и медианы —
    простой индикатор скошенности: среднее больше медианы → длинный правый хвост.
- id: stcs-loss-004
  topic: stats/descriptive
  type: mcq
  question: |-
    Какое одно число $c$ минимизирует сумму квадратов отклонений $\sum (x_i - c)^2$,
    а какое — сумму модулей $\sum |x_i - c|$?
  difficulty: 2
  tags:
  - mean
  - median
  - loss_functions
  - interview
  options:
  - text: Квадраты — среднее, модули — медиана
    correct: true
    why: 'Производная суммы квадратов по $c$: $-2\sum(x_i - c) = 0$, откуда $c = \bar x$. Для модулей
      оптимум там, где справа и слева одинаковое число точек — в медиане.'
  - text: Квадраты — медиана, модули — среднее
    correct: false
    why: Наоборот. Квадрат сильно штрафует большие отклонения, поэтому оптимум тянется к выбросам, как
      среднее.
  - text: Обе — среднее
    correct: false
    why: Для модулей сдвиг $c$ на шаг меняет сумму на (число точек справа − число слева); это ноль только
      в медиане.
  - text: Обе — мода
    correct: false
    why: Мода минимизирует число несовпадений (0-1 лосс), а не сумму отклонений.
  explanation: |-
    Мост к ML: модель, обученная на **MSE**, предсказывает условное **среднее** $E[Y \mid X]$,
    а на **MAE** — условную **медиану**. Поэтому MAE устойчивее к выбросам в целевой переменной,
    а MSE правильнее, когда важна сумма (прогноз выручки).
- id: stcs-std-005
  topic: stats/descriptive
  type: mcq
  question: |-
    Значения: 2, 4, 4, 4, 5, 5, 7, 9. Среднее равно 5. Чему равно стандартное отклонение,
    если делить на $n$ (как для всей совокупности)?
  difficulty: 1
  tags:
  - std
  - variance
  - calculation
  options:
  - text: '2'
    correct: true
    why: 'Отклонения от 5: −3, −1, −1, −1, 0, 0, 2, 4. Квадраты: 9, 1, 1, 1, 0, 0, 4, 16, сумма 32. Дисперсия
      $32 / 8 = 4$. Корень — 2.'
  - text: '4'
    correct: false
    why: 4 — это дисперсия. Стандартное отклонение — корень из неё.
  - text: '0'
    correct: false
    why: 'Это сумма отклонений без квадратов: плюсы и минусы всегда взаимно гасятся. Поэтому отклонения
      и возводят в квадрат.'
  - text: 1,5
    correct: false
    why: Это среднее модулей отклонений $12 / 8$ — другая мера разброса (среднее абсолютное отклонение).
  explanation: |-
    С делением на $n - 1 = 7$ (выборочное стандартное отклонение) получится $\sqrt{32/7} \approx 2{,}14$.
    Стандартное отклонение читается как «типичное отклонение от среднего» и измеряется в тех же единицах,
    что и данные.
- id: stcs-bessel-006
  topic: stats/descriptive
  type: mcq
  question: Почему в выборочной дисперсии делят на $n - 1$, а не на $n$?
  difficulty: 2
  tags:
  - bessel_correction
  - unbiased
  - interview
  options:
  - text: Отклонения считаются от выборочного среднего, подогнанного под те же данные, поэтому они систематически
      меньше отклонений от истинного среднего. Деление на $n - 1$ это компенсирует
    correct: true
    why: Выборочное среднее всегда лежит ровно в центре своих данных, и сумма квадратов отклонений от
      него минимальна. В среднем она равна $(n-1)\sigma^2$, а не $n\sigma^2$. Одна степень свободы «ушла»
      на оценку среднего.
  - text: Чтобы дисперсия получалась больше и оценка была консервативнее
    correct: false
    why: 'Цель не консерватизм, а несмещённость: с $n - 1$ оценка в среднем попадает точно в истинную
      дисперсию.'
  - text: Это соглашение без математического смысла
    correct: false
    why: 'Смысл есть: с делением на $n$ оценка систематически занижена.'
  - text: Потому что первое наблюдение не участвует в расчёте
    correct: false
    why: Участвуют все наблюдения. Степень свободы теряется не на наблюдение, а на оценку среднего.
  explanation: |-
    На больших выборках разница между $n$ и $n - 1$ пренебрежима. Внимание к ней нужно на малых выборках.
    В numpy по умолчанию `np.std` делит на $n$, в pandas `.std()` — на $n - 1$.
- id: stcs-iqr-007
  topic: stats/descriptive
  type: mcq
  question: Что такое межквартильный размах (IQR) и как по нему ищут выбросы?
  difficulty: 1
  tags:
  - iqr
  - quartiles
  - outliers
  options:
  - text: IQR = $Q_3 - Q_1$, ширина центральной половины данных. Выбросы — значения за пределами $Q_1
      - 1{,}5 \cdot IQR$ и $Q_3 + 1{,}5 \cdot IQR$
    correct: true
    why: $Q_1$ и $Q_3$ — 25-й и 75-й перцентили. Между ними лежит половина данных, поэтому IQR не зависит
      от крайних значений. Правило 1,5 IQR — то, что рисуют «усы» boxplot.
  - text: IQR — разница между максимумом и минимумом
    correct: false
    why: Это размах (range). Он определяется двумя крайними значениями и совершенно неустойчив к выбросам.
  - text: IQR = 1,5 стандартных отклонения
    correct: false
    why: IQR считается по квартилям, не по стандартному отклонению. Для нормального распределения IQR
      ≈ 1,35σ, но это следствие, а не определение.
  - text: IQR — стандартное отклонение без учёта выбросов
    correct: false
    why: Это разные меры. IQR основан на перцентилях.
  explanation: |-
    Правило 1,5 IQR — эвристика. Для сильно скошенных данных (суммы, доходы) оно помечает выбросами
    слишком многое в правом хвосте; тогда удобнее смотреть на перцентили или на данные в логарифме.
- id: stcs-pctl-008
  topic: stats/descriptive
  type: mcq
  question: 95-й перцентиль времени ответа скоринга — 800 мс. Что это значит?
  difficulty: 1
  tags:
  - percentile
  - quantile
  options:
  - text: 95% запросов обрабатываются не дольше 800 мс, 5% — дольше
    correct: true
    why: Перцентиль уровня 95 — точка, левее которой лежит 95% значений.
  - text: Среднее время ответа 800 мс
    correct: false
    why: Перцентиль ничего не говорит о среднем. Среднее может быть 200 мс при длинном хвосте медленных
      запросов.
  - text: 95% запросов обрабатываются ровно за 800 мс
    correct: false
    why: Перцентиль — граница, а не типичное значение.
  - text: Максимальное время ответа 800 мс
    correct: false
    why: Максимум — это 100-й перцентиль. Выше 800 мс лежат 5% запросов.
  explanation: |-
    Высокие перцентили (p95, p99) используют там, где важны хвосты: задержки сервисов,
    крупные потери, порог винзоризации. Медиана — 50-й перцентиль.
- id: stcs-stability-009
  topic: stats/descriptive
  type: mcq
  question: |-
    Данные — суммы транзакций с очень тяжёлым правым хвостом. Какая оценка центра
    будет стабильнее от выборки к выборке?
  difficulty: 2
  tags:
  - median
  - mean
  - standard_error
  - heavy_tails
  options:
  - text: 'Медиана: редкие огромные значения сильно раскачивают среднее, а медиану почти не двигают'
    correct: true
    why: Одна гигантская транзакция в выборке может сдвинуть среднее сильнее тысячи обычных. У медианы
      стандартная ошибка на таких данных заметно меньше.
  - text: 'Среднее: оно использует все данные'
    correct: false
    why: Для нормальных данных это верно — там среднее эффективнее медианы. Но при тяжёлых хвостах информация
      об «экстремальных» значениях скорее шум.
  - text: Одинаково — обе оценки несмещённые
    correct: false
    why: Несмещённость — про центр выборочного распределения, стабильность — про его ширину. Это разные
      свойства.
  - text: Мода
    correct: false
    why: Для непрерывных сумм мода плохо определена и очень нестабильна.
  explanation: |-
    Но медиана отвечает на другой вопрос. Если важна сумма (выручка), нужна стабилизированная оценка
    **среднего**: винзоризация, CUPED, логарифм с последующим пересчётом.
- id: stcs-robust-010
  topic: stats/descriptive
  type: multi
  question: Какие меры устойчивы к выбросам? Выбери все верные.
  difficulty: 2
  tags:
  - robustness
  - outliers
  options:
  - text: Медиана
    correct: true
    why: Чтобы сдвинуть медиану сколь угодно далеко, нужно испортить половину данных.
  - text: Межквартильный размах (IQR)
    correct: true
    why: Зависит от 25-го и 75-го перцентилей, крайние значения на него не влияют.
  - text: Медианное абсолютное отклонение (MAD)
    correct: true
    why: Медиана модулей отклонений от медианы — робастный аналог стандартного отклонения.
  - text: Среднее
    correct: false
    why: Одно достаточно большое значение сдвигает среднее сколь угодно далеко.
  - text: Стандартное отклонение
    correct: false
    why: 'Ещё чувствительнее среднего: отклонения возводятся в квадрат, и выброс доминирует.'
  - text: Размах (максимум − минимум)
    correct: false
    why: Определяется ровно двумя самыми крайними значениями.
  explanation: |-
    Мера устойчивости — **точка слома · breakdown point**: какую долю данных нужно испортить,
    чтобы оценка ушла сколь угодно далеко. У медианы 50%, у среднего — 0% (хватит одного значения).
- id: stcs-skew-011
  topic: stats/descriptive
  type: mcq
  question: Средний чек 3200 рублей, медианный — 1800. Что можно сказать о распределении?
  difficulty: 2
  tags:
  - skewness
  - lognormal
  options:
  - text: 'Оно скошено вправо: длинный хвост крупных чеков тянет среднее вверх'
    correct: true
    why: Среднее больше медианы — признак правой асимметрии. Типично для чеков, доходов, сумм кредитов.
  - text: Оно скошено влево
    correct: false
    why: При левой скошенности среднее меньше медианы.
  - text: Оно нормальное
    correct: false
    why: У нормального распределения среднее и медиана совпадают.
  - text: 'В данных ошибка: среднее не может так отличаться от медианы'
    correct: false
    why: Для скошенных данных такое расхождение обычно.
  explanation: |-
    Такие данные часто близки к логнормальным: логарифм от них примерно нормален.
    Логарифмирование помогает в моделях и визуализации, но тест на логарифмах сравнивает
    геометрические средние («во сколько раз»), а не обычные.
- id: stcs-6895-012
  topic: stats/descriptive
  type: mcq
  question: |-
    Время обработки заявки примерно нормально: среднее 20 минут, стандартное отклонение 3.
    Какая доля заявок обрабатывается дольше 26 минут?
  difficulty: 2
  tags:
  - normal_distribution
  - empirical_rule
  options:
  - text: Около 2,5%
    correct: true
    why: 26 = 20 + 2 × 3 — два стандартных отклонения выше среднего. В пределах ±2σ лежит около 95%, снаружи
      5%, по 2,5% с каждой стороны. Точнее — 2,3%.
  - text: Около 5%
    correct: false
    why: 5% — это оба хвоста вместе. Спрашивают только про правый.
  - text: Около 16%
    correct: false
    why: Это доля правее +1σ (23 минуты). 26 минут — это +2σ.
  - text: Около 0,15%
    correct: false
    why: Это доля правее +3σ (29 минут).
  explanation: |-
    Правило 68–95–99,7: в пределах ±1σ — 68% значений, ±2σ — 95%, ±3σ — 99,7%.
    Работает только для примерно нормальных данных. Для скошенных (суммы, доходы) хвосты другие.
- id: stcs-zscore-013
  topic: stats/descriptive
  type: mcq
  question: |-
    Для поиска аномальных транзакций аналитик помечает всё, что дальше 3σ от среднего.
    Суммы транзакций сильно скошены вправо. В чём проблема?
  difficulty: 2
  tags:
  - z_score
  - outliers
  - skewness
  options:
  - text: Правило 3σ рассчитано на нормальные данные. На скошенных оно пометит много нормальных крупных
      транзакций справа и ничего слева; к тому же выбросы сами раздувают σ
    correct: true
    why: У скошенного распределения правый хвост тяжелее нормального. Плюс среднее и σ чувствительны к
      тем самым выбросам, которые ищем, — порог «уплывает».
  - text: 'Никакой проблемы: правило 3σ универсально'
    correct: false
    why: Доля 0,3% за пределами ±3σ верна только для нормального распределения.
  - text: Нужно брать 2σ, чтобы ловить больше
    correct: false
    why: Проблема не в пороге, а в неподходящей мере для таких данных.
  - text: Нужно считать σ только по выбросам
    correct: false
    why: Такой процедуры не существует.
  explanation: |-
    Лучше: работать с логарифмом сумм, использовать робастные меры (медиана и MAD, IQR)
    или перцентили. **z-оценка · z-score** $(x - \mu)/\sigma$ показывает расстояние от среднего
    в стандартных отклонениях; её интерпретация через «редкость» опирается на нормальность.
- id: stcs-incomeshift-014
  topic: stats/descriptive
  type: open
  question: |-
    За год средний доход клиентов банка вырос, а медианный упал. Как такое возможно?
    Какие гипотезы проверите?
  difficulty: 2
  tags:
  - mean
  - median
  - composition
  - interview
  answer: |-
    Среднее и медиана реагируют на разные части распределения: медиана — на «середину»,
    среднее — на всё, включая хвост. Поэтому они могут двигаться в разные стороны.

    **Гипотезы.**
    1. **Изменился состав клиентов.** Пришло много клиентов с низким доходом (например, новый продукт
       для массового сегмента) — медиана упала. Одновременно пришли или остались несколько очень
       состоятельных — среднее выросло.
    2. **Рост неравенства внутри тех же клиентов.** Верхние доходы выросли, у большинства снизились.
    3. **Выбросы или ошибки данных.** Несколько записей с огромным доходом (ошибка ввода, лишний ноль)
       тянут среднее вверх.
    4. **Изменилась методика.** Доход стал браться из другого источника (подтверждённый вместо заявленного).

    **Что проверить.** Распределение целиком (перцентили p10, p25, p50, p75, p90, p99 за оба года),
    разбивку по сегментам и каналам привлечения, изменение доли каждого сегмента,
    топ записей по доходу на предмет ошибок.
  rubric:
  - Объяснил, что среднее чувствительно к хвосту, а медиана — к середине
  - Назвал изменение состава клиентов как гипотезу
  - Назвал рост неравенства или выбросы / ошибки данных
  - Предложил смотреть перцентили и разбивку по сегментам
  explanation: |-
    Общий навык для собеса: когда одна агрегированная метрика ведёт себя странно, первым делом
    смотреть распределение целиком и **состав** (какие сегменты и с какими весами). Это та же механика,
    что у парадокса Симпсона.
- id: stcs-winsor-015
  topic: stats/descriptive
  type: open
  question: |-
    В A/B-тесте выручки несколько пользователей сделали огромные покупки. Удалить их или винзоризовать?
    Как сделать это корректно?
  difficulty: 3
  tags:
  - winsorization
  - outliers
  - ab_testing
  - interview
  answer: |-
    **Удалять — плохо.** Крупные покупки — реальная выручка. Удалив их, мы меняем вопрос
    и рискуем выбросить сам эффект (например, если фича помогает именно крупным покупателям).
    Кроме того, если удалять «по ситуации», появляется возможность подогнать результат.

    **Винзоризация лучше.** Значения выше порога не удаляют, а **заменяют порогом**:
    всё, что выше 99-го перцентиля, становится равным 99-му перцентилю. Пользователь остаётся
    в выборке, его покупка засчитана как большая, но не может в одиночку определить результат.

    **Что это даёт.** Дисперсия метрики сильно падает, SE уменьшается, мощность растёт.
    Платим небольшим смещением: оцениваем эффект на слегка «подрезанной» метрике.

    **Как корректно.**
    - Порог выбирают **заранее**, до просмотра результатов.
    - Считают его по **объединённым** данным обеих групп (или по периоду до теста) и применяют
      **одинаково** к обеим группам. Иначе порог сам станет источником различий.
    - Проверяют, не меняется ли вывод при другом разумном пороге (99% против 99,9%).
  rubric:
  - Объяснил, почему удаление выбросов опасно
  - Дал определение винзоризации как замены значений порогом
  - 'Назвал эффект: снижение дисперсии и рост мощности ценой небольшого смещения'
  - Сказал про выбор порога заранее и одинаковое применение к обеим группам
  explanation: |-
    Альтернативы и дополнения: CUPED (уменьшает дисперсию за счёт данных до эксперимента),
    логарифмирование (меняет вопрос на «во сколько раз»), бутстрап для проверки устойчивости вывода.
