- id: stci-popsample-001
  topic: stats/inference
  type: card
  question: Чем генеральная совокупность отличается от выборки, а параметр — от статистики?
  difficulty: 1
  tags:
  - population
  - sample
  - parameter
  - statistic
  answer: |-
    **Генеральная совокупность** — всё, о чём хотим сделать вывод, включая будущее:
    все будущие заявки, все будущие посетители. Удобнее думать о ней как о процессе,
    который порождает данные.

    **Выборка** — то, что реально наблюдали: 2000 выданных кредитов, 900 чеков за день.

    **Параметр** — истинная характеристика генеральной совокупности: $\mu$, $\sigma$, $p$.
    Это фиксированное, но неизвестное число.

    **Статистика** — любое число, посчитанное по выборке: $\bar x$, $s$, $\hat p$.
    Она случайна: другая выборка дала бы другое значение. Статистику, которой угадывают
    параметр, называют **оценкой**.
  explanation: |-
    Вся статистика нужна потому, что вопрос касается генеральной совокупности, а видим мы
    только выборку. Если бы данные были все, достаточно было бы просто посчитать.
- id: stci-sampdist-002
  topic: stats/inference
  type: mcq
  question: Что такое выборочное распределение среднего?
  difficulty: 1
  tags:
  - sampling_distribution
  options:
  - text: Распределение, которое получилось бы у выборочных средних, если много раз брать новые выборки
      того же размера
    correct: true
    why: Другая выборка даёт другое среднее, значит, среднее — случайная величина. Выборочное распределение
      описывает, как разбросаны эти средние вокруг истины.
  - text: Гистограмма значений в нашей выборке
    correct: false
    why: Это распределение **данных** — отдельных чеков или кредитов. Выборочное распределение — про средние
      по многим выборкам.
  - text: Распределение генеральной совокупности
    correct: false
    why: Это распределение отдельных наблюдений. Выборочное распределение описывает статистику, посчитанную
      по выборке.
  - text: Нормальное распределение, которому подчиняются данные при большом n
    correct: false
    why: Данные при росте $n$ не становятся нормальными. Нормальным (по ЦПТ) становится распределение
      **средних**.
  explanation: |-
    Это центральная идея статистики: оценка — случайная величина со своим распределением.
    Его центр — истинный параметр (если оценка несмещённая), ширина — стандартная ошибка SE,
    форма — по ЦПТ примерно нормальная. Всё это известно, хотя выборка у нас одна.
- id: stci-sigmase-003
  topic: stats/inference
  type: mcq
  question: |-
    Стандартное отклонение чека $\sigma = 1500$ рублей, в выборке 900 чеков.
    Насколько в среднем выборочное среднее промахивается мимо истинного среднего?
  difficulty: 1
  tags:
  - standard_error
  - std
  options:
  - text: 'Примерно на 50 рублей: $SE = \sigma / \sqrt n = 1500 / 30$'
    correct: true
    why: Разброс **средних** по выборкам — это стандартная ошибка, она в $\sqrt n$ раз меньше разброса
      отдельных чеков.
  - text: Примерно на 1500 рублей
    correct: false
    why: '1500 — это разброс отдельных чеков вокруг среднего. Среднее по 900 чекам разбросано гораздо
      меньше: случайные отклонения частично гасят друг друга.'
  - text: 'Примерно на 1,7 рубля: $1500 / 900$'
    correct: false
    why: Делить нужно на $\sqrt n = 30$, а не на $n$.
  - text: 'Ноль: среднее несмещённое'
    correct: false
    why: Несмещённость значит, что промах в среднем по всем выборкам равен нулю. В конкретной выборке
      промах есть, его типичный размер и есть SE.
  explanation: |-
    Откуда $\sqrt n$: дисперсии независимых наблюдений складываются, поэтому дисперсия суммы $n$ чеков
    равна $n\sigma^2$. Среднее — это сумма, делённая на $n$, поэтому его дисперсия $n\sigma^2 / n^2 = \sigma^2 / n$,
    а стандартное отклонение $\sigma / \sqrt n$.

    **σ** описывает, насколько разные клиенты. **SE** — насколько точна наша оценка.
- id: stci-sqrtn-004
  topic: stats/inference
  type: mcq
  question: |-
    Доверительный интервал для конверсии получился шириной ±0,6 п.п.
    Во сколько раз нужно увеличить выборку, чтобы интервал стал ±0,2 п.п.?
  difficulty: 2
  tags:
  - standard_error
  - sample_size
  - interview
  options:
  - text: В 9 раз
    correct: true
    why: Ширина интервала пропорциональна $SE = \sigma / \sqrt n$. Чтобы сузить интервал в 3 раза, $\sqrt
      n$ должен вырасти в 3 раза, то есть $n$ — в $3^2 = 9$ раз.
  - text: В 3 раза
    correct: false
    why: Ширина зависит от $\sqrt n$, а не от $n$. Утроение выборки сузит интервал только в $\sqrt 3 \approx
      1{,}7$ раза.
  - text: В 1,7 раза
    correct: false
    why: Это $\sqrt 3$ — связь перевёрнута. Нужно возвести во вторую степень, а не извлекать корень.
  - text: В 27 раз
    correct: false
    why: Это $3^3$. Зависимость квадратичная, а не кубическая.
  explanation: |-
    Главное практическое следствие $\sqrt n$: чтобы стать вдвое точнее, нужно вчетверо больше данных.
    Поэтому в A/B-тестах маленькие эффекты требуют огромных выборок, и выгоднее уменьшать
    разброс $\sigma$ (CUPED, винзоризация), чем бесконечно наращивать трафик.
- id: stci-clt-005
  topic: stats/inference
  type: mcq
  question: Что утверждает центральная предельная теорема?
  difficulty: 1
  tags:
  - clt
  - interview
  options:
  - text: При большом $n$ распределение выборочного среднего приближённо нормально, какой бы ни была форма
      распределения данных
    correct: true
    why: Чеки скошены вправо, дефолт вообще 0 или 1, но средние по сотням и тысячам наблюдений ложатся
      колоколом. Центр — $\mu$, ширина — $\sigma / \sqrt n$.
  - text: При большом $n$ сами данные становятся нормальными
    correct: false
    why: 'Самая частая ошибка. Распределение данных от размера выборки не зависит: чеки остаются скошенными
      при любом $n$.'
  - text: Выборочное среднее с ростом $n$ приближается к истинному среднему
    correct: false
    why: 'Это закон больших чисел. ЦПТ говорит больше: не только куда сходится среднее, но и какую **форму**
      имеет его разброс.'
  - text: Любое распределение можно привести к нормальному стандартизацией
    correct: false
    why: Стандартизация меняет центр и масштаб, но не форму. Скошенное распределение после стандартизации
      остаётся скошенным.
  explanation: |-
    Почему ЦПТ важна: благодаря ей z-тест и t-тест применимы к конверсиям, чекам,
    долям дефолтов — к данным, которые сами по себе совсем не нормальны. Тест смотрит
    на распределение среднего, а не данных.
- id: stci-cltfail-006
  topic: stats/inference
  type: multi
  question: |-
    В каких ситуациях нормальному приближению для выборочного среднего **нельзя** слепо доверять?
    Выбери все верные.
  difficulty: 2
  tags:
  - clt
  - normal_approximation
  - assumptions
  options:
  - text: Выборка маленькая, а данные сильно скошены
    correct: true
    why: Чем сильнее скошенность, тем больше нужно $n$, чтобы ЦПТ сработала. На 30 чеках с длинным хвостом
      среднее ещё заметно скошено.
  - text: 'Очень тяжёлые хвосты: редкие огромные значения'
    correct: true
    why: Один чек на миллион может сдвинуть среднее сильнее, чем тысячи обычных. Сходимость к нормальному
      очень медленная.
  - text: 'Наблюдения зависимы: несколько сессий одного пользователя'
    correct: true
    why: ЦПТ в стандартной форме требует независимости. При зависимости стандартная формула $\sigma/\sqrt
      n$ занижает разброс.
  - text: 'Доля с очень редким событием: $p = 0{,}001$ при $n = 2000$'
    correct: true
    why: 'Ожидаемое число событий $np = 2$. Правило для долей: нужно $np \ge 10$ и $n(1-p) \ge 10$. Здесь
      распределение числа событий сильно скошено.'
  - text: Данные не нормальны, но $n$ = 50 000 и хвосты умеренные
    correct: false
    why: Это как раз типичный A/B-тест, где ЦПТ работает отлично. Ненормальность данных сама по себе не
      проблема.
  explanation: |-
    Что делать в проблемных случаях: винзоризация или логарифм для тяжёлых хвостов,
    анализ на уровне пользователя при зависимости, точные тесты (Фишера) для редких событий,
    бутстрап как универсальная проверка.
- id: stci-sep-007
  topic: stats/inference
  type: mcq
  question: Конверсия в выборке из 10 000 посетителей — 5%. Каков примерно 95% доверительный интервал?
  difficulty: 2
  tags:
  - standard_error
  - proportion
  - confidence_interval
  options:
  - text: От 4,57% до 5,43%
    correct: true
    why: $SE = \sqrt{p(1-p)/n} = \sqrt{0{,}05 \times 0{,}95 / 10\,000} \approx 0{,}0022$. Интервал $0{,}05
      \pm 1{,}96 \times 0{,}0022 = 0{,}05 \pm 0{,}0043$.
  - text: От 4,0% до 6,0%
    correct: false
    why: 'Слишком широкий: так получилось бы при SE около 0,5 п.п., то есть при выборке примерно в 5 раз
      меньше.'
  - text: От 4,98% до 5,02%
    correct: false
    why: Похоже, в формуле SE забыт корень. Нужно $\sqrt{p(1-p)/n}$.
  - text: 'Интервал для доли построить нельзя: данные 0/1 не нормальны'
    correct: false
    why: Нормальность нужна не данным, а выборочной доле. По ЦПТ при $np = 500$ она очень хорошо приближается
      нормальным.
  explanation: |-
    Почему $p(1-p)$: доля — это среднее нулей и единиц, а дисперсия величины Бернулли равна $p(1-p)$.
    Отдельного параметра разброса у доли нет, разброс определяется самой долей.
- id: stci-meanci-008
  topic: stats/inference
  type: open
  question: |-
    По 900 чекам средний чек 2060 рублей, стандартное отклонение 1500.
    Постройте 95% доверительный интервал и объясните, откуда берётся формула.
  difficulty: 2
  tags:
  - confidence_interval
  - derivation
  - interview
  answer: |-
    **Расчёт.**
    - $SE = s / \sqrt n = 1500 / \sqrt{900} = 1500 / 30 = 50$.
    - Интервал: $\bar x \pm 1{,}96 \times SE = 2060 \pm 98$, то есть **от 1962 до 2158** рублей.

    **Откуда формула.**
    1. По ЦПТ выборочное среднее $\bar X$ распределено примерно нормально с центром в истинном $\mu$
       и стандартным отклонением $SE$.
    2. У нормального распределения 95% значений лежат в пределах $\pm 1{,}96$ стандартных отклонений от центра.
       Значит, в 95% выборок $|\bar X - \mu| < 1{,}96 \cdot SE$.
    3. «Среднее отличается от истины меньше чем на 1,96 SE» — то же самое, что «истина отличается от среднего
       меньше чем на 1,96 SE». Переписываем относительно $\mu$: $\bar X - 1{,}96 SE < \mu < \bar X + 1{,}96 SE$.

    **Интерпретация.** Если повторять эксперимент много раз и каждый раз строить интервал так же,
    95% интервалов накроют истинный средний чек.
  rubric:
  - Посчитал SE = 50 через деление на корень из n
  - Получил интервал примерно 1962–2158
  - Объяснил, что 1,96 — граница, внутри которой 95% нормального распределения
  - Показал переход от «среднее близко к истине» к «истина близко к среднему»
  - Дал корректную интерпретацию через повторение процедуры
  explanation: |-
    Строго, раз $\sigma$ оценена по выборке, нужен квантиль t-распределения с 899 степенями свободы.
    Он равен 1,963 — на таких выборках разницы с 1,96 нет.
- id: stci-cimean-009
  topic: stats/inference
  type: mcq
  question: 95% доверительный интервал для PD сегмента — [3,1%; 4,3%]. Какое утверждение корректно?
  difficulty: 2
  tags:
  - confidence_interval
  - interpretation
  - interview
  options:
  - text: Если много раз повторить выборку и построить интервал той же процедурой, около 95% интервалов
      накроют истинный PD
    correct: true
    why: Истинный PD — константа, случаен интервал. 95% — свойство процедуры построения, а не конкретного
      интервала.
  - text: Истинный PD лежит в [3,1%; 4,3%] с вероятностью 95%
    correct: false
    why: 'В частотном подходе про конкретный интервал так сказать нельзя: истина либо в нём, либо нет.
      Такая формулировка верна для байесовского достоверного интервала.'
  - text: 95% клиентов сегмента имеют PD от 3,1% до 4,3%
    correct: false
    why: Интервал про **параметр** — средний PD сегмента, а не про разброс PD отдельных клиентов.
  - text: В 95% будущих выборок доля дефолтов попадёт в [3,1%; 4,3%]
    correct: false
    why: Будущие выборки дадут свои интервалы. Утверждение про конкретный интервал и будущие выборки —
      это уже предсказательный интервал, другая конструкция.
  explanation: |-
    На собесе этот вопрос задают почти всегда. Практически полезная формулировка:
    «интервал показывает, какие значения параметра согласуются с данными; при уровне 95%
    процедура промахивается в 5% случаев».
- id: stci-196-010
  topic: stats/inference
  type: mcq
  question: Откуда в формуле 95% интервала берётся число 1,96?
  difficulty: 1
  tags:
  - normal_distribution
  - quantile
  options:
  - text: 'Это квантиль стандартного нормального распределения: между −1,96 и +1,96 лежит 95% площади,
      по 2,5% в каждом хвосте'
    correct: true
    why: Число следует из формы нормального распределения. Для 90% интервала граница 1,645, для 99% —
      2,576.
  - text: Это эмпирическая константа, подобранная на практике
    correct: false
    why: 'Нет, это точное свойство нормального распределения: $\Phi(1{,}96) = 0{,}975$.'
  - text: Это $2 \times 0{,}98$, где 0,98 — уровень доверия
    correct: false
    why: Совпадение цифр. Связь с уровнем доверия идёт через квантиль, а не через умножение.
  - text: Это квантиль t-распределения, который используют всегда
    correct: false
    why: Квантиль t зависит от степеней свободы и при малых $n$ больше 1,96. К 1,96 он стремится при больших
      $n$.
  explanation: |-
    $\Phi$ — CDF стандартного нормального: доля колокола левее точки. $\Phi(1{,}96) = 0{,}975$ означает,
    что правее 1,96 остаётся 2,5%. Двусторонний интервал теряет по 2,5% с каждой стороны, итого 5%.
- id: stci-level-011
  topic: stats/inference
  type: mcq
  question: Как изменится интервал, если перейти от 95% к 99% уровню доверия при тех же данных?
  difficulty: 1
  tags:
  - confidence_level
  - width
  options:
  - text: 'Станет шире: множитель вырастет с 1,96 до 2,576'
    correct: true
    why: Чтобы реже промахиваться мимо истины, приходится брать интервал шире. Ширина вырастет примерно
      на треть.
  - text: 'Станет уже: мы увереннее'
    correct: false
    why: Больше уверенности достигается ценой ширины. Узкий интервал, накрывающий истину в 99% случаев,
      возможен только при большей выборке.
  - text: Не изменится
    correct: false
    why: Ширина зависит от уровня доверия через квантиль.
  - text: Станет шире ровно на 4%
    correct: false
    why: 'Рост нелинейный: $2{,}576 / 1{,}96 \approx 1{,}31$, то есть на 31%.'
  explanation: |-
    Связь с проверкой гипотез: уровень доверия $= 1 - \alpha$. Ноль вне 99% интервала разницы
    ⇔ тест значим при α = 0,01. Поэтому один и тот же эффект может быть значимым на 5% и не значимым на 1%.
- id: stci-tdist-012
  topic: stats/inference
  type: mcq
  question: Средний срок одобрения заявки считают по 20 заявкам. Какой множитель взять для 95% интервала
    и почему?
  difficulty: 2
  tags:
  - t_distribution
  - degrees_of_freedom
  options:
  - text: Около 2,09 — квантиль t-распределения с 19 степенями свободы
    correct: true
    why: $\sigma$ неизвестна и оценена по тем же 20 наблюдениям. Эта оценка сама случайна, из-за неё хвосты
      толще, чем у нормального. Степеней свободы $n - 1 = 19$.
  - text: 1,96 — интервал всегда строится по нормальному
    correct: false
    why: При малых $n$ интервал с 1,96 будет слишком узким и накроет истину реже, чем в 95% случаев.
  - text: 2,576 — для малых выборок берут 99%
    correct: false
    why: Уровень доверия выбирают по задаче, а не по размеру выборки. Малая выборка меняет распределение,
      а не уровень.
  - text: Интервал по 20 наблюдениям построить нельзя
    correct: false
    why: Можно, если данные не слишком скошены. Для этого и нужно t-распределение.
  explanation: |-
    Степени свободы — число независимых кусков информации. Одна степень уходит на оценку среднего,
    поэтому $n - 1$. Чем больше df, тем точнее $s$ и тем ближе t к нормальному: при df = 30 квантиль 2,04,
    при df = 1000 — 1,96.
- id: stci-bootstrap-013
  topic: stats/inference
  type: open
  question: Что такое бутстрап, когда он нужен и как построить с его помощью доверительный интервал?
  difficulty: 2
  tags:
  - bootstrap
  - confidence_interval
  - interview
  answer: |-
    **Когда нужен.** Для среднего и доли SE считается формулой. Для медианы, Gini модели,
    отношения двух сумм, перцентиля формулы либо нет, либо она сложная. Бутстрап получает
    выборочное распределение **симуляцией**.

    **Идея.** Выборочное распределение — это «что было бы при повторных выборках из генеральной
    совокупности». Генеральной совокупности нет, но наша выборка — её лучшее приближение.
    Поэтому новые выборки берём из неё.

    **Шаги.**
    1. Из нашей выборки размера $n$ берём $n$ элементов **с возвращением** — получаем псевдовыборку.
    2. Считаем на ней нужную статистику (медиану, Gini).
    3. Повторяем 1000–10 000 раз — получаем распределение статистики.
    4. 2,5-й и 97,5-й перцентили этого распределения — 95% интервал.

    **Почему с возвращением.** Без возвращения каждая псевдовыборка была бы той же выборкой
    в другом порядке, и статистика не менялась бы. С возвращением одни наблюдения попадают
    по нескольку раз, другие не попадают — так имитируется случайность новой выборки.
  rubric:
  - 'Назвал случаи, где нет формулы для SE: медиана, Gini, отношения'
  - 'Объяснил идею: выборка заменяет генеральную совокупность'
  - Описал шаги с пересемплированием и перцентилями
  - Объяснил, зачем выбор с возвращением
  explanation: |-
    Ограничения: бутстрап не спасает маленькую нерепрезентативную выборку и плохо работает
    для экстремальных статистик (максимум). При зависимых наблюдениях пересемплировать нужно
    целые кластеры — например, пользователей со всеми их сессиями.

    Для сравнения моделей (Gini новой и старой) применяют **парный** бутстрап: пересемплируют
    объекты и на каждой псевдовыборке считают разницу метрик обеих моделей.
- id: stci-diffci-014
  topic: stats/inference
  type: mcq
  question: |-
    Доля выхода в просрочку: контроль 12%, тест с SMS-напоминанием 11%, по 10 000 клиентов в группе.
    SE разницы — 0,45 п.п. Что можно сказать?
  difficulty: 2
  tags:
  - confidence_interval
  - difference
  - ab_testing
  options:
  - text: 95% интервал для разницы — от 0,12 до 1,88 п.п.; ноль не входит, эффект значим при α = 0,05
    correct: true
    why: $1 \pm 1{,}96 \times 0{,}45 = 1 \pm 0{,}88$. Ноль вне интервала ⇔ $p < 0{,}05$. Интервал ещё
      и показывает, что эффект может быть как совсем маленьким (0,12 п.п.), так и почти 2 п.п.
  - text: Эффект ровно 1 п.п. с точностью ±0,45
    correct: false
    why: 0,45 — одна SE. 95% интервал — примерно две SE в каждую сторону.
  - text: 'Нужно сравнить интервалы каждой группы: если они перекрываются, эффекта нет'
    correct: false
    why: Перекрытие интервалов групп не означает незначимость. Проверять нужно интервал для разницы.
  - text: Интервал для разницы долей строить нельзя
    correct: false
    why: 'Можно: SE разницы — корень из суммы квадратов SE групп.'
  explanation: |-
    Откуда SE разницы: группы независимы, поэтому дисперсии складываются:
    $SE_{\text{diff}} = \sqrt{\frac{0{,}12 \cdot 0{,}88}{10\,000} + \frac{0{,}11 \cdot 0{,}89}{10\,000}} \approx 0{,}0045$.

    Интервал полезнее, чем одно p-value: он говорит и о значимости, и о **размере** эффекта.
    Если нижняя граница меньше минимального эффекта, ради которого стоит внедрять,
    решение может быть не таким очевидным, как «значимо».
- id: stci-overlap-015
  topic: stats/inference
  type: open
  question: |-
    Средний чек в группе A — 100, в группе B — 103, SE в каждой группе — 1.
    95% интервалы групп перекрываются. Значит ли это, что разница незначима?
  difficulty: 3
  tags:
  - confidence_interval
  - overlap
  - interview
  answer: |-
    **Нет.** Проверим.

    **Интервалы групп:**
    - A: $100 \pm 1{,}96 = [98{,}04;\ 101{,}96]$;
    - B: $103 \pm 1{,}96 = [101{,}04;\ 104{,}96]$.

    Перекрываются на отрезке от 101,04 до 101,96.

    **Интервал для разницы.** Группы независимы, дисперсии складываются:
    $SE_{\text{diff}} = \sqrt{1^2 + 1^2} = \sqrt 2 \approx 1{,}41$.
    Интервал: $3 \pm 1{,}96 \times 1{,}41 = 3 \pm 2{,}77 = [0{,}23;\ 5{,}77]$. Ноль не входит — **разница значима**.

    **Почему перекрытие обманывает.** Чтобы интервалы групп не перекрывались, разница должна быть
    больше суммы полуширин: $1{,}96 \times (SE_A + SE_B) = 1{,}96 \times 2 = 3{,}92$.
    А для значимости нужно больше $1{,}96 \times \sqrt{SE_A^2 + SE_B^2} = 2{,}77$.
    Стандартные отклонения не складываются — складываются дисперсии, поэтому $\sqrt{1 + 1} < 1 + 1$.
    Проверка по перекрытию слишком строгая.
  rubric:
  - Сказал, что перекрытие интервалов не означает незначимость
  - 'Посчитал SE разницы как корень из суммы квадратов: 1,41'
  - Получил интервал разницы, не включающий ноль
  - 'Объяснил причину: складываются дисперсии, а не стандартные отклонения'
  explanation: |-
    Обратное верно: если интервалы групп **не** перекрываются, разница точно значима.
    Но перекрытие ничего не решает — смотреть нужно на интервал разницы или на тест.
    Частая ошибка в дашбордах, где рисуют интервалы по каждой группе отдельно.
