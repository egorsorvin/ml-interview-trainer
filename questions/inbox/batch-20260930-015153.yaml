- id: stcase-drop-001
  topic: stats/cases
  type: open
  question: Вчера конверсия в покупку упала на 10% относительно обычного уровня. Ваши действия?
  difficulty: 2
  tags:
  - metric_investigation
  - interview
  answer: |-
    Иду от простых причин к сложным.

    **1. Это реально или шум?** Сравнить с обычными колебаниями: какой разброс конверсии день к дню?
    Какой сегодня день недели и был ли такой же спад в похожие дни? 10% может быть в пределах шума
    для маленького трафика.

    **2. Проблемы с данными.** Не сломалось ли логирование (числитель или знаменатель),
    не поменялась ли формула метрики, не пришёл ли бот-трафик, который раздул знаменатель.

    **3. Декомпозиция.** Разбить по платформам, каналам, странам, новым и старым пользователям:
    - если упал один сегмент — ищем причину в нём (релиз приложения на Android, сбой платёжного шлюза);
    - если упало везде понемногу — ищем общую причину.
    - Проверить **состав**: мог вырасти трафик с низкой конверсией (рекламная кампания),
      тогда внутри сегментов всё нормально, а общая метрика упала.

    **4. Воронка.** На каком шаге падение: вход, карточка, корзина, оплата?

    **5. Внешние факторы.** Праздник, конкурент, сбой у партнёра, изменение цен.

    **6. Изменения у нас.** Релизы, запущенные эксперименты, изменения в маркетинге за последние дни.
  rubric:
  - Сначала проверил, выходит ли падение за обычный шум
  - Проверил качество данных и логирования
  - Предложил декомпозицию по сегментам и воронке
  - Упомянул эффект изменения состава трафика
  - Назвал внешние факторы и собственные релизы
  explanation: |-
    Классический продуктовый вопрос. Сильный ответ — структура: шум → данные → сегменты и состав →
    воронка → внешние и внутренние изменения.
- id: stcase-simpson-002
  topic: stats/cases
  type: mcq
  question: |-
    После внедрения новой модели bad rate в сегменте A снизился с 2,0% до 1,8%, в сегменте B — с 10% до 9%.
    Но общий bad rate вырос с 3,6% до 5,4%. Как такое возможно?
  difficulty: 2
  tags:
  - simpsons_paradox
  - composition
  - credit_risk
  options:
  - text: 'Изменился состав: доля рискового сегмента B в выдачах выросла (например, с 20% до 50%). Внутри
      сегментов стало лучше, но общий показатель взвешен по-новому'
    correct: true
    why: 'Было: $0{,}8 \cdot 2\% + 0{,}2 \cdot 10\% = 3{,}6\%$. Стало: $0{,}5 \cdot 1{,}8\% + 0{,}5 \cdot
      9\% = 5{,}4\%$. Это парадокс Симпсона.'
  - text: 'Ошибка в расчётах: если все сегменты улучшились, общий показатель тоже должен улучшиться'
    correct: false
    why: 'Нет: общий показатель — взвешенное среднее по сегментам, и веса тоже меняются.'
  - text: Модель ухудшила качество в обоих сегментах
    correct: false
    why: В обоих сегментах bad rate снизился.
  - text: Это случайный шум
    correct: false
    why: Разница 3,6% → 5,4% объясняется арифметикой смены весов, шум не нужен.
  explanation: |-
    Вывод для анализа: сравнивая общие метрики до и после, всегда проверяйте состав. Новая модель могла
    одобрять больше клиентов из рискового сегмента — это решение о риск-аппетите, а не ухудшение ранжирования.
- id: stcase-did-003
  topic: stats/cases
  type: open
  question: |-
    Новую стратегию взыскания запустили сразу во всём регионе Урал, без A/B-теста.
    Доля погашений в ранней просрочке на Урале выросла с 40% до 46%. Как оценить эффект стратегии?
  difficulty: 3
  tags:
  - difference_in_differences
  - quasi_experiment
  - credit_risk
  - interview
  answer: |-
    **Сравнение «до — после» на Урале не годится:** рост на 6 п.п. смешивает эффект стратегии
    с общими изменениями (сезон, экономика, изменения в продукте).

    **Разность разностей · difference-in-differences.** Нужен контрольный регион без изменений,
    например Сибирь. Допустим, там доля погашений за тот же период выросла с 38% до 41%.
    - Изменение на Урале: +6 п.п.
    - Изменение в Сибири (общий фон): +3 п.п.
    - Оценка эффекта: $6 - 3 = 3$ п.п.

    **Ключевое допущение — параллельные тренды:** без стратегии Урал менялся бы так же, как Сибирь.
    Проверка: построить динамику обоих регионов за несколько периодов **до** запуска. Если линии шли
    параллельно, допущению можно доверять больше.

    **Что ещё проверить.**
    - Не было ли на Урале других изменений в то же время.
    - Не изменился ли состав клиентов, входящих в просрочку.
    - Неопределённость: оценка по одному региону шумная; лучше несколько контрольных регионов
      и SE с учётом кластеризации по регионам.
  rubric:
  - Объяснил, почему сравнение «до — после» некорректно
  - Предложил разность разностей с контрольным регионом и посчитал пример
  - Назвал допущение параллельных трендов
  - Предложил проверить тренды в периоды до запуска
  - Упомянул другие изменения, состав клиентов или неопределённость оценки
  explanation: |-
    Когда A/B невозможен (решение уже принято, регуляторика, операционные ограничения), нужны
    квазиэксперименты. DiD — самый частый из них, и его допущение — главный предмет вопросов.
- id: stcase-confounder-004
  topic: stats/cases
  type: mcq
  question: |-
    Клиенты, которые пользуются мобильным приложением банка, дефолтят в два раза реже.
    Продакт предлагает агрессивно продвигать приложение, чтобы снизить дефолты. Что не так?
  difficulty: 2
  tags:
  - confounding
  - causality
  options:
  - text: 'Скорее всего, это конфаундинг: более молодые, доходные и финансово дисциплинированные клиенты
      и чаще пользуются приложением, и реже дефолтят'
    correct: true
    why: 'Связь есть, но не обязательно причинная. Общие факторы влияют и на использование приложения,
      и на риск. Проверить причинность можно экспериментом: случайно стимулировать установку и смотреть
      на дефолты.'
  - text: 'Всё верно: данные показывают, что приложение снижает дефолты'
    correct: false
    why: Данные показывают связь, а не причину.
  - text: Нужно просто посчитать корреляцию точнее
    correct: false
    why: Точность корреляции не отвечает на вопрос о причинности.
  - text: 'Связь обратная: дефолт мешает пользоваться приложением, поэтому эффект нулевой'
    correct: false
    why: Обратная связь возможна, но утверждать, что эффект нулевой, тоже нельзя без эксперимента.
  explanation: |-
    **Конфаундер** — фактор, влияющий и на «воздействие», и на результат. Частичное решение
    без эксперимента — сравнивать внутри страт по конфаундерам (возраст, доход, скор),
    но неизмеренные факторы всё равно остаются.
- id: stcase-reject-005
  topic: stats/cases
  type: mcq
  question: |-
    Новую скоринговую модель валидируют на исторических данных. Какая особенность кредитных данных
    искажает такую оценку?
  difficulty: 2
  tags:
  - selection_bias
  - reject_inference
  - credit_risk
  options:
  - text: Дефолт известен только для одобренных клиентов. Для отклонённых исход неизвестен, и выборка
      смещена в сторону «хороших» по старой модели
    correct: true
    why: Новая модель будет одобрять часть клиентов, которых старая отклоняла. На них она никогда не проверялась.
      Это проблема отказов (reject inference).
  - text: Дефолтов слишком много
    correct: false
    why: Обычно их, наоборот, мало, но смещение возникает не из-за числа.
  - text: Скоринговые модели нельзя валидировать на исторических данных
    correct: false
    why: Можно и нужно, но с учётом ограничений выборки одобренных.
  - text: Исторические данные всегда случайны
    correct: false
    why: 'Нет: кто попал в выборку одобренных, определила старая модель.'
  explanation: |-
    Как с этим работают: отдельный анализ «swap-set» — клиентов, которых модели решают по-разному;
    небольшая доля случайных одобрений для сбора данных; методы reject inference.
    Итоговая проверка — champion/challenger эксперимент.
- id: stcase-champion-006
  topic: stats/cases
  type: open
  question: Как проверить, что новая скоринговая модель лучше текущей, перед полным внедрением?
  difficulty: 3
  tags:
  - champion_challenger
  - model_evaluation
  - credit_risk
  - interview
  answer: |-
    **1. Офлайн-валидация.**
    - Out-of-time выборка: модель обучена на одном периоде, проверяется на более позднем.
    - Метрики ранжирования: Gini, KS; сравнение моделей парным бутстрапом или тестом ДеЛонга на одних клиентах.
    - Калибровка: совпадают ли предсказанные PD с наблюдаемыми по группам.
    - Стабильность: PSI скоров и ключевых признаков.
    - Смещение выборки: оценки только на одобренных, анализ swap-set.

    **2. Champion/challenger эксперимент.** Поток заявок случайно делится: часть решает текущая модель
    (champion), часть — новая (challenger). Единица — клиент.
    - Важно выставить cutoff так, чтобы **уровень одобрения был одинаковым** в обеих ветках.
      Тогда сравнение bad rate показывает качество ранжирования, а не разницу в риск-аппетите.
    - Primary — bad rate одобренных на созревшем горизонте (или ожидаемые потери / прибыль).
    - Горизонт: нужно дождаться созревания когорты (performance window), на коротком сроке
      смотрят ранние индикаторы.
    - Для осторожности challenger получает небольшую долю потока.

    **3. Решение.** По ожидаемой прибыли с учётом потерь; часто — тест на неухудшение по риску
    при выигрыше в одобрении или стоимости.
  rubric:
  - Назвал офлайн-валидацию на OOT и метрики Gini / KS с парным сравнением
  - Упомянул калибровку и стабильность (PSI)
  - Описал champion/challenger с рандомизацией по клиентам
  - Объяснил зачем выравнивать уровень одобрения
  - Упомянул созревание когорты и ранние индикаторы
  explanation: |-
    Для foundation-моделей логика та же: эмбеддинги проверяют через улучшение downstream-моделей
    (например, PD-модели) на OOT, парным сравнением, а затем в champion/challenger.
- id: stcase-equalar-007
  topic: stats/cases
  type: mcq
  question: |-
    В champion/challenger новая модель одобрила 45% заявок с bad rate 4%, старая — 55% с bad rate 5%.
    Можно ли сказать, что новая модель лучше?
  difficulty: 2
  tags:
  - champion_challenger
  - approval_rate
  - credit_risk
  options:
  - text: 'Нет: при меньшем одобрении bad rate почти всегда ниже. Нужно сравнивать при одинаковом уровне
      одобрения (или смотреть кривую bad rate от одобрения)'
    correct: true
    why: Новая модель просто строже. Чтобы сравнить качество ранжирования, нужно выставить cutoff обеих
      моделей на одинаковый уровень одобрения или сравнить их кривые «одобрение — bad rate».
  - text: 'Да: bad rate ниже'
    correct: false
    why: Это следствие более строгого порога, а не лучшего ранжирования.
  - text: 'Нет, старая лучше: одобряет больше'
    correct: false
    why: Больше одобрений ценой большего риска — тоже не показатель качества.
  - text: Да, если разница значима по z-тесту
    correct: false
    why: 'Значимость не решает проблему несравнимости: сравниваются разные точки отсечения.'
  explanation: |-
    Та же идея в сравнении классификаторов: precision и recall зависят от порога, поэтому сравнивают
    при одинаковом recall или по всей кривой (ROC, PR).
- id: stcase-regress-008
  topic: stats/cases
  type: mcq
  question: |-
    Для 20 отделений с худшими продажами за квартал провели тренинг. В следующем квартале их продажи
    выросли на 15%. Можно ли приписать рост тренингу?
  difficulty: 2
  tags:
  - regression_to_mean
  - causality
  options:
  - text: 'Нет: часть роста — регрессия к среднему. Худшие по одному кварталу отделения часто просто оказались
      в неудачном квартале, и без всякого вмешательства вернутся ближе к среднему'
    correct: true
    why: 'Отбор по экстремальному значению гарантирует, что в группу попали «невезучие». Нужна контрольная
      группа: случайно выбрать тренинг для половины из худших отделений.'
  - text: 'Да: продажи выросли после тренинга'
    correct: false
    why: «После» не значит «вследствие». Без контроля неизвестно, что было бы без тренинга.
  - text: Да, если рост значим по t-тесту
    correct: false
    why: Значимость роста не отделяет эффект тренинга от регрессии к среднему.
  - text: Нет, продажи всегда растут во втором квартале
    correct: false
    why: Сезонность возможна, но главная проблема здесь — отбор худших.
  explanation: |-
    Регрессия к среднему — частая ловушка в риске: «клиенты с самой высокой просрочкой после звонков
    стали платить лучше» — часть из них улучшилась бы и так.
- id: stcase-reverse-009
  topic: stats/cases
  type: mcq
  question: |-
    Пользователи, получающие больше push-уведомлений, покупают больше. Какое объяснение нужно исключить
    в первую очередь, прежде чем увеличивать число пушей?
  difficulty: 1
  tags:
  - reverse_causality
  - causality
  options:
  - text: 'Обратную причинность: активные пользователи чаще заходят и совершают действия, из-за которых
      система отправляет им больше пушей'
    correct: true
    why: Если пуши запускаются по активности, то связь «больше пушей — больше покупок» объясняется активностью,
      а не пушами.
  - text: Что пуши плохо написаны
    correct: false
    why: Это вопрос качества, а не причинности.
  - text: Что корреляция слишком маленькая
    correct: false
    why: Размер корреляции не отвечает на вопрос о направлении связи.
  - text: 'Ничего исключать не нужно: связь очевидна'
    correct: false
    why: Связь есть, направление — нет.
  explanation: |-
    Проверка — эксперимент: случайной части пользователей увеличить частоту пушей и сравнить
    с контролем. Заодно смотреть guardrail — отписки от уведомлений.
- id: stcase-embeddings-010
  topic: stats/cases
  type: open
  question: |-
    Команда обучила foundation-модель на транзакциях и получила эмбеддинги клиентов. Как статистически
    корректно проверить, что эмбеддинги улучшают PD-модель?
  difficulty: 3
  tags:
  - foundation_models
  - embeddings
  - model_comparison
  - interview
  answer: |-
    **Дизайн сравнения.**
    - Базовая PD-модель на текущих признаках против той же модели с добавленными эмбеддингами.
      Один алгоритм, одинаковый тюнинг — меняется только набор признаков.
    - Валидация **out-of-time**: обучение на ранних периодах, проверка на более поздних.
      Эмбеддинги при этом должны быть посчитаны только по данным, доступным на дату решения
      (нет утечки из будущего).
    - Цель — дефолт на созревшем горизонте (только когорты с полным performance window).

    **Статистика сравнения.**
    - Прирост Gini на одних и тех же клиентах — **парный** бутстрап (или тест ДеЛонга).
      Интервал для разницы, а не для каждой модели отдельно.
    - Стабильность по нескольким OOT-периодам и сегментам: прирост должен быть устойчивым,
      а не одним удачным месяцем.
    - Калибровка и PSI признаков эмбеддингов во времени.

    **Практическая значимость.** Перевести прирост Gini в деньги: снижение bad rate при том же уровне одобрения
    или рост одобрения при том же риске.

    **Если задач несколько** (PD, отток, фрод), учесть множественные сравнения и не выбирать задачи
    постфактум, где эмбеддинги «сработали».

    **Финальная проверка** — champion/challenger в проде.
  rubric:
  - Предложил сравнение одинаковых моделей с эмбеддингами и без
  - Потребовал out-of-time валидацию и отсутствие утечки в эмбеддингах
  - Предложил парный бутстрап или ДеЛонг для разницы Gini
  - Упомянул стабильность по периодам и сегментам
  - Перевёл прирост в бизнес-метрики или предложил champion/challenger
  explanation: |-
    Для Research Scientist в команде foundation-моделей это ключевой вопрос: качество эмбеддингов
    измеряют через downstream-задачи, и статистическая корректность сравнения — не менее важна,
    чем архитектура.
- id: stcase-proxy-011
  topic: stats/cases
  type: mcq
  question: Цель фичи — рост LTV клиента за год, но тест может длиться только месяц. Какой подход разумен?
  difficulty: 2
  tags:
  - proxy_metric
  - long_term
  options:
  - text: Использовать прокси-метрику, связанную с LTV (активность, удержание в первый месяц), предварительно
      проверив эту связь на исторических данных; оставить долгосрочную holdout-группу
    correct: true
    why: 'Прокси даёт ответ быстро, но может обмануть: фича может поднять краткосрочную активность без
      роста LTV. Долгосрочный holdout позволяет потом проверить эффект на настоящей цели.'
  - text: Ждать год
    correct: false
    why: Иногда оправдано, но обычно слишком долго. Есть промежуточные решения.
  - text: Взять любую метрику, которая изменится за месяц
    correct: false
    why: Метрика, не связанная с целью, может вести в неправильную сторону.
  - text: Экстраполировать месячный эффект на год, умножив на 12
    correct: false
    why: Эффект может затухать (новизна) или накапливаться. Линейная экстраполяция ничем не обоснована.
  explanation: |-
    В риске та же проблема с дефолтом: ранние индикаторы (просрочка на первых платежах) — прокси
    для дефолта через год. Их связь с итоговым дефолтом проверяют по vintage-анализу прошлых когорт.
- id: stcase-srmwin-012
  topic: stats/cases
  type: open
  question: |-
    Тест показал +5% выручки, p = 0,001. Но проверка SRM дала p = 0,0001: в тестовой группе на 2% меньше
    пользователей, чем должно быть. Что делать?
  difficulty: 2
  tags:
  - srm
  - data_quality
  - interview
  answer: |-
    **Результату доверять нельзя**, несмотря на значимость. SRM значит, что группы различаются
    не только воздействием: часть пользователей «потерялась» в одной группе, и, скорее всего,
    не случайно.

    **Почему это может создать ложный эффект.** Если в тестовой группе потерялись пользователи,
    которые ничего не покупают (например, у кого новая версия не загрузилась и они не залогировались),
    выручка на пользователя в тесте искусственно вырастет. +5% может быть целиком артефактом.

    **Что делать.**
    1. Найти причину: где теряются пользователи — назначение группы, загрузка варианта, логирование,
       фильтрация ботов. Посмотреть, в каких сегментах (устройства, браузеры) перекос сильнее.
    2. Исправить и перезапустить тест.
    3. Если причину удалось точно локализовать (например, баг только в одном браузере), можно проанализировать
       результат без этого сегмента в обеих группах — но только как предварительную оценку.
  rubric:
  - Сказал, что при SRM результату нельзя доверять
  - Объяснил механизм, как потеря пользователей может создать ложный эффект
  - Предложил искать причину SRM по этапам и сегментам
  - Предложил исправить и перезапустить
  explanation: |-
    На собесах это проверяет дисциплину: значимый результат заманчив, но проверки качества данных
    идут до интерпретации эффекта.
- id: stcase-twoprimary-013
  topic: stats/cases
  type: mcq
  question: |-
    В тесте две равноправные primary-метрики: конверсия выросла значимо, средний чек значимо упал.
    Как следовало действовать?
  difficulty: 2
  tags:
  - primary_metric
  - oec
  - decision
  options:
  - text: До теста зафиксировать одну итоговую метрику или правило решения (например, выручка на пользователя),
      объединяющую обе
    correct: true
    why: Выручка на пользователя = конверсия × средний чек. Она и отвечает на вопрос, что перевешивает.
      Когда primary несколько и они противоречат друг другу, решение становится произвольным.
  - text: Выбрать ту метрику, которая выросла
    correct: false
    why: Выбор метрики по результату — p-хакинг.
  - text: Считать тест неудачным
    correct: false
    why: Тест дал информацию; вопрос в том, что нужно было определить заранее.
  - text: Сложить p-value двух метрик
    correct: false
    why: Такой процедуры нет.
  explanation: |-
    Итоговую метрику решения иногда называют **OEC · overall evaluation criterion**. В риске аналогично:
    вместо «одобрение выросло, bad rate вырос» решают по ожидаемой прибыли.
- id: stcase-bayesq-014
  topic: stats/cases
  type: mcq
  question: 'Менеджер спрашивает: «Какова вероятность, что вариант B лучше A?» У вас p = 0,03. Что ответить?'
  difficulty: 2
  tags:
  - bayesian
  - p_value
  - communication
  options:
  - text: 'p-value на этот вопрос не отвечает: это вероятность данных при условии, что эффекта нет. Вероятность
      «B лучше A» даёт байесовский анализ с априорным распределением'
    correct: true
    why: 'p-value — $P(\text{данные} \mid H_0)$, а менеджер спрашивает $P(B > A \mid \text{данные})$.
      Их путают постоянно. Байесовский A/B отвечает прямо: например, «с вероятностью 97% B лучше».'
  - text: 97%
    correct: false
    why: $1 - p$ — не вероятность того, что B лучше.
  - text: 3%
    correct: false
    why: p-value — не вероятность того, что эффект случаен.
  - text: На этот вопрос ответить невозможно никаким методом
    correct: false
    why: Байесовский подход отвечает именно на него, ценой выбора prior.
  explanation: |-
    Для коммуникации полезно: «Если бы разницы не было, такой результат встречался бы в 3% случаев.
    Эффект, с учётом неопределённости, — от X до Y». Интервал понятнее, чем p-value.
- id: stcase-explain-015
  topic: stats/cases
  type: open
  question: |-
    Объясните директору по рискам без формул, что означают p-value и доверительный интервал в результатах теста
    новой стратегии, где просрочка снизилась на 1 п.п., p = 0,027, 95% интервал от 0,1 до 1,9 п.п.
  difficulty: 2
  tags:
  - communication
  - p_value
  - confidence_interval
  - interview
  answer: |-
    **Главное сначала.** «Новая стратегия снизила долю просрочки примерно на 1 п.п. С учётом случайности
    реальный эффект, скорее всего, где-то между 0,1 и 1,9 п.п.»

    **p-value.** «Мы проверили, могла ли такая разница получиться случайно, если бы стратегия не работала.
    Это маловероятно — примерно 3 шанса из 100. Поэтому считаем эффект реальным».

    **Интервал.** «Точно эффект мы не знаем. Данные согласуются с эффектом от очень маленького, 0,1 п.п.,
    до почти 2 п.п. Для решения важна нижняя граница: даже в худшем правдоподобном случае эффект
    положительный, но он может быть невелик».

    **Что это значит для решения.** «Если внедрение окупается даже при эффекте 0,1 п.п. — внедряем.
    Если нужен эффект хотя бы 0,5 п.п., данных недостаточно, чтобы это гарантировать: можно продлить тест
    для более точной оценки».
  rubric:
  - Начал с вывода и размера эффекта, а не с терминов
  - Объяснил p-value через «насколько вероятна случайность при отсутствии эффекта» без искажений
  - Объяснил интервал как диапазон правдоподобных значений эффекта
  - Связал нижнюю границу интервала с бизнес-решением
  explanation: |-
    На финальных этапах с руководителями важно переводить статистику в решение. Неверное упрощение
    («97% что работает») хуже, чем честное «скорее всего между 0,1 и 1,9».
