- id: sthyp-logic-001
  topic: stats/hypothesis_testing
  type: card
  question: Какова логика проверки гипотез? Почему «проверяют» именно H₀ — «эффекта нет»?
  difficulty: 1
  tags:
  - null_hypothesis
  - logic
  - interview
  answer: |-
    Логика — **от противного**. Временно допускаем, что эффекта нет (H₀), и смотрим,
    насколько странными выглядят наши данные в таком мире. Если слишком странными —
    отвергаем H₀ в пользу H₁ («эффект есть»).

    H₀ берут потому, что она **конкретна**: «разница равна нулю» задаёт одно определённое
    распределение статистики. Например, для z-теста это $N(0, 1)$. В нём можно посчитать,
    насколько редок наш результат. H₁ — «разница любая, кроме нуля» — одного распределения
    не задаёт, посчитать в ней нечего.

    Итог теста — «отвергаем H₀» или «нет оснований отвергнуть». «Доказали, что эффекта нет»
    сказать нельзя.
  explanation: |-
    H₀ не обязана быть «разница = 0». Бывает «новая модель хуже старой на 0,5 п.п. и больше»
    (тест на неухудшение) — главное, чтобы гипотеза была конкретной и была тем, что хотим опровергнуть.
- id: sthyp-pdef-002
  topic: stats/hypothesis_testing
  type: mcq
  question: Что такое p-value?
  difficulty: 1
  tags:
  - p_value
  - definition
  options:
  - text: Вероятность получить такой же или более экстремальный результат, **если H₀ верна**
    correct: true
    why: Это площадь хвостов распределения статистики в мире без эффекта за наблюдённым значением.
  - text: Вероятность того, что H₀ верна
    correct: false
    why: Самая частая ошибка. p-value считается **при условии** H₀, а не является вероятностью H₀. Вероятность
      гипотезы требует prior и формулы Байеса.
  - text: Вероятность, что эффект случаен
    correct: false
    why: Это та же ошибка в другой формулировке.
  - text: Доля ложных тревог, которую мы допускаем
    correct: false
    why: Это α — порог, выбранный заранее. p-value считается по данным.
  explanation: |-
    p-value — условная вероятность $P(\text{данные так же экстремальны} \mid H_0)$.
    Путать её с $P(H_0 \mid \text{данные})$ — та же ошибка, что путать recall с precision.
- id: sthyp-pinterp-003
  topic: stats/hypothesis_testing
  type: multi
  question: В тесте получили p = 0,03. Какие утверждения верны? Выбери все верные.
  difficulty: 2
  tags:
  - p_value
  - interpretation
  - interview
  options:
  - text: Если бы эффекта не было, такая же или большая разница встретилась бы примерно в 3% экспериментов
    correct: true
    why: Это и есть определение p-value.
  - text: При α = 0,05 H₀ отвергаем
    correct: true
    why: $0{,}03 < 0{,}05$.
  - text: При α = 0,01 H₀ не отвергаем
    correct: true
    why: $0{,}03 > 0{,}01$. Один и тот же результат значим при одном пороге и не значим при другом.
  - text: С вероятностью 97% эффект реален
    correct: false
    why: p-value не даёт вероятность гипотез. Эта интерпретация неверна.
  - text: Эффект большой
    correct: false
    why: p-value ничего не говорит о размере эффекта. На огромных выборках крошечный эффект даёт маленькое
      p-value. Размер показывает интервал для разницы.
  explanation: |-
    Эквивалентная формулировка через интервал: при p = 0,03 ноль лежит вне 95% интервала
    для разницы, но внутри 99%.
- id: sthyp-zstat-004
  topic: stats/hypothesis_testing
  type: mcq
  question: |-
    Конверсия: контроль 5,0%, тест 5,3%. SE разницы — 0,22 п.п.
    Чему равна z-статистика и значима ли разница при α = 0,05?
  difficulty: 1
  tags:
  - z_test
  - test_statistic
  - ab_testing
  options:
  - text: $z \approx 1{,}36$, не значима
    correct: true
    why: $z = \frac{0{,}3}{0{,}22} \approx 1{,}36$. Порог двустороннего теста при α = 0,05 — 1,96. $1{,}36
      < 1{,}96$, H₀ не отвергаем.
  - text: $z = 0{,}3$, не значима
    correct: false
    why: '0,3 п.п. — это сырая разница. z — разница в единицах SE: её нужно поделить на SE.'
  - text: $z \approx 1{,}36$, значима, потому что больше 1
    correct: false
    why: Порог для α = 0,05 — 1,96, а не 1. Разница в 1,36 SE вполне может быть шумом.
  - text: $z \approx 0{,}07$
    correct: false
    why: Это SE, поделённая на разницу, — дробь перевёрнута.
  explanation: |-
    Смысл z — «на сколько стандартных ошибок наша разница отстоит от нуля». Переведя разницу
    в единицы SE, все задачи сводятся к одному колоколу $N(0, 1)$, для которого известно:
    за пределами ±1,96 — 5% площади.
- id: sthyp-pcalc-005
  topic: stats/hypothesis_testing
  type: mcq
  question: |-
    z-статистика двустороннего теста равна 2,22. $\Phi(2{,}22) = 0{,}987$, где $\Phi$ — CDF стандартного
    нормального. Чему равно p-value?
  difficulty: 2
  tags:
  - p_value
  - normal_cdf
  options:
  - text: Около 0,027
    correct: true
    why: 'Правый хвост: $1 - 0{,}987 = 0{,}013$. Тест двусторонний — левый хвост такой же по симметрии:
      $2 \times 0{,}013 = 0{,}026 \approx 0{,}027$.'
  - text: 0,013
    correct: false
    why: Это один хвост — p-value одностороннего теста. В двустороннем отклонение в любую сторону считается
      «таким же экстремальным».
  - text: 0,987
    correct: false
    why: Это доля колокола **левее** 2,22. p-value — площадь хвостов, дальше от нуля.
  - text: 0,974
    correct: false
    why: Это доля колокола между −2,22 и +2,22 — ровно противоположное p-value.
  explanation: |-
    Формула: $p = 2 \cdot (1 - \Phi(|z|))$. Модуль — потому что важно расстояние от нуля, а не знак.
    Опорные точки: $|z| = 1{,}645 \to p = 0{,}10$; $1{,}96 \to 0{,}05$; $2{,}576 \to 0{,}01$.
- id: sthyp-alpha-006
  topic: stats/hypothesis_testing
  type: mcq
  question: Что означает уровень значимости α = 0,05?
  difficulty: 1
  tags:
  - alpha
  - type_i_error
  options:
  - text: Если эффекта на самом деле нет, тест ошибочно найдёт его в 5% случаев. Порог выбирают до эксперимента
    correct: true
    why: 'α — вероятность ошибки I рода (ложной тревоги). Мы сами её задаём, выбирая порог: $|z| > 1{,}96$
      в мире без эффекта случается в 5% выборок.'
  - text: Вероятность, что эффект есть, но мы его пропустим
    correct: false
    why: Это β — ошибка II рода.
  - text: 5% найденных эффектов — ложные
    correct: false
    why: Это доля ложных среди найденных (FDR), и она зависит от того, сколько проверяемых гипотез реально
      верны. α — доля ложных тревог среди проверок, где эффекта нет.
  - text: p-value, посчитанное по данным
    correct: false
    why: p-value считается по данным; α — заранее выбранный порог, с которым p-value сравнивают.
  explanation: |-
    Почему выбирать заранее: если подбирать порог после того, как увидел p-value, гарантия
    «5% ложных тревог» исчезает. Это одна из форм p-хакинга.
- id: sthyp-notreject-007
  topic: stats/hypothesis_testing
  type: mcq
  question: Тест новой корзины дал p = 0,17. Какой вывод корректен?
  difficulty: 2
  tags:
  - non_significant
  - power
  - confidence_interval
  - interview
  options:
  - text: 'Нет оснований отвергнуть H₀. Есть ли эффект, зависит от интервала и мощности: если интервал
      широкий, данных просто не хватило'
    correct: true
    why: p > α значит только, что данные совместимы с отсутствием эффекта. Но они могут быть совместимы
      и с важным эффектом. Интервал [−0,13; 0,73] п.п. включает и ноль, и эффекты больше MDE — вывод «не
      знаем».
  - text: Доказано, что корзина не влияет на конверсию
    correct: false
    why: Отсутствие значимости — не доказательство отсутствия эффекта. Утверждать «эффекта нет» можно
      только тестом на эквивалентность.
  - text: С вероятностью 83% эффекта нет
    correct: false
    why: p-value не даёт вероятности гипотез, и $1 - p$ тоже.
  - text: Нужно добавить ещё метрик, пока какая-нибудь не станет значимой
    correct: false
    why: 'Это p-хакинг: с каждой новой метрикой растёт шанс случайной «значимости».'
  explanation: |-
    Два случая с одним и тем же p > 0,05:
    - интервал узкий и весь внутри «неважной зоны» (меньше MDE) → практически значимого эффекта нет;
    - интервал широкий и включает важные эффекты → тест недомощный, вывода нет.
- id: sthyp-alphabeta-008
  topic: stats/hypothesis_testing
  type: mcq
  question: Команда хочет снизить α с 0,05 до 0,01, не меняя размер выборки. Что произойдёт?
  difficulty: 2
  tags:
  - alpha
  - beta
  - tradeoff
  options:
  - text: Ложных тревог станет меньше, но вырастет β — тест чаще будет пропускать реальные эффекты
    correct: true
    why: Порог сдвинется с 1,96 на 2,58. Хвост мира без эффекта за порогом уменьшится (α), но слева от
      порога останется больше колокола мира с эффектом (β). При эффекте в 2,8 SE мощность упадёт с 80%
      до 59%.
  - text: Уменьшатся и α, и β
    correct: false
    why: 'Двигая порог, α и β можно только обменивать. Уменьшить обе сразу можно, только раздвинув колоколы:
      больше выборка или меньше дисперсия.'
  - text: Ничего не изменится, кроме порога
    correct: false
    why: Порог определяет обе ошибки сразу.
  - text: Вырастет мощность, потому что тест станет строже
    correct: false
    why: 'Наоборот: строже тест — реже отвергаем H₀, в том числе когда эффект есть.'
  explanation: |-
    Один порог режет два колокола: мира без эффекта (центр 0) и мира с эффектом (центр $\Delta / SE$).
    α — хвост первого правее порога, β — часть второго левее порога.
- id: sthyp-power-009
  topic: stats/hypothesis_testing
  type: mcq
  question: Что такое мощность теста?
  difficulty: 1
  tags:
  - power
  - definition
  options:
  - text: Вероятность отвергнуть H₀, если эффект заданного размера действительно есть; равна $1 - \beta$
    correct: true
    why: Мощность — доля реальных эффектов, которые тест находит. Аналог recall в классификации.
  - text: Вероятность правильно не отвергнуть H₀, когда эффекта нет
    correct: false
    why: Это $1 - \alpha$.
  - text: Вероятность, что найденный эффект реален
    correct: false
    why: Это ближе к precision и зависит от доли реально работающих гипотез.
  - text: Характеристика теста, не зависящая от размера эффекта
    correct: false
    why: 'Мощность всегда считается для конкретного эффекта: маленький эффект найти труднее, мощность
      ниже.'
  explanation: |-
    Стандарт — 80%. Формула: $\text{Power} \approx \Phi\left(\frac{\Delta}{SE} - 1{,}96\right)$.
    При $\Delta / SE = 2{,}8$ мощность 80%, при 1,36 — всего 27%.
- id: sthyp-powerup-010
  topic: stats/hypothesis_testing
  type: multi
  question: Что увеличивает мощность теста? Выбери все верные.
  difficulty: 2
  tags:
  - power
  - variance_reduction
  - sample_size
  options:
  - text: Больше выборка
    correct: true
    why: SE падает как $1 / \sqrt n$, отношение $\Delta / SE$ растёт.
  - text: 'Меньше дисперсия метрики: CUPED, винзоризация'
    correct: true
    why: SE пропорциональна $\sigma$. CUPED с корреляцией 0,6 снижает дисперсию на 36%.
  - text: Больше истинный эффект
    correct: true
    why: Больший эффект сдвигает колокол мира H₁ дальше от порога. Но на него обычно нельзя повлиять.
  - text: Больше α
    correct: true
    why: Порог ниже, чаще отвергаем H₀ — в том числе при реальном эффекте. Цена — больше ложных тревог.
  - text: Меньше α
    correct: false
    why: Строже порог — ниже мощность.
  - text: Больше метрик в тесте
    correct: false
    why: Мощность по каждой метрике от этого не растёт, а при поправке на множественные сравнения падает.
  explanation: |-
    Всё сводится к одной дроби $\Delta / SE$ и порогу. Рычаги: $\Delta$ (не в нашей власти),
    $\sigma$ (методы снижения дисперсии), $n$ (время и трафик), α (обмен на ложные тревоги).
- id: sthyp-onesided-011
  topic: stats/hypothesis_testing
  type: mcq
  question: Когда уместен односторонний тест?
  difficulty: 2
  tags:
  - one_sided
  - two_sided
  options:
  - text: Когда до эксперимента решено, что интересно только одно направление, и эффект в другую сторону
      не изменит решения
    correct: true
    why: 'Например, тест на неухудшение: важно только «не хуже ли». Порог для α = 0,05 — 1,645, мощность
      выше.'
  - text: Когда двусторонний тест дал p = 0,08 — односторонний даст 0,04
    correct: false
    why: Выбор стороны после того, как увидел данные, — p-хакинг. Реальная доля ложных тревог становится
      больше заявленной.
  - text: Всегда, когда ожидаем улучшение
    correct: false
    why: Фича может и навредить. Если ухудшение важно заметить (а обычно важно), нужен двусторонний тест.
  - text: Никогда, это некорректный метод
    correct: false
    why: Корректный, если направление зафиксировано заранее и обосновано.
  explanation: |-
    В продуктовых A/B-тестах стандарт — двусторонний: ухудшение метрики — тоже важный результат.
    Односторонний применяют в тестах на неухудшение и для guardrail-метрик, где интересует только
    «не стало ли хуже».
- id: sthyp-errcost-012
  topic: stats/hypothesis_testing
  type: open
  question: |-
    Банк тестирует новую скоринговую модель против текущей. Что будет ошибкой I рода, что — II рода,
    и какая из них дороже? Как это влияет на выбор α и мощности?
  difficulty: 2
  tags:
  - type_i_error
  - type_ii_error
  - credit_risk
  - interview
  answer: |-
    Пусть H₀ — «новая модель не лучше текущей».

    **Ошибка I рода** — решили, что новая модель лучше, хотя это не так. Её внедряют:
    затраты на внедрение, риск роста дефолтов, если на деле модель хуже. В кредитном риске
    это обычно **дороже**: ошибка в оценке риска бьёт по потерям портфеля, а откатить
    выданные кредиты нельзя.

    **Ошибка II рода** — новая модель на самом деле лучше, но тест этого не показал.
    Упущенная выгода: продолжаем работать на худшей модели.

    **Что из этого следует.**
    - Если ошибка I рода дороже, можно брать строже α (0,01) или тест на неухудшение с запасом.
    - Строгий α снижает мощность, поэтому нужно больше данных: дольше тест или больше выборка.
    - Размер эффекта, который важно поймать (MDE), задаёт бизнес — например, минимальный прирост Gini
      или снижение bad rate, который окупает внедрение.
  rubric:
  - Правильно определил ошибку I рода как внедрение модели, которая не лучше
  - Правильно определил ошибку II рода как пропуск реально лучшей модели
  - Сравнил стоимость ошибок с аргументами из бизнеса
  - Связал выбор α с ценой ошибок и сказал про обмен на мощность и размер выборки
  explanation: |-
    Общий принцип: α и мощность — не догма (0,05 и 80%), а баланс стоимости двух ошибок.
    На собесе ценится именно умение связать статистические параметры с деньгами.
- id: sthyp-practical-013
  topic: stats/hypothesis_testing
  type: mcq
  question: |-
    На 10 млн пользователей тест показал рост конверсии на 0,01 п.п. с p = 0,001.
    Стоимость внедрения фичи высокая. Что делать?
  difficulty: 2
  tags:
  - practical_significance
  - large_samples
  options:
  - text: Эффект статистически значим, но практически ничтожен — решение принимают по его размеру и стоимости
      внедрения
    correct: true
    why: На огромной выборке SE крошечная, и даже ничтожный эффект становится значимым. Значимость отвечает
      на вопрос «есть ли эффект», а не «важен ли он».
  - text: 'Внедрять: p = 0,001 — очень сильный результат'
    correct: false
    why: Маленькое p-value говорит об уверенности в существовании эффекта, а не о его размере.
  - text: 'Результат ошибочный: при таком эффекте p-value не может быть маленьким'
    correct: false
    why: 'Может: $z = \Delta / SE$, и при огромном $n$ SE очень мала.'
  - text: Повторить тест на меньшей выборке
    correct: false
    why: Меньшая выборка просто потеряет способность видеть этот эффект. Размер эффекта от этого не изменится.
  explanation: |-
    Решение принимают по интервалу для эффекта в сравнении с MDE — минимальным эффектом,
    ради которого стоит внедрять. Если весь интервал ниже MDE, фича не окупится, даже будучи «значимой».
- id: sthyp-peeking-014
  topic: stats/hypothesis_testing
  type: mcq
  question: |-
    Аналитик каждый день смотрит на p-value теста и останавливает его, как только p < 0,05.
    Эффекта на самом деле нет. Что происходит с долей ложных тревог?
  difficulty: 2
  tags:
  - peeking
  - type_i_error
  - interview
  options:
  - text: 'Она становится заметно больше 5%: при 10 проверках — около 20%'
    correct: true
    why: Каждый взгляд — ещё одна возможность случайно пересечь порог. Остановка на первом пересечении
      собирает все эти шансы.
  - text: Остаётся 5% — порог же тот же
    correct: false
    why: Порог 5% гарантирует долю ложных тревог только для **одной** проверки в заранее заданный момент.
  - text: 'Уменьшается: больше проверок — надёжнее результат'
    correct: false
    why: Надёжнее был бы результат на полной выборке. Ранняя остановка ловит случайные колебания.
  - text: Становится ровно $1 - 0{,}95^{10} \approx 40\%$
    correct: false
    why: Это формула для независимых проверок. Ежедневные p-value одного теста сильно связаны (данные
      накапливаются), поэтому рост меньше — около 20% при 10 проверках.
  explanation: |-
    Что делать: фиксировать размер выборки и длительность заранее и смотреть на результат один раз;
    если нужно следить по ходу — использовать последовательные тесты (group sequential, mSPRT),
    в которых порог на каждой промежуточной проверке строже.
- id: sthyp-managernosig-015
  topic: stats/hypothesis_testing
  type: open
  question: |-
    Тест фичи не показал значимого эффекта. Менеджер говорит: «Значит, фича не работает, откатываем».
    Что вы ответите?
  difficulty: 3
  tags:
  - non_significant
  - power
  - equivalence
  - interview
  answer: |-
    **Не отвергли H₀ — не то же самое, что доказали отсутствие эффекта.** Прежде чем решать,
    стоит проверить три вещи.

    **1. Интервал для эффекта.** Если он широкий и включает эффекты, которые нам важны
    (больше MDE), вывода нет — данных не хватило. Если интервал узкий и весь внутри «неважной зоны»,
    можно говорить, что практически значимого эффекта нет.

    **2. Мощность.** Какой эффект тест в принципе мог поймать при нашем трафике?
    Если MDE теста 1 п.п., а ожидали 0,3 п.п., тест изначально был недомощным.

    **3. Качество теста.** Не было ли SRM, ошибок в сплите или логировании, эффекта новизны.

    **Что предложить.**
    - Если интервал включает важные эффекты — продлить тест или снизить дисперсию (CUPED).
    - Если нужно именно доказать «не хуже» или «эффекта нет» — тест на неухудшение или эквивалентность
      с заранее заданным порогом.
    - Если интервал целиком в неважной зоне и фича дорогая в поддержке — откат оправдан,
      но по причине «эффект слишком мал», а не «эффекта нет».
  rubric:
  - Сказал, что незначимость не доказывает отсутствие эффекта
  - Предложил смотреть на доверительный интервал и сравнить его с MDE
  - Упомянул мощность и то, какой эффект тест мог поймать
  - Упомянул проверку качества теста (SRM и т. п.)
  - Назвал тест на эквивалентность или неухудшение как способ утверждать «эффекта нет»
  explanation: |-
    Классический вопрос на понимание, а не на формулы. Сильный ответ переводит спор
    из «значимо / не значимо» в «какие эффекты согласуются с данными и что нам важно».
