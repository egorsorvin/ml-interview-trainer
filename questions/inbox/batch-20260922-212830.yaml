- id: mlreg-idea-001
  topic: ml/regularization
  type: card
  question: Что такое регуляризация и как её описать в терминах bias-variance?
  difficulty: 1
  tags:
  - regularization
  - bias_variance
  answer: |-
    В узком смысле — добавление штрафа к функции потерь:
    $$L_{\text{total}}(w) = L_{\text{data}}(w) + \lambda R(w)$$

    В широком смысле — любой приём, ограничивающий модель ради лучшего обобщения.

    В терминах bias-variance это **сознательный обмен**: мы немного увеличиваем bias
    (модель хуже подгоняется под обучающие данные) ради существенного снижения variance
    (модель меньше зависит от конкретной выборки).

    Цель регуляризации — не минимальный train loss, а минимальный **validation** loss.
  explanation: |-
    Под это определение подходят не только штрафы, но и dropout, аугментация данных,
    ранняя остановка и ансамблирование — все они снижают variance разными способами.
- id: mlreg-l1l2-002
  topic: ml/regularization
  type: mcq
  question: Почему $L_1$-регуляризация зануляет часть весов, а $L_2$ только уменьшает их?
  difficulty: 2
  tags:
  - l1
  - l2
  - sparsity
  options:
  - text: Производная штрафа $L_1$ постоянна и равна $\lambda$, а у $L_2$ равна $2\lambda w$ и слабеет
      по мере уменьшения веса
    correct: true
    why: Постоянная сила притяжения додавливает вес до точного нуля и удерживает его там. Убывающая сила
      лишь бесконечно приближает вес к нулю, не достигая его.
  - text: Модуль в $L_1$ штрафует сильнее, чем квадрат в $L_2$
    correct: false
    why: При весах больше единицы квадрат штрафует сильнее. Механизм зануления связан не с величиной штрафа,
      а с поведением его производной около нуля.
  - text: $L_1$ явно удаляет признаки с наименьшей корреляцией с целевой переменной
    correct: false
    why: 'Никакого явного отбора не происходит: разреженность возникает как побочный эффект оптимизации.'
  - text: $L_2$ применяется до обучения, а $L_1$ во время
    correct: false
    why: Оба штрафа входят в функцию потерь и действуют на каждом шаге обучения одинаково.
  explanation: |-
    Геометрическая формулировка: область допустимых весов для $L_1$ — ромб с углами на осях,
    для $L_2$ — круг. Линии уровня функции потерь с большой вероятностью касаются угла ромба,
    а угол лежит на оси, где одна координата равна нулю. У круга углов нет.
- id: mlreg-wd-003
  topic: ml/regularization
  type: card
  question: Что такое weight decay и почему для Adam понадобилась отдельная версия AdamW?
  difficulty: 2
  tags:
  - weight_decay
  - adamw
  answer: |-
    Weight decay — вычитание слагаемого, пропорционального весу, при каждом обновлении:
    $$w \leftarrow w - \eta \nabla L - \eta\lambda w$$
    Для обычного SGD это математически эквивалентно $L_2$-штрафу в функции потерь.

    Для **адаптивных** оптимизаторов эквивалентность нарушается. Если добавить $L_2$ в лосс,
    его градиент $2\lambda w$ пройдёт через деление на $\sqrt{\hat v}$ вместе с основным градиентом
    и исказится: веса с большими градиентами получат более слабую регуляризацию, чем задумано.

    **AdamW** применяет затухание весов отдельно, минуя адаптивный механизм.
    Это стандарт при обучении трансформеров.
  explanation: |-
    Типичное значение weight decay для трансформеров — $0{,}01$.
    Обычно его не применяют к параметрам нормализации и к смещениям:
    они отвечают за масштаб и сдвиг, а не за сложность модели.
- id: mlreg-drop-004
  topic: ml/regularization
  type: mcq
  question: Как работает dropout и почему он помогает против переобучения?
  difficulty: 2
  tags:
  - dropout
  options:
  - text: На каждом шаге обучения случайно отключает часть нейронов, из-за чего они не могут полагаться
      друг на друга
    correct: true
    why: 'Без dropout нейроны коадаптируются: один компенсирует ошибку другого, и такая связка отражает
      шум данных. Когда партнёр может исчезнуть, каждому приходится учиться самостоятельно полезному признаку.'
  - text: Удаляет из датасета часть объектов, чтобы модель не запоминала их
    correct: false
    why: Dropout работает с нейронами сети, а не с обучающими примерами.
  - text: Обнуляет веса, ставшие слишком большими по модулю
    correct: false
    why: Это описание клиппинга весов. Dropout отключает нейроны случайно, независимо от величины их весов.
  - text: Уменьшает learning rate для нейронов, которые обучаются слишком быстро
    correct: false
    why: Адаптация шага под параметр — механика Adam, а не dropout.
  - text: Заменяет часть активаций их средним значением по батчу
    correct: false
    why: Усреднение по батчу выполняет BatchNorm. Dropout зануляет активации, а не усредняет их.
  explanation: |-
    Второе объяснение эффекта: каждая итерация обучает свою прореженную подсеть,
    а на инференсе работают все нейроны сразу — это приближённо эквивалентно
    усреднению огромного ансамбля, что снижает variance.
- id: mlreg-drop-005
  topic: ml/regularization
  type: mcq
  question: Что происходит с dropout при инференсе и какая типичная ошибка с этим связана?
  difficulty: 2
  tags:
  - dropout
  - inference
  - pytorch
  options:
  - text: Dropout отключается, работают все нейроны; частая ошибка — забыть вызвать `model.eval()`, из-за
      чего предсказания становятся случайными
    correct: true
    why: В режиме обучения слой продолжает случайно занулять активации, поэтому один и тот же объект будет
      получать разные предсказания от запуска к запуску.
  - text: Dropout продолжает работать, обеспечивая устойчивость предсказаний
    correct: false
    why: Наоборот, его работа при инференсе делает предсказания недетерминированными. Исключение — приём
      Monte Carlo dropout, где это включают намеренно для оценки неопределённости.
  - text: Веса домножаются на вероятность отключения вручную перед предсказанием
    correct: false
    why: 'В современных библиотеках применяется inverted dropout: масштабирование выполняется во время
      обучения, поэтому на инференсе ничего делать не нужно.'
  - text: Dropout заменяется на BatchNorm
    correct: false
    why: Это независимые механизмы, они не подменяют друг друга при смене режима.
  explanation: |-
    При обучении оставшиеся активации делятся на $(1-p)$, чтобы сохранить масштаб суммы.
    Обратная ошибка тоже встречается: забыть вернуть `model.train()` перед продолжением обучения,
    из-за чего регуляризация перестаёт действовать.
- id: mlreg-norm-006
  topic: ml/regularization
  type: open
  question: В чём разница между BatchNorm и LayerNorm и почему в трансформерах используют именно LayerNorm?
  difficulty: 2
  tags:
  - batchnorm
  - layernorm
  - transformers
  - interview
  answer: |-
    Различие в том, по какому измерению считаются статистики.

    BatchNorm нормализует **по батчу**: для каждого признака вычисляются среднее
    и стандартное отклонение по всем объектам батча. Если представить данные таблицей,
    где строки это объекты, а столбцы признаки, то BatchNorm работает по столбцам.

    LayerNorm нормализует **внутри одного объекта**: статистики считаются
    по всем признакам этого объекта, то есть по строке.

    Для трансформеров LayerNorm подходит по трём причинам.

    Он не зависит от размера батча. В обработке текста батчи часто малы из-за длинных
    последовательностей, а BatchNorm на батче из двух-четырёх объектов считает статистики
    по нескольким числам, что даёт шум.

    Он одинаково работает при обучении и инференсе. BatchNorm вынужден на инференсе
    использовать накопленные скользящие средние, что создаёт расхождение между режимами.

    Он корректно обрабатывает последовательности переменной длины. Паддинг искажает
    статистики по батчу, тогда как нормализация внутри объекта от этого не страдает.
  rubric:
  - Объяснил, что BatchNorm считает статистики по батчу, а LayerNorm внутри объекта
  - Назвал независимость от размера батча как причину выбора в трансформерах
  - Упомянул одинаковое поведение при обучении и инференсе
  - Сказал про последовательности переменной длины и паддинг
  explanation: |-
    Стоит отметить, что нормализация — это в первую очередь **стабилизация обучения**,
    а регуляризующий эффект у BatchNorm побочный и возникает из шума статистик батча.
    Поэтому при использовании BatchNorm силу dropout обычно снижают.
- id: mlreg-aug-007
  topic: ml/regularization
  type: multi
  question: Какие утверждения про аугментацию данных верны? Выбери все верные.
  difficulty: 2
  tags:
  - augmentation
  options:
  - text: Она увеличивает эффективный размер обучающей выборки
    correct: true
  - text: Преобразование должно сохранять метку объекта
    correct: true
  - text: Её применяют только к обучающей выборке
    correct: true
  - text: Она учит модель инвариантности к неинформативным преобразованиям
    correct: true
  - text: Любое преобразование данных подходит, лишь бы оно было случайным
    correct: false
    why: Преобразование не должно менять смысл. Поворот рукописной цифры 6 на $180^\circ$ превращает её
      в 9, и модель будет учиться неверному.
  explanation: |-
    Применение аугментации к валидации исказило бы оценку: качество измерялось бы
    на искусственно изменённых данных, а не на тех, что встретятся в реальности.
    Исключение — приём test-time augmentation, где предсказания усредняют
    по нескольким версиям объекта, но это осознанное решение, а не часть обучения.
- id: mlreg-lambda-008
  topic: ml/regularization
  type: open
  question: Как подобрать силу регуляризации $\lambda$ и как понять, что она слишком велика или мала?
  difficulty: 2
  tags:
  - hyperparameters
  - interview
  answer: |-
    Параметр $\lambda$ — обычный гиперпараметр, поэтому подбирается по валидационной выборке
    перебором по логарифмической сетке: например, значения $10^{-4}$, $10^{-3}$, $10^{-2}$, $10^{-1}$, $1$.
    Логарифмическая сетка нужна потому, что значимы изменения на порядок, а не на доли.

    Диагностика по кривым обучения.

    Большой разрыв между train и validation при низкой ошибке на train означает,
    что регуляризации **недостаточно**: модель переобучается, нужно увеличить $\lambda$.

    Высокая ошибка на обеих выборках одновременно означает **избыток** регуляризации:
    модель недообучена, $\lambda$ следует уменьшить.

    Оптимум там, где валидационная ошибка минимальна, независимо от значения на train.

    Важная деталь: перед применением $L_1$ или $L_2$ признаки нужно стандартизировать.
    Штраф зависит от величины весов, а вес зависит от масштаба признака,
    поэтому без стандартизации признаки в мелких единицах получают большие веса
    и штрафуются несправедливо сильно. Свободный член обычно не штрафуют:
    он отвечает за общий уровень предсказания, а не за сложность модели.
  rubric:
  - Сказал, что $\lambda$ подбирается на валидации по логарифмической сетке
  - 'Назвал признак недостатка регуляризации: большой разрыв train и validation'
  - 'Назвал признак избытка: высокая ошибка на обеих выборках'
  - Упомянул необходимость стандартизации признаков перед $L_1$ или $L_2$
  - Отметил, что свободный член обычно не штрафуют
  explanation: |-
    В глубоком обучении подбирают не одно значение, а комбинацию:
    weight decay, вероятность dropout, сила аугментации и момент ранней остановки
    действуют совместно, поэтому их настраивают вместе.
- id: mlreg-elastic-009
  topic: ml/regularization
  type: mcq
  question: Какую проблему Lasso решает Elastic Net?
  difficulty: 2
  tags:
  - elastic_net
  - correlated_features
  options:
  - text: 'Нестабильность отбора при коррелированных признаках: Lasso произвольно выбирает один из группы,
      а Elastic Net отбирает их вместе'
    correct: true
    why: 'Добавленная $L_2$-компонента создаёт групповой эффект: коррелированные признаки получают похожие
      веса и попадают в модель или выпадают из неё совместно.'
  - text: Невозможность применить Lasso к задачам классификации
    correct: false
    why: $L_1$-штраф добавляется к любой функции потерь, включая log-loss в логистической регрессии.
  - text: Слишком медленную сходимость Lasso
    correct: false
    why: Скорость сходимости не является основной проблемой; Elastic Net решает вопрос устойчивости отбора
      признаков.
  - text: Неспособность Lasso обнулять веса
    correct: false
    why: Зануление весов — как раз главное свойство Lasso, ради которого его и применяют.
  explanation: |-
    Формула объединяет оба штрафа: $\lambda_1\|w\|_1 + \lambda_2\|w\|_2^2$.
    Elastic Net особенно востребован там, где признаков больше, чем объектов,
    и они сильно скоррелированы — в геномике, биоинформатике, работе с текстовыми данными.
- id: mlreg-early-010
  topic: ml/regularization
  type: card
  question: Почему раннюю остановку относят к методам регуляризации?
  difficulty: 2
  tags:
  - early_stopping
  answer: |-
    Она ограничивает, насколько далеко модель успеет уйти в подгонку под шум обучающих данных,
    то есть ограничивает её **эффективную сложность** — тот же результат,
    которого добивается $L_2$-штраф, но другим способом.

    Механизм: после каждой эпохи считается метрика на валидации,
    лучшие веса запоминаются, и при отсутствии улучшений в течение `patience` эпох
    обучение прекращается с возвратом лучших весов.
  explanation: |-
    Важное различие: сохранение лучшей модели (чекпоинтинг) и остановка — разные механизмы.
    Чекпоинтинг решает, какую модель брать в итоге, остановка — сколько ресурсов тратить.
    Параметр `patience` нужен потому, что валидационная метрика шумит
    и может случайно просесть на одной эпохе.
- id: mlreg-cmp-011
  topic: ml/regularization
  type: multi
  question: Какие приёмы снижают variance модели? Выбери все верные.
  difficulty: 2
  tags:
  - overfitting
  - methods
  options:
  - text: Weight decay
    correct: true
  - text: Dropout
    correct: true
  - text: Аугментация данных
    correct: true
  - text: Бэггинг и усреднение моделей
    correct: true
  - text: Увеличение глубины сети
    correct: false
    why: Усложнение модели снижает bias, но повышает variance — это движение в противоположную сторону.
  explanation: |-
    Все перечисленные работают через одну идею: либо ограничивают эффективную сложность модели,
    либо увеличивают объём информации, на которой она обучается,
    либо усредняют несколько моделей, гася случайные особенности каждой.
- id: mlreg-smooth-012
  topic: ml/regularization
  type: card
  question: Что делает label smoothing и какую проблему модели он лечит?
  difficulty: 2
  tags:
  - label_smoothing
  - calibration
  answer: |-
    Заменяет жёсткие метки слегка размытыми:
    $$y_{\text{smooth}} = (1 - \varepsilon)\, y + \frac{\varepsilon}{K}$$
    При $\varepsilon = 0{,}1$ и десяти классах правильный класс получает цель $0{,}91$ вместо $1{,}0$,
    остальные по $0{,}01$ вместо нуля.

    Лечит **переуверенность**. Чтобы довести cross-entropy до нуля при жёсткой метке,
    модель должна выдать вероятность ровно единицу, а для этого логит обязан уйти в бесконечность.
    Модель начинает раздувать логиты и теряет калибровку.
    Размытая цель достижима при конечных значениях, поэтому стимул исчезает.
  explanation: |-
    Стандартная практика при обучении трансформеров и крупных классификаторов.
    Побочный эффект — модель чуть хуже ранжирует по уверенности,
    поэтому при задачах, где важен именно порядок, применяют осторожно.
- id: mlreg-dl-013
  topic: ml/regularization
  type: mcq
  question: Какой набор регуляризации типичен при обучении трансформера?
  difficulty: 2
  tags:
  - deep_learning
  - practice
  options:
  - text: Dropout около $0{,}1$, weight decay через AdamW, label smoothing и LayerNorm
    correct: true
    why: Именно эта комбинация используется при обучении BERT, GPT и большинства современных языковых
      моделей.
  - text: Только $L_1$-регуляризация для получения разреженных весов
    correct: false
    why: Разреженность весов не является целью при обучении трансформеров; $L_1$ там практически не применяется.
  - text: BatchNorm после каждого слоя внимания
    correct: false
    why: 'В трансформерах используется LayerNorm: BatchNorm зависит от размера батча и плохо работает
      с последовательностями переменной длины.'
  - text: Elastic Net в сочетании с отбором признаков
    correct: false
    why: Это инструменты линейных моделей на табличных данных, к нейросетям они не применяются.
  explanation: |-
    Дополнительно применяют gradient clipping с порогом около единицы —
    формально это не регуляризация, а стабилизация, защищающая от разрушительных шагов
    при взрыве градиентов.
- id: mlreg-case-014
  topic: ml/regularization
  type: open
  question: |-
    Модель показывает accuracy $0{,}99$ на обучающей выборке и $0{,}72$ на валидационной.
    Какие действия предпримешь и в каком порядке?
  difficulty: 3
  tags:
  - case
  - interview
  - diagnostics
  answer: |-
    Разрыв в двадцать семь пунктов — явное переобучение, но прежде чем лечить симптом,
    стоит проверить, нет ли методологической ошибки.

    Сначала проверяю корректность валидации: не перемешаны ли временные данные случайно,
    нет ли дубликатов между выборками, не разошлись ли распределения train и validation,
    репрезентативна ли валидация вообще. Иногда разрыв объясняется не переобучением,
    а тем, что валидация собрана из другого распределения.

    Дальше, если методология в порядке, действую по возрастанию стоимости.

    Самое дешёвое — усилить регуляризацию: увеличить weight decay, поднять вероятность dropout,
    включить раннюю остановку. Это требует лишь перезапуска обучения.

    Следом — упростить модель: уменьшить число слоёв или их ширину,
    ограничить глубину деревьев, если речь о бустинге.

    Затем — поработать с данными: добавить аугментацию, собрать больше примеров.
    Больше данных остаётся самым надёжным средством, но и самым дорогим.

    Параллельно смотрю на признаки: нет ли среди них таких, что позволяют модели
    запоминать конкретные объекты, например идентификаторов.

    После каждого изменения смотрю не на абсолютные значения, а на **динамику разрыва**:
    цель не максимальная accuracy на train, а минимальная ошибка на валидации.
  rubric:
  - 'Сначала проверил корректность валидации: утечки, дубликаты, репрезентативность'
  - Предложил усилить регуляризацию как наиболее дешёвое действие
  - Упомянул упрощение модели
  - Назвал аугментацию или сбор данных
  - Сказал, что ориентироваться надо на валидационную метрику, а не на train
  explanation: |-
    Порядок действий важен: начинать с дорогих шагов вроде сбора данных нерационально,
    если проблема решается настройкой гиперпараметров.
    А если причина в утечке или некорректной валидации, любые улучшения регуляризации
    просто маскируют проблему.
- id: mlreg-ridge-015
  topic: ml/regularization
  type: mcq
  question: Как $L_2$-регуляризация решает проблему мультиколлинеарности с точки зрения линейной алгебры?
  difficulty: 3
  tags:
  - ridge
  - multicollinearity
  - linear_algebra
  options:
  - text: 'Решение принимает вид $(X^TX + \lambda I)^{-1}X^Ty$: все собственные значения сдвигаются вверх
      на $\lambda$, и матрица становится обратимой'
    correct: true
    why: При линейно зависимых признаках минимальное собственное значение $X^TX$ близко к нулю. Сдвиг
      на $\lambda$ гарантирует обратимость и улучшает число обусловленности.
  - text: Из матрицы признаков удаляются линейно зависимые столбцы
    correct: false
    why: 'Никакого удаления не происходит: все признаки остаются в модели, меняются лишь значения весов.'
  - text: Матрица $X^TX$ заменяется на единичную
    correct: false
    why: Добавляется слагаемое $\lambda I$, а не замена. При малом $\lambda$ решение остаётся близким
      к исходному.
  - text: Признаки ортогонализуются перед обучением
    correct: false
    why: Ортогонализация — отдельный приём, например через QR-разложение или PCA. Ridge работает иначе.
  explanation: |-
    Геометрическая интерпретация: при мультиколлинеарности функция потерь имеет форму желоба
    с плоским дном, и оптимум не единственный. Добавление $\lambda\|w\|^2$
    придаёт кривизну по всем направлениям, превращая желоб в чашу с единственным минимумом.
