- id: stss-depends-001
  topic: stats/sample_size
  type: card
  question: От чего зависит необходимый размер выборки в A/B-тесте? Какова формула?
  difficulty: 1
  tags:
  - sample_size
  - mde
  - formula
  answer: |-
    Размер **одной** группы:

    $$n = \frac{2\,(z_{\alpha/2} + z_\beta)^2\,\sigma^2}{\Delta^2} \approx \frac{16\,\sigma^2}{\Delta^2}$$

    - $\Delta$ — **MDE**, минимальный эффект, который хотим надёжно поймать. Меньше эффект — больше $n$, квадратично.
    - $\sigma^2$ — дисперсия метрики. Для доли $\sigma^2 = p(1-p)$.
    - $z_{\alpha/2}$ — квантиль для уровня значимости (1,96 при α = 0,05).
    - $z_\beta$ — квантиль для мощности (0,84 при мощности 80%).
    - Двойка — потому что сравниваются две группы, и дисперсии их средних складываются.

    Приближение с 16 верно для α = 0,05 и мощности 80%.
  explanation: |-
    Смысл формулы: $n$ растёт, когда шум больше ($\sigma^2$), эффект меньше ($\Delta$),
    а требования строже (меньше α, больше мощность).
- id: stss-sixteen-002
  topic: stats/sample_size
  type: mcq
  question: Откуда в приближённой формуле $n \approx 16\sigma^2 / \Delta^2$ берётся число 16?
  difficulty: 1
  tags:
  - sample_size
  - quantiles
  options:
  - text: $2 \cdot (1{,}96 + 0{,}84)^2 = 2 \cdot 7{,}84 \approx 15{,}7$ — для α = 0,05 и мощности 80%
    correct: true
    why: 1,96 — квантиль для двустороннего α = 0,05, 0,84 — квантиль для мощности 80%. Двойка — от двух
      групп.
  - text: Это эмпирическая константа из практики A/B
    correct: false
    why: Она выводится точно из выбранных α и мощности. При других значениях получится другое число.
  - text: $4^2$, где 4 — число стандартных ошибок до порога
    correct: false
    why: Совпадение по величине. Настоящая сумма квантилей — 2,80, а не 4.
  - text: $1{,}96^2 \cdot 4$
    correct: false
    why: Здесь нет квантиля мощности. Без него получится формула для мощности 50%.
  explanation: |-
    При мощности 90% ($z_\beta = 1{,}28$) множитель будет $2 \cdot 3{,}24^2 \approx 21$,
    при α = 0,01 и мощности 80% — $2 \cdot 3{,}42^2 \approx 23$.
- id: stss-conv-003
  topic: stats/sample_size
  type: mcq
  question: |-
    Базовая конверсия 10%, хотим поймать рост до 11%. α = 0,05, мощность 80%.
    Сколько пользователей нужно в каждую группу?
  difficulty: 2
  tags:
  - sample_size
  - proportion
  - calculation
  options:
  - text: Около 14 000–15 000
    correct: true
    why: $\sigma^2 = p(1-p) = 0{,}1 \cdot 0{,}9 = 0{,}09$, $\Delta = 0{,}01$. $n \approx 16 \cdot 0{,}09
      / 0{,}0001 = 14\,400$. Точная формула с усреднённой долей даёт около 14 800.
  - text: Около 1 440
    correct: false
    why: Похоже, $\Delta$ взята как 0,1 п.п. в неправильном масштабе или потерян ноль. $0{,}01^2 = 0{,}0001$.
  - text: Около 144 000
    correct: false
    why: Это соответствует $\Delta = 0{,}33$ п.п., а не 1 п.п.
  - text: Около 900
    correct: false
    why: Это $0{,}09 / 0{,}0001$ без множителя 16. Без него мощность будет низкой.
  explanation: |-
    Порядок расчёта: 1) дисперсия метрики через базовую конверсию, 2) MDE в абсолютных единицах,
    3) подставить в формулу, 4) поделить на трафик и округлить до полных недель.
- id: stss-halfmde-004
  topic: stats/sample_size
  type: mcq
  question: Бизнес попросил ловить эффект вдвое меньше, чем планировали. Как изменится нужная выборка?
  difficulty: 1
  tags:
  - sample_size
  - mde
  options:
  - text: Вырастет в 4 раза
    correct: true
    why: $n \propto 1 / \Delta^2$. $\Delta$ уменьшилась в 2 раза — $n$ выросла в $2^2 = 4$ раза.
  - text: Вырастет в 2 раза
    correct: false
    why: Зависимость квадратичная, а не линейная.
  - text: Вырастет в 1,4 раза
    correct: false
    why: Это $\sqrt 2$ — связь перевёрнута.
  - text: Не изменится
    correct: false
    why: MDE — главный фактор размера выборки.
  explanation: |-
    Поэтому маленькие эффекты так дороги: MDE 0,1 п.п. вместо 1 п.п. требует в 100 раз больше данных.
    Честный разговор с бизнесом о том, какой эффект действительно важен, экономит месяцы тестирования.
- id: stss-relative-005
  topic: stats/sample_size
  type: mcq
  question: Базовая конверсия 5%. Продакт хочет MDE «10%». Что подставлять в формулу как $\Delta$?
  difficulty: 2
  tags:
  - mde
  - relative_effect
  - baseline
  options:
  - text: Уточнить, относительный это эффект или абсолютный. Если относительный, то $\Delta = 0{,}05 \times
      0{,}10 = 0{,}005$, то есть 0,5 п.п.
    correct: true
    why: В формулу идёт абсолютная разница. «Рост на 10%» обычно означает с 5% до 5,5%. Если же подставить
      10 п.п., выборка получится в 400 раз меньше нужной.
  - text: $\Delta = 0{,}10$
    correct: false
    why: Это 10 процентных пунктов — рост конверсии с 5% до 15%. Для реальных изменений это огромный эффект.
  - text: $\Delta = 10$
    correct: false
    why: 'Единицы должны совпадать с единицами метрики: доля — от 0 до 1.'
  - text: Относительный или абсолютный — неважно
    correct: false
    why: Разница — в 20 раз по эффекту и в 400 раз по выборке.
  explanation: |-
    Для перевода нужна **базовая конверсия (baseline)**: абсолютный эффект = baseline × относительный.
    Baseline нужен и для дисперсии $p(1-p)$. Берут его по историческим данным того же сегмента.
- id: stss-reverse-006
  topic: stats/sample_size
  type: mcq
  question: |-
    Трафика хватает только на 20 000 пользователей в группе. Базовая конверсия 5%.
    Какой минимальный эффект тест сможет надёжно поймать (α = 0,05, мощность 80%)?
  difficulty: 2
  tags:
  - mde
  - fixed_traffic
  - calculation
  options:
  - text: Около 0,6 п.п.
    correct: true
    why: $MDE = (z_{\alpha/2} + z_\beta) \cdot \sigma \sqrt{2/n} = 2{,}8 \cdot \sqrt{0{,}05 \cdot 0{,}95}
      \cdot \sqrt{2 / 20\,000} = 2{,}8 \cdot 0{,}218 \cdot 0{,}01 \approx 0{,}0061$.
  - text: Около 0,06 п.п.
    correct: false
    why: 'Ошибка в порядке: $\sqrt{2/20\,000} = 0{,}01$, а не 0,001.'
  - text: Около 2,8 п.п.
    correct: false
    why: Забыты множители $\sigma$ и $\sqrt{2/n}$.
  - text: 'Любой: при 20 000 пользователях тест ловит всё'
    correct: false
    why: Мощность теста всегда ограничена. Эффекты меньше MDE тест будет пропускать чаще, чем в 20% случаев.
  explanation: |-
    Обратная задача полезнее прямой, когда трафик ограничен. Если ожидаемый эффект 0,3 п.п.,
    а MDE теста 0,6 п.п., тест бессмысленно запускать в таком виде: вероятнее всего, он ничего не покажет.
    Варианты — дольше тест, CUPED, более чувствительная метрика или отказ от теста.
- id: stss-whomde-007
  topic: stats/sample_size
  type: mcq
  question: Кто и как должен определять MDE?
  difficulty: 2
  tags:
  - mde
  - business
  options:
  - text: 'Бизнес: это минимальный эффект, при котором внедрение окупается или имеет смысл. Статистика
      потом говорит, сколько данных нужно, чтобы его поймать'
    correct: true
    why: Например, если внедрение стоит 5 млн, а 1 п.п. конверсии даёт 2 млн в год, эффекты меньше определённого
      уровня неинтересны. MDE переводит этот бизнес-порог в размер выборки.
  - text: Аналитик — такой, чтобы тест закончился за неделю
    correct: false
    why: 'Это обратная задача: при фиксированной длительности можно посчитать MDE, но потом нужно спросить
      бизнес, устраивает ли он.'
  - text: Его берут равным наблюдённому эффекту после теста
    correct: false
    why: MDE фиксируют до теста. Подгонка после — источник ошибок.
  - text: Он всегда равен 1% относительного роста
    correct: false
    why: Универсального значения нет, всё зависит от экономики продукта.
  explanation: |-
    В кредитном риске MDE часто задают через деньги: какое снижение bad rate или рост Gini
    окупает внедрение новой модели с учётом объёма выдач.
- id: stss-power90-008
  topic: stats/sample_size
  type: mcq
  question: Как изменится выборка, если поднять мощность с 80% до 90% (α = 0,05)?
  difficulty: 2
  tags:
  - power
  - sample_size
  options:
  - text: Вырастет примерно на 34%
    correct: true
    why: $n \propto (z_{\alpha/2} + z_\beta)^2$. Было $(1{,}96 + 0{,}84)^2 = 7{,}84$, стало $(1{,}96 +
      1{,}28)^2 = 10{,}5$. Отношение около 1,34.
  - text: Вырастет на 12,5% — пропорционально мощности
    correct: false
    why: Мощность входит через квантиль в квадрате, а не линейно.
  - text: Удвоится
    correct: false
    why: Удвоение потребовалось бы для гораздо более высокой мощности.
  - text: Не изменится
    correct: false
    why: Мощность — один из трёх рычагов формулы вместе с α и MDE.
  explanation: |-
    Для сравнения: снижение α с 0,05 до 0,01 при мощности 80% требует примерно на 49% больше данных:
    $(2{,}58 + 0{,}84)^2 / 7{,}84 \approx 1{,}49$.
- id: stss-alpha01-009
  topic: stats/sample_size
  type: mcq
  question: |-
    Риск-команда хочет проверять новую модель при α = 0,01 вместо 0,05, сохранив мощность 80%.
    Во сколько раз вырастет нужная выборка?
  difficulty: 2
  tags:
  - alpha
  - sample_size
  options:
  - text: Примерно в 1,5 раза
    correct: true
    why: $(z_{0{,}005} + z_{0{,}2})^2 / (z_{0{,}025} + z_{0{,}2})^2 = (2{,}58 + 0{,}84)^2 / (1{,}96 +
      0{,}84)^2 = 11{,}7 / 7{,}84 \approx 1{,}49$.
  - text: 'В 5 раз: α уменьшили в 5 раз'
    correct: false
    why: α входит через квантиль, который растёт медленно — с 1,96 до 2,58.
  - text: 'В 1,3 раза: $2{,}58 / 1{,}96$'
    correct: false
    why: Нужно брать сумму квантилей в квадрате, а не отношение квантилей α.
  - text: Не изменится, если мощность та же
    correct: false
    why: Чтобы сохранить мощность при более строгом пороге, колоколы нужно раздвинуть сильнее — это и
      есть рост $n$.
  explanation: |-
    Строгий α — разумная плата, если ложная тревога дорогая (внедрение модели, которая на деле хуже).
    Но это нужно учитывать при планировании длительности.
- id: stss-split-010
  topic: stats/sample_size
  type: mcq
  question: |-
    Из осторожности тест хотят запустить на 10% трафика (90/10). Как это влияет на общее число пользователей,
    нужное для той же мощности, по сравнению со сплитом 50/50?
  difficulty: 2
  tags:
  - unequal_split
  - sample_size
  options:
  - text: Нужно примерно в 2,8 раза больше пользователей всего
    correct: true
    why: 'SE разницы пропорциональна $\sqrt{1/n_A + 1/n_B}$. При общем $N$: для 50/50 это $\sqrt{4/N}$,
      для 90/10 — $\sqrt{(1/0{,}9 + 1/0{,}1)/N} = \sqrt{11{,}1/N}$. Отношение $11{,}1 / 4 \approx 2{,}8$.'
  - text: Ровно столько же — важно общее число
    correct: false
    why: 'Точность ограничивает маленькая группа: её SE доминирует.'
  - text: В 9 раз больше
    correct: false
    why: Это отношение размеров групп, а не рост общей выборки.
  - text: 'Меньше: контрольная группа большая и очень точная'
    correct: false
    why: Точность разницы зависит от обеих групп. Огромный контроль не компенсирует маленький тест.
  explanation: |-
    При фиксированном общем трафике сплит 50/50 даёт максимальную мощность. Неравный сплит оправдан,
    когда воздействие рискованное или дорогое, — но тест придётся вести дольше.
- id: stss-cuped-011
  topic: stats/sample_size
  type: mcq
  question: |-
    Метрика коррелирует со своим значением за месяц до теста с $\rho = 0{,}5$.
    Насколько CUPED сократит нужную выборку?
  difficulty: 2
  tags:
  - cuped
  - variance_reduction
  - sample_size
  options:
  - text: 'На 25%: дисперсия умножается на $1 - \rho^2 = 0{,}75$'
    correct: true
    why: CUPED вычитает из метрики часть, предсказуемую по данным до теста. Остаётся доля дисперсии $1
      - \rho^2$. Так как $n \propto \sigma^2$, выборка тоже уменьшается в 0,75 раза.
  - text: 'На 50%: множитель $1 - \rho$'
    correct: false
    why: 'В формуле квадрат корреляции: $1 - 0{,}5^2 = 0{,}75$.'
  - text: На 75%
    correct: false
    why: Это $\rho^2$ с обратным знаком. Остаётся 75% дисперсии, а не 25%.
  - text: 'Не сократит: CUPED меняет среднее, а не дисперсию'
    correct: false
    why: 'Наоборот: среднее не меняется (вычитается величина со средним 0), меняется дисперсия.'
  explanation: |-
    При $\rho = 0{,}7$ экономия уже 51%. Поэтому CUPED особенно эффективен для метрик с сильной
    «инерцией»: выручка на пользователя, число транзакций, баланс.
- id: stss-baseline-012
  topic: stats/sample_size
  type: mcq
  question: |-
    Для расчёта выборки теста конверсии аналитик взял $\sigma^2 = 0{,}25$ «на всякий случай», хотя
    реальная конверсия около 2%. К чему это приведёт?
  difficulty: 1
  tags:
  - baseline
  - variance
  options:
  - text: 'Выборка будет сильно завышена: при 2% реальная дисперсия $0{,}02 \cdot 0{,}98 \approx 0{,}02$,
      в 12,5 раз меньше'
    correct: true
    why: 0,25 — максимум $p(1-p)$, он достигается при $p = 0{,}5$. Для редких событий дисперсия гораздо
      меньше. Тест будет идти в 12 раз дольше, чем нужно.
  - text: Выборка будет занижена
    correct: false
    why: Взята максимально возможная дисперсия, значит, выборка завышена, а не занижена.
  - text: 'Ничего страшного: дисперсия доли всегда 0,25'
    correct: false
    why: Дисперсия доли $p(1-p)$ зависит от $p$.
  - text: Нужно брать ещё больше для надёжности
    correct: false
    why: Больше 0,25 дисперсия доли быть не может.
  explanation: |-
    Хотя абсолютная дисперсия редкой конверсии мала, **относительный** MDE для неё обычно дорогой:
    10% роста от 2% — это всего 0,2 п.п., и $\Delta^2$ в знаменателе крошечная.
- id: stss-duration-013
  topic: stats/sample_size
  type: mcq
  question: |-
    Нужно 38 000 пользователей в каждой из двух групп. В тест попадает 6 000 новых пользователей в день
    (на обе группы вместе). Какая длительность?
  difficulty: 1
  tags:
  - duration
  - traffic
  options:
  - text: '14 дней: нужно 76 000 пользователей, это 12,7 дня, округляем до полных недель'
    correct: true
    why: Две группы по 38 000 — 76 000 всего. $76\,000 / 6\,000 \approx 12{,}7$ дня. Две полные недели
      покрывают все дни недели одинаково.
  - text: '7 дней: 38 000 / 6 000 ≈ 6,3'
    correct: false
    why: 38 000 — это одна группа. В тест нужно набрать обе.
  - text: 13 дней — ровно сколько нужно
    correct: false
    why: Выборка набрана, но дни недели представлены неравномерно.
  - text: 3 дня, если эффект будет виден раньше
    correct: false
    why: Остановка по промежуточной значимости раздувает долю ложных тревог.
  explanation: |-
    Осторожнее с повторными пользователями: если считать по уникальным пользователям, прирост в день
    со временем падает (многие уже в тесте). Длительность считают по уникальным.
- id: stss-derive-014
  topic: stats/sample_size
  type: open
  question: Выведите формулу размера выборки для A/B-теста. Откуда в ней $z_{\alpha/2}$, $z_\beta$ и двойка?
  difficulty: 2
  tags:
  - sample_size
  - derivation
  - interview
  answer: |-
    **Два мира.** Статистика $z = \hat\Delta / SE$ в мире без эффекта распределена вокруг 0,
    в мире с эффектом $\Delta$ — вокруг $\Delta / SE$. Ширина обоих колоколов — 1 (в единицах SE).

    **Порог один.** Отвергаем H₀, если $z > z_{\alpha/2}$ (правый хвост; левым в мире с положительным
    эффектом можно пренебречь).
    - В мире H₀ правее порога должна остаться доля $\alpha/2$ — порог стоит на $z_{\alpha/2}$ правее центра 0.
    - В мире H₁ левее порога должна остаться только доля β — порог стоит на $z_\beta$ **левее** центра $\Delta / SE$.

    **Значит**, расстояние между центрами складывается из двух кусков:

    $$\frac{\Delta}{SE} = z_{\alpha/2} + z_\beta$$

    **SE разницы.** Две группы по $n$ с одинаковой дисперсией $\sigma^2$: дисперсии средних складываются,
    $SE = \sqrt{\sigma^2/n + \sigma^2/n} = \sigma\sqrt{2/n}$. Отсюда двойка.

    **Выражаем $n$:** $\Delta = (z_{\alpha/2} + z_\beta)\,\sigma\sqrt{2/n}$, возводим в квадрат:

    $$n = \frac{2\,(z_{\alpha/2} + z_\beta)^2\,\sigma^2}{\Delta^2}$$
  rubric:
  - 'Описал два распределения статистики: при H₀ и при H₁'
  - Объяснил, что порог один и режет оба мира
  - Получил условие Δ/SE = z_{α/2} + z_β
  - Вывел SE = σ√(2/n) через сложение дисперсий двух групп
  - Выразил n
  explanation: |-
    Ту же формулу можно решить относительно $\Delta$ — получится MDE при фиксированном $n$.
    Это полезно, когда трафик ограничен.
- id: stss-sms-015
  topic: stats/sample_size
  type: open
  question: |-
    Тестируем SMS-напоминание о платеже. Доля выхода в просрочку 30+ — 12%, хотим поймать снижение на 1 п.п.
    Платёж в месяц наступает у 5 000 подходящих клиентов. Сколько нужно клиентов и сколько займёт тест?
    Что делать, если это слишком долго?
  difficulty: 3
  tags:
  - sample_size
  - credit_risk
  - limited_traffic
  - interview
  answer: |-
    **Расчёт.** Средняя доля около 11,5%, $\sigma^2 \approx 0{,}115 \cdot 0{,}885 \approx 0{,}102$.
    $n \approx 16 \cdot 0{,}102 / 0{,}01^2 \approx 16\,300$ на группу, около 32 600 всего.
    При 5 000 клиентов в месяц — примерно **6,5 месяцев** набора. Плюс просрочка 30+ видна
    только через 30 дней после платежа.

    **Что можно сделать.**
    1. **CUPED** с ковариатой «просрочки в прошлом» — платёжная дисциплина сильно коррелирует с прошлой,
       дисперсия может упасть заметно.
    2. **Более ранняя и частая метрика** — просрочка 1+ (любое опоздание): она чаще, чем 30+,
       и видна быстрее. Нужно проверить, что она связана с 30+.
    3. **Расширить сегмент** — включить больше клиентов, если механизм применим к ним.
    4. **Пересмотреть MDE** — если бизнес согласен ловить только эффект от 1,5 п.п.,
       выборка упадёт примерно в 2,25 раза.
    5. **Несколько платёжных циклов на клиента** — но тогда наблюдения одного клиента зависимы,
       анализировать нужно на уровне клиента.
    6. **Односторонний тест**, если заранее ясно, что интересует только снижение, — заметно меньше выборка,
       но нужно обоснование до старта.
  rubric:
  - Посчитал дисперсию через долю и выборку около 16 тысяч на группу
  - Оценил длительность с учётом трафика и созревания метрики
  - Предложил снижение дисперсии (CUPED по прошлой просрочке)
  - Предложил более раннюю или чувствительную метрику
  - Предложил пересмотреть MDE или расширить сегмент
  explanation: |-
    В риске ограничения по трафику и медленное созревание метрик — норма. Интервьюер хочет услышать
    не только формулу, но и набор практических рычагов, когда формула даёт «слишком долго».
