- id: mll-ce-001
  topic: ml/losses
  type: card
  question: Запиши бинарную cross-entropy и объясни, зачем в формуле присутствуют оба слагаемых.
  difficulty: 1
  tags:
  - cross_entropy
  - binary
  answer: |-
    $$\ell = -\big[y\ln p + (1-y)\ln(1-p)\big]$$
    где $y \in \{0, 1\}$ — истинная метка из датасета, $p$ — предсказанная моделью вероятность класса 1.

    Слагаемые работают как переключатель. При $y = 1$ второе обнуляется множителем $(1-y)$
    и остаётся $-\ln p$. При $y = 0$ обнуляется первое и остаётся $-\ln(1-p)$.

    В обоих случаях берётся логарифм вероятности, присвоенной **правильному** ответу.
  explanation: |-
    Запись через умножение на $y$ и $(1-y)$ — это способ выразить ветвление арифметически.
    Конструкция с условием не была бы дифференцируемой, а произведение — вполне.
    Многоклассовый вариант $-\sum_k y_k \ln p_k$ использует тот же приём:
    вектор меток one-hot обнуляет все слагаемые, кроме одного.
- id: mll-ce-002
  topic: ml/losses
  type: mcq
  question: Почему для классификации используют cross-entropy, а не MSE?
  difficulty: 2
  tags:
  - cross_entropy
  - mse
  options:
  - text: Cross-entropy резко штрафует уверенные ошибки, тогда как MSE за полную ошибку даёт штраф порядка
      единицы
    correct: true
    why: При предсказании $0{,}01$ для объекта класса 1 cross-entropy даёт примерно $4{,}6$, а MSE лишь
      около $1$. Логарифм уходит в бесконечность, заставляя модель не блефовать.
  - text: MSE неприменима к значениям из отрезка от нуля до единицы
    correct: false
    why: Формально применима и даже используется в некоторых задачах. Вопрос в том, что она плохо обучает
      классификатор, а не в невозможности вычисления.
  - text: Cross-entropy вычисляется быстрее
    correct: false
    why: Логарифм считается не быстрее возведения в квадрат. Преимущество в свойствах градиента, а не
      в скорости.
  - text: MSE недифференцируема в нуле
    correct: false
    why: MSE гладкая всюду. Излом в нуле есть у MAE, а не у квадратичной ошибки.
  explanation: |-
    Есть и вторая причина, связанная с градиентом. В паре с сигмоидой MSE даёт множитель $\sigma'(z)$,
    который мал на хвостах — то есть затухание возникает именно там, где модель ошибается сильнее всего.
    У cross-entropy этот множитель сокращается, и градиент остаётся пропорциональным ошибке.
- id: mll-mle-003
  topic: ml/losses
  type: open
  question: Откуда берётся формула cross-entropy? Почему именно логарифм?
  difficulty: 2
  tags:
  - cross_entropy
  - maximum_likelihood
  - interview
  answer: |-
    Cross-entropy выводится из **метода максимального правдоподобия**.

    Правдоподобие — вероятность увидеть наблюдаемые метки при данных параметрах модели.
    Для независимых объектов это произведение:
    $$\mathcal{L} = \prod_i p_i^{y_i}(1 - p_i)^{1 - y_i}$$

    Максимизировать произведение неудобно: тысячи сомножителей меньше единицы
    мгновенно уходят в машинный ноль. Логарифм превращает произведение в сумму
    и не меняет точку максимума, поскольку монотонен:
    $$\ln\mathcal{L} = \sum_i \big[y_i\ln p_i + (1-y_i)\ln(1-p_i)\big]$$

    Максимизация этого выражения эквивалентна минимизации его со знаком минус,
    а это и есть cross-entropy.

    Дополнительное свойство логарифма — резкий рост штрафа при уверенной ошибке,
    что заставляет модель честно оценивать неуверенность и даёт хорошую калибровку вероятностей.
  rubric:
  - Назвал метод максимального правдоподобия как источник формулы
  - 'Объяснил, зачем берут логарифм: произведение превращается в сумму, точка максимума сохраняется'
  - Упомянул численную проблему с произведением малых вероятностей
  - Связал логарифм с резким штрафом за уверенную ошибку
  explanation: |-
    Тот же принцип объясняет и MSE: она соответствует максимальному правдоподобию
    при предположении о нормально распределённом шуме. Выбор функции потерь —
    это неявное предположение о распределении данных.
- id: mll-logit-004
  topic: ml/losses
  type: mcq
  question: |-
    Почему в PyTorch функцию потерь вычисляют от логитов через `CrossEntropyLoss`,
    а не применяют `softmax` вручную перед ней?
  difficulty: 2
  tags:
  - cross_entropy
  - numerical_stability
  - pytorch
  options:
  - text: Иначе softmax применится дважды, а прямое вычисление логарифма от малых вероятностей численно
      неустойчиво
    correct: true
    why: Внутри `CrossEntropyLoss` уже выполняется log-softmax с устойчивыми преобразованиями. Ручной
      softmax перед ней даёт двойное применение и риск получить $\ln 0$.
  - text: Это просто короче по коду, разницы в результате нет
    correct: false
    why: 'Разница есть и в корректности, и в устойчивости: двойной softmax сплющивает распределение и
      ослабляет градиенты.'
  - text: Функция `CrossEntropyLoss` не умеет работать с вероятностями в принципе
    correct: false
    why: Дело не в ограничении интерфейса, а в том, что подача вероятностей приводит к неверному вычислению.
  - text: Логиты требуют меньше памяти, чем вероятности
    correct: false
    why: 'Объём одинаков: тот же тензор той же формы, просто с другими значениями.'
  explanation: |-
    Внутри применяется приём log-sum-exp: из логитов вычитается максимум,
    благодаря чему экспонента не переполняется, а логарифм и экспонента взаимно сокращаются,
    и выражение $\ln 0$ никогда не вычисляется.
    Для бинарного случая роль такой функции играет `BCEWithLogitsLoss`.
- id: mll-grad-005
  topic: ml/losses
  type: multi
  question: Какие утверждения про связку softmax и cross-entropy верны? Выбери все верные.
  difficulty: 2
  tags:
  - cross_entropy
  - gradient
  options:
  - text: Градиент по логитам равен $p - y$
    correct: true
  - text: Softmax превращает произвольные числа в вероятности, суммирующиеся в единицу
    correct: true
  - text: Громоздкие производные softmax и логарифма при выводе взаимно упрощаются
    correct: true
  - text: Связка численно устойчива при вычислении от логитов
    correct: true
  - text: Softmax следует применять к выходу каждого скрытого слоя
    correct: false
    why: Softmax ставят только на последнем слое классификатора. В скрытых слоях используют ReLU, GELU
      и подобные активации.
  explanation: |-
    Простота градиента $p - y$ — одна из причин, по которой эта связка стала стандартом:
    вычисление дёшево, реализация устойчива, а формула легко запоминается
    как «предсказание минус истина».
- id: mll-focal-006
  topic: ml/losses
  type: card
  question: Запиши focal loss и объясни, какую проблему он решает.
  difficulty: 2
  tags:
  - focal_loss
  - imbalance
  answer: |-
    $$\ell_{\text{focal}} = -(1 - p_t)^{\gamma}\ln(p_t)$$
    где $p_t$ — вероятность, присвоенная правильному классу, а $\gamma$ — фокусирующий параметр
    (типичное значение 2).

    Решает проблему экстремального дисбаланса, при котором масса легко классифицируемых примеров
    суммарно даёт больший градиент, чем немногочисленные сложные.

    Множитель $(1 - p_t)^{\gamma}$ гасит вклад уверенно решённых примеров:
    при $p_t = 0{,}95$ и $\gamma = 2$ он равен примерно $0{,}0025$,
    тогда как при $p_t = 0{,}1$ остаётся около $0{,}81$.
  explanation: |-
    При $\gamma = 0$ формула вырождается в обычную cross-entropy.
    Изначально предложен для детекции объектов, где фоновых областей тысячи на один объект.
    Применим везде, где простое взвешивание классов не справляется.
- id: mll-choose-007
  topic: ml/losses
  type: open
  question: Как выбрать функцию потерь под задачу? Разбери основные случаи.
  difficulty: 2
  tags:
  - interview
  - loss_selection
  answer: |-
    Отправная точка — тип задачи.

    Бинарная классификация: binary cross-entropy, вычисляемая от логитов.
    Многоклассовая: cross-entropy в паре с softmax.
    Задача с несколькими метками одновременно: binary cross-entropy независимо по каждому классу,
    поскольку классы не исключают друг друга.

    Регрессия: MSE по умолчанию, Huber при наличии выбросов,
    квантильная функция потерь, если нужен не средний прогноз, а определённый процентиль.

    Дальше — корректировки под особенности данных.

    При дисбалансе классов добавляют веса в cross-entropy,
    при экстремальном дисбалансе переходят к focal loss.

    Для обучения эмбеддингов, где важна не метка, а структура пространства представлений,
    берут контрастивные функции: triplet loss или InfoNCE.

    Для дистилляции и вариационных автоэнкодеров нужна KL-дивергенция,
    поскольку целью выступает не метка, а целое распределение.

    Общий принцип: функция потерь должна отражать то, что действительно важно в задаче.
    Если цена ошибок несимметрична, это закладывают в веса,
    а не надеются исправить подбором порога постфактум.
  rubric:
  - Назвал cross-entropy для классификации и MSE для регрессии как отправную точку
  - Упомянул Huber или MAE при наличии выбросов в регрессии
  - Предложил взвешивание классов или focal loss при дисбалансе
  - Назвал контрастивные функции для обучения эмбеддингов
  - 'Сформулировал общий принцип: лосс отражает приоритеты задачи'
  explanation: |-
    Полезное уточнение для multi-label: применение softmax там было бы ошибкой,
    поскольку он навязывает суммирование вероятностей в единицу,
    тогда как объект может относиться сразу к нескольким классам.
- id: mll-hinge-008
  topic: ml/losses
  type: card
  question: Запиши hinge loss и объясни, как из него возникают опорные векторы.
  difficulty: 2
  tags:
  - hinge
  - svm
  answer: |-
    $$\ell = \max\big(0,\ 1 - y \cdot f(x)\big)$$
    где $y \in \{-1, +1\}$, а $f(x)$ — сырой выход модели. Произведение $m = y \cdot f(x)$
    называется отступом: положительное значение означает правильную классификацию.

    Ключевое свойство: при отступе больше единицы штраф равен **ровно нулю**.
    Объект классифицирован правильно и с запасом, поэтому он не вносит вклада в функцию потерь
    и не влияет на положение разделяющей границы.

    Объекты, дающие ненулевой вклад, — те, что лежат внутри зазора или нарушают его.
    Именно они и называются **опорными векторами**.
  explanation: |-
    Отличие от логистической функции потерь в том, что та никогда не обнуляется:
    даже далёкие правильно классифицированные объекты продолжают слегка влиять на решение.
    Hinge недифференцируем в точке излома, поэтому требует субградиентов.
- id: mll-kl-009
  topic: ml/losses
  type: mcq
  question: Какое свойство KL-дивергенции $D_{KL}(P \| Q)$ верно?
  difficulty: 2
  tags:
  - kl_divergence
  options:
  - text: Она неотрицательна, обращается в ноль только при совпадении распределений и несимметрична
    correct: true
    why: Несимметричность означает, что $D_{KL}(P\|Q) \neq D_{KL}(Q\|P)$, поэтому строго говоря это не
      метрика, а мера расхождения.
  - text: Она симметрична и удовлетворяет неравенству треугольника
    correct: false
    why: Оба свойства нарушены, поэтому KL не является метрикой в математическом смысле. Симметричный
      вариант существует отдельно — дивергенция Дженсена-Шеннона.
  - text: Она может принимать отрицательные значения при сильном расхождении распределений
    correct: false
    why: Неотрицательность доказывается через неравенство Йенсена и выполняется всегда.
  - text: Она определена только для непрерывных распределений
    correct: false
    why: Определена и для дискретных, где сумма заменяет интеграл. В классификации используется именно
      дискретный вариант.
  explanation: |-
    Связь с cross-entropy: $D_{KL}(P\|Q) = H(P, Q) - H(P)$.
    Энтропия истинного распределения не зависит от модели, поэтому минимизация cross-entropy
    эквивалентна минимизации KL-дивергенции — и в классификации используют более простую CE.
- id: mll-triplet-010
  topic: ml/losses
  type: card
  question: Запиши triplet loss и объясни, чему учится модель.
  difficulty: 2
  tags:
  - triplet
  - embeddings
  answer: |-
    $$\ell = \max\big(0,\ d(a, p) - d(a, n) + m\big)$$
    где $a$ — якорь, $p$ — похожий на него объект, $n$ — непохожий,
    $d$ — расстояние между эмбеддингами, $m$ — зазор.

    Модель учится строить пространство представлений, в котором похожие объекты расположены близко,
    а непохожие далеко. Требование не абсолютное, а относительное: расстояние до похожего
    должно быть меньше расстояния до непохожего **минимум на величину зазора**.
    Если это уже выполнено, штраф равен нулю.
  explanation: |-
    Главная практическая трудность — выбор троек. Случайные тройки почти всегда
    уже удовлетворяют условию, дают нулевой лосс и не обучают модель.
    Поэтому применяют hard negative mining — поиск непохожих объектов,
    которые модель ошибочно считает близкими.
- id: mll-contr-011
  topic: ml/losses
  type: open
  question: |-
    Как обучают модели, производящие эмбеддинги, если у объектов нет меток классов?
    В чём главная практическая сложность?
  difficulty: 3
  tags:
  - contrastive
  - embeddings
  - interview
  answer: |-
    Используют контрастивное обучение: вместо предсказания метки модель учится
    различать похожие и непохожие пары, то есть формировать структуру пространства представлений.

    Contrastive loss работает с парами: похожие притягивает, непохожие отталкивает,
    но только пока они ближе заданного зазора.

    Triplet loss работает с тройками якорь-позитив-негатив и требует,
    чтобы позитив был ближе негатива минимум на зазор.

    InfoNCE обобщает идею на множество негативов сразу: один позитив против $N$ негативов,
    что по форме превращается в softmax-классификацию «какой из кандидатов правильный».
    Именно этот подход стоит за CLIP, SimCLR и современными моделями текстовых эмбеддингов.

    Пары формируют без ручной разметки: из аугментаций одного объекта,
    из соседних фрагментов одного документа, из пары «изображение и его подпись»,
    из последовательных действий одного пользователя.

    Главная сложность — **выбор негативов**. Случайный негатив почти всегда легко отличим,
    лосс на нём близок к нулю, и обучение стоит на месте. Поэтому нужны сложные негативы:
    похожие, но всё же неправильные кандидаты. Их ищут через hard negative mining,
    увеличивают размер батча, чтобы негативов в нём было больше,
    либо поддерживают очередь предыдущих представлений.
  rubric:
  - 'Объяснил идею контрастивного обучения: различать похожие и непохожие пары вместо предсказания метки'
  - 'Назвал хотя бы две функции потерь: contrastive, triplet или InfoNCE'
  - Рассказал, откуда берутся пары без ручной разметки
  - Назвал выбор негативов главной сложностью и объяснил, почему случайные негативы бесполезны
  - 'Предложил решения: hard negative mining, большой батч, очередь представлений'
  explanation: |-
    Тема напрямую относится к построению поисковых систем и рекомендаций:
    качество ретривера определяется именно тем, насколько хорошо организовано
    пространство эмбеддингов.
- id: mll-kl-012
  topic: ml/losses
  type: mcq
  question: В каком случае нужна именно KL-дивергенция, а не обычная cross-entropy?
  difficulty: 3
  tags:
  - kl_divergence
  - distillation
  options:
  - text: Когда целью обучения служит не жёсткая метка, а целое распределение — например, при дистилляции
      знаний
    correct: true
    why: Ученик повторяет распределение вероятностей учителя, а не только его финальный ответ, поэтому
      нужна мера расхождения между двумя распределениями.
  - text: Когда классов больше двух
    correct: false
    why: Многоклассовая задача прекрасно решается обычной cross-entropy с softmax.
  - text: Когда классы несбалансированы
    correct: false
    why: Дисбаланс решается взвешиванием классов или focal loss, а не сменой типа меры.
  - text: Когда метки содержат шум
    correct: false
    why: Шум в метках лечат сглаживанием меток или робастными функциями потерь, но не переходом к KL.
  - text: Когда требуется более быстрая сходимость
    correct: false
    why: При жёстких метках KL и cross-entropy отличаются на константу и ведут себя одинаково.
  explanation: |-
    Другие места, где нужна именно KL: вариационные автоэнкодеры, где она удерживает
    латентное распределение близким к нормальному, и дообучение языковых моделей
    с человеческой обратной связью, где KL-штраф не даёт модели далеко уйти от исходной.
- id: mll-emb-013
  topic: ml/losses
  type: multi
  question: Какие функции потерь применяют для обучения эмбеддингов? Выбери все верные.
  difficulty: 2
  tags:
  - embeddings
  - losses
  options:
  - text: Triplet loss
    correct: true
  - text: Contrastive loss
    correct: true
  - text: InfoNCE
    correct: true
  - text: Hinge loss в задаче SVM
    correct: false
    why: Применяется для классификации с максимальным зазором, а не для построения пространства представлений.
      Понятие зазора здесь общее, но задача другая.
  - text: Focal loss
    correct: false
    why: Модификация cross-entropy для задач с сильным дисбалансом классов; к обучению эмбеддингов отношения
      не имеет.
  explanation: |-
    Общее у контрастивных функций то, что они оперируют **относительными** расстояниями
    между объектами, а не абсолютной правильностью метки.
    Модель учится тому, что похоже на что, а не тому, к какому классу относится объект.
- id: mll-smooth-014
  topic: ml/losses
  type: mcq
  question: Что делает label smoothing и зачем он нужен?
  difficulty: 2
  tags:
  - label_smoothing
  - calibration
  options:
  - text: Заменяет жёсткие метки слегка размытыми, чтобы модель не раздувала логиты и оставалась откалиброванной
    correct: true
    why: Чтобы довести cross-entropy до нуля при жёсткой метке, логит правильного класса должен уйти в
      бесконечность. Размытая цель делает её достижимой при конечных значениях.
  - text: Добавляет шум к входным признакам для увеличения разнообразия данных
    correct: false
    why: Это описание аугментации. Label smoothing работает с метками, а не с признаками.
  - text: Уменьшает learning rate на поздних эпохах обучения
    correct: false
    why: Это расписание learning rate, другой механизм.
  - text: Исключает из обучения объекты с неверными метками
    correct: false
    why: 'Никакой фильтрации данных не происходит: сглаживание применяется ко всем меткам одинаково.'
  explanation: |-
    При сглаживании с параметром $\varepsilon = 0{,}1$ и десяти классах правильный класс
    получает цель $0{,}9$ вместо $1{,}0$, остальные по $0{,}01$ вместо нуля.
    Стандартная практика при обучении трансформеров и крупных классификаторов.
- id: mll-imb-015
  topic: ml/losses
  type: open
  question: |-
    Как учесть сильный дисбаланс классов на уровне функции потерь?
    Какие есть варианты и чем они различаются?
  difficulty: 2
  tags:
  - imbalance
  - weighting
  - interview
  answer: |-
    Первый уровень — **взвешивание классов**. В cross-entropy добавляют веса,
    обратно пропорциональные частоте класса, чтобы ошибка на редком классе
    штрафовалась сильнее. В библиотеках это параметры `class_weight` или `pos_weight`.
    Приём простой и работает в большинстве случаев умеренного дисбаланса.

    Второй уровень — **focal loss**. Он решает другую проблему: когда лёгких примеров
    настолько много, что их суммарный градиент заглушает сигнал от сложных.
    Множитель $(1 - p_t)^{\gamma}$ гасит вклад уверенно решённых примеров независимо от их класса.
    Ключевое отличие от взвешивания: focal смотрит на **сложность** примера,
    а не на его класс.

    Дополнительно лосс можно комбинировать с методами уровня данных
    (oversampling редкого класса, undersampling частого) и с подбором порога после обучения.

    Важно понимать, что сама по себе смена функции потерь не решает задачу целиком:
    метрики тоже нужно менять, иначе accuracy будет показывать хорошие числа
    независимо от того, что происходит с редким классом.
  rubric:
  - Назвал взвешивание классов в cross-entropy как первый шаг
  - 'Назвал focal loss и объяснил его отличие: фокус на сложности примера, а не на классе'
  - Упомянул методы уровня данных или подбор порога как дополнение
  - Отметил, что вместе с лоссом нужно менять и метрики оценки
  explanation: |-
    Практическая деталь по сэмплированию: размножать редкий класс нужно
    **только в обучающей выборке и после разделения**. Если сделать это раньше,
    копии одного объекта попадут и в train, и в validation, что создаст утечку.
