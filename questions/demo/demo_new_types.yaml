# Демо новых типов: match (сопоставь) и order (последовательность). Удали папку questions/demo/, когда появятся свои.
- id: demo-match-007
  topic: demo/ml
  type: match
  difficulty: 2
  tags: [regularization, bayes]
  question: |
    Сопоставь регуляризацию с априорным распределением на веса, которому она соответствует.
  pairs:
    - {left: 'L1 (Lasso)', right: 'лапласовский априор'}
    - {left: 'L2 (Ridge)', right: 'гауссовский априор'}
    - {left: 'Без регуляризации (чистый MLE)', right: 'неинформативный (плоский) априор'}
  extra_right: ['бета-распределение']
  explanation: |
    MAP-оценка с лапласовским prior даёт L1 (разреженные веса), с гауссовским — L2. Без регуляризации остаётся
    максимум правдоподобия, то есть MAP с плоским prior.

- id: demo-order-008
  topic: demo/dl
  type: order
  difficulty: 1
  tags: [training, backprop]
  question: |
    Расставь шаги одной итерации обучения нейросети в верном порядке.
  items:
    - 'прямой проход (forward): посчитать предсказания'
    - 'посчитать функцию потерь $L$'
    - 'обратный проход (backward): посчитать градиенты $\nabla_\theta L$'
    - 'шаг оптимизатора: обновить веса'
  explanation: |
    Градиенты нельзя посчитать до loss, а веса нельзя обновить до градиентов.
